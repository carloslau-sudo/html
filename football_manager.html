<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Football Manager</title>
<style>
:root {
  --bg: #10181F;
  --panel: #18232C;
  --panel-2: #1F2D38;
  --line: #2C3E4C;
  --ink: #E8EFF2;
  --ink-soft: #9FB3BE;
  --pitch: #2EAE6A;
  --pitch-dark: #1E7A49;
  --amber: #E8B33C;
  --red: #D85C4A;
  --mono: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
header {
  background: linear-gradient(180deg, #15212B, #10181F);
  border-bottom: 2px solid var(--pitch);
  padding: 14px 24px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
header h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
header h1 span { color: var(--pitch); }
#club-badge { font-size: 13px; color: var(--ink-soft); }
#week-badge { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--amber); }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

.tabs { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.tabs button {
  background: var(--panel); color: var(--ink-soft); border: 1px solid var(--line);
  border-radius: 4px 4px 0 0; padding: 8px 16px; cursor: pointer; font-size: 14px;
}
.tabs button.active { background: var(--pitch-dark); color: #fff; border-color: var(--pitch); }
.tabs button:hover { color: #fff; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 16px; }
h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0.02em; }
h3 { margin: 16px 0 8px; font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--ink-soft); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tr.me td { background: rgba(46, 174, 106, 0.22); font-weight: 600; }
tr.me td:first-child { box-shadow: inset 3px 0 0 var(--pitch); }
tr.champ td:first-child { border-left: 3px solid var(--amber); }
tr.ucl td:first-child { border-left: 3px solid #3D7DC8; }
tr.uel td:first-child { border-left: 3px solid #E8833C; }
tr.uecl td:first-child { border-left: 3px solid #35B07A; }
tr.releg td:first-child { border-left: 3px solid var(--red); }
.zone-legend { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.zone-legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; vertical-align: -1px; }

button.action {
  background: var(--pitch-dark); color: #fff; border: 1px solid var(--pitch);
  border-radius: 4px; padding: 10px 22px; font-size: 15px; cursor: pointer; font-weight: 600;
}
button.action:hover { background: var(--pitch); }
button.ghost {
  background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer;
}
button.ghost:hover { color: #fff; border-color: var(--ink-soft); }
select {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; font-size: 14px;
}
input[type="text"], input[type="password"], input:not([type]) {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; font-size: 14px; font-family: inherit;
}

.club-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.club-card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px; cursor: pointer; transition: border-color 0.15s;
}
.club-card:hover { border-color: var(--pitch); }
.club-card .cname { font-weight: 700; font-size: 16px; }
.club-card .cinfo { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
.club-card .cstars { font-size: 12px; color: var(--amber); margin-top: 6px; }
.stars-bar { color: var(--pitch); letter-spacing: 2px; }

.pos-GK { color: var(--amber); } .pos-DF { color: #6FB3E0; } .pos-MF { color: #8ED48E; } .pos-FW { color: #E08B8B; }
.tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); }
.tag.inj { color: var(--red); border-color: var(--red); }
.tag.sus { color: var(--amber); border-color: var(--amber); }
.formbar { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; }
.formbar .W { color: var(--pitch); } .formbar .D { color: var(--ink-soft); } .formbar .L { color: var(--red); }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
.plink { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
.plink:hover { color: #fff; }
.overlay { position: fixed; inset: 0; background: rgba(8,12,16,.6); z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 16px; }
.pcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  max-width: 400px; width: 100%; padding: 18px 20px; max-height: 88vh; overflow-y: auto; }
.pcard h3 { margin: 0 0 4px; }
.pcard table td { padding: 3px 6px; }
th.sortable:hover { color: #fff; text-decoration: underline; }
details.fold { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 10px 0; background: var(--panel-2); }
details.fold summary { cursor: pointer; color: var(--ink-soft); font-weight: 600; font-size: 13px; user-select: none; }
details.fold summary:hover { color: var(--ink); }
details.fold[open] > summary { margin-bottom: 8px; }
.scorer-lines { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 2px 0 8px; }

.minute-badge { text-align: center; font-family: var(--mono); font-size: 18px; color: var(--amber); margin: 2px 0 10px; }
.pitch-wrap { margin: 6px auto 10px; max-width: 760px; position: relative; }
.snd-btn { position: absolute; top: 8px; right: 8px; z-index: 5; background: rgba(10,18,12,.55);
  border: 1px solid rgba(255,255,255,.25); border-radius: 8px; color: #fff;
  font-size: 15px; padding: 3px 9px; cursor: pointer; }
#pitch, #hl-pitch, #wc-pitch { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid var(--line); }
.kit-legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); padding: 4px 2px; }
.kit-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; vertical-align: -1px; margin-right: 5px; }
.crest { vertical-align: middle; margin-right: 6px; flex-shrink: 0; }
td .crest { vertical-align: -4px; margin-right: 5px; }
.ev-else { color: var(--ink-soft); font-size: 13px; }
.speed-on { border-color: var(--pitch) !important; color: #fff !important; }
.ht-panel { background: var(--panel-2); border: 1px solid var(--amber); border-radius: 6px; padding: 14px; margin: 12px 0; }
.poss-bar { display: flex; height: 13px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.poss-bar .ph { background: var(--pitch-dark); }
.poss-bar .pa { background: #50647A; }
.stat-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; padding: 3px 0; }
.stat-row .lbl { color: var(--ink-soft); font-family: inherit; }
.motm { text-align: center; color: var(--amber); margin: 10px 0 4px; }

.lineup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.slot { display: flex; align-items: center; gap: 8px; }
.slot label { width: 34px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.slot select { flex: 1; }

.score-line { font-size: 26px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
.score-line .vs { color: var(--ink-soft); font-size: 16px; font-weight: 400; margin: 0 10px; }
.events { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; }
.events li { padding: 5px 8px; border-bottom: 1px solid var(--line); }
.events .min { font-family: var(--mono); color: var(--amber); display: inline-block; width: 38px; }
.ev-goal { background: rgba(46, 174, 106, 0.08); }
.ev-red { background: rgba(216, 92, 74, 0.10); }
.other-results { color: var(--ink-soft); font-size: 13px; }
.other-results b { color: var(--ink); }

.banner {
  text-align: center; padding: 26px; border: 2px solid var(--amber); border-radius: 8px;
  background: linear-gradient(180deg, rgba(232,179,60,0.08), transparent); margin-bottom: 16px;
}
.banner h2 { font-size: 24px; color: var(--amber); }
.note { color: var(--ink-soft); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
footer { text-align: center; color: var(--ink-soft); font-size: 12px; padding: 24px; }

/* wide stats tables scroll sideways inside their panel instead of breaking the page */
.panel { overflow-x: auto; }

.lbl-short { display: none; }
@media (max-width: 640px) {
  .m-hide { display: none; }
  .lbl-full { display: none; }
  .lbl-short { display: inline; }
  table th, table td { padding: 4px 3px; font-size: 11.5px; }
  .stars-bar { font-size: 9px; letter-spacing: -1px; }
  header { padding: 10px 12px; gap: 8px; }
  header h1 { font-size: 16px; }
  #club-badge { font-size: 11px; }
  #week-badge { font-size: 11px; }
  main { padding: 12px 8px 40px; }
  .panel { padding: 12px 10px; }
  th, td { padding: 4px 5px; font-size: 12px; }
  .tabs button { padding: 7px 10px; font-size: 13px; }
  button.action { padding: 12px 16px; font-size: 14px; width: 100%; }
  button.ghost { padding: 9px 12px; }
  .score-line { font-size: 19px; }
  .score-line .vs { margin: 0 6px; }
  .events { font-size: 13px; }
  .events .min { width: 32px; }
  .club-card { padding: 11px; }
  h2 { font-size: 15px; }
  .slot select { min-width: 0; }
  .kit-legend { font-size: 11px; }
  .zone-legend { font-size: 11px; }
}
</style>
</head>
<body>
<header>
  <h1>Football <span>Manager</span></h1>
  <span id="club-badge"></span>
  <span id="week-badge"></span>
</header>
<main id="app"></main>
<div id="modal"></div>
<footer>Football Manager · a one-file football management game · unofficial fan project, not affiliated with the Premier League, UEFA, or Sports Interactive · squad data approximate (2025/26 season)</footer>

<script>
"use strict";

/* ---------------- Data ---------------- */

/* Formations: player counts per line plus a shape character (small multipliers) */
const FORMATIONS = {
  "4-4-2":         { DF: 4, MF: 4, FW: 2, att: 1.00, mid: 1.00, def: 1.00 },
  "4-3-3":         { DF: 4, MF: 3, FW: 3, att: 1.05, mid: 0.96, def: 1.00 },
  "4-2-3-1":       { DF: 4, MF: 5, FW: 1, att: 1.02, mid: 1.03, def: 0.98 },
  "4-4-2 Diamond": { DF: 4, MF: 4, FW: 2, att: 1.01, mid: 1.05, def: 0.96 },
  "4-5-1":         { DF: 4, MF: 5, FW: 1, att: 0.94, mid: 1.06, def: 1.02 },
  "3-5-2":         { DF: 3, MF: 5, FW: 2, att: 1.02, mid: 1.04, def: 0.93 },
  "3-4-3":         { DF: 3, MF: 4, FW: 3, att: 1.08, mid: 0.98, def: 0.89 },
  "5-3-2":         { DF: 5, MF: 3, FW: 2, att: 0.94, mid: 0.96, def: 1.08 },
  "5-4-1":         { DF: 5, MF: 4, FW: 1, att: 0.87, mid: 1.00, def: 1.12 },
};

/* ---------------- Detailed positions (roles) ----------------
   Every player has a role within his line — LB/CB/RB, CDM/CM/CAM/LM/RM,
   LW/ST/CF/SS/RW — and every formation defines its exact slots. A player in
   the wrong slot still plays, but his effective rating drops with how far
   from home he is (wrong side, wrong duty, or wrong line entirely). */
const ROLES = {
  GK:  { line: "GK", side: "C" },
  LB:  { line: "DF", side: "L" }, LWB: { line: "DF", side: "L" },
  CB:  { line: "DF", side: "C" },
  RB:  { line: "DF", side: "R" }, RWB: { line: "DF", side: "R" },
  CDM: { line: "MF", side: "C" }, CM:  { line: "MF", side: "C" }, CAM: { line: "MF", side: "C" },
  LM:  { line: "MF", side: "L" }, RM:  { line: "MF", side: "R" },
  LW:  { line: "FW", side: "L" }, RW:  { line: "FW", side: "R" },
  ST:  { line: "FW", side: "C" }, CF:  { line: "FW", side: "C" }, SS:  { line: "FW", side: "C" },
};
/* slot lists are in formation-group order (DF block, MF block, FW block) so
   they line up with the lineup array and the position dropdowns */
const FORM_SLOTS = {
  "4-4-2":         ["LB","CB","CB","RB", "LM","CM","CM","RM", "ST","ST"],
  "4-3-3":         ["LB","CB","CB","RB", "CDM","CM","CM", "LW","ST","RW"],
  "4-2-3-1":       ["LB","CB","CB","RB", "CDM","CDM","LM","CAM","RM", "ST"],
  "4-4-2 Diamond": ["LB","CB","CB","RB", "CDM","CM","CM","CAM", "ST","ST"],
  "4-5-1":         ["LB","CB","CB","RB", "LM","CDM","CM","CDM","RM", "ST"],
  "3-5-2":         ["CB","CB","CB", "LM","CM","CDM","CM","RM", "ST","ST"],
  "3-4-3":         ["CB","CB","CB", "LM","CM","CM","RM", "LW","ST","RW"],
  "5-3-2":         ["LWB","CB","CB","CB","RWB", "CM","CDM","CM", "ST","ST"],
  "5-4-1":         ["LWB","CB","CB","CB","RWB", "LM","CM","CM","RM", "ST"],
};
function formSlots(formationName) {
  return ["GK"].concat(FORM_SLOTS[formationName] || FORM_SLOTS["4-4-2"]);
}
function roleFit(playerRole, slotRole) {
  if (playerRole === slotRole) return 1;
  const a = ROLES[playerRole], b = ROLES[slotRole];
  if (!a || !b) return 1; // unknown role (old data mid-migration): no penalty
  if (a.line === "GK" || b.line === "GK") return 0.5; // an outfielder in goal is chaos
  let pen = 0;
  if (a.line !== b.line) pen += (a.side === b.side && a.side !== "C") ? 0.06 : 0.10; // LM→LW is natural
  if (a.side !== b.side) pen += (a.side === "C" || b.side === "C") ? 0.05 : 0.08;    // wrong flank hurts most
  if (a.line === b.line && a.side === b.side) pen += 0.03;                            // CM→CAM, ST→SS, LB→LWB
  return Math.max(0.8, 1 - pen);
}
function slotRating(p, slotRole) { return effRating(p) * roleFit(p.role || p.pos, slotRole); }
/* role templates: the strongest players in a line take the core roles */
const LINE_ROLES = {
  GK: ["GK"],
  DF: ["CB", "LB", "RB", "CB", "CB", "LB", "RB", "CB"],
  MF: ["CM", "CDM", "CAM", "LM", "RM", "CM", "CDM", "CM"],
  FW: ["ST", "LW", "RW", "ST", "CF", "SS"],
};
function assignRoles(squad) { // fills only players without a role
  for (const pos of ["GK", "DF", "MF", "FW"]) {
    const line = squad.filter(p => p.pos === pos && !p.role).sort((a, b) => b.rating - a.rating);
    line.forEach((p, i) => { p.role = LINE_ROLES[pos][i % LINE_ROLES[pos].length]; });
  }
}
function roleFor(pos, squad) { // a single newcomer covers the thinnest role
  const seq = [...new Set(LINE_ROLES[pos])];
  return seq.sort((x, y) => squad.filter(p => p.role === x).length - squad.filter(p => p.role === y).length)[0];
}
const MENTALITIES = ["Defensive", "Balanced", "Attacking"];
/* Weather: rolled per match-week, English seasonality. att hits both sides;
   drain multiplies fitness cost; inj multiplies injury risk. */
const WEATHER = {
  clear: { icon: "☀", name: "Clear",      att: 1.00, drain: 1.00, inj: 1.00, note: "Perfect conditions." },
  rain:  { icon: "🌧", name: "Rain",       att: 0.98, drain: 1.05, inj: 1.15, note: "A slick surface — passing moves can break down, and injuries are more likely." },
  storm: { icon: "⛈", name: "Heavy rain", att: 0.93, drain: 1.12, inj: 1.30, note: "A quagmire. Quality football is nearly impossible; knocks and slips everywhere." },
  wind:  { icon: "💨", name: "Windy",      att: 0.96, drain: 1.00, inj: 1.00, note: "A swirling wind — long balls and crosses become a lottery." },
  snow:  { icon: "❄", name: "Snow",       att: 0.90, drain: 1.20, inj: 1.35, note: "An orange ball day. Cold legs, heavy pitch, high injury risk." },
  heat:  { icon: "🥵", name: "Heatwave",   att: 0.97, drain: 1.30, inj: 1.10, note: "Energy-sapping heat — rotate or watch your players wilt." },
};
/* AI tactical identities: every club has a characteristic way of playing */
const AI_TACTICS = {
  MCI: ["4-3-3", "Tiki-Taka"],      ARS: ["4-3-3", "Gegenpress"],     LIV: ["4-3-3", "Gegenpress"],
  CHE: ["4-2-3-1", "Gegenpress"],   TOT: ["4-3-3", "Gegenpress"],     NEW: ["4-3-3", "Gegenpress"],
  MUN: ["4-2-3-1", "Balanced"],     AVL: ["4-2-3-1", "Balanced"],     BHA: ["4-2-3-1", "Tiki-Taka"],
  BOU: ["4-2-3-1", "Gegenpress"],   BRE: ["4-3-3", "Direct Play"],    CRY: ["3-4-3", "Counter-Attack"],
  EVE: ["4-4-2", "Direct Play"],    FUL: ["4-2-3-1", "Balanced"],     NFO: ["4-2-3-1", "Counter-Attack"],
  WHU: ["4-2-3-1", "Balanced"],     WOL: ["4-2-3-1", "Counter-Attack"], BUR: ["4-4-2", "Counter-Attack"],
  SUN: ["4-3-3", "Counter-Attack"], LEE: ["4-2-3-1", "Gegenpress"],
  LEI: ["4-2-3-1", "Balanced"],     SOU: ["4-2-3-1", "Tiki-Taka"],    IPS: ["4-2-3-1", "Gegenpress"],
  SHU: ["3-5-2", "Counter-Attack"], BIR: ["4-2-3-1", "Balanced"],     WRX: ["4-4-2", "Direct Play"],
};
function aiTacticsByBase(base) {
  if (base >= 84) return { form: "4-3-3", style: "Tiki-Taka" };
  if (base >= 79) return { form: "4-2-3-1", style: "Gegenpress" };
  if (base >= 73) return { form: "4-4-2", style: "Balanced" };
  if (base >= 65) return { form: "4-5-1", style: "Counter-Attack" };
  return { form: "5-4-1", style: "Park the Bus" };
}
function aiTactics(clubIdx) {
  const t = AI_TACTICS[CLUBS[clubIdx].short];
  return t ? { form: t[0], style: t[1] } : aiTacticsByBase(CLUBS[clubIdx].base);
}
function styleTip(style) {
  return style === "Tiki-Taka" ? "They'll hog the ball — press high or sit compact, but don't chase shadows."
    : style === "Gegenpress" ? "They press ferociously — direct balls over the press can beat it, and their legs fade late."
    : style === "Counter-Attack" ? "They sit deep and break fast — don't overcommit your full-backs."
    : style === "Direct Play" ? "Long, early balls — win the second balls in midfield."
    : style === "Park the Bus" ? "A low block. You'll need patience, width, and probably a moment of magic."
    : "A balanced side — the match will be decided by quality.";
}

function rollWeather(week) {
  const r = rnd();
  if (week <= 5) return r < 0.55 ? "clear" : r < 0.7 ? "heat" : r < 0.85 ? "rain" : r < 0.95 ? "wind" : "storm";
  if (week >= 14 && week <= 27) return r < 0.35 ? "clear" : r < 0.6 ? "rain" : r < 0.75 ? "wind" : r < 0.88 ? "storm" : "snow";
  return r < 0.5 ? "clear" : r < 0.75 ? "rain" : r < 0.9 ? "wind" : "storm";
}
function getWeather() { // one forecast per game-week, fixed once rolled
  if (!G.wx || G.wx.week !== G.week || G.wx.season !== G.season) {
    G.wx = { week: G.week, season: G.season, kind: rollWeather(G.week) };
  }
  return WEATHER[G.wx.kind] ? G.wx.kind : "clear";
}
/* styles interact with conditions */
function weatherStyleMod(wx, style) {
  if (wx === "rain" || wx === "storm") {
    if (style === "Tiki-Taka") return { mid: 0.95 };
    if (style === "Direct Play") return { att: 1.03 };
  }
  if (wx === "wind") {
    if (style === "Direct Play") return { att: 0.93 };
    if (style === "Tiki-Taka") return { mid: 1.02 };
  }
  if (wx === "snow" && style === "Tiki-Taka") return { mid: 0.93 };
  return {};
}
/* Playing styles: trade-offs in strength, possession share, and fitness cost */
const STYLES = {
  "Balanced":       { att: 1.00, mid: 1.00, def: 1.00, poss: 0.00, drain: 1.0,  desc: "No special instructions." },
  "Gegenpress":     { att: 1.05, mid: 1.03, def: 0.97, poss: 0.03, drain: 1.45, desc: "Hunt the ball high up the pitch. Devastating — but legs tire much faster." },

  const [r1, g1, b1] = hex2rgb(home), [r2, g2, b2] = hex2rgb(away);
  const dist = Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);

    const homeIsLight = r1 + g1 + b1 > 460;

   Sunday and the round nearest 26 December played on Boxing Day itself, whatever
   the weekday (the great English tradition). Midweeks follow the real broadcast
   map: Champions League and League Cup on Tuesday/Wednesday nights, Europa AND
   Conference League on Thursdays. FA Cup ties take the Sunday of their week.

const DAY_MS = 86400000;

  //     (cups & Europe play in the midweek after league round wk−1)
  if (kind === "league") {
    const sat = seasonStartMs(G.season) + wk * 7 * DAY_MS;
    const d = new Date(sat);
    if (d.getUTCMonth() === 11 && d.getUTCDate() >= 23 && d.getUTCDate() <= 29)

  if (txt === null) return null; // you walked away

/* ---------------- Fixtures (double round robin, circle method) ---------------- */

function makeFixtures(n) {
  const ids = [...Array(n).keys()];
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = ids[i], b = ids[n - 1 - i];
      pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    ids.splice(1, 0, ids.pop());
  }
  const back = rounds.map(rd => rd.map(([h, a]) => [a, h]));
  return rounds.concat(back);
}

function rnd() { return Math.random(); }
function poisson(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
}

function teamNumbers(squad, xiIds, mentality, formName, styleName, weatherKind) {
  const xi = xiIds.map(id => squad.find(p => p.id === id)).filter(Boolean);
  // the lineup array is in slot order, so each man's rating is weighed by how
  // well his role fits the slot he is actually standing in
  const slots = formSlots(formName);
  const fitted = xi.map((p, i) => ({
    p, v: effRating(p) * roleFit(p.role || p.pos, slots[i] || p.role || p.pos),
  }));
  const g = pos => fitted.filter(x => x.p.pos === pos);
  const avg = arr => arr.length ? arr.reduce((s, x) => s + x.v, 0) / arr.length : 40;
  let att = avg(g("FW")) * 0.6 + avg(g("MF")) * 0.4;
  let mid = avg(g("MF"));
  let def = avg(g("DF")) * 0.65 + avg(g("GK")) * 0.35;
  if (xi.some(p => traitOf(p) === "leader")) { att *= 1.01; mid *= 1.01; def *= 1.01; }
  if (mentality === "Attacking") { att *= 1.07; def *= 0.94; }
  if (mentality === "Defensive") { att *= 0.93; def *= 1.06; }
  const fm = FORMATIONS[formName] || {};
  const st = STYLES[styleName] || STYLES.Balanced;
  const wx = WEATHER[weatherKind] || WEATHER.clear;
  const wm = weatherStyleMod(weatherKind, styleName);
  att *= (fm.att || 1) * st.att * wx.att * (wm.att || 1);
  mid *= (fm.mid || 1) * st.mid * (wm.mid || 1);
  def *= (fm.def || 1) * st.def * (wm.def || 1);
  if (xi.length < 11) { // down to 10 (or fewer) men
    const f = 1 - 0.07 * (11 - xi.length);
    att *= f; mid *= f; def *= f;
  }
  return { xi, att, mid, def, poss: st.poss || 0, drain: (st.drain || 1) * wx.drain };
}

function expGoals(my, opp, home) {
  const ratio = (my.att * 0.65 + my.mid * 0.35) / (opp.def * 0.7 + opp.mid * 0.3);
  let xg = 1.18 * Math.pow(ratio, 2.2);
  if (home) xg += 0.18;
  return Math.min(xg, 4.5);
}

function pickScorer(team) {
  const w = team.xi.map(p => (p.pos === "FW" ? 6 : p.pos === "MF" ? 3 : p.pos === "DF" ? 1 : 0) * (traitOf(p) === "talisman" ? 1.8 : 1));
  const total = w.reduce((a, b) => a + b, 0);
  let r = rnd() * total;
  for (let i = 0; i < team.xi.length; i++) { r -= w[i]; if (r <= 0) return team.xi[i]; }
  return team.xi[team.xi.length - 1];
}

function simMatch(hIdx, aIdx, opts) {
  const hSquad = G.squads[hIdx], aSquad = G.squads[aIdx];
  const hXI = (opts && opts.hXI) || bestXI(hSquad, "4-4-2");
  const aXI = (opts && opts.aXI) || bestXI(aSquad, "4-4-2");
  const wx = getWeather();
  const hAI = aiTactics(hIdx), aAI = aiTactics(aIdx);
  const H = teamNumbers(hSquad, hXI, (opts && opts.hMent) || "Balanced", (opts && opts.hForm) || hAI.form, (opts && opts.hStyle) || hAI.style, wx);
  const A = teamNumbers(aSquad, aXI, (opts && opts.aMent) || "Balanced", (opts && opts.aForm) || aAI.form, (opts && opts.aStyle) || aAI.style, wx);

  const derby = isDerby(hIdx, aIdx); // 🔥 rivalry: more goals, cards and penalties when these two meet
  const dGoal = derby ? 1.15 : 1, dCard = derby ? 1.7 : 1, dRed = derby ? 2.3 : 1, dPen = derby ? 2 : 1;
  const hg = poisson(expGoals(H, A, true) * dGoal);
  const ag = poisson(expGoals(A, H, false) * dGoal);

  const events = [];
  const addGoals = (n, team, clubIdx) => {
    for (let i = 0; i < n; i++) {
      const e = makeGoalEvent(team, clubIdx);
      e.min = 3 + Math.floor(rnd() * 88);
      events.push(e);
    }
  };
  addGoals(hg, H, hIdx);
  addGoals(ag, A, aIdx);

  // cards, injuries, and the odd missed penalty
  for (const [team, clubIdx] of [[H, hIdx], [A, aIdx]]) {
    if (rnd() < 0.08 * dPen) {
      const p = (clubIdx === G.myClub && G.pkTaker && team.xi.find(q => q.id === G.pkTaker)) || pickScorer(team);
      const k = Math.floor(rnd() * PKMISS_LINES.length);
      events.push({ min: 5 + Math.floor(rnd() * 85), type: "pkmiss", clubIdx, pid: p.id, who: p.name,
                    text: p.name + " " + PKMISS_LINES[k], zh: p.name + " " + PKMISS_LINES_ZH[k] });
    }
    for (const p of team.xi) {
      if (rnd() < 0.13 * dCard * (traitOf(p) === "hothead" ? 1.7 : 1)) {
        p.yellows++;
        events.push({ min: 10 + Math.floor(rnd() * 80), type: "yellow", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " goes into the book.", zh: p.name + " 食黃牌，俾球證記咗名。" });
        if (p.yellows % 4 === 0) p.ban = Math.max(p.ban, 1);
      }
      if (rnd() < 0.006 * dRed) {
        p.ban = Math.max(p.ban, 2);
        events.push({ min: 20 + Math.floor(rnd() * 70), type: "red", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " is sent off! Straight red.", zh: p.name + " 直接紅牌！即刻收工！" });
      }
      if (rnd() < 0.035 * (WEATHER[wx] || WEATHER.clear).inj * (traitOf(p) === "glass" ? 1.6 : traitOf(p) === "ironman" ? 0.5 : 1)) {
        p.injury = 1 + Math.floor(rnd() * 4);
        events.push({ min: 5 + Math.floor(rnd() * 85), type: "injury", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " limps off injured (" + p.injury + " wk).", zh: p.name + " 受傷一拐一拐離場（傷停 " + p.injury + " 週）。" });
      }
    }
  }
  events.sort((a, b) => a.min - b.min);

  // fitness and form
  const res = hg > ag ? 1 : hg < ag ? -1 : 0;
  for (const [team, sign] of [[H, res], [A, -res]]) {
    for (const p of team.xi) {
      p.apps++; p.morale = Math.min(100, (p.morale === undefined ? 75 : p.morale) + 2);
      p.fitness = Math.max(20, p.fitness - Math.round((10 + Math.floor(rnd() * 8)) * (team.drain || 1)));
      p.form = Math.max(-2, Math.min(2, p.form + (sign > 0 ? 1 : sign < 0 ? -1 : 0) * (rnd() < 0.6 ? 1 : 0)));
    }
  }
  const result = { h: hIdx, a: aIdx, hg, ag, events };
  if (hIdx === G.myClub || aIdx === G.myClub) {
    result.stats = synthStats(H, A, events, hIdx, aIdx);
    result.ratings = matchRatings(hIdx, aIdx, hXI, aXI, events, hg, ag);
    result.weather = wx;
  }
  return result;
}

/* Suspensions/injuries earned THIS week must not tick down until the week is over,
   so snapshot who was already out before kickoff and only decay those. */
function snapshotStatuses() {
  const inj = [], ban = [];
  for (const squad of G.squads) for (const p of squad) {
    if (p.injury > 0) inj.push(p.id);
    if (p.ban > 0) ban.push(p.id);
  }
  return { inj, ban };
}
function applyDecay(snapshot) {
  const inj = new Set(snapshot.inj), ban = new Set(snapshot.ban);
  for (const squad of G.squads) for (const p of squad) {
    if (inj.has(p.id) && p.injury > 0) { p.injury--; if (G.squads[G.myClub] && G.squads[G.myClub].includes(p) && p.injury > 0 && rnd() < staffTier("physio") * 0.25) p.injury--; }
    if (ban.has(p.id) && p.ban > 0) p.ban--;
    // weekly recovery: the more tired, the faster you recover — but European
    // midweeks cost fitness with no extra recovery, so congestion bites
    p.fitness = Math.min(100, Math.round(p.fitness + (100 - p.fitness) * 0.45));
    const m0 = p.morale === undefined ? 75 : p.morale;
    p.morale = Math.round((m0 + (m0 > 70 ? -1 : m0 < 70 ? 1 : 0)) * 10) / 10;
  }
}

function commitWeek(weekResults, myResult, snapshot) {
  ghQueueSync();
  if (myResult) { myResult.dateMs = matchDateMs("league", G.week); addDramaEvents(myResult); }
  applyDecay(snapshot);
  G.results.push(weekResults);
  G.week++;
  G.lastMatch = myResult;
  G.live = null;
  G.lastMatchEuro = false;
  G.lastMatchLabel = null;
  G.motmNews = null;
  G.motyNews = null;
  if (!windowOpen()) G.offersIn = []; // bids expire when the window shuts
  // the board reacts to league results
  if (G.board && myResult) {
    const win = (myResult.h === G.myClub && myResult.hg > myResult.ag) || (myResult.a === G.myClub && myResult.ag > myResult.hg);
    const draw = myResult.hg === myResult.ag;
    const t = tableStats();
    const p = t.findIndex(r => r.i === G.myClub) + 1;
    const drift = Math.max(-1.5, Math.min(1.5, (G.board.exp - p) * 0.15));
    if (myResult.h === G.myClub) { // 🎟 gate receipts
      const gate = Math.max(0.1, Math.round((0.3 + (CLUBS[G.myClub].base - 70) * 0.04 + (G.board.conf / 100) * 0.3) * 10) / 10);
      adjBudget(gate, "Matchday gate receipts", "gate");
    }
    const derbyX = isDerby(myResult.h, myResult.a) ? 2 : 1;
    boardBump((win ? 2 : draw ? 0.5 : -2.5) * derbyX + drift);
  }
  // Manager of the Month: best league record over each four-week block
  if (G.week % 4 === 0 && G.week <= 44 && G.results.length >= G.week) {
    const pts = {}, gd = {};
    for (let wk = G.week - 4; wk < G.week; wk++) {
      for (const r of G.results[wk]) {
        const dH = r.hg - r.ag;
        pts[r.h] = (pts[r.h] || 0) + (dH > 0 ? 3 : dH === 0 ? 1 : 0);
        pts[r.a] = (pts[r.a] || 0) + (dH < 0 ? 3 : dH === 0 ? 1 : 0);
        gd[r.h] = (gd[r.h] || 0) + dH;
        gd[r.a] = (gd[r.a] || 0) - dH;
      }
    }
    let best = null;
    for (const i of G.league) {
      const s = pts[i] || 0, d = gd[i] || 0;
      if (!best || s > best.s || (s === best.s && d > best.d)) best = { i, s, d };
    }
    if (best && best.i === G.myClub) {
      const MONTHS = ["August", "September", "October", "November", "December", "January", "February", "March", "April", "May", "June"];
      G.motm = G.motm || [];
      G.motm.push("Season " + G.season + " · " + MONTHS[G.week / 4 - 1] + " (" + best.s + " pts from 4 games)");
      G.motmNews = "🏅 Manager of the Month! Your " + best.s + " points from the last four league games topped the division.";
      boardBump(2);
    }
  }
  if (G.week >= G.fixtures.length) {
    const T = TIERS[tierIndex()];
    const tbl = tableStats();
    if (tbl[0].i === G.myClub) {
      G.honours.push("Season " + G.season + ": " + T.name + " champions");
      if (tierIndex() === 0) boardBump(15);
    }
    // playable promotion play-offs: a side finishing in the play-off places contests its own
    // semi-final and Wembley final before the rest of the pyramid is settled
    {
      const myPos = tbl.findIndex(r => r.i === G.myClub) + 1;
      if (T.po && myPos > T.autoUp && myPos >= T.po[0] && myPos <= T.po[1] && !G.playoff && !G.choff) {
        setupPlayoff(tbl.slice(T.po[0] - 1, T.po[1]).map(r => r.i), tierIndex());
        G.screen = "prematch"; save(); render(); return;
      }
    }
    G.screen = "seasonEnd";
    // settle the whole pyramid the instant the season ends; the rich Premier
    // League end screen still reads G.relegated / G.promoted, so mirror them
    if (!G.pyr) G.pyr = resolvePyramid();
    if (tierIndex() === 0) {
      G.relegated = G.pyr.down[0];
      G.promoted = G.pyr.up[1];
    }
    // Manager of the Season: your league title, a major trophy, or a clear overachievement vs squad stature
    {
      const myPos = tbl.findIndex(r => r.i === G.myClub) + 1;
      const sHon = (G.honours || []).filter(h => h.startsWith("Season " + G.season + ":")).map(h => (h.split(": ")[1] || ""));
      const wonLeague = sHon.some(h => /champions$/.test(h));
      const wonMajor = sHon.some(h => /winners$/.test(h) && !/Community Shield|Super Cup/.test(h));
      const byBase = [...G.league].sort((a, b) => CLUBS[b].base - CLUBS[a].base);
      const expPos = byBase.indexOf(G.myClub) + 1;
      const margin = Math.max(3, Math.round(G.league.length * 0.2));
      const overachieved = myPos > 0 && (expPos - myPos) >= margin && myPos <= Math.ceil(G.league.length / 2);
      if ((wonLeague || wonMajor || overachieved) && !(G.moty || []).some(m => m.startsWith("Season " + G.season + " "))) {
        const why = wonLeague ? "won the " + T.name + " title"
                  : wonMajor ? "lifted major silverware"
                  : "overachieved - finished #" + myPos + " (expected #" + expPos + ")";
        G.moty = G.moty || [];
        G.moty.push("Season " + G.season + " · " + CLUBS[G.myClub].name + " — " + why);
        G.motyNews = "🏆 Manager of the Season! You " + why + " with " + CLUBS[G.myClub].name + ".";
        boardBump(6);
      }
    }
  } else {
    G.screen = "matchResult";
    if (!checkSack() && !G.event && G.week >= 2 && rnd() < 0.28) generateEvent();
  }
  save();
  render();
}

function quickSim() {
  if (G.week >= G.fixtures.length || G.live || dueEuro() || dueCup() || duePreseason()) return;
  defaultExpectation();
  const my = G.myClub;
  prepMatchLineup();
  const snapshot = snapshotStatuses();
  let myResult = null;
  const weekResults = G.fixtures[G.week].map(([h, a]) => {
    const opts = {};
    if (h === my) { opts.hXI = G.lineup; opts.hMent = G.mentality; opts.hForm = G.formation; opts.hStyle = G.style || "Balanced"; }
    if (a === my) { opts.aXI = G.lineup; opts.aMent = G.mentality; opts.aForm = G.formation; opts.aStyle = G.style || "Balanced"; }
    const r = simMatch(h, a, opts);
    if (h === my || a === my) myResult = r;
    return r;
  });
  commitWeek(weekResults, myResult, snapshot);
}

/* ---------------- Challenge modes ---------------- */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function startChallenge(kind) {
  if (kind === "survival") {
    const pl = defaultTiers()[0];
    let weak = pl[0];
    for (const i of pl) if (CLUBS[i].base < CLUBS[weak].base) weak = i;
    newGame(weak);
    G.challenge = "survival";
    G.board = { conf: 55, exp: 17, grace: 6, chosen: true, choice: "survival" };
    G.budget = Math.max(10, Math.round(G.budget * 0.6));
    ledgerOpen();
    genMissions();
    save(); render();
    return;
  }
  if (kind === "daily") {
    const ds = new Date().toISOString().slice(0, 10);
    const seed = strHash("FM-" + ds);
    const realRandom = Math.random;
    Math.random = mulberry32(seed); // deterministic world: same squads, fixtures, draws for everyone today
    try { const pl = defaultTiers()[0]; newGame(pl[seed % pl.length]); } finally { Math.random = realRandom; }
    G.challenge = "daily";
    G.challengeDate = ds;
    G.board.chosen = true; G.board.choice = "daily";
    save(); render();
    return;
  }
  if (kind === "rescue") {
    newGame(0);
    G.challenge = "rescue";
    // the first half of the season happens without you...
    const me = G.myClub;
    G.myClub = -1;
    for (let wk = 0; wk < 19; wk++) {
      const snapshot = snapshotStatuses();
      G.results.push(G.fixtures[wk].map(([h, a]) => simMatch(h, a, {})));
      G.week++;
      applyDecay(snapshot);
    }
    // ...and you inherit whoever is bottom, in the January window
    const t = tableStats();
    G.myClub = t[t.length - 1].i;
    G.formation = "4-4-2"; G.mentality = "Balanced"; G.style = "Balanced";
    G.lineup = bestXI(G.squads[G.myClub], G.formation);
    G.budget = Math.max(5, Math.round((10 + (CLUBS[G.myClub].base - 70) * 3) * 0.6));
    ledgerOpen();
    setWageCap();
    G.board = { conf: 45, exp: 17, grace: 25, chosen: true, choice: "rescue" };
    G.cups.lc.alive = "out"; G.cups.fa.alive = "out"; // the old manager's messes
    G.euro = null;
    G.sponsor = { name: "Crown Logistics", base: Math.max(3, sponsorRep() - 4), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 1 };
    G.sponsorOffers = null;
    G.dealsKey = null; // a fresh January window awaits
    save(); render();
    return;
  }
  if (kind === "takeover") {
    const candidates = defaultTiers()[0].filter(i => CLUBS[i].base <= 77);
    newGame(candidates[Math.floor(Math.random() * candidates.length)]);
    G.challenge = "takeover";
    G.budget = 400;
    ledgerOpen();
    G.wcap = Math.round(wageCapFormula() * 1.6);
    G.board = { conf: 70, exp: 1, grace: 6, chosen: true, choice: "takeover" };
    save(); render();
    return;
  }
  if (kind === "youth") {
    newGame(4); // Brighton — the model academy club
    G.challenge = "youth";
    G.board = { conf: 65, exp: 6, grace: 6, chosen: true, choice: "youth" };
    save(); render();
  }
}

function challengeVerdict(myPos) { // called at season end; returns banner line or ""
  if (!G.challenge) return "";
  const done = label => {
    G.honours.push("Season " + G.season + ": 🎖 " + label);
    G.challenge = null;
    return `<p style="color:var(--amber)"><b>🎖 CHALLENGE COMPLETE: ${label}</b></p>`;
  };
  const fail = msg => { G.challenge = null; return `<p style="color:var(--red)"><b>Challenge over:</b> ${msg}</p>`; };
  if (G.challenge === "rescue") {
    return myPos <= 17 ? done("Relegation Rescue — kept them up from the bottom of the table")
                       : fail("relegated. Some rescues are beyond anyone.");
  }
  if (G.challenge === "takeover") {
    if (myPos === 1) return done("The Takeover — title delivered in season " + G.season);
    if (G.season >= 2) return fail("two seasons, no title. The owner's jet is waiting.");
    return `<p class="note">🎖 The Takeover: the owner expects the title <b>next season</b>. No excuses.</p>`;
  }
  if (G.challenge === "youth") {
    if (myPos <= 6) return done("Youth Project — top six with a transfer ban");
    if (G.season >= 3) return fail("three seasons without cracking the top six. The project ends.");
    return `<p class="note">🎖 Youth Project: top six needed within ${3 - G.season} more season${3 - G.season > 1 ? "s" : ""}. Academy and loans only.</p>`;
  }
  if (G.challenge === "survival") {
    G.challenge = null;
    if (myPos <= 17) {
      G.honours.push("Season " + G.season + ": 🎖 Survival Season — kept " + CLUBS[G.myClub].name + " up against the odds");
      return `<p style="color:var(--pitch)"><b>🎖 SURVIVAL SEASON COMPLETE — ${esc(CLUBS[G.myClub].name)} stay up (#${myPos})!</b> Into the Hall of Fame it goes.</p>`;
    }
    return `<p style="color:var(--red)"><b>🎖 Survival Season failed — relegated in #${myPos}.</b> The weakest squad proved too weak this time.</p>`;
  }
  if (G.challenge === "daily") {
    G.challenge = null;
    return `<p style="color:var(--amber)"><b>🎖 Daily Challenge ${esc(G.challengeDate || "")} complete — you finished #${myPos}.</b> Download your season card and compare with friends who played today's world.</p>`;
  }
  return "";
}

/* Between matches, club life happens — and the manager must choose. */

function evPick(filter, n) {
  const pool = G.squads[G.myClub].filter(p => !p.loan && (!filter || filter(p)));
  const out = [];
  while (out.length < (n || 1) && pool.length) out.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  return out;
}
function bumpForm(p, d) { if (p) p.form = Math.max(-2, Math.min(2, (p.form || 0) + d)); }
function friendliesLeft() {
  if (G.friendlySeason !== G.season) { G.friendlySeason = G.season; G.friendliesPlayed = 0; G.friendlyNews = null; }
  return Math.max(0, 3 - (G.friendliesPlayed || 0));
}
function playFriendly() {
  if (G.week !== 0 || G.live || friendliesLeft() <= 0) return;
  let opp = G.myClub, guard = 0;
  while (opp === G.myClub && guard++ < 50) opp = Math.floor(rnd() * EURO_SLOT);
  const home = rnd() < 0.5;
  const xi = validateLineup();
  const myStr = xi.reduce((t, id) => { const p = pById(id); return t + (p ? effRating(p) : 0); }, 0) / Math.max(1, xi.length);
  const oppXi = bestXI(G.squads[opp], "4-4-2");
  const oppStr = oppXi.reduce((t, id) => { const p = G.squads[opp].find(x => x.id === id); return t + (p ? p.rating : 0); }, 0) / Math.max(1, oppXi.length);
  const edge = (myStr - oppStr) * 0.06 + (home ? 0.3 : -0.1);
  const goalsFor = e => Math.max(0, Math.round((1.1 + e) * (0.45 + rnd())));
  const myG = goalsFor(edge), opG = goalsFor(-edge);
  // minutes sharpen the side; nobody is booked or cup-tied in a friendly; small knock risk
  for (const id of xi) { const p = pById(id); if (p) { bumpForm(p, 1); if (rnd() < 0.025) p.injury = Math.max(p.injury, 1 + Math.floor(rnd() * 2)); } }
  adjBudget(home ? 0.4 : 0.2, "Pre-season friendly gate", "gate");
  G.friendliesPlayed = (G.friendliesPlayed || 0) + 1;
  const me = CLUBS[G.myClub].short, op = CLUBS[opp].short;
  const score = home ? me + " " + myG + "-" + opG + " " + op : op + " " + opG + "-" + myG + " " + me;
  G.friendlyNews = "\ud83e\udd1d Friendly: " + score + ". Sharpness up across the XI." + (friendliesLeft() ? " (" + friendliesLeft() + " left)" : "");
  save(); render();
}
function pById(id) { return G.squads[G.myClub].find(p => p.id === id); }

function generateEvent() {
  const keys = Object.keys(EVENT_DEFS).sort(() => rnd() - 0.5);
  for (const key of keys) {
    const built = EVENT_DEFS[key].build();
    if (built) {
      G.event = { key, ctx: built.ctx, text: built.text, choices: built.choices, auto: built.auto };

}
function decideEvent(i) {
  const e = G.event;
  if (!e || !EVENT_DEFS[e.key]) return;
  G.eventNews = "📰 " + EVENT_DEFS[e.key].resolve(e.ctx, i);
  G.event = null;
  save(); render();
}
function autoResolveEvent() { // played on without deciding — the passive option happens
  const e = G.event;
  if (!e || !EVENT_DEFS[e.key]) return;
  G.eventNews = "📰 (Unattended) " + EVENT_DEFS[e.key].resolve(e.ctx, e.auto);

}

/* ---------------- Other English clubs in Europe ---------------- */

function resolveEuroRivals() { // their campaigns settle at season's end
  G.euroRivalNews = [];
  for (const r of (G.euroRivals || [])) {
    const base = CLUBS[r.i].base;
    const winP = Math.max(0.3, Math.min(0.72, 0.35 + (base - 76) * 0.025));
    let label;
    const roll = rnd();
    if (roll > winP * 0.6 + 0.45) label = "went out in the league phase";
    else if (roll >= winP * 0.6 && rnd() > winP) label = "lost in the knockout play-offs";
    else {
      const rounds = ["the Round of 16", "the quarter-finals", "the semi-finals", "the final"];
      let k = 0;
      while (k < 4 && rnd() < winP) k++;
      if (k === 4 && G.euro && G.euro.comp === r.comp && G.euro.stage === "won") k = 3; // you took that trophy
      label = k === 4 ? "🏆 WON the " + COMP_NAME[r.comp] + "!" : "went out in " + rounds[k];
    }
    r.done = label;
    G.euroRivalNews.push("🌍 " + CLUBS[r.i].name + " (" + COMP_NAME[r.comp] + ") " + label);
  }
}
function assignEuroRivals(finalT) {
  const rivals = [];
  finalT.slice(0, 6).forEach((row, idx) => {
    if (row.i === G.myClub) return;
    rivals.push({ i: row.i, comp: idx < 4 ? "UCL" : idx === 4 ? "UEL" : "UECL", done: null });
  });
  G.euroRivals = rivals;
}

const SPONSOR_NAMES = ["Volt Energy", "Nimbus Cloud", "Harbour Finance", "AeroJet Airways", "DragonPay",
  "Stellar Telecom", "RedLion Brewery", "Velocity Motors", "TigerPay", "Apex Insurance",
  "Borealis Hotels", "Summit Sports", "Crown Logistics", "Meridian Bank"];

function sponsorRep() { // commercial appeal: stature + recent success
  let rep = (CLUBS[G.myClub].base - 64) * 1.3;
  const lastSeason = (G.career || [])[Math.max(0, (G.career || []).length - 1)];
  if (lastSeason && lastSeason.club === CLUBS[G.myClub].name) rep += Math.max(0, (21 - lastSeason.pos) * 0.4);
  rep += (G.honours || []).filter(h => h.startsWith("Season " + (G.season - 1) + ":")).length * 5;
  if (G.euro) rep += G.euro.comp === "UCL" ? 4 : 2;
  return Math.max(3, Math.round(rep));
}
function ensureSponsorOffers() {
  if (G.sponsor || G.week !== 0) return;
  if (G.sponsorOffers && G.sponsorOffers.length) return;
  const rep = sponsorRep();
  const names = [...SPONSOR_NAMES].sort(() => rnd() - 0.5);
  G.sponsorOffers = [
    { name: names[0], kind: "guaranteed", base: Math.round(rep * 1.0), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 3,
      blurb: "£" + Math.round(rep) + "M/yr guaranteed for 3 years. Safe money, no strings." },
    { name: names[1], kind: "performance", base: Math.round(rep * 0.6), winBonus: 0.3, top4Bonus: 8, trophyBonus: 10, years: 2,
      blurb: "£" + Math.round(rep * 0.6) + "M/yr base + £0.3M per league win + £8M for top four + £10M per trophy. Back yourself." },
    { name: names[2], kind: "short", base: Math.round(rep * 0.85), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 1,
      blurb: "£" + Math.round(rep * 0.85) + "M/yr for one year only — renegotiate from strength after a big season." },
  ];
  save();
}
function signSponsor(i) {
  const o = (G.sponsorOffers || [])[i];
  if (!o || G.sponsor) return;
  G.sponsor = { name: o.name, base: o.base, winBonus: o.winBonus, top4Bonus: o.top4Bonus, trophyBonus: o.trophyBonus, years: o.years };
  G.sponsorOffers = null;
  adjBudget(o.base, "Sponsor signing-on (" + o.name + ")", "sponsor"); // year one, paid up front
  G.deals = G.deals || [];
  G.deals.unshift("🤝 Signed " + o.name + " as shirt sponsor — £" + o.base + "M banked for year one");
  save(); render();
}
function defaultSponsor() { // playing on without choosing = take the guaranteed money
  if (G.week === 0 && !G.sponsor) {
    ensureSponsorOffers();
    if (G.sponsorOffers && G.sponsorOffers.length) signSponsor(0);
  }
}

/* ---------------- The board: expectations, confidence, the sack ---------------- */

function expectedPos(clubIdx) {
  const ranked = [...G.league].sort((a, b) => CLUBS[b].base - CLUBS[a].base);
  return ranked.indexOf(clubIdx) + 1;
}
function boardOptions() {
  const natural = expectedPos(G.myClub);
  const opts = [];
  const ambTarget = Math.max(1, natural - 4);
  if (ambTarget < natural) {
    opts.push({ kind: "ambitious", target: ambTarget,
      title: "🔥 Promise them the moon",
      desc: "Target: " + expectationText(ambTarget) + ". The board releases a war chest of +£" + ambitionBonus() + "M — but you will be judged against this all season." });
  }
  opts.push({ kind: "realistic", target: natural,
    title: "🤝 A sensible season",
    desc: "Target: " + expectationText(natural) + ". No promises, no extras. The board nods." });
  const conTarget = Math.min(G.league.length, natural + 4);
  if (conTarget > natural) {
    opts.push({ kind: "conservative", target: conTarget,
      title: "🛡 Manage expectations down",
      desc: "Target: " + expectationText(conTarget) + ". An easier yardstick — but the board keeps 25% of your transfer budget back." });
  }
  return opts;
}
function ambitionBonus() { return Math.max(5, 10 + Math.round((CLUBS[G.myClub].base - 70) * 1.5)); }

function setExpectation(kind) {
  if (!G.board || G.board.chosen) return;
  const opt = boardOptions().find(o => o.kind === kind);
  if (!opt) return;
  G.board.exp = opt.target;
  G.board.choice = kind;
  G.board.chosen = true;
  if (kind === "ambitious") adjBudget(ambitionBonus(), "Board war chest (ambitious objective)", "funds");
  if (kind === "conservative") adjBudget(Math.round((G.budget || 0) * 0.75) - (G.budget || 0), "Budget held back (conservative objective)", "running");
  save(); render();
}
function defaultExpectation() { // playing on without choosing = the sensible option
  if (G.board && !G.board.chosen) { G.board.choice = "realistic"; G.board.chosen = true; }
  defaultSponsor();
  if (G.event) autoResolveEvent();
}

function expectationText(e) {
  return e <= 2 ? "challenge for the title" :
         e <= 4 ? "qualify for the Champions League" :
         e <= 7 ? "push for European football" :
         e <= 12 ? "a solid top-half finish" :
         e <= 16 ? "comfortable mid-table safety" : "avoid relegation at all costs";
}
/* 🔥 Derby days: rivalries with double stakes and a hotter crowd */
const DERBIES = [["ARS","TOT"],["LIV","EVE"],["MUN","MCI"],["MUN","LIV"],["CHE","FUL"],["WHU","TOT"],["NEW","SUN"],["AVL","WOL"],["BRE","FUL"],["CRY","BHA"],["SHU","LEE"],["BIR","AVL"],["SHU","SHW"],["NOR","IPS"],["POM","SOU"],["CHA","MLW"],["BLB","BUR"],["BLB","PNE"],["DER","NFO"],["COV","LEI"],["MID","SUN"],["QPR","FUL"],["WBA","WOL"],["LEE","MUN"],["CAR","SWA"]];
function isDerby(h, a) {
  const x = CLUBS[h] && CLUBS[h].short, y = CLUBS[a] && CLUBS[a].short;
  return DERBIES.some(([m, n]) => (m === x && n === y) || (m === y && n === x));
}
/* 🎙 drama pass: hat-tricks, last-gasp winners, momentum bursts */
function addDramaEvents(r) {
  if (!r || !r.events) return;
  const goals = r.events.filter(e => e.type === "goal").sort((m, n) => m.min - n.min);
  const byWho = {};
  for (const e of goals) {
    byWho[e.who] = (byWho[e.who] || 0) + 1;
    if (byWho[e.who] === 3) r.events.push({ min: e.min, type: "info",
      text: "🎩 A HAT-TRICK for " + e.who + " — he takes the match ball home!",
      zh: "🎩 " + e.who + " 大演帽子戲法——皮球袋住走！" });
  }
  const last = goals[goals.length - 1];
  if (last && last.min >= 88 && Math.abs(r.hg - r.ag) === 1) {
    const winSide = r.hg > r.ag ? r.h : r.a;
    if (last.clubIdx === winSide) r.events.push({ min: last.min, type: "info",
      text: "⚡ AT THE DEATH! " + last.who + " wins it in the dying seconds — scenes!",
      zh: "⚡ 絕殺！" + last.who + " 最後關頭一錘定音——全場瘋咗！" });
  }
  for (let i = 1; i < goals.length; i++) {
    if (goals[i].clubIdx === goals[i-1].clubIdx && goals[i].min - goals[i-1].min <= 5) {
      r.events.push({ min: goals[i].min, type: "info",
        text: "🔥 Two in five minutes — the momentum is unstoppable!",
        zh: "🔥 五分鐘內連入兩球——勢不可擋！" });
      break;
    }
  }
  // 📺 VAR: some goals get checked; the wait is the drama
  for (const e of goals) {
    if (rnd() < 0.14) r.events.push({ min: e.min, type: "info",
      text: "📺 VAR CHECK on " + e.who + "'s goal… a long wait… GOAL STANDS. The ground exhales.",
      zh: "📺 VAR 覆核 " + e.who + " 嘅入球……漫長等待……入球有效！全場鬆一口氣。" });
  }
  if (rnd() < 0.05) r.events.push({ min: 25 + Math.floor(rnd() * 55), type: "info",
    text: "📺 VAR drama — a penalty shout is checked at the monitor… and waved away. The manager kicks a water bottle.",
    zh: "📺 VAR 風波——十二碼爭議返睇監視器……最後不了了之。教練一腳踢飛水樽。" });
  r.events.sort((m, n) => m.min - n.min);
}

/* ---------------- Season missions ----------------
   Two side-quests beside the board objective, scaled to the club's stature.
   Completed missions pay +£8M each into next season's budget; a survival
   mission completed from the drop zone at Christmas earns the Great Escape. */
function genMissions() {
  const exp = expectedPos(G.myClub);
  const ms = [];
  if (exp >= 15) ms.push({ k: "survive", text: "🛡 Win the relegation battle — finish 17th or higher" });
  else if (exp >= 7) ms.push({ k: "tophalf", text: "📈 Finish in the top half" });
  else ms.push({ k: "trophy", text: "🏆 Win at least one trophy" });
  ms.push({ k: "giantkill", text: "⚔ Beat one of the giants (squad strength 84+)" });
  ms.push({ k: "cuprun", text: "🏆 Reach a domestic cup quarter-final" });
  G.missions = ms;
}
function missionDone(m) {
  const t = tableStats();
  const pos = t.findIndex(r => r.i === G.myClub) + 1;
  switch (m.k) {
    case "survive": return pos > 0 && pos <= 17;
    case "tophalf": return pos > 0 && pos <= 10;
    case "trophy": return (G.honours || []).some(h => h.startsWith("Season " + G.season + ":"));
    case "giantkill":
      for (const wk of G.results) for (const r of wk) {
        let gf = null, ga, opp;
        if (r.h === G.myClub) { gf = r.hg; ga = r.ag; opp = r.a; }
        else if (r.a === G.myClub) { gf = r.ag; ga = r.hg; opp = r.h; }
        if (gf !== null && gf > ga && CLUBS[opp] && CLUBS[opp].base >= 84) return true;
      }
      return false;
    case "cuprun":
      return ["lc", "fa"].some(key => {
        const c = G.cups && G.cups[key];
        if (!c || !c.rounds) return false;
        const reached = c.alive === "won" ? c.rounds.length : c.r;
        return reached >= c.rounds.length - 3;
      });
    default: return false;
  }
}
function missionsLine() { // live status for the main screen
  if (!(G.missions || []).length) return "";
  return `<p class="note" style="margin:0 0 10px">📋 Missions: ` +
    G.missions.map(m => `${missionDone(m) ? "✅" : "⏳"} ${esc(m.text)}`).join(" · ") +
    ` <span class="note">(+£8M next season each)</span></p>`;
}

function boardBump(n) {
  if (!G.board) return;
  G.board.conf = Math.max(0, Math.min(100, G.board.conf + n));
}

function checkSack() {
  // patience scales with stature: elite boards pull the trigger far sooner,
  // and promising the moon at the meeting shortens the rope further
  const base = CLUBS[G.myClub].base;
  const graceCut = base >= 84 ? 2 : base >= 79 ? 1 : 0;
  if (!G.board || G.week <= Math.max(3, (G.board.grace || 6) - graceCut)) return false;
  const threshold = 5 + (base >= 84 ? 8 : base >= 79 ? 4 : 0) + (G.board.choice === "ambitious" ? 4 : 0);
  if (G.board.conf > threshold) return false;
  // dismissed — struggling clubs come calling
  const t = tableStats();
  const strugglers = t.slice(10).map(r => r.i).filter(i => i !== G.myClub);
  const offers = [];
  while (offers.length < 3 && strugglers.length) {
    const k = Math.floor(rnd() * strugglers.length);
    offers.push(strugglers.splice(k, 1)[0]);
  }
  G.offers = offers;
  G.screen = "sacked";
  return true;
}

function takeJob(clubIdx) {
  if (!G.offers || !G.offers.includes(clubIdx)) return;
  const oldClub = G.myClub;
  // record the spell that just ended so the Hall of Fame shows both clubs for this season
  {
    const pos = tableStats().findIndex(r => r.i === oldClub) + 1;
    G.career = G.career || [];
    G.career.push({ s: G.season, club: CLUBS[oldClub].name, pos: pos || G.league.length,
      sacked: true, notes: "Sacked - #" + (pos || "?") + " when dismissed" });
  }
  G.myClub = clubIdx;
  // in the cup brackets, you now ARE the new club: swap the entrant identities
  for (const key of ["lc", "fa"]) {
    const c = G.cups && G.cups[key];
    if (!c || !c.remaining) continue;
    for (const e of c.remaining) {
      if (e.kind === "league" && e.idx === clubIdx) { e.idx = oldClub; }
    }
    if (c.opp && c.opp.kind === "league" && c.opp.idx === clubIdx) { c.opp = null; }
  }
  G.euro = null;                 // the European campaign stayed with your old club
  G.budget = Math.max(5, 10 + (CLUBS[clubIdx].base - 70) * 3);
  ledgerOpen("New club: opening transfer budget");
  G.sponsor = null; G.sponsorOffers = null; G.sponsorNews = null; // the deal stayed with your old club
  setWageCap();
  G.board = { conf: 60, exp: expectedPos(clubIdx), grace: G.week + 6, chosen: true };
  G.mgr = { wage: managerWageFor(clubIdx), years: 2 }; // a short proving deal at a club that just sacked its boss
  G.formation = "4-4-2"; G.mentality = "Balanced";
  G.lineup = bestXI(G.squads[clubIdx], G.formation);
  delete G.offers;
  G.screen = "main"; G.tab = "squad";
  genMissions();
  save(); render();
}

function managerWageFor(clubIdx) {
  const base = CLUBS[clubIdx] ? CLUBS[clubIdx].base : 70;
  return Math.max(0.5, Math.round((0.6 + (base - 65) * 0.18) * 10) / 10); // £M/yr, scales with club stature
}
function ensureMgr() {
  if (G && !G.mgr && CLUBS[G.myClub]) G.mgr = { wage: managerWageFor(G.myClub), years: 3 };
}
function mgrRep() {
  const base = (CLUBS[G.myClub] ? CLUBS[G.myClub].base : 70);
  return Math.round(base + Math.min(14, ((G.honours || []).length) * 2));
}
function jobRejects(clubIdx) {
  const gap = CLUBS[clubIdx].base - mgrRep(); // +ve means the club is a stretch above your reputation
  let p = gap >= 5 ? 0.6 : gap >= 3 ? 0.4 : gap >= 1 ? 0.2 : 0.05;
  const releg = (G.career || []).slice(-3).filter(c => /Relegat/i.test(c.notes || "")).length;
  const sacks = (G.career || []).filter(c => c.sacked).length;
  p += releg * 0.12 + Math.min(0.2, sacks * 0.08);
  if ((G.honours || []).length >= 3) p -= 0.15;
  return rnd() < Math.max(0, Math.min(0.85, p));
}
function applyJob(clubIdx) {
  if (!CLUBS[clubIdx]) return;
  if (typeof confirm === "function" && !confirm("Apply to take over " + CLUBS[clubIdx].name + " for " + seasonYears(G.season + 1) + "? You leave " + CLUBS[G.myClub].name + "; your transfer budget, sponsor and any European place stay behind.")) return;
  if (jobRejects(clubIdx)) {
    if (typeof alert === "function") alert(CLUBS[clubIdx].name + " have gone in another direction. \"We thank you for your interest, but your record does not yet convince the board.\" Build your reputation and try again.");
    return;
  }
  const wage = managerWageFor(clubIdx);
  let yrs = 3;
  if (typeof prompt === "function") {
    const t = prompt(CLUBS[clubIdx].name + " accept your application and offer £" + wage + "M/yr. How many years do you want to sign for? (1 to 5)", "3");
    if (t === null) return; // walked away from the table
    yrs = Math.max(1, Math.min(5, Math.round(parseFloat(t) || 0) || 3));
  }
  G._mgrYears = yrs;
  nextSeason(clubIdx);
}
function jobCentreHtml() {
  if (!G.pyr || !G.pyr.newTiers) return "";
  const rep = mgrRep();
  const cands = G.pyr.newTiers.flat()
    .filter(i => i !== G.myClub && CLUBS[i] && (CLUBS[i].base - rep) <= 7)
    .sort((a, b) => CLUBS[b].base - CLUBS[a].base)
    .slice(0, 12);
  if (!cands.length) return "";
  const cards = cands.map(i => {
    const ti = tierOfClub(i, G.pyr.newTiers);
    const gap = CLUBS[i].base - rep;
    const tag = gap >= 4 ? " · a real step up" : gap >= 1 ? " · a step up" : gap <= -8 ? " · a smaller club" : " · a sideways move";
    return `<div class="club-card" onclick="applyJob(${i})"><div class="cname">${esc(CLUBS[i].name)}</div><div class="cinfo">${esc(TIERS[ti].name)} · squad strength ${CLUBS[i].base}${tag}</div></div>`;
  }).join("");
  return `<div class="panel" style="border-color:var(--amber)"><h2>💼 Job Centre — managerial vacancies</h2><p class="note">Fancy a fresh challenge for ${seasonYears(G.season + 1)}? Apply to take over another club. Bigger clubs open up as your reputation grows through trophies and overachieving, and lower-division clubs will still take a chance on you if your reputation dips. A club may turn you down if your record is not strong enough. Your transfer budget, sponsor and any European place stay behind.</p><div class="club-grid">${cards}</div></div>`;
}
