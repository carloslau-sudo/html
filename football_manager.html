}

function anaFrame(id) { // shared chart scaffolding: context + plot rectangle
  const c = document.getElementById(id);
  if (!c || !c.getContext) return null;
  const x = c.getContext("2d");
  if (!x) return null;
  const W = c.width, H = c.height, L = 34, R = 12, T = 14, B = 22;
  x.clearRect(0, 0, W, H);
  x.font = "11px " + "'SF Mono', Consolas, monospace";
  return { x, W, H, L, R, T, B, iw: W - L - R, ih: H - T - B };
}

function drawPosChart(hist) {
  const f = anaFrame("ana-pos");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const Tp = TIERS[tierIndex()];
  const N = G.fixtures.length, P = G.league.length;
  const X = w => L + (N <= 1 ? 0 : (w / (N - 1)) * iw);
  const Y = pos => T + ((pos - 1) / (P - 1)) * ih;
  const relStart = Tp.down > 0 ? P - Tp.down + 0.5 : P + 1;
  // zones: promotion / European places at the top, the drop at the foot
  if (tierIndex() === 0) {
    x.fillStyle = "rgba(46,174,106,0.10)"; x.fillRect(L, Y(1), iw, Y(4.5) - Y(1));
    x.fillStyle = "rgba(232,179,60,0.07)"; x.fillRect(L, Y(4.5), iw, Y(6.5) - Y(4.5));
  } else {
    if (Tp.autoUp) { x.fillStyle = "rgba(46,174,106,0.12)"; x.fillRect(L, Y(0.5), iw, Y(Tp.autoUp + 0.5) - Y(0.5)); }
    if (Tp.po) { x.fillStyle = "rgba(53,176,122,0.08)"; x.fillRect(L, Y(Tp.po[0] - 0.5), iw, Y(Tp.po[1] + 0.5) - Y(Tp.po[0] - 0.5)); }
  }
  if (Tp.down > 0) { x.fillStyle = "rgba(216,92,74,0.12)"; x.fillRect(L, Y(relStart), iw, Y(P) - Y(relStart)); }
  x.fillStyle = "#9FB3BE"; x.textAlign = "right"; x.textBaseline = "middle";
  const marks = [...new Set([1, tierIndex() === 0 ? 4 : (Tp.autoUp || 1), Math.round(P / 2), Tp.down > 0 ? P - Tp.down + 1 : P - 2, P])].filter(p => p >= 1 && p <= P).sort((a, b) => a - b);
  for (const p of marks) {
    x.fillText(p, L - 6, Y(p));
    x.strokeStyle = "rgba(159,179,190,0.12)"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(L, Y(p)); x.lineTo(L + iw, Y(p)); x.stroke();
  }
  if (G.board && G.board.exp) { // the board's demand, as a dashed line
    x.strokeStyle = "rgba(232,179,60,0.7)"; x.setLineDash([5, 4]);
    x.beginPath(); x.moveTo(L, Y(G.board.exp)); x.lineTo(L + iw, Y(G.board.exp)); x.stroke();
    x.setLineDash([]);
    x.fillStyle = "#E8B33C"; x.textAlign = "left";
    x.fillText("board: " + ordinal(G.board.exp), L + 4, Y(G.board.exp) - 8);
  }
  x.strokeStyle = "#E8EFF2"; x.lineWidth = 2; x.beginPath();
  hist.forEach((m, w) => { const px = X(w), py = Y(m.pos); w ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  hist.forEach((m, w) => {
    x.beginPath(); x.arc(X(w), Y(m.pos), 3.4, 0, 6.29);
    x.fillStyle = ANA_RES_COL[m.res]; x.fill();
  });
}

function drawGoalsChart(hist) {
  const f = anaFrame("ana-goals");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const N = G.fixtures.length;
  const mid = T + ih / 2;
  const peak = Math.max(3, ...hist.map(m => Math.max(m.gf, m.ga)));
  const bw = Math.max(3, iw / N - 2);
  x.strokeStyle = "rgba(159,179,190,0.35)";
  x.beginPath(); x.moveTo(L, mid); x.lineTo(L + iw, mid); x.stroke();
  hist.forEach((m, w) => {
    const px = L + (w / N) * iw + 1;
    const hF = (m.gf / peak) * (ih / 2 - 2), hA = (m.ga / peak) * (ih / 2 - 2);
    x.fillStyle = "rgba(46,174,106,0.85)"; x.fillRect(px, mid - hF, bw, hF);
    x.fillStyle = "rgba(216,92,74,0.85)"; x.fillRect(px, mid + 1, bw, hA);
  });
  x.fillStyle = "#9FB3BE"; x.textAlign = "left"; x.textBaseline = "middle";
  x.fillText("scored ↑", L + 4, T + 8);
  x.fillText("conceded ↓", L + 4, T + ih - 8);
}

function drawPaceChart(hist) {
  const f = anaFrame("ana-pace");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const N = G.fixtures.length;
  const refs = [[2.0, "title pace", "#E8B33C"], [1.74, "top-4 pace", "#2EAE6A"], [1.0, "safety", "#D85C4A"]];
  const yMax = Math.max(2.0 * N, hist[hist.length - 1].pts * (N / hist.length)) + 4;
  const X = w => L + ((w + 1) / N) * iw;
  const Y = pts => T + ih - (pts / yMax) * ih;
  x.textBaseline = "middle";
  for (const [rate, label, col] of refs) {
    x.strokeStyle = col; x.globalAlpha = 0.45; x.setLineDash([4, 4]);
    x.beginPath(); x.moveTo(L, Y(0)); x.lineTo(L + iw, Y(rate * N)); x.stroke();
    x.setLineDash([]); x.globalAlpha = 1;
    x.fillStyle = col; x.textAlign = "right";
    x.fillText(label + " (" + Math.round(rate * N) + ")", L + iw - 4, Y(rate * N) + 9);
  }
  x.strokeStyle = "#E8EFF2"; x.lineWidth = 2; x.beginPath(); x.moveTo(L, Y(0));
  hist.forEach((m, w) => x.lineTo(X(w), Y(m.pts)));
  x.stroke();
  const last = hist[hist.length - 1];
  const proj = Math.round(last.pts / hist.length * N);
  x.fillStyle = "#E8EFF2"; x.textAlign = "left";
  x.fillText(last.pts + " pts → " + proj + " projected", Math.min(X(hist.length - 1) + 6, L + iw - 130), Y(last.pts));
  x.fillStyle = "#9FB3BE"; x.textAlign = "right"; x.textBaseline = "top";
  x.fillText("matches →", L + iw, T + ih + 6);
}

function ordinal(n) { return n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th"); }

function renderAnalytics() {
  const hist = myLeagueHistory();
  if (!hist.length) return `<div class="panel"><h2>📊 Form & analytics</h2>
    <p class="note">The charts appear after your first league match of the season.</p></div>`;
  const wins = hist.filter(m => m.res === "W").length;
  const draws = hist.filter(m => m.res === "D").length;
  const losses = hist.length - wins - draws;
  const rec = side => {
    const ms = hist.filter(m => m.ha === side);
    return ms.filter(m => m.res === "W").length + "-" + ms.filter(m => m.res === "D").length + "-" + ms.filter(m => m.res === "L").length;
  };
  let streak = 1;
  while (streak < hist.length && hist[hist.length - 1 - streak].res === hist[hist.length - 1].res) streak++;
  const streakWord = { W: "win", D: "draw", L: "defeat" }[hist[hist.length - 1].res];
  const big = [...hist].sort((a, b) => (b.gf - b.ga) - (a.gf - a.ga))[0];
  const bad = [...hist].sort((a, b) => (a.gf - a.ga) - (b.gf - b.ga))[0];
  const fmtM = m => m.gf + "–" + m.ga + " v " + CLUBS[m.opp].short + " (" + m.ha + ")";
  const cs = hist.filter(m => m.ga === 0).length;
  const sq = G.squads[G.myClub];
  const ts = [...sq].sort((a, b) => b.goals - a.goals)[0];
  const ta = [...sq].sort((a, b) => b.assists - a.assists)[0];
  const formStr = hist.slice(-6).map(m => `<span class="${m.res}" title="${fmtM(m)}">${m.res}</span>`).join("");
  return `<div class="panel">
    <h2>📊 Form & analytics — ${seasonYears(G.season)} league season</h2>
    <p class="note">League position week by week. Green band: Champions League places · amber: Europe · red: the drop.
      Dots are coloured by result.</p>
    ${anaCanvas("ana-pos", 220)}
    <p class="note">Goals in every league match — scored above the line, conceded below.</p>
    ${anaCanvas("ana-goals", 140)}
    <p class="note">Points pace against the marks that usually matter.</p>
    ${anaCanvas("ana-pace", 190)}
    <h3>Season insights</h3>
    <table><tbody>
      <tr><td>Record (W-D-L)</td><td class="num"><b>${wins}-${draws}-${losses}</b> · home ${rec("H")} · away ${rec("A")}</td></tr>
      <tr><td>Current run</td><td class="num">${streak} ${streakWord}${streak > 1 ? "s" : ""} on the spin · last six: <span class="formbar">${formStr}</span></td></tr>
      <tr><td>Biggest win</td><td class="num">${big.gf > big.ga ? fmtM(big) : "—"}</td></tr>
      <tr><td>Heaviest defeat</td><td class="num">${bad.gf < bad.ga ? fmtM(bad) : "—"}</td></tr>
      <tr><td>Clean sheets</td><td class="num">${cs} in ${hist.length}</td></tr>
      <tr><td>Goals per match</td><td class="num">${(hist.reduce((s, m) => s + m.gf, 0) / hist.length).toFixed(2)} scored · ${(hist.reduce((s, m) => s + m.ga, 0) / hist.length).toFixed(2)} conceded</td></tr>
      <tr><td>Talisman</td><td class="num">${ts && ts.goals ? esc(ts.name) + " — " + ts.goals + " goals" : "no goals yet"}${ta && ta.assists ? " · " + esc(ta.name) + " — " + ta.assists + " assists" : ""}</td></tr>
    </tbody></table>
  </div>`;
}

function drawAnalytics() {
  const hist = myLeagueHistory();
  if (!hist.length) return;
  drawPosChart(hist); drawGoalsChart(hist); drawPaceChart(hist);
}

function adjBudget(delta, label, cat) {
  if (!G) return;
  delta = Math.round(delta * 10) / 10;
  G.budget = Math.round(((G.budget || 0) + delta) * 10) / 10;
  G.ledger = G.ledger || [];
  G.ledger.push({ s: G.season || 1, w: G.week, amt: delta, label: label || "Adjustment", cat: cat || "other", bal: G.budget });
  if (G.ledger.length > 400) G.ledger = G.ledger.slice(-400);
  return G.budget;
}
function ledgerOpen(label) {
  G.ledger = [{ s: G.season || 1, w: G.week || 0, amt: G.budget || 0, label: label || "Opening transfer budget", cat: "opening", bal: G.budget || 0 }];
}
function finMoneyM(n) {
  const v = Math.round(n * 10) / 10;
  return (v < 0 ? "-" : "") + "£" + Math.abs(v) + "M";
}
function finCatName(c) {
  return ({ opening: "Opening balance", gate: "Matchday gate", transfer_in: "Player sales", transfer_out: "Player purchases", sponsor: "Sponsorship", prize: "Prize money", funds: "Board grants", staff: "Backroom staff", manager: "Manager salary", event: "Boardroom events", running: "Running costs", stipend: "Stature stipend" })[c] || "Other";
}
function renderFinance() {
  if (!G.ledger || !G.ledger.length) ledgerOpen();
  ensureMgr();
  const L = G.ledger, bal = G.budget;
  const cats = {}; let totIn = 0, totOut = 0;
  for (const e of L) {
    if (e.cat === "opening") continue;
    cats[e.cat] = (cats[e.cat] || 0) + e.amt;
    if (e.amt >= 0) totIn += e.amt; else totOut += e.amt;
  }
  const catRows = Object.keys(cats).sort((a, b) => Math.abs(cats[b]) - Math.abs(cats[a]))
    .map(c => `<tr><td>${finCatName(c)}</td><td class="num" style="color:${cats[c] >= 0 ? "var(--pitch)" : "var(--red)"}">${finMoneyM(cats[c])}</td></tr>`).join("");
  const pts = L.map(e => e.bal);
  const W = 640, H = 130, pad = 10;
  const lo = Math.min(0, ...pts), hi = Math.max(1, ...pts);
  const xs = i => pad + (L.length <= 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (L.length - 1));
  const ys = v => H - pad - ((v - lo) / ((hi - lo) || 1)) * (H - 2 * pad);
  const linePath = pts.map((v, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(" ");
  const areaPath = `M${xs(0).toFixed(1)} ${ys(lo).toFixed(1)} ` + pts.map((v, i) => `L${xs(i).toFixed(1)} ${ys(v).toFixed(1)}`).join(" ") + ` L${xs(pts.length - 1).toFixed(1)} ${ys(lo).toFixed(1)} Z`;
  const zeroY = ys(0).toFixed(1);
  const chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;max-height:140px;margin-top:6px">
      <line x1="${pad}" y1="${zeroY}" x2="${W - pad}" y2="${zeroY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${areaPath}" fill="var(--pitch)" opacity="0.10"/>
      <path d="${linePath}" fill="none" stroke="var(--pitch)" stroke-width="2"/>
      <circle cx="${xs(pts.length - 1).toFixed(1)}" cy="${ys(pts[pts.length - 1]).toFixed(1)}" r="3.5" fill="var(--pitch)"/>
    </svg>`;
  const show = L.slice(-120).reverse();
  const rows = show.map(e => {
    const per = e.w == null ? "End of S" + e.s : "S" + e.s + " · wk " + (e.w + 1);
    const col = e.amt > 0 ? "var(--pitch)" : e.amt < 0 ? "var(--red)" : "inherit";
    const amt = e.cat === "opening" ? "" : (e.amt > 0 ? "+" : "") + finMoneyM(e.amt);
    return `<tr><td class="note">${per}</td><td>${esc(e.label)}</td><td class="num" style="color:${col}">${amt}</td><td class="num">${finMoneyM(e.bal)}</td></tr>`;
  }).join("");
  const capped = L.length > 120 ? `<p class="note">Showing the most recent 120 of ${L.length} entries. Category totals above cover the full history.</p>` : "";
  return `<div class="panel">
    <h2>💷 Finance</h2>
    <p>Transfer budget (cash available): <b style="color:${bal < 0 ? "var(--red)" : "var(--pitch)"};font-size:1.3em">${finMoneyM(bal)}</b>
      &nbsp;·&nbsp; Wage bill: <b style="color:${wageBill() > wageCap() ? "var(--red)" : "inherit"}">£${wageBill()}M</b> / £${wageCap()}M cap</p>
    <p class="note">Your contract: <b>£${G.mgr.wage}M/yr</b> · <b>${G.mgr.years}</b> season${G.mgr.years === 1 ? "" : "s"} remaining${G.mgr.years <= 1 ? ` <span style="color:var(--amber)">— renewal due</span>` : ""}. Your salary is paid from the budget at each season's close.</p>
    ${chart}
    <p class="note">Cash balance across your career. Each season close keeps half of any unspent budget; the rest is absorbed as running costs.</p>
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 4px">
      <div><b>Money in:</b> <span style="color:var(--pitch)">${finMoneyM(totIn)}</span></div>
      <div><b>Money out:</b> <span style="color:var(--red)">${finMoneyM(totOut)}</span></div>
      <div><b>Net:</b> ${finMoneyM(totIn + totOut)}</div>
    </div>
    <table><thead><tr><th>By category</th><th class="num">Total</th></tr></thead><tbody>${catRows}</tbody></table>
    <h3 style="margin-top:14px">Transactions</h3>
    ${capped}
    <table><thead><tr><th>When</th><th>Item</th><th class="num">In / Out</th><th class="num">Balance</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function euroLeagueTableHtml(compact) {
  const E = G.euro;
  const ranked = rankEuro(E);
  const myIdx = ranked.findIndex(t => t.id === "me");
  let rows = ranked.map((t, i) => ({ t, i }));
  if (compact) { // top 8 plus my neighbourhood
    const keep = new Set();
    for (let i = 0; i < 8; i++) keep.add(i);
    for (let i = Math.max(0, myIdx - 2); i <= Math.min(35, myIdx + 2); i++) keep.add(i);
    rows = rows.filter(r => keep.has(r.i));
  }
  let lastShown = -1;
  return `<table><thead><tr><th>#</th><th>Club</th><th class="num">P</th><th class="num">GF</th><th class="num">GA</th><th class="num">Pts</th></tr></thead><tbody>` +
    rows.map(({ t, i }) => {
      const gap = compact && lastShown >= 0 && i > lastShown + 1 ? `<tr><td colspan="6" class="note" style="text-align:center">⋮</td></tr>` : "";
      lastShown = i;
      const zone = i < 8 ? "border-left:3px solid #3D7DC8" : i < 24 ? "border-left:3px solid #E8833C" : "border-left:3px solid var(--red)";
      return gap + `<tr${t.id === "me" ? ' class="me"' : ""} style="${zone}">
        <td class="num">${i + 1}</td><td>${esc(euroName(E, t.id))}${t.id === "me" ? " (you)" : ""}</td>
        <td class="num">${E.played}</td><td class="num">${t.gf}</td><td class="num">${t.ga}</td><td class="num"><b>${t.pts}</b></td></tr>`;
    }).join("") + `</tbody></table>
    <p class="zone-legend"><i style="background:#3D7DC8"></i>Round of 16 (1–8)
    <i style="background:#E8833C"></i>Knockout play-off (9–24)
    <i style="background:var(--red)"></i>Eliminated (25–36)</p>`;
}

  const wks = euroMDWeeks(E.comp);

    E.stage === "league" ? `League phase — matchday ${Math.min(E.played + 1, wks.length)} of ${wks.length} (Swiss format: one 36-club table, top 8 straight to the Round of 16, 9th–24th into the play-offs)` :
    E.stage === "playoff" ? "Knockout play-off — win it to reach the Round of 16." :

    E.stage === "F" ? "🏆 You're in the FINAL!" :
    E.stage === "won" ? "🏆 CHAMPIONS! What a campaign." :

  const fix = dueEuro();

    nextText = `<p><b>Next up:</b> ${fix.label} vs ${esc(fix.opp.name)} ${fix.home ? "(home)" : "(away)"} — press the matchday button below.</p>`;

  } else if (EURO_KO_WEEKS[E.stage]) {

  return `<div class="panel"><h2>🏆 ${COMP_NAME[E.comp]}</h2>
    <p>${stageText}</p>

    <h3>League phase ${E.stage === "league" ? "standings" : "(final)"}</h3>

        <td class="num"><b>${r.myG} – ${r.opG}</b></td><td class="note">${esc(r.note || "")}</td></tr>`).join("") +
      `</tbody></table>` : ""}
    ${(G.euroRivals || []).length ? `<h3>Other English clubs in Europe</h3>
      <p class="note">` + G.euroRivals.map(r => clubCrest(r.i, 14) + esc(CLUBS[r.i].name) + " — " + COMP_NAME[r.comp] +
        (r.done ? ": " + esc(r.done) : " (campaign in progress — resolved at season's end)")).join("<br>") + `</p>` : ""}

function plink(ci, p, label) {

        ${row("This season", (p.goals || 0) + " goals · " + (p.assists || 0) + " assists · " + (p.apps || 0) + " apps · " + (p.yellows || 0) + "🟨")}
        ${!wc ? row("Contract", "£" + (p.wage || 0) + "M/yr · " + (p.years || 0) + " year" + ((p.years || 0) === 1 ? "" : "s") + ((p.years || 0) <= 1 ? ' <span style="color:var(--amber)">EXPIRING</span>' : "")) : ""}

      ${mine ? `<div class="row" style="margin-top:12px">
        ${(p.years || 0) <= 1 ? `<button class="ghost" onclick="renewContract(${p.id});showProfile(${ci},${p.id})" title="He wants £${renewDemand(p)}M/yr">📄 Renew (£${renewDemand(p)}M/yr)</button>` : ""}
        ${young ? `<button class="ghost" ${focusFull ? 'disabled title="Only three players can get focused coaching"' : ""} onclick="toggleTraining(${p.id});showProfile(${ci},${p.id})">${focused ? "🎯 Focused coaching ON" : "🎯 Focus his training"}</button>` : ""}
        ${G.pkTaker !== p.id ? `<button class="ghost" onclick="G.pkTaker=${p.id};save();showProfile(${ci},${p.id})">⚪ Make penalty taker</button>` : `<button class="ghost" onclick="G.pkTaker=null;save();showProfile(${ci},${p.id})">⚪ Penalty taker ✓ (remove)</button>`}
        ${canLoanOut(p) ? `<button class="ghost" onclick="closeProfile();loanOut(${p.id})">↗ Loan out</button>` : ""}
        ${windowOpen() && canLeave(G.myClub, p) ? `<button class="ghost" onclick="closeProfile();sellPlayer(${p.id})">💸 Sell £${Math.round(playerValue(p) * 0.9)}M</button>` : ""}

function toggleTraining(pid) {
  G.training = G.training || [];

}

function savePlayerEdit(ci, pid) {
  const sq = G.squads[ci], p = sq && sq.find(x => x.id === pid);
  if (!p) return;
  const g = id => document.getElementById(id);
  const name = (g("ed-name").value || "").trim();

  const role = g("ed-role").value;
  if (role) { p.role = role; p.pos = bucketForRole(role); }
  const r = parseInt(g("ed-rating").value); if (!isNaN(r)) p.rating = Math.max(30, Math.min(99, r));
  const pot = parseInt(g("ed-pot").value); if (!isNaN(pot)) p.pot = Math.max(p.rating, Math.min(99, pot));
  const a = parseInt(g("ed-age").value); if (!isNaN(a)) p.age = Math.max(15, Math.min(45, a));
  p.edited = true; // protects the manual change from the load-time role reconciler
  if (ci === G.myClub) G.lineup = validateLineup(); // a position change may shuffle the XI
  save(); render(); showProfile(ci, pid);
}

function renderTactics() {
  const squad = G.squads[G.myClub];
  G.lineup = validateLineup();
  let html = `<div class="panel"><h2>Tactics & Lineup</h2>
    <div class="row">
      <label>Formation
        <select onchange="G.formation=this.value;G.lineup=bestXI(G.squads[G.myClub],G.formation);save();render()">` +
        Object.keys(FORMATIONS).map(fm => `<option${fm === G.formation ? " selected" : ""}>${fm}</option>`).join("") +
      `</select></label>
      <label>Mentality
        <select onchange="G.mentality=this.value;save();render()">` +
        MENTALITIES.map(m => `<option${m === G.mentality ? " selected" : ""}>${m}</option>`).join("") +
      `</select></label>
      <label>Style
        <select onchange="G.style=this.value;save();render()">` +
        Object.keys(STYLES).map(st => `<option${st === (G.style || "Balanced") ? " selected" : ""}>${st}</option>`).join("") +
      `</select></label>
      <button class="ghost" onclick="G.lineup=bestXI(G.squads[G.myClub],G.formation);save();render()">Auto-pick best XI now</button>
    </div>
    <p class="note"><label><input type="checkbox" ${G.autoXI === false ? "" : "checked"} onchange="G.autoXI=this.checked;if(this.checked)G.lineup=bestXI(G.squads[G.myClub],G.formation);save();render()"> <b>Auto-pick best XI before every match</b></label> - ${G.autoXI === false ? "OFF: your chosen XI is kept; only injured or suspended men are replaced." : "ON: your strongest available XI by form, position and fitness is picked each matchday; a tired player is rotated only when a fresher team-mate in his line is the better pick, and he returns the moment he is your strongest option. Switch off to pick by hand."}</p>
    <p class="note">${esc(STYLES[G.style || "Balanced"].desc)}</p>
    <h3>Starting XI</h3><div class="lineup-grid">`;
  const slotRoles = formSlots(G.formation);
  for (let i = 0; i < slotRoles.length; i++) {
    const role = slotRoles[i];
    const pos = slotLine(G.formation, i);
    const current = G.lineup[i];
    // every available player of this line is selectable, sorted by how well he
    // fits THIS slot — the shown rating is already adjusted for the role
    const options = squad.filter(p => p.pos === pos && available(p))
      .sort((a, b) => slotRating(b, role) - slotRating(a, role));
    // unavailable men stay visible — greyed out with the reason — so a new
    // signing who arrived injured/suspended can always be located
    const out = squad.filter(p => p.pos === pos && !available(p));
    // an out-of-line stand-in (injury crisis) is shown as this slot's occupant
    // under his real role, never silently swapped for the first name in the list
    const curP = squad.find(p => p.id === current);
    const standIn = curP && curP.pos !== pos
      ? `<option value="${curP.id}" selected>${esc(curP.name)} (${curP.role || curP.pos} filling in · ${Math.round(slotRating(curP, role))})</option>` : "";
    html += `<div class="slot"><label class="pos-${pos}" title="${pos} slot">${role}</label>
      <select onchange="swapSlot(${i}, parseInt(this.value))">` + standIn +
      options.map(p => {
        const v = Math.round(slotRating(p, role));
        return `<option value="${p.id}"${p.id === current ? " selected" : ""}>${esc(p.name)} (${p.role || p.pos} · ${v}${p.fitness < 70 ? " · " + p.fitness + "%" : ""})${p.resting ? " 💤" : ""}${G.lineup.includes(p.id) && p.id !== current ? " — starting" : ""}</option>`;
      }).join("") +
      out.map(p => `<option disabled>${esc(p.name)} — ${p.loan ? "on loan at " + esc(p.loan) : p.injury ? "🚑 injured (" + p.injury + " wk)" : "⛔ suspended (" + p.ban + ")"}</option>`).join("") +
      `</select></div>`;
  }
  html += `</div><p class="note">Each slot shows ratings <b>adjusted for that role</b> — a left-back picked at right-back, or a winger up front, plays below his real level. Attacking mentality boosts your attack but weakens defence; defensive does the opposite.</p></div>`;
  return html;
}

function swapSlot(slotIdx, playerId) {
  const current = G.lineup[slotIdx];
  const other = G.lineup.indexOf(playerId);
  if (other >= 0 && other !== slotIdx) G.lineup[other] = current; // swap the two starters
  G.lineup[slotIdx] = playerId;
  save();
  render();
}

let fixturesExpanded = false; // view preference for this session only
function cupTiesForWeek(w) {
  const out = [];
  if (!G.cups) return out;
  for (const key of ["lc", "fa", "et"]) {
    const c = G.cups[key];
    if (!c || !(c.rounds || []).length) continue;
    c.rounds.forEach((rd, ri) => {
      if (rd.week !== w) return;
      const res = (c.results || []).find(x => x.label === rd.label);
      let status;
      if (res) status = (res.home ? "vs " : "at ") + esc(res.opp) + " " + res.myG + "–" + res.opG + (res.note && /pen/i.test(res.note) ? " (pens)" : "");
      else if (c.alive !== true) return; // out of this cup — no upcoming ties
      else if (ri === c.r && c.opp) status = (c.opp.home ? "vs " : "at ") + esc(c.opp.name);
      else status = "draw to be made";
      out.push(`<tr><td colspan="3" class="note" style="padding-left:6px">🏆 ${esc(CUP_NAME[key])} · ${rd.label} — ${status}</td></tr>`);
    });
  }
  return out;
}
function renderFixtures() {
  const weekRows = w => {
    const played = w < G.results.length;
    let rows = `<tr><th colspan="3">Matchweek ${w + 1} · ${matchDateStr("league", w)}${w === G.week ? " — next" : ""}</th></tr>`;
    G.fixtures[w].forEach(([h, a], j) => {
      const mine = h === G.myClub || a === G.myClub;
      const r = played ? G.results[w][j] : null;
      rows += `<tr${mine ? ' class="me"' : ""}><td>${esc(CLUBS[h].name)}</td>
        <td class="num">${r ? r.hg + " – " + r.ag : "vs"}</td><td>${esc(CLUBS[a].name)}</td></tr>`;
    });
    cupTiesForWeek(w).forEach(row => rows += row);
    return rows;
  };
  let html = `<div class="panel"><h2>Fixtures & Results</h2>`;
  if (fixturesExpanded) {
    html += `<p class="note"><button class="ghost" onclick="fixturesExpanded=false;render()">▴ Compact view — latest round & next round only</button></p><table><tbody>`;
    for (let w = 0; w < G.fixtures.length; w++) html += weekRows(w);
  } else {
    html += `<table><tbody>`;
    if (G.results.length > 0) html += weekRows(G.results.length - 1); // the round just played
    if (G.week < G.fixtures.length) html += weekRows(G.week);         // the round coming up
    if (!G.results.length && G.week >= G.fixtures.length) html += `<tr><td class="note">Season complete.</td></tr>`;
  }
  html += `</tbody></table>`;
  if (!fixturesExpanded) html += `<p class="note" style="margin-top:10px"><button class="ghost" onclick="fixturesExpanded=true;render()">📜 Show the full season — all ${G.fixtures.length} rounds</button></p>`;
  return html + `</div>`;
}

function renderTable() {
  const t = tableStats();
  const ti = tierIndex();
  const T = TIERS[ti];
  const isPL = ti === 0;
  const relStart = T.down > 0 ? t.length - T.down : t.length + 1; // 0-based index of first relegation row
  const downName = TIERS[ti + 1] ? TIERS[ti + 1].name : "";
  return `<div class="panel"><h2>${T.name} Table — ${seasonYears(G.season)}</h2>
    <table><thead><tr><th>#</th><th>Club</th><th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th><th class="num">GF</th><th class="num">GA</th><th class="num">GD</th><th class="num">Pts</th><th>Form</th></tr></thead><tbody>` +
    t.map((row, i) => {
      let zone;
      if (isPL) zone = i === 0 ? "champ" : i < 4 ? "ucl" : i === 4 ? "uel" : i === 5 ? "uecl" : i >= relStart ? "releg" : "";
      else zone = i === 0 ? "champ" : i < T.autoUp ? "ucl" : (T.po && i >= T.po[0] - 1 && i <= T.po[1] - 1) ? "uecl" : i >= relStart ? "releg" : "";
      return `<tr class="${row.i === G.myClub ? "me " : ""}${zone}">
      <td class="num">${i + 1}</td><td>${clubCrest(row.i, 15)}${esc(row.name)}${CLUBS[row.i].nick ? `<br><span class="note" style="font-size:10px;font-weight:normal">${esc(CLUBS[row.i].nick)}</span>` : ""}</td>
      <td class="num">${row.p}</td><td class="num">${row.w}</td><td class="num">${row.d}</td><td class="num">${row.l}</td>
      <td class="num">${row.gf}</td><td class="num">${row.ga}</td><td class="num">${row.gf - row.ga}</td><td class="num"><b>${row.pts}</b></td>
      <td class="formbar">${row.form.slice(-5).map(x => `<span class="${x}">${x}</span>`).join("")}</td>
    </tr>`; }).join("") + `</tbody></table>
    <p class="zone-legend">` + (isPL ? `
      <i style="background:var(--amber)"></i>Champions
      <i style="background:#3D7DC8"></i>Champions League (1-4)
      <i style="background:#E8833C"></i>Europa League (5)
      <i style="background:#35B07A"></i>Conference League (6)
      <i style="background:var(--red)"></i>Relegation to the Championship (18-20)` : `
      <i style="background:var(--amber)"></i>Champions${T.autoUp > 1 ? " &amp; automatic promotion (1-" + T.autoUp + ")" : " (automatic promotion)"}` +
      (T.po ? `
      <i style="background:#35B07A"></i>Promotion playoffs (` + T.po[0] + `-` + T.po[1] + `)` : ``) +
      (T.down > 0 ? `
      <i style="background:var(--red)"></i>Relegation to ` + downName + ` (` + (relStart + 1) + `-` + t.length + `)` : ``)) + `
    </p></div>`;
}

function renderScorers() {
  const top = topScorers(15);
  return `<div class="panel"><h2>Golden Boot race</h2>
    <table><thead><tr><th>#</th><th>Player</th><th>Club</th><th class="num">Goals</th><th class="num">Assists</th><th class="num">Apps</th></tr></thead><tbody>` +
    (top.length ? top.map((s, i) => `<tr><td class="num">${i + 1}</td><td>${plink(s.ci, s.p)}</td><td>${s.club}</td>
      <td class="num"><b>${s.p.goals}</b></td><td class="num">${s.p.assists || 0}</td><td class="num">${s.p.apps}</td></tr>`).join("")
      : `<tr><td colspan="6" class="note">No goals yet — play a match!</td></tr>`) +
    `</tbody></table></div>`;
}

function fmtMin(m) { return m > 90 ? "90+" + (m - 90) : m; }
function evIcon(t) {
  return t === "goal" ? "⚽" : t === "yellow" ? "🟨" : t === "red" ? "🟥"
       : t === "injury" ? "🚑" : t === "chance" ? "⚡" : t === "pkmiss" ? "❌" : "🟢";
}

function renderManagePanel(isHT) {
  const L = G.live;
  const my = G.myClub;
  const key = myXIKey(L);
  const squad = G.squads[my];
  const xi = L[key].map(id => squad.find(p => p.id === id)).filter(Boolean);
  const ok = canSub();
  const benchOpts = posFilter => squad
    .filter(p => available(p) && (!posFilter || p.pos === posFilter) && !L[key].includes(p.id))
    .sort((a, b) => effRating(b) - effRating(a))
    .map(p => `<option value="${p.id}">${esc(p.name)} (${p.role || p.pos} ${Math.round(effRating(p))})</option>`).join("");
  const shortHanded = L[key].length < 11 - (L.reds[my] || 0);
  const windowNote = isHT
    ? "Half-time changes are free — they don't use a substitution window."
    : `Windows used: ${L.windows + (L.winPending ? 1 : 0)}/3${L.winPending ? " (current window open — add more subs at no extra cost)" : ""}`;
  return `<div class="ht-panel"><h3>${isHT ? "Half-time team talk" : "⚙ Touchline instructions — " + fmtMin(L.minute) + "'"}</h3>
    ${L.notice ? `<p style="color:var(--amber)">⚠ ${esc(L.notice)}</p>` : ""}
    <div class="row">
      <label>Mentality <select onchange="htMent(this.value)">` +
        MENTALITIES.map(m => `<option${(my === L.h ? L.hMent : L.aMent) === m ? " selected" : ""}>${m}</option>`).join("") +
      `</select></label>
      <label>Style <select onchange="htStyle(this.value)">` +
        Object.keys(STYLES).map(st => `<option${(my === L.h ? L.hStyle : L.aStyle) === st ? " selected" : ""}>${st}</option>`).join("") +
      `</select></label>
      <span class="note">Substitutions used: ${L.subsUsed}/5 · ${windowNote}</span>
    </div>
    ${shortHanded ? `<div class="row"><span class="note">⚠ You are a man short.</span>
      ${ok ? `<select onchange="htSubIn(parseInt(this.value))"><option value="">Bring on…</option>${benchOpts(null)}</select>` : `<span class="note">No substitutions available.</span>`}
    </div>` : ""}
    <div class="lineup-grid">` +
    xi.map(p => `<div class="slot"><label class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</label>
      <span style="flex:1">${esc(p.name)} <span class="note">${Math.round(effRating(p))}${p.fitness < 70 ? " · " + p.fitness + "%" : ""}</span></span>
      ${ok ? `<select onchange="htSub(${p.id}, parseInt(this.value))"><option value="">sub…</option>${benchOpts(p.pos)}</select>` : ""}
    </div>`).join("") +
    `</div>
    <div class="row" style="margin-top:12px">
      <button class="action" onclick="${isHT ? "resumeSecondHalf()" : "closeManage()"}">${isHT ? "▶ Start second half" : "▶ Resume match"}</button>
    </div>
  </div>`;
}

function liveStatsLine(L) {
  const S = L.stats;
  if (!S) return "";
  const poss = S.t ? Math.round(S.hp / S.t * 100) : 50;
  return LANG === "zh" ? `控球 ${poss}% – ${100 - poss}% · 射門 ${S.hShots}（${S.hSot} 中框）– ${S.aShots}（${S.aSot}）` : `Possession ${poss}% – ${100 - poss}% · Shots ${S.hShots} (${S.hSot} on target) – ${S.aShots} (${S.aSot})`;
}

function liveScoreHtml(L) {
  const hg = liveGoals(L, L.h, L.minute), ag = liveGoals(L, L.a, L.minute);
  return `${esc(CLUBS[L.h].name)} <b>${hg}</b><span class="vs">–</span><b>${ag}</b> ${esc(CLUBS[L.a].name)}`;
}
function liveFeedHtml(L) {
  const feed = L.events.concat(L.elsewhere)
    .filter(e => e.min <= L.minute)
    .sort((x, y) => y.min - x.min);
  return feed.map(e => e.type === "elsewhere"
    ? `<li class="ev-else"><span class="min">${fmtMin(e.min)}'</span> 📻 ${esc(evText(e))}</li>`
    : `<li class="ev-${e.type === "goal" ? "goal" : e.type === "red" ? "red" : "other"}">
         <span class="min">${fmtMin(e.min)}'</span> ${evIcon(e.type)}
         ${e.type === "info" ? "" : `<b>${CLUBS[e.clubIdx].short}</b> — `}${esc(evText(e))}</li>`).join("");
}
function liveGroundsHtml(L) {
  return L.otherResults.map(o => {
    const r = o.r;
    const hs = r.events.filter(e => e.type === "goal" && e.clubIdx === r.h && e.min <= L.minute).length;
    const as = r.events.filter(e => e.type === "goal" && e.clubIdx === r.a && e.min <= L.minute).length;
    return `<tr><td>${esc(CLUBS[r.h].name)}</td><td class="num"><b>${hs} – ${as}</b></td><td>${esc(CLUBS[r.a].name)}</td></tr>`;
  }).join("");
}

function renderLive() {
  const L = G.live;
  const wxIcon = (WEATHER[L.weather] || WEATHER.clear).icon;
  const phaseLabel = (L.phase === "ht" ? (LANG === "zh" ? "半場" : "HALF-TIME") : L.phase === "ft" ? (LANG === "zh" ? "完場" : "FULL TIME") : L.phase === "pens" ? (LANG === "zh" ? "互射十二碼" : "PENALTY SHOOTOUT") : fmtMin(L.minute) + "'") + " " + wxIcon;
  const running = tickTimer != null;
  const [hCol, aCol] = kitColors(L.h, L.a);
  let html = `<div class="panel">
    <h2>${L.euro ? "🏆 " + COMP_NAME[G.euro.comp] + " — " + esc(L.fix.label) : L.psFix ? esc(L.psFix.label) : L.cupLabel ? "🏆 " + esc(L.cupLabel) : "Matchweek " + (G.week + 1)} · ${matchDateStr(L.euro ? G.euro.comp : L.cupFix ? L.cupFix.cupKey : "league", G.week, L.euro && G.euro ? G.euro.played : undefined)} — Live</h2>
    <div class="score-line" id="live-score">${liveScoreHtml(L)}</div>
    <div class="minute-badge" id="live-min">${phaseLabel}</div>
    <div class="note" id="live-stats" style="text-align:center">${liveStatsLine(L)}</div>
    <div class="pitch-wrap">
      <canvas id="pitch" width="760" height="498"></canvas>
      <button class="snd-btn" id="snd-btn" onclick="toggleSound()" title="Crowd sound on/off">${SND.on ? "🔊" : "🔇"}</button>
      ${langBtn("right:56px")}
      <div class="kit-legend">
        <span>${crest(CLUBS[L.h].short, hCol, 18)}${esc(CLUBS[L.h].name)}</span>
        <span>${esc(CLUBS[L.a].name)}${crest(CLUBS[L.a].short, aCol, 18).replace('margin-right: 6px', '')}</span>
      </div>
    </div>`;
  if ((L.phase === "first" || L.phase === "second") && L.manage) {
    html += renderManagePanel(false);
  } else if (L.phase === "first" || L.phase === "second") {
    html += `<div class="row" style="justify-content:center">
      <button class="${!running && L.minute === 0 ? "action" : "ghost"}" onclick="togglePlay()">${running ? "⏸ Pause" : L.minute === 0 ? "▶ Kick off" : "▶ Play"}</button>` +
      ["slow", "normal", "fast"].map(s =>
        `<button class="ghost${(L.speed || "normal") === s ? " speed-on" : ""}" onclick="setSpeed('${s}')">${s}</button>`).join("") +
      `<button class="ghost" onclick="openManage()">⚙ Manage</button>
      <button class="ghost" onclick="skipPhase()">⏩ ${L.phase === "first" ? "Half-time" : "Full time"}</button>
      ${L.phase === "first" ? `<button class="ghost" onclick="skipToEnd()" title="Play the whole match instantly — stops only if you're needed">⏭ Finish match</button>` : ""}
    </div>`;
  }
  if (L.phase === "ht") html += renderManagePanel(true);
  if (L.phase === "ft") html += `<div class="row" style="justify-content:center">
    <button class="action" onclick="finishLiveMatch()">Continue → match report</button></div>`;
  if (L.phase === "pens" && L.pens) {
    const so = L.pens.so;
    const shown = so.kicks.slice(0, L.pens.shown);
    const last = shown[shown.length - 1];
    const done = L.pens.shown >= so.kicks.length;
    html += `<div class="ht-panel" style="text-align:center">
      <h3>🥅 Penalty shootout</h3>
      <div class="score-line">${esc(CLUBS[G.myClub].short)} <b>${last ? last.myS : 0}</b><span class="vs">–</span><b>${last ? last.opS : 0}</b> pens</div>
      <p style="letter-spacing:2px;font-size:18px">${shown.map(k => `<span title="${esc(k.name)}">${k.scored ? "🟢" : "🔴"}</span>`).join(" ")}</p>
      ${shown.length ? `<p class="note">${esc(last.name)} ${last.scored ? (LANG === "zh" ? "一射入網。" : "buries it.") : (LANG === "zh" ? "——俾門將擋出！" : "— DENIED!")}</p>` : `<p class="note">${LANG === "zh" ? "球員喺中圈集合……" : "The players gather at the centre circle…"}</p>`}
      ${done
        ? `<p><b>${so.myWin ? (LANG === "zh" ? "你贏咗互射十二碼 " : "YOU WIN THE SHOOTOUT ") : (LANG === "zh" ? "心碎時刻——十二碼落敗 " : "Heartbreak — you lose it ")} ${so.myS}–${so.opS}</b></p>
           <button class="action" onclick="finishLiveMatch()">Continue → result</button>`
        : (pensTimer ? "" : `<button class="action" onclick="startPensTimer()">▶ Continue the shootout</button>`)}
    </div>`;
  }
  if (!L.euro && !L.cupFix && G.week === G.fixtures.length - 1) {
    const t0 = tableStats();
    const add = {};
    const live = [{ h: L.h, a: L.a, hg: liveGoals(L, L.h, L.minute), ag: liveGoals(L, L.a, L.minute) }]
      .concat(L.otherResults.map(o => ({ h: o.r.h, a: o.r.a,
        hg: o.r.events.filter(e => e.type === "goal" && e.clubIdx === o.r.h && e.min <= L.minute).length,
        ag: o.r.events.filter(e => e.type === "goal" && e.clubIdx === o.r.a && e.min <= L.minute).length })));
    for (const m of live) {
      add[m.h] = { pts: m.hg > m.ag ? 3 : m.hg === m.ag ? 1 : 0, gd: m.hg - m.ag };
      add[m.a] = { pts: m.ag > m.hg ? 3 : m.hg === m.ag ? 1 : 0, gd: m.ag - m.hg };
    }
    const rows = t0.map(r => ({ i: r.i, name: r.name,
      pts: r.pts + (add[r.i] ? add[r.i].pts : 0), gd: r.gf - r.ga + (add[r.i] ? add[r.i].gd : 0) }))
      .sort((x, y) => y.pts - x.pts || y.gd - x.gd);
    html += `<h3>⏱ AS IT STANDS — final day</h3><table><tbody>` +
      rows.map((r, i) => (i < 4 || i >= rows.length - 3 || r.i === G.myClub)
        ? `<tr${r.i === G.myClub ? ' class="me"' : ""}><td class="num">${i + 1}</td><td>${esc(r.name)}</td><td class="num">${r.gd > 0 ? "+" + r.gd : r.gd}</td><td class="num"><b>${r.pts}</b></td></tr>` : "").join("") +
      `</tbody></table>`;
  }
  html += `<ul class="events" id="live-feed">${liveFeedHtml(L)}</ul>` +
    (L.otherResults.length ? `<h3>Around the grounds — live</h3>
    <table><tbody id="live-grounds">${liveGroundsHtml(L)}</tbody></table>` : "") +
    `</div>`;
  return html;
}

function goPreMatch() {
  if (G.week >= G.fixtures.length || G.live) return;
  G.screen = "prematch";
  save(); render();
}

function renderPreMatch() {
  const poFix = dueLeaguePlayoff();
  const euroFix = poFix ? null : dueEuro();
  const cupFix = (poFix || euroFix) ? null : dueCup();
  const preFix = (poFix || euroFix || cupFix) ? null : duePreseason();
  let fixtureHtml, scoutHtml, liveBtn, quickBtn;
  if (poFix) {
    const oppIdx = poFix.oppIdx;
    const myC = clubCrest(G.myClub, 24) + esc(CLUBS[G.myClub].name);
    const opC = clubCrest(oppIdx, 24) + esc(CLUBS[oppIdx].name);
    fixtureHtml = `<h2>🏟 ${esc(poFix.label)}</h2>
      <div class="score-line">${poFix.home ? myC : opC}<span class="vs">vs</span>${poFix.home ? opC : myC}</div>
      <p class="note" style="text-align:center">${poFix.isFinal ? "Wembley. One match, the winner goes up." : poFix.home ? "A one-off semi-final at home — win to reach Wembley." : "A one-off semi-final away at the higher seed — win to reach Wembley."}</p>`;
    const t = tableStats(); const oppRow = t.find(r => r.i === oppIdx); const poT = aiTactics(oppIdx);
    scoutHtml = `<h3>Scouting report — ${esc(CLUBS[oppIdx].name)}${CLUBS[oppIdx].nick ? ` (${esc(CLUBS[oppIdx].nick)})` : ""}</h3>
      <p>League position: <b>#${oppRow ? t.indexOf(oppRow) + 1 : "?"}</b> · <span class="stars-bar">${starBar(CLUBS[oppIdx].base + 3)}</span> strength ${CLUBS[oppIdx].base}<br>
      They play a <b>${poT.form} ${poT.style}</b> — ${styleTip(poT.style)}</p>`;
    liveBtn = "startPlayoffLive()"; quickBtn = "playPlayoffQuick()";
  } else if (preFix) {
    const o = preFix.opp;
    const oppBase = o.kind === "league" ? CLUBS[o.idx].base : o.base;
    const myC = clubCrest(G.myClub, 24) + esc(CLUBS[G.myClub].name);
    const opC = crest(o.short, o.kind === "league" ? colorOf(o.idx) : o.col, 24) + esc(o.name);
    fixtureHtml = `<h2>${esc(preFix.label)}</h2>
      <div class="score-line">${preFix.home ? myC : opC}<span class="vs">vs</span>${preFix.home ? opC : myC}</div>
      <p class="note" style="text-align:center">${preFix.ptype === "friendly" ? "A pre-season warm-up - minutes and sharpness, nothing on the line." : preFix.ptype === "shield" ? "The traditional curtain-raiser - the season's first silverware." : "The European curtain-raiser, against the holders of the other major trophy."}</p>`;
    const pT = aiTacticsByBase(oppBase);
    scoutHtml = `<h3>Scouting report - ${esc(o.name)}${o.kind === "league" && CLUBS[o.idx] && CLUBS[o.idx].nick ? ` (${esc(CLUBS[o.idx].nick)})` : ""}</h3>
      <p><span class="stars-bar">${starBar(oppBase + 3)}</span> Squad strength ${oppBase} · They play a <b>${pT.form} ${pT.style}</b> - ${styleTip(pT.style)}</p>`;
    liveBtn = "startPreseasonLive()"; quickBtn = "playPreseasonQuick()";
  } else if (cupFix) {
    const o = cupFix.opp;
    const myC = clubCrest(G.myClub, 24) + esc(CLUBS[G.myClub].name);
    const opC = crest(o.short, (o.kind === "league" || o.kind === "u21") ? colorOf(o.idx) : (o.col || "#8A98A5"), 24) + esc(o.name);
    fixtureHtml = `<h2>🏆 ${esc(cupFix.label)}</h2>
      <div class="score-line">${cupFix.home ? myC : opC}
        <span class="vs">vs</span>
        ${cupFix.home ? opC : myC}</div>
      <p class="note" style="text-align:center">📅 ${matchDateStr(cupFix.cupKey, G.week)} · ${cupFix.isFinal ? "Wembley. A trophy on the line." : cupFix.home ? "A home tie — see them off." : "An away trip — keep your heads."}</p>`;
    const cupT = o.kind === "league" ? aiTactics(o.idx) : aiTacticsByBase(o.base);
    scoutHtml = `<h3>Scouting report — ${esc(o.name)}${o.kind === "league" && CLUBS[o.idx] && CLUBS[o.idx].nick ? ` (${esc(CLUBS[o.idx].nick)})` : ""}</h3>
      <p><span class="stars-bar">${starBar(o.base + 3)}</span> Squad strength ${o.base}
      · They play a <b>${cupT.form} ${cupT.style}</b> — ${styleTip(cupT.style)}
      ${o.kind === "minnow" ? "<br><b>Lower-league opposition</b> — a fine chance to rest tired legs, but beware the banana skin." : ""}</p>`;
    liveBtn = "startCupLive()"; quickBtn = "playCupQuick()";
  } else if (euroFix) {
    const o = euroFix.opp;
    const tu = euroTuple(G.euro, o.id);
    const stars = (tu[4] || []).map(s => esc(s[0])).join(", ");
    const myC = clubCrest(G.myClub, 24) + esc(CLUBS[G.myClub].name);
    const opC = crest(o.short, o.col, 24) + esc(o.name);
    fixtureHtml = `<h2>🏆 ${COMP_NAME[G.euro.comp]} · ${esc(euroFix.label)}</h2>
      <div class="score-line">${euroFix.home ? myC : opC}
        <span class="vs">vs</span>
        ${euroFix.home ? opC : myC}</div>
      <p class="note" style="text-align:center">📅 ${matchDateStr(G.euro.comp, G.week, G.euro.played)} · ${euroFix.home ? "At home — the crowd is behind you." : "Away from home — a hostile atmosphere awaits."}</p>`;
    const euT = aiTacticsByBase(o.base);
    scoutHtml = `<h3>Scouting report — ${esc(o.name)}</h3>
      <p><span class="stars-bar">${starBar(o.base + 3)}</span> Squad strength ${o.base} ·
      They play a <b>${euT.form} ${euT.style}</b> — ${styleTip(euT.style)}<br>
      ${stars ? "Danger men: " + stars : "A well-drilled European side — no famous names, no easy night."}</p>`;
    liveBtn = "startEuroLive()"; quickBtn = "playEuroQuick()";
  } else {
    const myFix = G.fixtures[G.week] ? G.fixtures[G.week].find(([h, a]) => h === G.myClub || a === G.myClub) : null;
    if (!myFix) { G.screen = "main"; return renderMain(); }
    const home = myFix[0] === G.myClub;
    const oppIdx = home ? myFix[1] : myFix[0];
    const t = tableStats();
    const oppRow = t.find(r => r.i === oppIdx);
    const myRow = t.find(r => r.i === G.myClub);
    const oppSquad = G.squads[oppIdx];
    const danger = [...oppSquad].sort((a, b) => b.goals - a.goals || effRating(b) - effRating(a))[0];
    const unavailable = oppSquad.filter(p => !available(p)).length;
    const formStr = row => row.form.slice(-5).map(x => `<span class="${x}">${x}</span>`).join("") || "—";
    fixtureHtml = `<h2>Matchweek ${G.week + 1} · ${matchDateStr("league", G.week)}</h2>
      <div class="score-line">${clubCrest(myFix[0], 24)}${esc(CLUBS[myFix[0]].name)}<span class="vs">vs</span>${clubCrest(myFix[1], 24)}${esc(CLUBS[myFix[1]].name)}</div>
      <p class="note" style="text-align:center">${isDerby(myFix[0], myFix[1]) ? "🔥 <b>DERBY DAY.</b> Bragging rights and double the board's judgement at stake. " : ""}${home ? "At home — the crowd is behind you." : "Away from home."}</p>`;
    const oppT = aiTactics(oppIdx);
    scoutHtml = `<h3>Scouting report — ${esc(CLUBS[oppIdx].name)}${CLUBS[oppIdx].nick ? ` (${esc(CLUBS[oppIdx].nick)})` : ""}</h3>
      <p>League position: <b>#${t.indexOf(oppRow) + 1}</b> (you: #${t.indexOf(myRow) + 1}) ·
      Form: <span class="formbar">${formStr(oppRow)}</span> ·
      <span class="stars-bar">${starBar(CLUBS[oppIdx].base + 3)}</span> strength ${CLUBS[oppIdx].base}<br>
      They play a <b>${oppT.form} ${oppT.style}</b> — ${styleTip(oppT.style)}<br>
      Danger man: <b>${esc(danger.name)}</b> (${danger.goals} goals this season)
      ${unavailable ? ` · ${unavailable} player${unavailable > 1 ? "s" : ""} unavailable for them` : " · full squad available"}</p>`;
    liveBtn = "startMatchday()"; quickBtn = "quickSim()";
  }
  const fc = WEATHER[getWeather()];
  const forecastHtml = `<h3>Forecast</h3>
    <p>${fc.icon} <b>${fc.name}</b> — ${esc(fc.note)}${fc.drain > 1.1 ? " Plan your fitness accordingly." : ""}</p>`;
  return `<div class="panel">${fixtureHtml}${scoutHtml}${forecastHtml}</div>
    ${renderTactics()}
    <div class="panel row">
      <button class="action" onclick="${liveBtn}">▶ Kick off — watch LIVE</button>
      <button class="ghost" onclick="${quickBtn}" title="Instant result, no live coverage">Quick sim</button>
      <button class="ghost" onclick="G.forceCup=null;G.screen='main';save();render()">← Back</button>
    </div>`;
}

function presser(style, pk) {
  G.presserDone = pk;
  if (style === "calm") { boardBump(1); G.presserNews = "Measured and gracious. The board approves (+1 confidence)."; }
  else if (style === "fiery") {
    if (rnd() < 0.5) { for (const q of G.squads[G.myClub]) q.morale = Math.min(100, (q.morale || 75) + 2);
      G.presserNews = "Your fire lights up the back pages — the dressing room loves it (+2 squad morale)."; }
    else { boardBump(-2); G.presserNews = "The rant lands badly. The chairman 'requests a chat' (−2 confidence)."; }
  } else G.presserNews = "You stride past the microphones. The press box mutters.";
  save(); render();
}

function renderMatchResult() {
  const r = G.lastMatch;
  const others = G.lastMatchEuro ? [] : (G.results[G.results.length - 1] || []).filter(x => x !== r);
  const myWin = (r.h === G.myClub && r.hg > r.ag) || (r.a === G.myClub && r.ag > r.hg);
  const draw = r.hg === r.ag;
  const derby = !G.lastMatchEuro && isDerby(r.h, r.a);
  const verdict = (derby ? (myWin ? "🔥 DERBY WON — the city is yours! " : draw ? "🔥 Derby honours shared. " : "🔥 A derby defeat. Stay indoors a few days. ") : "") + (myWin ? "A fine win!" : draw ? "Honours even." : G.lastMatchEuro === "euro" ? "A tough European night." : "A tough afternoon.");
  const wxTag = r.weather && r.weather !== "clear" && WEATHER[r.weather]
    ? " · " + WEATHER[r.weather].icon + " " + WEATHER[r.weather].name : "";
  // who scored — the headline facts stay visible; everything else folds away
  const scorerLine = side => r.events
    .filter(e => e.type === "goal" && e.clubIdx === side)
    .map(e => esc(e.who || "?") + " " + e.min + "'").join(", ");
  const hS = scorerLine(r.h), aS = scorerLine(r.a);
  // what comes next — computed AFTER this result was committed
  const seasonOver = G.week >= G.fixtures.length;
  let nextLine = "";
  if (!seasonOver) {
    const ef = dueEuro(), cf = ef ? null : dueCup(), pf = (ef || cf) ? null : duePreseason();
    const nf = (!ef && !cf && !pf && G.fixtures[G.week]) ? G.fixtures[G.week].find(([h, a]) => h === G.myClub || a === G.myClub) : null;
    if (ef) nextLine = "🏆 " + COMP_NAME[G.euro.comp] + " · " + esc(ef.label) + " vs " + esc(ef.opp.name) + (ef.home ? " (H)" : " (A)") + " — " + matchDateStr(G.euro.comp, G.week, G.euro.played);
    else if (cf) nextLine = "🏆 " + esc(cf.label) + " vs " + esc(cf.opp.name) + (cf.home ? " (H)" : " (A)") + " — " + matchDateStr(cf.cupKey, G.week);
    else if (pf) nextLine = esc(pf.label) + " vs " + esc(pf.opp.name) + (pf.home ? " (H)" : " (A)");
    else if (nf) {
      const home = nf[0] === G.myClub;
      nextLine = "Matchweek " + (G.week + 1) + " vs " + esc(CLUBS[home ? nf[1] : nf[0]].name) + (home ? " (H)" : " (A)") + " — " + matchDateStr("league", G.week);
    }
  }
  return `<div class="panel">
    ${G.motmNews ? `<div class="banner" style="padding:12px;margin-bottom:14px"><p style="margin:0">${esc(G.motmNews)}</p></div>` : ""}
    <h2>Full time — ${G.lastMatchLabel ? esc(G.lastMatchLabel) : "Matchweek " + G.week}${r.dateMs ? " · " + fmtDate(r.dateMs) : ""}${wxTag}</h2>
    <div class="score-line">${esc(CLUBS[r.h].name)} <b>${r.hg}</b><span class="vs">–</span><b>${r.ag}</b> ${esc(CLUBS[r.a].name)}</div>
    ${hS || aS ? `<p class="scorer-lines">${hS ? "⚽ " + CLUBS[r.h].short + ": " + hS : ""}${hS && aS ? " &nbsp;·&nbsp; " : ""}${aS ? "⚽ " + CLUBS[r.a].short + ": " + aS : ""}</p>` : ""}
    <p style="text-align:center" class="note">${verdict}${r.ratings && r.ratings.motm ? ` · ⭐ ${esc(r.ratings.motm.name)} ${r.ratings.motm.val.toFixed(1)}` : ""}</p>
    ${r.events.some(e => e.type === "goal" && e.clubIdx !== undefined) ? `
    <div style="text-align:center;margin:4px 0 10px">
      <button class="ghost" id="hl-btn" onclick="startHighlights()">🎬 Watch the goals</button>
      <button class="ghost" onclick="toggleLang()" title="Language / 語言">${LANG === "zh" ? "EN" : "中文旁述"}</button>
    </div>
    <div id="hl-box" class="pitch-wrap" style="display:none">
      <canvas id="hl-pitch" width="760" height="498"></canvas>
      <button class="snd-btn" onclick="skipHighlight()" title="Skip to the next goal">⏭</button>
    </div>` : `
    <div style="text-align:center;margin:4px 0 10px">
      <button class="ghost" onclick="toggleLang()" title="Language / 語言">${LANG === "zh" ? "EN" : "中文旁述"}</button>
    </div>`}
    <details class="fold"><summary>📋 Match timeline (${r.events.length} events)</summary>
      <ul class="events">` +
      r.events.map(e => `<li class="ev-${e.type === "goal" ? "goal" : e.type === "red" ? "red" : "other"}">
        <span class="min">${e.min}'</span> ${evIcon(e.type)}
        ${e.clubIdx !== undefined && CLUBS[e.clubIdx] ? `<b>${CLUBS[e.clubIdx].short}</b> — ` : ""}${esc(evText(e))}</li>`).join("") +
      `</ul></details>` +
    (r.stats ? `<details class="fold"><summary>📊 Match stats — possession ${r.stats.poss}%, shots ${r.stats.hShots}–${r.stats.aShots}</summary>
      <div class="poss-bar"><div class="ph" style="width:${r.stats.poss}%"></div><div class="pa" style="width:${100 - r.stats.poss}%"></div></div>
      <div class="stat-row"><span>${r.stats.poss}%</span><span class="lbl">Possession</span><span>${100 - r.stats.poss}%</span></div>
      <div class="stat-row"><span>${r.stats.hShots}</span><span class="lbl">Shots</span><span>${r.stats.aShots}</span></div>
      <div class="stat-row"><span>${r.stats.hSot}</span><span class="lbl">On target</span><span>${r.stats.aSot}</span></div></details>` : "") +
    (r.ratings && r.ratings.motm ? `
      <details class="fold"><summary>⭐ Player ratings — ${esc(CLUBS[G.myClub].name)}</summary>
      <p class="motm">⭐ Man of the Match: <b>${esc(r.ratings.motm.name)}</b> (${CLUBS[r.ratings.motm.club].short}) — ${r.ratings.motm.val.toFixed(1)}</p>
      <table><tbody>` +
      (r.h === G.myClub ? r.ratings.home : r.ratings.away)
        .sort((x, y) => y.val - x.val)
        .map(p => {
          const badges = "⚽".repeat(p.g || 0) + "🅰".repeat(p.a || 0) + "🟨".repeat(p.y || 0)
                       + "🟥".repeat(p.r || 0) + "❌".repeat(p.pk || 0);
          return `<tr><td class="pos-${p.pos}">${p.pos}</td><td>${esc(p.name)} ${badges}</td>
          <td class="num"><b>${p.val.toFixed(1)}</b></td></tr>`; }).join("") +
      `</tbody></table></details>` : "") +
    (others.length ? `<details class="fold"><summary>🏟 Around the grounds — the other ${others.length} results</summary>
    <p class="other-results">` +
    others.map(x => `${esc(CLUBS[x.h].name)} <b>${x.hg}–${x.ag}</b> ${esc(CLUBS[x.a].name)}`).join(" &nbsp;·&nbsp; ") +
    `</p></details>` : "") +
    (G.lastMatchEuro === "euro" && G.euro && G.euro.stage === "league" ? `<details class="fold"><summary>🌍 League phase standings</summary>${euroLeagueTableHtml(true)}</details>` : "") +
    ((() => {
      const pk = G.season + ":" + G.results.length + ":" + (G.lastMatchEuro || "lg");
      if (G.presserDone === pk) return G.presserNews ? `<p class="note" style="text-align:center">🎤 ${esc(G.presserNews)}</p>` : "";
      return `<div class="ht-panel" style="text-align:center"><b>🎤 Press conference</b><p class="note">The cameras are on. How do you play it?</p>
        <div class="row" style="justify-content:center">
          <button class="ghost" onclick="presser('calm','${pk}')">😌 Calm &amp; classy</button>
          <button class="ghost" onclick="presser('fiery','${pk}')">🔥 Fiery soundbite</button>
          <button class="ghost" onclick="presser('skip','${pk}')">🚪 No comment</button>
        </div></div>`;
    })()) +
    (G.lastMatchEuro === "playoff" && G.playoff && G.playoff.stage === "final"
      ? `<p style="text-align:center;margin-top:14px">📅 <b>Next up:</b> 🏟 ${TIERS[G.playoff.tier].name} Play-off Final vs ${esc(CLUBS[G.playoff.otherWinner].name)} at Wembley</p>`
      : nextLine ? `<p style="text-align:center;margin-top:14px">📅 <b>Next up:</b> ${nextLine}</p>` : seasonOver ? `<p style="text-align:center;margin-top:14px">🏁 That was the final round — the season review awaits.</p>` : "") +
    `<div class="row" style="margin-top:10px">
      <button class="action" onclick="continueAfterMatch()">Continue → ${G.lastMatchEuro === "playoff" ? (G.playoff && G.playoff.stage === "done" ? "Season review" : "the Final at Wembley") : G.lastMatchEuro === "euro" ? "Europe" : G.lastMatchEuro === "cup" ? "Cups" : "League table"}</button>
      ${G.lastMatchEuro === "playoff" ? "" : `<button class="ghost" onclick="G.screen='main';G.tab='squad';save();render()">Squad & next match</button>`}
    </div></div>`;
}

function drawShieldOn(x, cx, cy, s, col, initials) {
  x.save();
  x.translate(cx - 30 * s, cy - 35 * s);
  x.scale(s, s);
  const shield = () => {
    x.beginPath();
    x.moveTo(30, 2); x.lineTo(56, 10); x.lineTo(56, 38);
    x.bezierCurveTo(56, 56, 44, 64, 30, 68);
    x.bezierCurveTo(16, 64, 4, 56, 4, 38);
    x.lineTo(4, 10); x.closePath();
  };
  shield();
  x.fillStyle = col; x.fill();
  x.lineWidth = 3; x.strokeStyle = shade(col, -45); x.stroke();
  x.beginPath();
  x.moveTo(30, 2); x.lineTo(56, 10); x.lineTo(56, 38);
  x.bezierCurveTo(56, 56, 44, 64, 30, 68);
  x.closePath();
  x.fillStyle = "rgba(0,0,0,0.16)"; x.fill();
  const rgb = [1, 3, 5].map(i => parseInt(col.slice(i, i + 2), 16));
  x.fillStyle = (rgb[0] * 299 + rgb[1] * 587 + rgb[2] * 114) / 1000 > 150 ? "#1A2026" : "#FFFFFF";
  x.font = "bold 16px Arial, sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(initials, 30, 38);
  x.restore();
}

function seasonCardCanvas() {
  const t = tableStats();
  const myPos = t.findIndex(r => r.i === G.myClub) + 1;
  const row = t.find(r => r.i === G.myClub);
  if (!row) return null;
  const col = colorOf(G.myClub);
  const c = document.createElement("canvas");
  c.width = 800; c.height = 1040;
  const x = c.getContext("2d");
  if (!x) return null;
  // backdrop
  const grad = x.createLinearGradient(0, 0, 0, 1040);
  grad.addColorStop(0, "#15212B"); grad.addColorStop(1, "#0C1218");
  x.fillStyle = grad; x.fillRect(0, 0, 800, 1040);
  x.fillStyle = col; x.fillRect(0, 0, 800, 10); x.fillRect(0, 1030, 800, 10);
  const center = (txt, y, font, color) => { x.font = font; x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillText(txt, 400, y); };
  // header
  drawShieldOn(x, 400, 120, 1.9, col, CLUBS[G.myClub].short);
  center(CLUBS[G.myClub].name.toUpperCase(), 235, "bold 38px Arial, sans-serif", "#E8EFF2");
  center(seasonYears(G.season) + " SEASON REVIEW", 268, "16px Arial, sans-serif", "#9FB3BE");
  // headline
  const champs = myPos === 1;
  if (champs) {
    center("🏆 CHAMPIONS 🏆", 360, "bold 54px Arial, sans-serif", "#E8B33C");
  } else {
    center("#" + myPos, 372, "bold 92px Arial, sans-serif", myPos <= 4 ? "#3D7DC8" : myPos >= 18 ? "#D85C4A" : "#E8EFF2");
    center("in the Premier League", 402, "18px Arial, sans-serif", "#9FB3BE");
  }
  center("W " + row.w + "   D " + row.d + "   L " + row.l + "   ·   " + row.gf + "–" + row.ga + "   ·   " + row.pts + " pts", 450, "22px 'Courier New', monospace", "#E8EFF2");
  if (G.board) {
    const met = myPos <= G.board.exp;
    center("Board objective: " + expectationText(G.board.exp) + " — " + (met ? "MET ✓" : "MISSED ✗"), 484, "16px Arial, sans-serif", met ? "#2EAE6A" : "#D85C4A");
  }
  // divider
  x.strokeStyle = "rgba(255,255,255,0.15)"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(120, 515); x.lineTo(680, 515); x.stroke();
  // competitions
  let y = 560;
  const line = (txt, big, color) => { center(txt, y, (big ? "bold 24px" : "19px") + " Arial, sans-serif", color || "#E8EFF2"); y += big ? 40 : 34; };
  const cupLine = key => {
    const cp = G.cups && G.cups[key];
    if (!cp) return;
    const last = cp.results.length ? cp.results[cp.results.length - 1].label : null;
    line(CUP_NAME[key] + ":  " + (cp.alive === "won" ? "🏆 WINNERS" : last ? "out in " + (last.startsWith("Round") ? last : "the " + last) : "—"), false,
         cp.alive === "won" ? "#E8B33C" : "#9FB3BE");
  };
  cupLine("lc"); cupLine("fa");
  if (G.euro) {
    const E = G.euro;
    const stageTxt = E.stage === "won" ? "🏆 CHAMPIONS" :
      E.stage === "out" ? "out (" + (E.results.length ? E.results[E.results.length - 1].label : "league phase") + ")" :
      E.stage;
    line(COMP_NAME[E.comp] + ":  " + stageTxt, false, E.stage === "won" ? "#E8B33C" : "#9FB3BE");
  }
  y += 8;
  x.beginPath(); x.moveTo(120, y - 20); x.lineTo(680, y - 20); x.stroke();
  // stars of the season
  const scorer = [...G.squads[G.myClub]].sort((a, b) => b.goals - a.goals)[0];
  const assister = [...G.squads[G.myClub]].sort((a, b) => (b.assists || 0) - (a.assists || 0))[0];
  y += 14;
  line("⭐ STARS OF THE SEASON", true, "#E8B33C");
  if (scorer && scorer.goals) line("Top scorer:  " + scorer.name + " — " + scorer.goals + " goals");
  if (assister && assister.assists) line("Most assists:  " + assister.name + " — " + assister.assists);
  const motmCount = (G.motm || []).filter(m => m.startsWith("Season " + G.season + " ")).length;
  if (motmCount) line("Manager of the Month awards:  " + motmCount);
  if ((G.moty || []).some(m => m.startsWith("Season " + G.season + " "))) line("🏆 Manager of the Season", true, "#E8B33C");
  // trophies banner
  const trophies = (G.honours || []).filter(h => h.startsWith("Season " + G.season + ":")).map(h => h.split(": ")[1]);
  if (trophies.length) {
    y += 10;
    line("🏆 " + trophies.join("  ·  "), true, "#E8B33C");
  }
  // footer
  center("FOOTBALL MANAGER · season card · " + CLUBS[G.myClub].short + " " + G.season, 1006, "13px Arial, sans-serif", "#5E6E7A");
  return c;
}

function showSeasonCard() {
  // render fresh every time and SHOW it — auto-downloads fail silently on many
  // mobile browsers, which made the card look like it never updated
  const c = seasonCardCanvas();
  if (!c) return;
  const box = document.getElementById("card-box");
  if (!box) return;
  box.innerHTML = "";
  const img = document.createElement("img");
  img.src = c.toDataURL("image/png");
  img.alt = "Season card";
  img.style.cssText = "max-width:400px;width:100%;display:block;margin:10px auto;border:1px solid var(--line);border-radius:8px";
  box.appendChild(img);
  const note = document.createElement("p");
  note.className = "note";
  note.style.textAlign = "center";
  note.innerHTML = "📱 On a phone: press and hold the card → <b>Save image</b>. 🖥 On a computer: ";
  const a = document.createElement("a");
  a.textContent = "download " + "FM-" + seasonYears(G.season).replace("/", "-") + "-" + CLUBS[G.myClub].short + ".png";
  a.download = "FM-" + seasonYears(G.season).replace("/", "-") + "-" + CLUBS[G.myClub].short + ".png";
  a.href = img.src;
  a.style.color = "var(--pitch)";
  note.appendChild(a);
  box.appendChild(note);
  if (box.scrollIntoView) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function downloadSeasonCard() { showSeasonCard(); } // old name kept for safety

function renderSeasonEnd() {
  if (!G.pyr) { G.pyr = resolvePyramid(); save(); }
  const ti0 = tierIndex();
  if (ti0 !== 0) {
    const T = TIERS[ti0];
    const t = tableStats();
    const pos = t.findIndex(r => r.i === G.myClub) + 1;
    const po = G.choff || { up: (G.pyr.up[ti0] || []).slice(), s1: null, s2: null, f: null };
    const up = G.pyr.up[ti0] || po.up || [];
    const promoted = up.includes(G.myClub);
    const auto = pos > 1 && pos <= T.autoUp;
    const iAmDown = (G.pyr.down[ti0] || []).includes(G.myClub);
    const inFinal = po.f && (po.f.h === G.myClub || po.f.a === G.myClub);
    const inSemis = (po.s1 && (po.s1.h === G.myClub || po.s1.a === G.myClub)) || (po.s2 && (po.s2.h === G.myClub || po.s2.a === G.myClub));
    if (iAmDown && ti0 === TIERS.length - 1) {
      const promo = G.pyr.promotedIn || [];
      return `<div class="banner"><h2>💔 CAREER OVER</h2>
        <p>You finished <b>#${pos}</b> of ${t.length} and were relegated out of the National League into regional non-league football.</p>
        <p class="note">There is no division below this in the game, and no way back from here. This is where the journey ends.</p>
        ${promo.length ? `<p class="note">Up from non-league in your place: ${promo.map(i => esc(CLUBS[i].name)).join(", ")}</p>` : ""}
        ${(G.honours || []).length ? `<p class="note">Honours board: ${G.honours.map(esc).join(" · ")}</p>` : ""}
        <div class="row"><button class="action" onclick="resetGame()">Start a new career</button>
        <button class="ghost" onclick="showSeasonCard()" title="A poster of your season">🖼 Season card</button></div></div>` + renderTable();
    }
    const upName = TIERS[ti0 - 1] ? TIERS[ti0 - 1].name : "the division above";
    const downName = TIERS[ti0 + 1] ? TIERS[ti0 + 1].name : "regional non-league";
    const line = pos === 1 ? "Champions of " + T.name + ". Promoted!" :
                 auto ? "Automatic promotion to " + upName + "!" :
                 promoted ? "Up through the playoffs - what a day!" :
                 inFinal ? "Beaten in the playoff final. Heartbreak." :
                 inSemis ? "Out in the playoff semifinals. So close." :
                 iAmDown ? "Relegated to " + downName + ". A hard season." :
                 "A mid-table finish. Another year at this level.";
    const tieLine = (m, label) => m ? `<p class="note">${label}: ${esc(CLUBS[m.h].name)} ${m.hg}-${m.ag} ${esc(CLUBS[m.a].name)}${m.pens ? ", " + esc(CLUBS[m.winner].short) + " win " + m.pens + " on penalties" : ""}${(m.h === G.myClub || m.a === G.myClub) ? " · YOUR tie" : ""}</p>` : "";
    const poBlock = po.f ? `<div style="text-align:left;border-top:1px solid var(--line);margin-top:10px;padding-top:8px">

      <button class="ghost" onclick="resetGame()">New game (different club)</button>
    </div>
    <div id="card-box"></div>`;
}

function saveWC() { try { localStorage.setItem("touchline_wc", JSON.stringify(WCS)); } catch (e) {} }
function loadWC() {
  try { WCS = JSON.parse(localStorage.getItem("touchline_wc") || "null"); } catch (e) { WCS = null; }

let wcPid = 0;
function wcGenSquad(ti) {
  const [, short, base, , , region, stars] = WC_TEAMS[ti];
  const squad = [];
  const pool = region === "EUR" ? EURO_NAMES : WC_NAME_POOLS[region];
  const used = new Set((stars || []).map(s => s[0]));
  const filler = () => {
    for (let i = 0; i < 40; i++) {
      const n = "ABCDEFGHIJLMNPRSTV"[Math.floor(rnd() * 18)] + ". " + pool[Math.floor(rnd() * pool.length)];
      if (!used.has(n)) { used.add(n); return n; }
    }
    return "A. " + pool[0];
  };
  const mk = (nm, pos, rating) => {
    const age = 22 + Math.floor(rnd() * 11);
    return { id: 800000 + (wcPid++), name: nm, pos, rating, pot: rating, age,
      wage: 1, years: 1, fitness: 100, form: 0, injury: 0, ban: 0, yellows: 0, goals: 0, assists: 0, apps: 0 };
  };
  const counts = { GK: 2, DF: 6, MF: 6, FW: 4 };
  const starBy = { GK: [], DF: [], MF: [], FW: [] };
  for (const [nm, pos] of (stars || [])) starBy[pos].push(nm);
  for (const pos of ["GK", "DF", "MF", "FW"]) {
    starBy[pos].forEach(nm => squad.push(mk(nm, pos, base + 4 + Math.floor(rnd() * 3))));
    for (let i = starBy[pos].length; i < counts[pos]; i++) {
      squad.push(mk(filler(), pos, base - 4 + Math.floor(rnd() * 8)));
    }
  }
  assignRoles(squad);
  return squad;
}

function natYear() { return 2026 + 4 * ((G && G.natTenure) || 0); }
function natTargetForBase(b) { return b >= 88 ? 4 : b >= 82 ? 3 : b >= 78 ? 2 : 1; } // 4=SF,3=QF,2=R16,1=knockouts

  for (const rd of (WCS.ko && WCS.ko.log) || []) {

    .filter(i => WC_TEAMS[i][2] <= rep + 2 && WC_TEAMS[i][2] >= rep - 16) // nations within reach of your standing, top nations only for top reputations
    .sort((a, b) => WC_TEAMS[b][2] - WC_TEAMS[a][2])

    myTeam: ti, stage: "group", md: 0,
    squads: WC_TEAMS.map((_, i) => wcGenSquad(i)),
    results: [],            // group stage: per matchday, list of {a, b, ag, bg, events}
    ko: null,               // { round, ties: [[a,b]...], log: [] }
    tac: Object.assign({}, aiTacticsByBase(WC_TEAMS[ti][2]), { ment: "Balanced" }),
    lastMatch: null, champion: null, honoured: false,
  };
  saveWC(); render();
}

function wcAiTac(ti) { return Object.assign({}, aiTacticsByBase(WC_TEAMS[ti][2]), { ment: "Balanced" }); }

function wcSimMatch(ai, bi) {
  const tA = ai === WCS.myTeam ? WCS.tac : wcAiTac(ai);
  const tB = bi === WCS.myTeam ? WCS.tac : wcAiTac(bi);
  const sqA = WCS.squads[ai], sqB = WCS.squads[bi];
  const A = teamNumbers(sqA, bestXI(sqA, tA.form), tA.ment, tA.form, tA.style, "clear");
  const B = teamNumbers(sqB, bestXI(sqB, tB.form), tB.ment, tB.form, tB.style, "clear");
  const ag = poisson(expGoals(A, B, false));   // neutral venues — no home boost
  const bg = poisson(expGoals(B, A, false));
  const events = [];
  for (let i = 0; i < ag; i++) { const e = makeGoalEvent(A, ai); e.min = 3 + Math.floor(rnd() * 88); events.push(e); }
  for (let i = 0; i < bg; i++) { const e = makeGoalEvent(B, bi); e.min = 3 + Math.floor(rnd() * 88); events.push(e); }
  for (const [T, idx] of [[A, ai], [B, bi]]) {
    if (rnd() < 0.5) {
      const p = pickScorer(T);
      const k = Math.floor(rnd() * CHANCE_LINES.length);
      events.push({ min: 5 + Math.floor(rnd() * 85), type: "chance", clubIdx: idx, who: p.name,
                    text: p.name + " " + CHANCE_LINES[k], zh: p.name + " " + CHANCE_LINES_ZH[k] });
    }
    if (rnd() < 0.18) {
      const p = T.xi[Math.floor(rnd() * T.xi.length)];
      events.push({ min: 10 + Math.floor(rnd() * 80), type: "yellow", clubIdx: idx, who: p.name,
                    text: p.name + " goes into the book.", zh: p.name + " 食黃牌，俾球證記咗名。" });
    }
  }
  events.sort((x, y) => x.min - y.min);
  return { a: ai, b: bi, ag, bg, events };
}

function wcShootout(ai, bi) { // same probabilities as the club shootout engine
  const xi = ti => bestXI(WCS.squads[ti], "4-4-2").map(id => WCS.squads[ti].find(p => p.id === id)).filter(Boolean);
  const A = xi(ai), B = xi(bi);
  const takers = side => side.filter(p => p.pos !== "GK").sort((x, y) => y.rating - x.rating);
  const gk = side => side.find(p => p.pos === "GK") || side[0];
  const tA = takers(A), tB = takers(B), gA = gk(A), gB = gk(B);
  let aS = 0, bS = 0;
  const kicks = [];
  const kick = (mine) => {
    const t = mine ? tA[kicks.filter(k => k.mine).length % tA.length] : tB[kicks.filter(k => !k.mine).length % tB.length];
    const keeper = mine ? gB : gA;
    const scored = rnd() < Math.max(0.55, Math.min(0.92, 0.76 + (t.rating - keeper.rating) * 0.004));
    if (scored) { if (mine) aS++; else bS++; }
    kicks.push({ mine, name: t.name, scored, aS, bS });
  };
  let settled = false;
  for (let r = 0; r < 5 && !settled; r++) {
    kick(true);
    if (aS > bS + (5 - r) || bS > aS + (4 - r)) { settled = true; break; }
    kick(false);
    if (aS > bS + (4 - r) || bS > aS + (4 - r)) settled = true;
  }
  let sd = 0;
  while (aS === bS && sd++ < 30) { kick(true); kick(false); }
  if (aS === bS) aS++;
  return { winA: aS > bS, aS, bS, kicks };
}

function wcGroupTeams(g) { return WC_TEAMS.map((t, i) => i).filter(i => WC_TEAMS[i][4] === g); }
function wcGroupFixtures(g, md) {
  const [a, b, c, d] = wcGroupTeams(g);
  return [[[a, b], [c, d]], [[a, c], [b, d]], [[d, a], [b, c]]][md];
}
function wcGroupTable(g) {
  const rows = wcGroupTeams(g).map(i => ({ i, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
  const by = {}; rows.forEach(r => by[r.i] = r);
  for (const mdRes of WCS.results) for (const m of mdRes) {
    if (!(m.a in by) || !(m.b in by)) continue;
    const A = by[m.a], B = by[m.b];
    A.p++; B.p++; A.gf += m.ag; A.ga += m.bg; B.gf += m.bg; B.ga += m.ag;
    if (m.ag > m.bg) { A.w++; B.l++; A.pts += 3; }
    else if (m.ag < m.bg) { B.w++; A.l++; B.pts += 3; }
    else { A.d++; B.d++; A.pts++; B.pts++; }
  }
  return rows.sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || WC_TEAMS[x.i][0].localeCompare(WC_TEAMS[y.i][0]));
}

function wcBuildR32() {
  const winners = [], runners = [], thirds = [];
  for (let g = 0; g < 12; g++) {
    const t = wcGroupTable(g);
    winners.push(t[0].i); runners.push(t[1].i); thirds.push(t[2]);
  }
  thirds.sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
  const bestThirds = thirds.slice(0, 8).map(r => r.i);
  const ties = [];
  for (let i = 0; i < 8; i++) ties.push([winners[i], bestThirds[i]]);            // 8 ties: W vs best 3rd
  for (let i = 8; i < 12; i++) ties.push([winners[i], runners[(i - 8 + 2) % 12]]); // 4 ties: W vs RU (other group)
  const usedR = new Set([runners[2], runners[3], runners[4], runners[5]]);
  const restR = runners.filter(r => !usedR.has(r));                               // remaining 8 runners pair up
  for (let i = 0; i < 4; i++) ties.push([restR[i], restR[i + 4]]);
  return { round: 0, ties, log: [] };
}

function wcPlayNext(preMatch) {
  if (!WCS || WCS.stage === "pick" || WCS.stage === "done") return;
  if (WCS.stage === "group") {
    const mdRes = [];
    for (let g = 0; g < 12; g++) for (const [a, b] of wcGroupFixtures(g, WCS.md))
      mdRes.push(preMatch && preMatch.a === a && preMatch.b === b ? preMatch : wcSimMatch(a, b));
    WCS.results.push(mdRes);
    WCS.lastMatch = mdRes.find(m => m.a === WCS.myTeam || m.b === WCS.myTeam) || null;
    WCS.md++;
    if (WCS.md >= 3) { WCS.ko = wcBuildR32(); WCS.stage = "ko"; }
  } else if (WCS.stage === "ko") {
    const survivors = [], roundLog = [];
    for (const [a, b] of WCS.ko.ties) {
      const m = preMatch && preMatch.a === a && preMatch.b === b ? preMatch : wcSimMatch(a, b);
      let note = "";
      let winner = m.ag > m.bg ? a : m.bg > m.ag ? b : null;
      if (winner === null) {
        const so = wcShootout(a, b);
        winner = so.winA ? a : b;
        note = " (" + so.aS + "–" + so.bS + " pens)";
        m.pens = so;
      }
      m.note = note; m.winner = winner;
      roundLog.push(m);
      survivors.push(winner);
      if (a === WCS.myTeam || b === WCS.myTeam) WCS.lastMatch = m;
    }
    // semi-final losers meet in the third-place playoff before the final
    if (WCS.ko.ties.length === 2) {
      WCS.thirdTie = WCS.ko.ties.map((t, i) => t[0] === survivors[i] ? t[1] : t[0]);
    }
    if (WCS.ko.ties.length === 1 && WCS.thirdTie) {
      const tp = wcSimMatch(WCS.thirdTie[0], WCS.thirdTie[1]);
      if (tp.ag === tp.bg) { const so = wcShootout(tp.a, tp.b); tp.note = " (" + so.aS + "–" + so.bS + " pens)"; tp.winner = so.winA ? tp.a : tp.b; }
      else tp.winner = tp.ag > tp.bg ? tp.a : tp.b;
      WCS.ko.log.push({ round: -1, label: "Third-place playoff", matches: [tp] });
      WCS.thirdTie = null;
    }
    WCS.ko.log.push({ round: WCS.ko.round, matches: roundLog });
    if (survivors.length === 1) {
      WCS.champion = survivors[0];
      WCS.stage = "done";
      // national-team campaign: dynamic-year honour + the federation's verdict, evaluated once
      if (WCS.nat && G && G.honours && !WCS.evaluated) {
        const nat = G.natJob;
        const reached = natStageReached();
        const target = natTarget();
        if (WCS.champion === WCS.myTeam && !WCS.honoured) {
          G.honours.push("Season " + G.season + ": 🌎 World Cup " + (WCS.year || 2026) + " winners with " + WC_TEAMS[nat][0]);
          WCS.honoured = true;
        }
        let verdict;
        if (reached >= target) {
          G.natStrikes = 0; G.natTenure = (G.natTenure || 0) + 1;
          verdict = "🦁 The " + WC_TEAMS[nat][0] + " FA are satisfied — you reached " + natStageText(reached) + ". The post is yours; next, the " + natYear() + " World Cup.";
        } else {
          G.natStrikes = (G.natStrikes || 0) + 1;
          if ((target - reached) >= 2 || G.natStrikes >= 2) {
            verdict = "🦁 The " + WC_TEAMS[nat][0] + " FA have dismissed you after going out at " + natStageText(reached) + " (they wanted you to " + natTargetText(target) + "). Your national post is over.";
            G.natJob = null; G.natStrikes = 0;
          } else {
            G.natTenure = (G.natTenure || 0) + 1;
            verdict = "🦁 The " + WC_TEAMS[nat][0] + " FA expected you to " + natTargetText(target) + " but you exited at " + natStageText(reached) + ". A final warning; deliver at the " + natYear() + " World Cup.";
          }
        }
        WCS.natVerdict = verdict; WCS.evaluated = true; G.natNews = verdict;
        save();
      } else if (!WCS.nat && WCS.champion === WCS.myTeam && G && G.honours && !WCS.honoured) {
        G.honours.push("Season " + G.season + ": 🌎 World Cup " + (WCS.year || 2026) + " winners with " + WC_TEAMS[WCS.myTeam][0]);
        WCS.honoured = true;
        save();
      }
    } else {
      WCS.ko.round++;
      WCS.ko.ties = [];
      for (let i = 0; i < survivors.length; i += 2) WCS.ko.ties.push([survivors[i], survivors[i + 1]]);
    }
  }
  saveWC(); render();
}

/* --- World Cup LIVE: a compact live viewer on the same maths & sounds --- */
let WCL = null, wclTimer = null;
function wcStartLive() {

function wclStart() { wclStop(); if (WCL) wclTimer = setInterval(wclTick, SPEEDS[WCL.speed] || 180); }
function wclStop() { if (wclTimer) { clearInterval(wclTimer); wclTimer = null; } }
function wclTick() {

  for (const [T, O, idx, sideA] of [[L.H, L.W, L.a, true], [L.W, L.H, L.b, false]]) {
    if (rnd() < expGoals(T, O, false) / 93) {
      const e = makeGoalEvent(T, idx); e.min = L.minute; L.events.push(e);
      if (sideA) L.ag++; else L.bg++;
      L.ball = { x: sideA ? 0.96 : 0.04, y: 0.42 + rnd() * 0.16 };
      L.flash = { text: (LANG === "zh" ? "入咗呀！" : "GOAL! ") + e.who, until: Date.now() + 1900 };
      SND.roar(idx === WCS.myTeam);
      news = true;
    } else if (rnd() < 0.035) {
      const q = pickScorer(T);

      L.events.push({ min: L.minute, type: "chance", clubIdx: idx, who: q.name,
