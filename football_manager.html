  if (fix.home) { opts.hXI = G.lineup; opts.hMent = G.mentality; opts.hForm = G.formation; opts.hStyle = G.style || "Balanced"; }
  else { opts.aXI = G.lineup; opts.aMent = G.mentality; opts.aForm = G.formation; opts.aStyle = G.style || "Balanced"; }
  commitEuro(fix, simMatch(h, a, opts));
}

function startEuroLive() {
  const fix = dueEuro();
  if (!fix || G.live) return;
  G.lineup = validateLineup();
  setEuroGuest(fix.opp);
  const oppIdx = EURO_SLOT;
  const h = fix.home ? G.myClub : EURO_SLOT, a = fix.home ? EURO_SLOT : G.myClub;
  const aiXI = bestXI(G.squads[EURO_SLOT], "4-4-2");
  const L = {
    h, a,
    hXI: fix.home ? [...G.lineup] : aiXI,
    aXI: fix.home ? aiXI : [...G.lineup],
    hMent: fix.home ? G.mentality : "Balanced",
    aMent: fix.home ? "Balanced" : G.mentality,
    hForm: fix.home ? G.formation : aiTactics(oppIdx).form,
    aForm: fix.home ? aiTactics(oppIdx).form : G.formation,
    hStyle: fix.home ? (G.style || "Balanced") : aiTactics(oppIdx).style,
    aStyle: fix.home ? aiTactics(oppIdx).style : (G.style || "Balanced"),
    events: [{ min: 0, type: "info", text: "Kick-off — a European night under the lights!" }],
    elsewhere: [], otherResults: [], snapshot: null,
    minute: 0, phase: "first", subsUsed: 0, aiSubs: 0, windows: 0, winPending: false,
    manage: false, notice: null, speed: "normal",
    reds: {}, endMin: 91 + Math.floor(rnd() * 4), euro: true, fix,
    stats: { t: 0, hp: 0, hShots: 0, aShots: 0, hSot: 0, aSot: 0 },
  };
  L.hApp = [...L.hXI]; L.aApp = [...L.aXI];
  L.weather = getWeather();
  if (L.weather !== "clear") {
    L.events.push({ min: 0, type: "info", text: WEATHER[L.weather].icon + " Conditions: " + WEATHER[L.weather].name + " — " + WEATHER[L.weather].note, zh: wxLineZH(L.weather) });
  }
  G.live = L;
  liveCacheDirty();
  G.screen = "live";
  save(); render(); // begins paused at 0' — press ▶ Kick off when ready
}

/* ---------------- Penalty shootouts ---------------- */
/* Drawn knockout ties are settled kick by kick, not by a coin. */

function simShootoutClubs(myIdx, oppIdx, myXIids, oppXIids) {
  const xiOf = (ci, ids) => (ids || bestXI(G.squads[ci], "4-4-2")).map(id => G.squads[ci].find(p => p.id === id)).filter(Boolean);
  const myXI = xiOf(myIdx, myXIids), opXI = xiOf(oppIdx, oppXIids);
  const takers = xi => [...xi].filter(p => p.pos !== "GK").sort((a, b) => b.rating - a.rating);
  const keeper = xi => { const g = xi.find(p => p.pos === "GK"); return g ? g.rating : 70; };
  const myT = takers(myXI), opT = takers(opXI);
  const myGK = keeper(myXI), opGK = keeper(opXI);
  const pScore = (taker, gk) => Math.max(0.55, Math.min(0.92, 0.76 + (taker.rating - gk) * 0.004));
  const kicks = [];
  let myS = 0, opS = 0, myK = 0, opK = 0;
  const kick = (mineSide) => {
    const list = mineSide ? myT : opT;
    const t = list[(mineSide ? myK : opK) % list.length];
    if (mineSide) myK++; else opK++;
    const scored = rnd() < pScore(t, mineSide ? opGK : myGK);
    if (scored) { if (mineSide) myS++; else opS++; }
    kicks.push({ mine: mineSide, name: t.name, scored, myS, opS });
  };
  // five rounds each, stopping the moment it's mathematically settled
  let settled = false;
  for (let r = 0; r < 5 && !settled; r++) {
    kick(true);
    if (myS > opS + (5 - r) || opS > myS + (4 - r)) { settled = true; break; }
    kick(false);
    if (myS > opS + (4 - r) || opS > myS + (4 - r)) settled = true;
  }
  // sudden death
  let sd = 0;
  while (myS === opS && sd++ < 30) { kick(true); kick(false); }
  if (myS === opS) myS++; // the referee has a plane to catch
  return { myWin: myS > opS, myS, opS, kicks,
           note: " (" + (myS > opS ? "won" : "lost") + " " + myS + "–" + opS + " on penalties)" };
}

function shootoutEvents(so, myIdx, oppIdx) {
  return so.kicks.map((k, n) => ({
    min: 120, type: "info",
    text: "🥅 Pen " + (n + 1) + ": " + k.name + (k.scored ? " SCORES" : " MISSES") + "! " +
          CLUBS[myIdx].short + " " + k.myS + "–" + k.opS + " " + CLUBS[oppIdx].short,
    zh: "🥅 十二碼第 " + (n + 1) + " 輪：" + k.name + (k.scored ? "射入！" : "射失！") + " " +
        CLUBS[myIdx].short + " " + k.myS + "–" + k.opS + " " + CLUBS[oppIdx].short,
  }));
}

let pensTimer = null;
function startPensTimer() {
  if (pensTimer) clearInterval(pensTimer);
  SND.startCrowd(); SND.whistle(1);
  pensTimer = setInterval(() => {
    const L = G.live;
    if (!L || !L.pens || L.pens.shown >= L.pens.so.kicks.length) {
      clearInterval(pensTimer); pensTimer = null;
      if (G.live) { save(); render(); }
      return;
    }
    L.pens.shown++;
    const k = L.pens.so.kicks[L.pens.shown - 1];
    if (V) V.flash = { text: k.scored ? "⚽ " + k.name + (LANG === "zh" ? " 射入！" : " SCORES") : "❌ " + k.name + (LANG === "zh" ? " 射失！" : " MISSES"),
                       color: k.scored ? "#2EAE6A" : "#D85C4A", until: performance.now() + 850 };
    if (k.mine) { if (k.scored) SND.roar(true); else SND.groan(); }
    else { if (k.scored) SND.ooh(); else SND.roar(false); }
    render();
  }, 950);
}

/* ---------------- Crowd sound (synthesized with WebAudio — no audio files) ----------------
   The crowd bed is looped brown noise through a bandpass filter; excitement moves the
   gain and filter frequency. Roars/groans are momentary gain swells; the referee's
   whistle is a square-wave oscillator with a 36Hz "pea" trill on its frequency. */
const SND = {
  ctx: null, dead: false, buf: null,
  crowd: null, crowdGain: null, crowdFilter: null,
  exc: 0.25, hold: 0,
  get on() { try { return localStorage.getItem("touchline_snd") !== "off"; } catch (e) { return false; } },
  bed() { return 0.05 + this.exc * 0.16; },
  init() {
    if (this.ctx || this.dead || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.dead = true; return; }
    try {
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 2;
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        last = (last + (Math.random() * 2 - 1) * 0.04) * 0.985;
        d[i] = last * 6;
      }
      this.buf = buf;
    } catch (e) { this.dead = true; this.ctx = null; }
  },
  startCrowd() {
    this.init();
    if (!this.ctx || this.crowd || !this.on) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const src = this.ctx.createBufferSource();
    src.buffer = this.buf; src.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "bandpass"; filt.frequency.value = 700; filt.Q.value = 0.6;
    const gain = this.ctx.createGain();
    gain.gain.value = 0;
    src.connect(filt); filt.connect(gain); gain.connect(this.ctx.destination);
    src.start();
    this.crowd = src; this.crowdGain = gain; this.crowdFilter = filt;
    this.setExcite(this.exc);
  },
  stopCrowd() {
    if (!this.ctx || !this.crowd) return;
    this.crowdGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
    const old = this.crowd;
    this.crowd = null; this.crowdGain = null; this.crowdFilter = null;
    setTimeout(() => { try { old.stop(); } catch (e) {} }, 1800);
  },
  setExcite(x) {
    this.exc = Math.max(0.12, Math.min(1, x));
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    if (t < this.hold) return; // a roar/groan is mid-flight — don't cut it short
    this.crowdGain.gain.setTargetAtTime(this.bed(), t, 0.25);
    this.crowdFilter.frequency.setTargetAtTime(550 + this.exc * 900, t, 0.25);
  },
  swell(peak, up, down) {
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    const g = this.crowdGain.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(peak, t, up);
    g.setTargetAtTime(this.bed(), t + up * 4, down);
    this.hold = t + up * 4 + down * 2;
  },
  roar(big) { this.swell(big ? 0.55 : 0.34, 0.06, 0.9); },
  ooh() { this.swell(0.3, 0.05, 0.25); },
  groan() {
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    const g = this.crowdGain.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(0.3, t, 0.05);          // the rise as the chance opens up…
    g.setTargetAtTime(0.025, t + 0.4, 0.25);  // …then the air goes out of the ground
    g.setTargetAtTime(this.bed(), t + 1.5, 0.5);
    this.hold = t + 2.2;
  },
  whistle(blasts) {
    this.init();
    if (!this.ctx || !this.on) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.02;
    for (let b = 0; b < blasts; b++) {
      const t = t0 + b * 0.42;
      const dur = blasts > 1 && b === blasts - 1 ? 0.65 : 0.28; // long final blast
      const osc = this.ctx.createOscillator();
      osc.type = "square"; osc.frequency.value = 2280;
      const trill = this.ctx.createOscillator();
      trill.frequency.value = 36;
      const trillGain = this.ctx.createGain(); trillGain.gain.value = 600;
      trill.connect(trillGain); trillGain.connect(osc.frequency);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.02);
      g.gain.setValueAtTime(0.06, t + dur - 0.05);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); trill.start(t);
      osc.stop(t + dur + 0.05); trill.stop(t + dur + 0.05);
    }
  },
  cue(e) {
    if (!this.crowd) return;
    if (e.type === "goal") this.roar(e.clubIdx === G.myClub);
    else if (e.type === "chance") this.ooh();
    else if (e.type === "pkmiss") this.groan();
    else if (e.type === "yellow" || e.type === "red" || e.type === "injury") this.whistle(1);
  },
};

function toggleSound() {
  const wasOff = localStorage.getItem("touchline_snd") === "off";
  try { localStorage.setItem("touchline_snd", wasOff ? "on" : "off"); } catch (e) {}
  if (!wasOff) SND.stopCrowd();
  else if (G.live && tickTimer) SND.startCrowd();
  const b = document.getElementById("snd-btn");
  if (b) b.textContent = wasOff ? "🔊" : "🔇";
}

/* ---------------- Live match mode ---------------- */

let tickTimer = null;
const SPEEDS = { slow: 450, normal: 180, fast: 50 };

function liveGoals(L, clubIdx, uptoMin) {
  return L.events.filter(e => e.type === "goal" && e.clubIdx === clubIdx && e.min <= uptoMin).length;
}
function myXIKey(L) { return G.myClub === L.h ? "hXI" : "aXI"; }

function removeFromXI(L, clubIdx, id) {
  const key = clubIdx === L.h ? "hXI" : "aXI";
  L[key] = L[key].filter(x => x !== id);
}

/* The user's match is simulated MINUTE BY MINUTE, so tactical changes and
   substitutions take effect immediately from the next minute of play. */

let liveTeamsCache = null;
function liveCacheDirty() { liveTeamsCache = null; }
function getLiveTeams(L) {
  if (!liveTeamsCache) {
    liveTeamsCache = {
      H: teamNumbers(G.squads[L.h], L.hXI, L.hMent, L.hForm || "4-4-2", L.hStyle || "Balanced", L.weather || "clear"),
      A: teamNumbers(G.squads[L.a], L.aXI, L.aMent, L.aForm || "4-4-2", L.aStyle || "Balanced", L.weather || "clear"),
    };
  }
  return liveTeamsCache;
}

function aiAutoSub(L, clubIdx) {
  if (clubIdx === G.myClub) return;
  if ((L.aiSubs || 0) >= 5) return;
  const key = clubIdx === L.h ? "hXI" : "aXI";
  if (L[key].length >= 11 - (L.reds[clubIdx] || 0)) return;
  const sq = G.squads[clubIdx];
  const inP = sq.filter(p => available(p) && !L[key].includes(p.id))
                .sort((a, b) => effRating(b) - effRating(a))[0];
  if (!inP) return;
  L[key].push(inP.id);
  (clubIdx === L.h ? L.hApp : L.aApp).push(inP.id);
  L.aiSubs = (L.aiSubs || 0) + 1;
  L.events.push({ min: L.minute, type: "info", text: CLUBS[clubIdx].short + " make a substitution: " + inP.name + " comes on.", zh: CLUBS[clubIdx].short + " 換人調動：" + inP.name + " 後備入場。" });
  liveCacheDirty();
}

function genMinuteEvents(L) {
  const { H, A } = getLiveTeams(L);
  const out = [];
  const push = e => { e.min = L.minute; out.push(e); L.events.push(e); };
  for (const [T, O, clubIdx, home] of [[H, A, L.h, true], [A, H, L.a, false]]) {
    if (!T.xi.length) continue;
    if (rnd() < expGoals(T, O, home) / 93) {
      push(makeGoalEvent(T, clubIdx));
    }
    if (rnd() < 0.043) {
      const p = pickScorer(T);
      const k = Math.floor(rnd() * CHANCE_LINES.length);
      push({ type: "chance", clubIdx, pid: p.id, who: p.name,
             text: p.name + " " + CHANCE_LINES[k], zh: p.name + " " + CHANCE_LINES_ZH[k] });
    }
    if (rnd() < 0.0009) { // a penalty... missed!
      const p = pickScorer(T);
      const k = Math.floor(rnd() * PKMISS_LINES.length);
      push({ type: "pkmiss", clubIdx, pid: p.id, who: p.name,
             text: p.name + " " + PKMISS_LINES[k], zh: p.name + " " + PKMISS_LINES_ZH[k] });
    }
    if (rnd() < 0.0152) {
      const p = T.xi[Math.floor(rnd() * T.xi.length)];
      p.yellows++;
      if (p.yellows % 4 === 0) p.ban = Math.max(p.ban, 1);
      push({ type: "yellow", clubIdx, pid: p.id, who: p.name,
             text: p.name + " goes into the book.", zh: p.name + " 食黃牌，俾球證記咗名。" });
    }
    if (rnd() < 0.0007) {
      const p = T.xi[Math.floor(rnd() * T.xi.length)];
      p.ban = Math.max(p.ban, 2);
      L.reds[clubIdx] = (L.reds[clubIdx] || 0) + 1;
      removeFromXI(L, clubIdx, p.id);
      liveCacheDirty();
      const left = L[clubIdx === L.h ? "hXI" : "aXI"].length;
      push({ type: "red", clubIdx, pid: p.id, who: p.name,
             text: p.name + " is sent off! Straight red — down to " + left + " men.",
             zh: p.name + " 直接紅牌出場！場上得返 " + left + " 個人應戰。" });
    }
    if (rnd() < 0.0042 * (WEATHER[L.weather] || WEATHER.clear).inj) {
      const p = T.xi[Math.floor(rnd() * T.xi.length)];
      p.injury = 1 + Math.floor(rnd() * 4);
      removeFromXI(L, clubIdx, p.id);
      liveCacheDirty();
      push({ type: "injury", clubIdx, pid: p.id, who: p.name,
             text: p.name + " pulls up injured and cannot continue.", zh: p.name + " 受傷倒地，無法繼續作賽。" });
      aiAutoSub(L, clubIdx);
    }
  }
  return out;
}

function startMatchday() {
  if (G.week >= G.fixtures.length || G.live || dueEuro() || dueCup()) return;
  defaultExpectation();
  const my = G.myClub;
  G.lineup = validateLineup();
  const snapshot = snapshotStatuses();
  const fixtures = G.fixtures[G.week];
  let myFix = null;
  const otherResults = [];
  fixtures.forEach(([h, a], j) => {
    if (h === my || a === my) { myFix = [h, a]; return; }
    otherResults.push({ j, r: simMatch(h, a, {}) });
  });
  const home = myFix[0] === my;
  const oppIdx = home ? myFix[1] : myFix[0];
  const aiXI = bestXI(G.squads[oppIdx], "4-4-2");
  const L = {
    h: myFix[0], a: myFix[1],
    hXI: home ? [...G.lineup] : aiXI,
    aXI: home ? aiXI : [...G.lineup],
    hMent: home ? G.mentality : "Balanced",
    aMent: home ? "Balanced" : G.mentality,
    hForm: home ? G.formation : aiTactics(oppIdx).form,
    aForm: home ? aiTactics(oppIdx).form : G.formation,
    hStyle: home ? (G.style || "Balanced") : aiTactics(oppIdx).style,
    aStyle: home ? aiTactics(oppIdx).style : (G.style || "Balanced"),
    events: [{ min: 0, type: "info", text: "Kick-off!", zh: "開波！" }],
    elsewhere: [], otherResults, snapshot,
    minute: 0, phase: "first", subsUsed: 0, aiSubs: 0, windows: 0, winPending: false,
    manage: false, notice: null, speed: "normal",
    reds: {}, endMin: 91 + Math.floor(rnd() * 4),
    stats: { t: 0, hp: 0, hShots: 0, aShots: 0, hSot: 0, aSot: 0 },
  };
  L.hApp = [...L.hXI]; L.aApp = [...L.aXI];
  L.weather = getWeather();
  if (L.weather !== "clear") {
    L.events.push({ min: 0, type: "info", text: WEATHER[L.weather].icon + " Conditions: " + WEATHER[L.weather].name + " — " + WEATHER[L.weather].note, zh: wxLineZH(L.weather) });
  }
  // goals from the other grounds, as live ticker items
  for (const o of otherResults) {
    let hs = 0, as = 0;
    for (const e of [...o.r.events].filter(e => e.type === "goal").sort((x, y) => x.min - y.min)) {
      if (e.clubIdx === o.r.h) hs++; else as++;
      L.elsewhere.push({ min: e.min, type: "elsewhere",
        text: "GOAL elsewhere — " + CLUBS[o.r.h].short + " " + hs + "–" + as + " " + CLUBS[o.r.a].short + ": " + e.text,
        zh: "他場有波入 — " + CLUBS[o.r.h].short + " " + hs + "–" + as + " " + CLUBS[o.r.a].short + "：" + (e.zh || e.text) });
    }
  }
  G.live = L;
  liveCacheDirty();
  G.screen = "live";
  save();
  render(); // match begins paused at 0' — press ▶ Kick off when ready
}

function startTicker() {
  stopTicker();
  if (!G.live) return;
  const kickoff = G.live.minute === 0 && !G.live.kicked;
  tickTimer = setInterval(tickMinute, SPEEDS[G.live.speed || "normal"]);
  SND.startCrowd();
  if (kickoff) { G.live.kicked = true; SND.whistle(1); }
}
function stopTicker() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

function tickMinute() {
  const L = G.live;
  if (!L || L.manage || (L.phase !== "first" && L.phase !== "second")) { stopTicker(); return; }
  L.minute++;
  const fresh = genMinuteEvents(L);
  const freshElse = L.elsewhere.filter(e => e.min === L.minute);
  cueEvents(fresh);
  if (SND.crowd) { // the crowd warms up as the clock runs down a tight game
    const diff = Math.abs(liveGoals(L, L.h, 999) - liveGoals(L, L.a, 999));
    SND.setExcite(0.22 + L.minute / 320 + (diff <= 1 && L.minute > 70 ? 0.18 : 0));
  }
  // running match statistics
  if (L.stats) {
    const S = L.stats;
    const { H, A } = getLiveTeams(L);
    const pH = Math.pow(H.mid, 1.3) / (Math.pow(H.mid, 1.3) + Math.pow(A.mid, 1.3)) + 0.02 + (H.poss || 0) - (A.poss || 0);
    S.t++; if (rnd() < pH) S.hp++;
    for (const e of fresh) {
      if (e.type === "goal") { if (e.clubIdx === L.h) { S.hShots++; S.hSot++; } else { S.aShots++; S.aSot++; } }
      else if (e.type === "chance") {
        if (e.clubIdx === L.h) { S.hShots++; if (rnd() < 0.45) S.hSot++; }
        else { S.aShots++; if (rnd() < 0.45) S.aSot++; }
      }
      else if (e.type === "pkmiss") {
        if (e.clubIdx === L.h) { S.hShots++; S.hSot++; } else { S.aShots++; S.aSot++; }
      }
    }
    if (rnd() < 0.045) { S.hShots++; if (rnd() < 0.3) S.hSot++; }
    if (rnd() < 0.045) { S.aShots++; if (rnd() < 0.3) S.aSot++; }
  }
  // AI manager reacts on the hour: chase the game or shut up shop
  if (L.minute === 60) {
    const aiClub = G.myClub === L.h ? L.a : L.h;
    const aiGoals = liveGoals(L, aiClub, 999), myGoals = liveGoals(L, G.myClub, 999);
    const ment = aiGoals < myGoals ? "Attacking" : aiGoals - myGoals >= 2 ? "Defensive" : null;
    if (ment) {
      if (aiClub === L.h) L.hMent = ment; else L.aMent = ment;
      liveCacheDirty();
      L.events.push({ min: 60, type: "info", text: CLUBS[aiClub].short + (ment === "Attacking" ? " push players forward — they're chasing this." : " drop deep to protect their lead."), zh: CLUBS[aiClub].short + (ment === "Attacking" ? " 全隊壓上——佢哋要追返呢場波。" : " 全軍退守，力保領先優勢。") });
    }
  }
  if (L.phase === "first" && L.minute >= 45) {
    L.minute = 45; L.phase = "ht";
    L.events.push({ min: 45, type: "info", text: "Half-time. Time for the team talk.", zh: "半場休息，係時候同班球員講兩句。" });
    if (V) V.flash = { text: LANG === "zh" ? "半場" : "HALF-TIME", color: "#E8B33C", until: performance.now() + 2200 };
    SND.whistle(2);
    stopTicker(); save(); render(); return;
  }
  if (L.phase === "second" && L.minute >= L.endMin) {
    L.minute = L.endMin; L.phase = "ft";
    L.events.push({ min: L.endMin, type: "info", text: "Full time! The referee blows the whistle.", zh: "完場！球證鳴笛！" });
    if (V) V.flash = { text: LANG === "zh" ? "完場" : "FULL TIME", color: "#E8B33C", until: performance.now() + 2600 };
    SND.whistle(3); SND.stopCrowd();
    stopTicker(); save(); render(); return;
  }
  // your player went down or saw red — match pauses for your decision
  const incident = fresh.find(e => (e.type === "injury" || e.type === "red") && e.clubIdx === G.myClub);
  if (incident) {
    openManage(incident.type === "injury"
      ? incident.who + " cannot continue. You may substitute (this uses a window)."
      : incident.who + " has been sent off — no replacement allowed, you're down to " + L[myXIKey(L)].length + " men.");
    return;
  }
  if (L.minute % 5 === 0) save();
  updateLiveDom(fresh.length + freshElse.length > 0);
}

function openManage(notice) {
  const L = G.live;
  if (!L || (L.phase !== "first" && L.phase !== "second")) return;
  stopTicker();
  L.manage = true;
  L.notice = notice || null;
  save(); render();
}
function closeManage() {
  const L = G.live;
  if (!L) return;
  if (L.winPending) { L.windows++; L.winPending = false; }
  L.manage = false;
  L.notice = null;
  save(); render(); startTicker();
}

function updateLiveDom(hasNews) {
  const L = G.live;
  const elMin = document.getElementById("live-min");
  if (!elMin) { render(); return; }
  elMin.textContent = fmtMin(L.minute) + "' " + (WEATHER[L.weather] || WEATHER.clear).icon;
  const st = document.getElementById("live-stats");
  if (st) st.textContent = liveStatsLine(L);
  if (hasNews) {
    const sc = document.getElementById("live-score");
    const feed = document.getElementById("live-feed");
    const grounds = document.getElementById("live-grounds");
    if (sc) sc.innerHTML = liveScoreHtml(L);
    if (feed) feed.innerHTML = liveFeedHtml(L);
    if (grounds) grounds.innerHTML = liveGroundsHtml(L);
  }
}

function togglePlay() { if (tickTimer) stopTicker(); else startTicker(); render(); }
function setSpeed(s) {
  if (!G.live) return;
  G.live.speed = s;
  if (tickTimer) startTicker();
  save(); render();
}
function skipPhase() {
  const L = G.live;
  if (!L || L.manage) return;
  stopTicker();
  // simulate the remaining minutes one by one so every event still happens —
  // but stop early if an incident demands the manager's attention
  let guard = 0;
  const target = L.phase === "first" ? "ht" : "ft";
  while (G.live && G.live.phase !== target && G.live.phase !== "ft" && !G.live.manage && guard++ < 60) {
    tickMinute();
  }
}

function skipToEnd() {
  const L = G.live;
  if (!L || L.manage) return;
  stopTicker();
  let guard = 0;
  while (G.live && G.live.phase !== "ft" && !G.live.manage && guard++ < 160) {
    if (G.live.phase === "ht") { resumeSecondHalf(); stopTicker(); }
    else tickMinute();
  }
}

/* Substitutions: 5 per match, in up to 3 in-play windows. All subs made during
   one pause count as ONE window; half-time changes are free (real-world rule). */
function canSub() {
  const L = G.live;
  if (!L || L.subsUsed >= 5) return false;
  if (L.phase === "ht") return true;
  return L.windows < 3 || L.winPending; // an open window can take more subs
}
function noteSub(outName, inName) {
  const L = G.live;
  L.subsUsed++;
  if (L.phase !== "ht") L.winPending = true;
  L.events.push({ min: L.minute, type: "info",
    text: "🔁 " + CLUBS[G.myClub].short + " substitution: " + inName + " replaces " + outName + ".",
    zh: "🔁 " + CLUBS[G.myClub].short + " 換人：" + inName + " 入替 " + outName + "。" });
  liveCacheDirty();
  stopAnim(); // rebuild the pitch dots with the new personnel
  save(); render();
}
function htSub(outId, inId) {
  const L = G.live;
  if (!L || !inId || !canSub()) return;
  const key = myXIKey(L);
  const sq = G.squads[G.myClub];
  const outP = sq.find(p => p.id === outId), inP = sq.find(p => p.id === inId);
  if (!outP || !inP) return;
  L[key] = L[key].map(id => id === outId ? inId : id);
  (G.myClub === L.h ? L.hApp : L.aApp).push(inId);
  noteSub(outP.name, inP.name);
}
function htSubIn(inId) { // bring a player on when down a man through injury
  const L = G.live;
  if (!L || !inId || !canSub()) return;
  const key = myXIKey(L);
  if (L[key].length >= 11 - (L.reds[G.myClub] || 0)) return;
  const inP = G.squads[G.myClub].find(p => p.id === inId);
  if (!inP) return;
  L[key].push(inId);
  (G.myClub === L.h ? L.hApp : L.aApp).push(inId);
  noteSub("the injured player", inP.name);
}
function htMent(v) {
  const L = G.live;
  if (!L) return;
  if (G.myClub === L.h) L.hMent = v; else L.aMent = v;
  G.mentality = v;
  liveCacheDirty();
  if (L.phase === "first" || L.phase === "second") {
    L.events.push({ min: L.minute, type: "info", text: "📣 You switch to a " + v.toLowerCase() + " approach." });
  }
  save();
}
function htStyle(v) {
  const L = G.live;
  if (!L || !STYLES[v]) return;
  if (G.myClub === L.h) L.hStyle = v; else L.aStyle = v;
  G.style = v;
  liveCacheDirty();
  if (L.phase === "first" || L.phase === "second") {
    L.events.push({ min: L.minute, type: "info", text: "📣 Instructions from the bench: " + v + "." });
  }
  save();
}

function resumeSecondHalf() {
  const L = G.live;
  if (!L || L.phase !== "ht") return;
  // AI half-time team talk: adjust mentality and patch injury gaps
  const aiClub = G.myClub === L.h ? L.a : L.h;
  const aiKey = aiClub === L.h ? "hXI" : "aXI";
  const aiGoals = liveGoals(L, aiClub, 45), myGoals = liveGoals(L, G.myClub, 45);
  const ment = aiGoals < myGoals ? "Attacking" : aiGoals - myGoals >= 2 ? "Defensive" : "Balanced";
  if (aiClub === L.h) L.hMent = ment; else L.aMent = ment;
  while (L[aiKey].length < 11 - (L.reds[aiClub] || 0) && (L.aiSubs || 0) < 5) {
    const before = L[aiKey].length;
    aiAutoSub(L, aiClub);
    if (L[aiKey].length === before) break;
  }
  L.events.push({ min: 45, type: "info", text: "Second half under way.", zh: "下半場開始！" });
  L.phase = "second"; L.minute = 45;
  L.winPending = false;
  liveCacheDirty();
  stopAnim(); // rebuild the pitch view: substitutes on, sent-off players gone
  save(); render(); startTicker();
  SND.whistle(1);
}

/* ---------------- 2D pitch visualization ---------------- */
/* V holds visual-only state (dot/ball positions, cues) — never saved. */

let animId = null;
let V = null;

const LINE_X = { GK: 0.045, DF: 0.21, MF: 0.45, FW: 0.70 };
const PULL = { GK: 0.05, DF: 0.20, MF: 0.33, FW: 0.38 };

function buildVisual() {
  const L = G.live;
  if (!L) { V = null; return; }
  const [hCol, aCol] = kitColors(L.h, L.a);
  const players = [];
  const addSide = (clubIdx, xiIds, col, homeSide) => {
    const squad = G.squads[clubIdx];
    const xi = xiIds.map(id => squad.find(p => p.id === id)).filter(Boolean);
    for (const pos of ["GK", "DF", "MF", "FW"]) {
      const line = xi.filter(p => p.pos === pos);
      line.forEach((p, i) => {
        const lx = LINE_X[pos];
        const ax = homeSide ? lx : 1 - lx;
        const ay = 0.12 + 0.76 * ((i + 1) / (line.length + 1));
        players.push({ pid: p.id, club: clubIdx, pos: p.pos, col,
                       ax, ay, x: ax, y: ay, ph: rnd() * 6.28, off: false });
      });
    }
  };
  addSide(L.h, L.hXI, hCol, true);
  addSide(L.a, L.aXI, aCol, false);
  // average XI strength decides which half the ball drifts toward
  const str = ids => {
    const sq = ids === L.hXI ? G.squads[L.h] : G.squads[L.a];
    const xi = ids.map(id => sq.find(p => p.id === id)).filter(Boolean);
    return xi.reduce((s, p) => s + effRating(p), 0) / Math.max(1, xi.length);
  };
  V = {
    players, hCol, aCol,
    ball: { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 },
    bias: Math.max(-0.5, Math.min(0.5, (str(L.hXI) - str(L.aXI)) / 30)),
    nextDrift: 0, cues: [], cue: null, flash: null, lastTs: 0,
  };
}

function cueEvents(evts) {
  if (!V) return;
  for (const e of evts) {
    if (e.type === "goal" || e.type === "chance" || e.type === "yellow" || e.type === "red" || e.type === "injury" || e.type === "pkmiss") {
      V.cues.push(e);
    }
  }
  if (V.cues.length > 3) V.cues = V.cues.slice(-2); // fast speed: drop stale choreography
}

function startCue(e, now) {
  const L = G.live;
  const homeAttacks = e.clubIdx === L.h;
  SND.cue(e);
  if (e.type === "goal" || e.type === "chance" || e.type === "pkmiss") {
    V.cue = { e, start: now, dur: e.type === "goal" ? 1500 : 1000,
              gx: homeAttacks ? 0.965 : 0.035, gy: 0.42 + rnd() * 0.16 };
    if (e.type === "goal") {
      V.flash = { text: (LANG === "zh" ? "入咗呀！" : "GOAL! ") + e.who, color: "#2EAE6A", until: now + 1900 };
    } else if (e.type === "pkmiss") {
      V.flash = { text: (LANG === "zh" ? "❌ 十二碼宴客 — " : "❌ PENALTY MISSED — ") + e.who, color: "#D85C4A", until: now + 1700 };
    }
  } else {
    V.cue = { e, start: now, dur: 900 };
    const icons = { yellow: "🟨", red: "🟥", injury: "🚑" };
    V.flash = { text: icons[e.type] + " " + (e.who || ""), color: e.type === "yellow" ? "#E8B33C" : "#D85C4A", until: now + 1500 };
  }
}

function endCue() {
  const e = V.cue.e;
  if (e.type === "goal") { V.ball.x = 0.5; V.ball.y = 0.5; V.ball.tx = 0.5; V.ball.ty = 0.5; }
  if (e.type === "red" || e.type === "injury") {
    const dot = V.players.find(p => p.pid === e.pid);
    if (dot) dot.off = true; // walks off the pitch
  }
  V.cue = null;
}

function stepAnim(ts) {
  animId = null;
  if (!G || G.screen !== "live" || !G.live) { V = null; SND.stopCrowd(); return; }
  if (!V) buildVisual();
  const dt = Math.min(0.05, (ts - (V.lastTs || ts)) / 1000);
  V.lastTs = ts;
  const playing = tickTimer != null;
  const L = G.live;

  // cue scheduling
  if (!V.cue && V.cues.length) startCue(V.cues.shift(), ts);
  if (V.cue) {
    const c = V.cue, t = ts - c.start;
    if (c.e.type === "goal" || c.e.type === "chance") {
      if (t < c.dur * 0.55) { V.ball.tx = c.gx; V.ball.ty = c.gy; }
      else if (c.e.type === "chance" || c.e.type === "pkmiss") { V.ball.tx = c.gx > 0.5 ? c.gx - 0.18 : c.gx + 0.18; V.ball.ty = c.gy < 0.5 ? 0.12 : 0.88; }
    }
    if (t >= c.dur) endCue();
  } else if (playing && ts > V.nextDrift) {
    // open play: ball drifts, biased toward the stronger side's attacking end
    V.ball.tx = Math.max(0.05, Math.min(0.95, 0.5 + V.bias * 0.35 + (rnd() - 0.5) * 0.85));
    V.ball.ty = 0.12 + 0.76 * rnd();
    V.nextDrift = ts + 900 + rnd() * 1300;
  }

  // ball movement (faster during a goal rush)
  const bSpeed = V.cue && V.cue.e.type === "goal" ? 7.5 : 3.6;
  V.ball.x += (V.ball.tx - V.ball.x) * Math.min(1, dt * bSpeed);
  V.ball.y += (V.ball.ty - V.ball.y) * Math.min(1, dt * bSpeed);

  // players: anchor + pull toward ball + gentle jogging
  for (const p of V.players) {
    let tx, ty;
    if (p.off) { tx = p.x > 0.5 ? 1.06 : -0.06; ty = p.y; } // leaving the field
    else {
      const pull = PULL[p.pos];
      tx = p.ax + (V.ball.x - p.ax) * pull;
      ty = (p.pos === "GK" ? 0.5 + (V.ball.y - 0.5) * 0.3 : p.ay + (V.ball.y - p.ay) * pull);
      if (playing) { tx += Math.sin(ts / 900 + p.ph) * 0.012; ty += Math.cos(ts / 800 + p.ph) * 0.014; }
    }
    p.x += (tx - p.x) * Math.min(1, dt * 2.6);
    p.y += (ty - p.y) * Math.min(1, dt * 2.6);
  }

  drawPitch(ts);
  animId = requestAnimationFrame(stepAnim);
}

function paintPitchBG(x, W, H, M) {
  // grass with mown stripes
  x.fillStyle = "#2C8A4D"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#2F9355";
  for (let i = 0; i < 10; i += 2) x.fillRect(M + i * (W - 2 * M) / 10, M, (W - 2 * M) / 10, H - 2 * M);
  // markings
  x.strokeStyle = "rgba(255,255,255,0.85)"; x.lineWidth = 2;
  x.strokeRect(M, M, W - 2 * M, H - 2 * M);
  x.beginPath(); x.moveTo(W / 2, M); x.lineTo(W / 2, H - M); x.stroke();
  x.beginPath(); x.arc(W / 2, H / 2, (H - 2 * M) * 0.14, 0, 6.29); x.stroke();
  const boxH = (H - 2 * M) * 0.55, boxW = (W - 2 * M) * 0.16;
  const sixH = (H - 2 * M) * 0.26, sixW = (W - 2 * M) * 0.06;
  for (const left of [true, false]) {
    const bx = left ? M : W - M - boxW;
    const sx = left ? M : W - M - sixW;
    x.strokeRect(bx, (H - boxH) / 2, boxW, boxH);
    x.strokeRect(sx, (H - sixH) / 2, sixW, sixH);
    const gx = left ? M - 7 : W - M;
    x.fillStyle = "rgba(255,255,255,0.9)";
    x.fillRect(gx, H / 2 - (H - 2 * M) * 0.09, 7, (H - 2 * M) * 0.18);
  }
}

function drawPitch(ts) {
  const c = document.getElementById("pitch");
  if (!c || !c.getContext) return;
  const x = c.getContext("2d");
  if (!x) return;
  const W = c.width, H = c.height, M = 22;
  const px = nx => M + nx * (W - 2 * M);
  const py = ny => M + ny * (H - 2 * M);
  paintPitchBG(x, W, H, M);
  // players
  for (const p of V.players) {
    if (p.x < -0.04 || p.x > 1.04) continue; // fully walked off
    x.beginPath();
    x.arc(px(p.x), py(p.y), 8, 0, 6.29);
    x.fillStyle = p.col;
    x.fill();
    x.lineWidth = 1.6;
    x.strokeStyle = p.pos === "GK" ? "#FFD34D" : "#FFFFFF";
    x.stroke();
  }
  // ball
  x.beginPath();
  x.arc(px(V.ball.x), py(V.ball.y), 4.6, 0, 6.29);
  x.fillStyle = "#FFFFFF"; x.fill();
  x.lineWidth = 1.2; x.strokeStyle = "#1F1B16"; x.stroke();
  // flash overlay
  if (V.flash && performance.now() < V.flash.until) {
    x.fillStyle = "rgba(16,24,31,0.55)";
    x.fillRect(0, H / 2 - 34, W, 68);
    x.font = "bold 34px 'Segoe UI', sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = V.flash.color || "#fff";
    x.fillText(V.flash.text, W / 2, H / 2);
  }
}

function ensureAnim() {
  if (typeof requestAnimationFrame !== "function") return;
  if (!V) buildVisual();
  if (!animId) animId = requestAnimationFrame(stepAnim);
}
function stopAnim() {
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  V = null;
}

/* ---------------- Goal-highlight replays ----------------
   Broadcast-style reel on the match report: every goal is re-enacted from the
   event data — build-up passes, the finish, and a caption. Works for live AND
   quick-simmed matches, since it choreographs from the result, not a recording. */
let HL = null; // reel state, visual-only — never saved

function goalScene(e) {
  const right = e.clubIdx === HL.r.h; // home attacks the right-hand goal
  const X = f => right ? f : 1 - f;
  const gy = 0.40 + rnd() * 0.2;
  const pts = [
    { x: X(0.32 + rnd() * 0.08), y: 0.2 + rnd() * 0.6 },
    { x: X(0.54 + rnd() * 0.08), y: 0.18 + rnd() * 0.64 },
    { x: X(0.71 + rnd() * 0.06), y: gy < 0.5 ? 0.6 + rnd() * 0.22 : 0.16 + rnd() * 0.22 },
    { x: X(0.81 + rnd() * 0.05), y: gy + (rnd() - 0.5) * 0.16 },
  ];
  const atk = e.clubIdx === HL.r.h ? HL.hCol : HL.aCol;
  const def = e.clubIdx === HL.r.h ? HL.aCol : HL.hCol;
  // supporting cast: runners arriving in the box, defenders backpedalling
  const runners = pts.slice(0, 3).map(p => ({
    sx: p.x - (right ? 0.08 : -0.08), sy: Math.max(0.08, Math.min(0.92, p.y + (rnd() - 0.5) * 0.3)),
    tx: X(0.78 + rnd() * 0.1), ty: 0.3 + rnd() * 0.4 }));
  const backs = [0, 1, 2, 3].map(i => ({
    sx: X(0.62 + rnd() * 0.16), sy: 0.15 + 0.7 * (i / 3) + (rnd() - 0.5) * 0.08,
    tx: X(0.86 + rnd() * 0.06), ty: gy + (i - 1.5) * 0.13 }));
  return { e, right, pts, gy, atk, def, roared: false,
           goal: { x: right ? 0.985 : 0.015, y: gy }, runners, backs };
}

const HL_SEG = 760;             // ms per pass (slow-mo feel)
const HL_SHOT = 480, HL_NET = 1900;
function hlSceneLen() { return HL_SEG * 3 + HL_SHOT + HL_NET; }

function nextHighlight(now) {
  HL.i++;
  if (HL.i >= HL.goals.length) {
    HL.done = true; HL.t0 = now;
    SND.whistle(3);
    setTimeout(() => SND.stopCrowd(), 1200);
    const btn = document.getElementById("hl-btn");
    if (btn) { btn.style.display = ""; btn.textContent = "↺ Watch again"; }
    return;
  }
  const e = HL.goals[HL.i];
  HL.scene = goalScene(e);
  HL.t0 = now;
}

function startHighlights() {
  const r = G.lastMatch;
  if (!r || G.screen !== "matchResult") return;
  const goals = r.events.filter(e => e.type === "goal" && e.clubIdx !== undefined)
                        .sort((a, b) => a.min - b.min);
  if (!goals.length) return;
  const [hCol, aCol] = kitColors(r.h, r.a);
  HL = { r, goals, hCol, aCol, i: -1, scene: null, t0: 0, hs: 0, as: 0, done: false };
  const box = document.getElementById("hl-box");
  if (box) box.style.display = "block";
  const btn = document.getElementById("hl-btn");
  if (btn) btn.style.display = "none";
  SND.startCrowd(); SND.setExcite(0.45);
  nextHighlight(performance.now());
  if (typeof requestAnimationFrame === "function") requestAnimationFrame(stepHL);
}

function skipHighlight() {
  if (!HL || HL.done) return;
  if (HL.scene) { // count the skipped goal so the scoreboard stays honest
    if (HL.scene.e.clubIdx === HL.r.h) HL.hs++; else HL.as++;
  }
  nextHighlight(performance.now());
}

function hlEase(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function stepHL(ts) {
  if (!HL || G.screen !== "matchResult") { HL = null; SND.stopCrowd(); return; }
  const c = document.getElementById("hl-pitch");
  if (!c || !c.getContext) { HL = null; SND.stopCrowd(); return; }
  const x = c.getContext("2d");
  const W = c.width, H = c.height, M = 22;
  const px = nx => M + nx * (W - 2 * M);
  const py = ny => M + ny * (H - 2 * M);
  paintPitchBG(x, W, H, M);

  if (HL.done) { // closing card: the final score, held on screen
    x.fillStyle = "rgba(16,24,31,0.72)"; x.fillRect(0, H / 2 - 60, W, 120);
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#fff";
    x.font = "bold 38px 'Segoe UI', sans-serif";
    x.fillText(CLUBS[HL.r.h].short + "  " + HL.r.hg + " – " + HL.r.ag + "  " + CLUBS[HL.r.a].short, W / 2, H / 2 - 14);
    x.font = "16px 'Segoe UI', sans-serif"; x.fillStyle = "#E8B33C";
    x.fillText(LANG === "zh" ? "完場 — 精華播放完畢" : "FULL TIME — THAT'S THE REEL", W / 2, H / 2 + 26);
    return; // the loop ends here; ↺ Watch again restarts it
  }

  const S = HL.scene, t = ts - HL.t0;
  const passEnd = HL_SEG * 3, shotEnd = passEnd + HL_SHOT;
  let bx, by;
  if (t < passEnd) {
    const seg = Math.min(2, Math.floor(t / HL_SEG));
    const f = hlEase((t - seg * HL_SEG) / HL_SEG);
    bx = S.pts[seg].x + (S.pts[seg + 1].x - S.pts[seg].x) * f;
    by = S.pts[seg].y + (S.pts[seg + 1].y - S.pts[seg].y) * f;
  } else if (t < shotEnd) {
    const f = (t - passEnd) / HL_SHOT;
    bx = S.pts[3].x + (S.goal.x - S.pts[3].x) * f;
    by = S.pts[3].y + (S.goal.y - S.pts[3].y) * f;
    if (!S.roared) { S.roared = true; SND.roar(S.e.clubIdx === G.myClub); }
  } else { bx = S.goal.x; by = S.goal.y; }

  const prog = Math.min(1, t / shotEnd);
  // defenders scrambling back, then the attacking runners
  for (const d of S.backs) {
    x.beginPath(); x.arc(px(d.sx + (d.tx - d.sx) * prog), py(d.sy + (d.ty - d.sy) * prog), 8, 0, 6.29);
    x.fillStyle = S.def; x.fill(); x.lineWidth = 1.6; x.strokeStyle = "#FFFFFF"; x.stroke();
  }
  // their goalkeeper tracks the ball, rooted to the line
  x.beginPath(); x.arc(px(S.right ? 0.955 : 0.045), py(0.5 + (by - 0.5) * 0.55), 8, 0, 6.29);
  x.fillStyle = S.def; x.fill(); x.lineWidth = 1.6; x.strokeStyle = "#FFD34D"; x.stroke();
  for (const a of S.runners) {
    x.beginPath(); x.arc(px(a.sx + (a.tx - a.sx) * prog), py(a.sy + (a.ty - a.sy) * prog), 8, 0, 6.29);
    x.fillStyle = S.atk; x.fill(); x.lineWidth = 1.6; x.strokeStyle = "#FFFFFF"; x.stroke();
  }
  // the man on the ball: tip of the move so far
  x.beginPath(); x.arc(px(bx + (S.right ? -0.016 : 0.016)), py(by + 0.02), 8, 0, 6.29);
  x.fillStyle = S.atk; x.fill(); x.lineWidth = 2; x.strokeStyle = "#FFD34D"; x.stroke();
  // ball
  x.beginPath(); x.arc(px(bx), py(by), 4.6, 0, 6.29);
  x.fillStyle = "#FFFFFF"; x.fill(); x.lineWidth = 1.2; x.strokeStyle = "#1F1B16"; x.stroke();

  // REPLAY watermark + running score chyron
  x.textBaseline = "middle";
  x.font = "bold 13px 'Segoe UI', sans-serif"; x.textAlign = "left";
  x.fillStyle = "rgba(255,255,255,0.85)";
  x.fillText(LANG === "zh" ? "⏺ 重播 — 第 " + (HL.i + 1) + "/" + HL.goals.length + " 球" : "⏺ REPLAY — goal " + (HL.i + 1) + " of " + HL.goals.length, M + 6, 13);
  x.textAlign = "right";
  x.fillText(CLUBS[HL.r.h].short + " " + HL.hs + "–" + HL.as + " " + CLUBS[HL.r.a].short, W - M - 6, 13);

  if (t >= shotEnd) { // GOAL caption
    x.fillStyle = "rgba(16,24,31,0.6)"; x.fillRect(0, H / 2 - 34, W, 68);
    x.font = "bold 30px 'Segoe UI', sans-serif"; x.textAlign = "center";
    x.fillStyle = "#2EAE6A";
    x.fillText("⚽ " + S.e.min + "' " + (S.e.who || "GOAL") + " — " + CLUBS[S.e.clubIdx].short, W / 2, H / 2);
  }
  if (t >= shotEnd + HL_NET) {
    if (S.e.clubIdx === HL.r.h) HL.hs++; else HL.as++;
    nextHighlight(ts);
  }
  requestAnimationFrame(stepHL);
}

function finishLiveMatch() {
  const L = G.live;
  if (!L || (L.phase !== "ft" && L.phase !== "pens")) return;
  const hg = liveGoals(L, L.h, 999), ag = liveGoals(L, L.a, 999);
  // a drawn knockout tie goes to penalties — live and kick by kick
  const isKO = !!L.cupFix || (L.euro && L.fix && L.fix.kind !== "league");
  if (hg === ag && isKO && !L.pens) {
    const myIds = G.myClub === L.h ? L.hXI : L.aXI;
    const opIds = G.myClub === L.h ? L.aXI : L.hXI;
    const oppClub = G.myClub === L.h ? L.a : L.h;
    L.pens = { so: simShootoutClubs(G.myClub, oppClub, myIds, opIds), shown: 0 };
    L.phase = "pens";
    if (V) V.flash = { text: LANG === "zh" ? "互射十二碼" : "PENALTIES", color: "#E8B33C", until: performance.now() + 2000 };
    save(); render(); startPensTimer();
    return;
  }
  if (L.phase === "pens" && L.pens && L.pens.shown < L.pens.so.kicks.length) return; // still being taken
  SND.stopCrowd();
  const myRes = { h: L.h, a: L.a, hg, ag,
    events: L.events.filter(e => e.type !== "chance" && e.type !== "info") };
  if (L.stats) {
    const S = L.stats;
    myRes.stats = { poss: S.t ? Math.round(S.hp / S.t * 100) : 50,
                    hShots: S.hShots, hSot: S.hSot, aShots: S.aShots, aSot: S.aSot };
  }
  myRes.weather = L.weather;
  myRes.ratings = matchRatings(L.h, L.a, L.hApp, L.aApp, myRes.events, hg, ag);
  const weekResults = (L.euro || L.cupFix) ? null : G.fixtures[G.week].map((f, j) => {
    const o = L.otherResults.find(x => x.j === j);
    return o ? o.r : myRes;
  });
  // post-match fitness & form for everyone who appeared in the live match
  const res = hg > ag ? 1 : hg < ag ? -1 : 0;
  const apply = (clubIdx, appIds, sign) => {
    const sq = G.squads[clubIdx];
    const app = new Set(appIds);
    const drain = (STYLES[clubIdx === L.h ? (L.hStyle || "Balanced") : (L.aStyle || "Balanced")] || STYLES.Balanced).drain;
    for (const p of sq) {
      if (app.has(p.id)) {
        p.apps++;
        p.fitness = Math.max(20, p.fitness - Math.round((10 + Math.floor(rnd() * 8)) * drain));
        p.form = Math.max(-2, Math.min(2, p.form + (sign > 0 ? 1 : sign < 0 ? -1 : 0) * (rnd() < 0.6 ? 1 : 0)));
      }
    }
  };
  apply(L.h, L.hApp, res);
  apply(L.a, L.aApp, -res);
  if (L.euro) { commitEuro(L.fix, myRes, L.pens ? L.pens.so : undefined); return; }
  if (L.cupFix) { commitCup(L.cupFix, myRes, L.pens ? L.pens.so : undefined); return; }
  commitWeek(weekResults, myRes, L.snapshot);
}

/* ---------------- League table ---------------- */

function tableStats() {
  const t = G.league.map(i => ({ i, name: CLUBS[i].name, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, form: [] }));
  const byClub = {};
  for (const row of t) byClub[row.i] = row;
  for (const week of G.results) {
    for (const r of week) {
      const H = byClub[r.h], A = byClub[r.a];
      if (!H || !A) continue;
      H.p++; A.p++; H.gf += r.hg; H.ga += r.ag; A.gf += r.ag; A.ga += r.hg;
      if (r.hg > r.ag) { H.w++; A.l++; H.pts += 3; H.form.push("W"); A.form.push("L"); }
      else if (r.hg < r.ag) { A.w++; H.l++; A.pts += 3; A.form.push("W"); H.form.push("L"); }
      else { H.d++; A.d++; H.pts++; A.pts++; H.form.push("D"); A.form.push("D"); }
    }
  }
  t.sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || x.name.localeCompare(y.name));
  return t;
}

function topScorers(n) {
  const all = [];
  G.league.forEach(ci => G.squads[ci].forEach(p => { if (p.goals > 0) all.push({ p, club: CLUBS[ci].short }); }));
  all.sort((a, b) => b.p.goals - a.p.goals || a.p.name.localeCompare(b.p.name));
  return all.slice(0, n);
}

/* ---------------- Season transition ---------------- */

function nextSeason(newClub) {
  ghQueueSync();
  // European qualification comes from this season's final table (before the league swap)
  const finalT = tableStats();
  const myFinalPos = finalT.findIndex(r => r.i === G.myClub) + 1;
  // career history for the hall of fame
  G.career = G.career || [];
  G.career.push({ s: G.season, club: CLUBS[G.myClub].name, pos: myFinalPos,
    notes: (G.honours || []).filter(h => h.startsWith("Season " + G.season + ":")).map(h => h.split(": ")[1]).join(", ") });
  // promotion & relegation: swap the three relegated clubs for the promoted ones
  const releg = G.relegated || [];
  const promo = G.promoted || [];
  const nextLeague = G.league.map(i => {
    const k = releg.indexOf(i);
    return k >= 0 ? promo[k] : i;
  });
  let movedClub = false;
  if (releg.includes(G.myClub)) {
    if (typeof newClub !== "number" || !nextLeague.includes(newClub)) return; // must pick a new job first
    G.myClub = newClub;
    movedClub = true;
  }
  G.league = nextLeague;
  delete G.relegated; delete G.promoted;
  // transfer budget: club stature + prize money + European earnings + half of what's unspent
  const euroPrize = G.euro ? ({ UCL: 25, UEL: 12, UECL: 6 }[G.euro.comp] || 0) * (G.euro.stage === "won" ? 2 : 1) : 0;
  const leaguePrize = (PL_SIZE - myFinalPos) * 2;
  // sponsorship: performance bonuses for the finished season, then the deal ages a year
  let sponsorIncome = 0;
  if (G.sponsor && !movedClub) {
    const sp = G.sponsor;
    const myRow = finalT.find(r => r.i === G.myClub);
    const trophies = (G.honours || []).filter(h => h.startsWith("Season " + G.season + ":")).length;
    const bonus = Math.round((sp.winBonus || 0) * (myRow ? myRow.w : 0) + (myFinalPos <= 4 ? sp.top4Bonus || 0 : 0) + (sp.trophyBonus || 0) * trophies);
    sp.years--;
    if (sp.years > 0) {
      sponsorIncome = sp.base + bonus;
      G.youthNews = G.youthNews || [];
    } else {
      sponsorIncome = bonus;
    }
    G.sponsorNews = "💼 " + sp.name + ": " + (bonus ? "£" + bonus + "M in performance bonuses" : "no bonuses earned") +
      (sp.years > 0 ? " + £" + sp.base + "M for the new season (" + sp.years + "y left)" : " — the deal has EXPIRED; new offers are on the table");
    if (sp.years <= 0) { G.sponsor = null; G.sponsorOffers = null; }
  } else if (movedClub) {
    G.sponsor = null; G.sponsorOffers = null; G.sponsorNews = null;
  }
  G.budget = Math.round((movedClub ? 0 : (G.budget || 0) * 0.5) + 20 + (CLUBS[G.myClub].base - 70) * 8 + (movedClub ? 0 : leaguePrize + euroPrize + sponsorIncome));
  resolveEuroRivals();
  initEuro(movedClub ? null : myFinalPos <= 4 ? "UCL" : myFinalPos === 5 ? "UEL" : myFinalPos === 6 ? "UECL" : null);
  assignEuroRivals(finalT);
  initCups();
  const newExp = expectedPos(G.myClub);
  G.board = { exp: newExp, grace: 6, chosen: false,
    conf: Math.max(30, Math.min(85, movedClub ? 60 : 55 + (G.board ? (G.board.exp - myFinalPos) * 1.5 : 0))) };
  // player development, retirements, and academy intakes — the league renews itself
  G.youthNews = [];
  for (let ci = 0; ci < EURO_SLOT; ci++) {
    const squad = G.squads[ci];
    const mine = ci === G.myClub;
    // development: young players grow toward their potential, faster with playing time
    for (const p of squad) {
      const wasOnLoan = mine && p.loan;
      const appsBefore = wasOnLoan ? 28 : p.apps; // regular football at the loan club
      p.age++;
      p.years = (p.years === undefined ? 2 : p.years) - 1;
      if (p.wage === undefined) p.wage = wageFor(p.rating, p.age);
      if (p.pot === undefined) p.pot = potentialFor(p.rating, p.age);
      if (p.age >= 32) {
        p.rating = Math.max(55, p.rating - (p.age >= 35 ? 2 : 1));
      } else if (p.rating < p.pot) {
        const appsF = appsBefore >= 25 ? 1.0 : appsBefore >= 10 ? 0.7 : 0.5;
        const youthF = p.age <= 19 ? 3 : p.age <= 21 ? 2.2 : p.age <= 23 ? 1.6 : 1.0;
        const gain = Math.min(p.pot - p.rating, Math.round(youthF * appsF * (0.6 + rnd() * 0.8)));
        if (gain > 0) {
          p.rating += gain;
          if (wasOnLoan) G.youthNews.push("↩ " + p.name + " returns from his loan at " + p.loan + " a better player (" + (p.rating - gain) + " → " + p.rating + ")");
          else if (mine && gain >= 3) G.youthNews.push("📈 " + p.name + " has developed superbly (" + (p.rating - gain) + " → " + p.rating + ")");
        } else if (wasOnLoan) {
          G.youthNews.push("↩ " + p.name + " returns from his loan at " + p.loan + ".");
        }
      } else if (wasOnLoan) {
        G.youthNews.push("↩ " + p.name + " returns from his loan at " + p.loan + ".");
      }
      if (mine) p.loan = null;
      p.goals = 0; p.assists = 0; p.apps = 0; p.yellows = 0; p.form = 0; p.fitness = 100; p.injury = 0; p.ban = 0;
    }
    // retirements
    for (const p of [...squad]) {
      if (p.age >= 34 && rnd() < (p.age - 33) * 0.35) {
        G.squads[ci] = G.squads[ci].filter(x => x.id !== p.id);
        if (mine) G.youthNews.push("👋 " + p.name + " (" + p.age + ") has retired. A fine servant to the club.");
      }
    }
    // contracts: your expired players walk for free; AI clubs quietly renew
    for (const p of [...G.squads[ci]]) {
      if ((p.years || 0) > 0) continue;
      if (mine) {
        G.squads[ci] = G.squads[ci].filter(x => x.id !== p.id);
        G.youthNews.push("📄 " + p.name + " left on a FREE transfer — his contract expired un-renewed.");
      } else {
        p.years = 2 + Math.floor(rnd() * 3);
        p.wage = wageFor(p.rating, p.age);
      }
    }
    // academy intake: 2-3 graduates, occasionally a wonderkid.
    // The academy answers the club's needs: short of keepers? It promotes a keeper.
    const promoteGrad = () => {
      const targets = { GK: 2, DF: 6, MF: 6, FW: 4 };
      const cntPos = q => G.squads[ci].filter(x => x.pos === q).length;
      let pos = null, worst = 0;
      for (const q of ["GK", "DF", "MF", "FW"]) {
        const d = targets[q] - cntPos(q);
        if (d > worst) { worst = d; pos = q; }
      }
      if (!pos) pos = ["DF", "DF", "MF", "MF", "FW", "GK"][Math.floor(rnd() * 6)];
      const rating = 56 + Math.floor(rnd() * 9) + Math.round((CLUBS[ci].base - 70) / 3);
      const grad = makePlayer(YOUTH_FIRST[Math.floor(rnd() * YOUTH_FIRST.length)] + " " + YOUTH_LAST[Math.floor(rnd() * YOUTH_LAST.length)],
                              pos, rating, 16 + Math.floor(rnd() * 3));
      grad.pot = Math.min(94, rating + 8 + Math.floor(rnd() * 19));
      G.squads[ci].push(grad);
      return grad;
    };
    const n = 2 + (rnd() < 0.5 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const grad = promoteGrad();
      if (mine) G.youthNews.push("🎓 Academy graduate: " + grad.name + " (" + grad.pos + ", " + grad.age + ")" +
        (grad.pot >= 88 ? " — ✨ the coaches say he could be a wonderkid" : ""));
    }
    // emergency promotions: if free transfers and retirements have left the
    // first team threadbare, the academy steps up so a season is always playable
    if (mine) {
      let guard = 0;
      while (G.squads[ci].length < 15 && guard++ < 12) {
        const grad = promoteGrad();
        G.youthNews.push("🚨 Emergency promotion: " + grad.name + " (" + grad.pos + ", " + grad.age + ") — too many contracts ran out, and the kids must fill the gaps.");
      }
    }
    // AI clubs trim their squads; you manage your own
    if (!mine) {
      while (G.squads[ci].length > 22) {
        const candidates = [...G.squads[ci]].sort((x, y) =>
          (x.rating + (x.pot - x.rating) * 0.4 - (x.age >= 29 ? 2 : 0)) -
          (y.rating + (y.pot - y.rating) * 0.4 - (y.age >= 29 ? 2 : 0)));
        let cutDone = false;
        const floor = { GK: 2, DF: 5, MF: 5, FW: 3 };
        for (const cut of candidates) {
          // only the released player's own position must stay above its floor —
          // an unrelated shortage elsewhere shouldn't block every release
          const remaining = G.squads[ci].filter(x => x.pos === cut.pos && x.id !== cut.id).length;
          if (remaining >= floor[cut.pos]) {
            G.squads[ci] = G.squads[ci].filter(x => x.id !== cut.id);
            cutDone = true;
            break;
          }
        }
        if (!cutDone) break;
      }
    }
  }
  G.season++; G.week = 0; G.results = [];
  setWageCap();
  G.fixtures = leagueFixtures(G.league);
  G.lineup = bestXI(G.squads[G.myClub], G.formation);
  G.screen = "main"; G.tab = "squad"; G.lastMatch = null;
  save();
  render();
}

/* ---------------- Persistence ---------------- */

function save() {
  try { if (G) G.savedAt = Date.now(); localStorage.setItem("touchline_save", JSON.stringify({ ...G, nextId })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem("touchline_save");
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.ver === 2) { // migrate: add the Championship pool + league list
      nextId = data.nextId || 1000;
      data.league = [...Array(PL_SIZE).keys()];
      while (data.squads.length < CLUBS.length) data.squads.push(genSquad(data.squads.length));
      data.nextId = nextId;
      data.ver = 3;
    }
    if (data.ver === 3) { data.ver = 4; data.euro = null; data.honours = []; }
    if (data.ver === 4) { data.ver = 5; data.live = null; } // old pre-simulated matches can't resume
    if (data.ver === 5) {
      data.ver = 6;
      data.budget = 20 + (CLUBS[data.myClub].base - 70) * 8;
      data.deals = []; data.dealsKey = null; data.tfFilter = "All";
    }
    if (data.ver === 6) {
      data.ver = 7;
      data.cups = null; // initialised below once G is set
    }
    if (data.ver === 7) {
      data.ver = 8;
      data.board = null; // initialised below once G is set
    }
    if (data.ver === 8) {
      data.ver = 9;
      for (const squad of data.squads) for (const p of squad) {
        if (p.pot === undefined) p.pot = Math.min(94, p.rating +
          (p.age <= 20 ? 8 : p.age <= 23 ? 5 : p.age <= 27 ? 2 : 0));
        if (p.assists === undefined) p.assists = 0;
      }
      data.youthNews = [];
    }
    if (data.ver === 9) {
      data.ver = 10;
      // old 4-team group format can't be carried into the Swiss model mid-campaign
      if (data.euro && !data.euro.format) data.euro = { legacyComp: data.euro.comp, legacyStage: data.euro.stage };
    }
    if (data.ver !== 10) return false; // save from an older game version
    nextId = data.nextId || 1000;
    delete data.nextId;
    G = data;
    const guest = G.guestClub || (G.euro && G.euro.opp);
    if (guest) { // restore the visiting-opposition slot (European or cup minnow)
      CLUBS[EURO_SLOT].name = guest.name;
      CLUBS[EURO_SLOT].short = guest.short;
      CLUBS[EURO_SLOT].base = guest.base;
      CLUBS[EURO_SLOT].col = guest.col;
    }
    if (!G.cups || !G.cups.lc.remaining) { // older formats join fresh brackets mid-season
      initCups();
      for (const key of ["lc", "fa"]) {
        const c = G.cups[key];
        while (c.rounds[c.r] && c.rounds[c.r].week < G.week) {
          // fast-forward passed rounds: the field shrinks, you get byes
          const others = c.remaining.filter(e => e.kind !== "me");
          const rd = simCupRound(others);
          c.history.push({ label: c.rounds[c.r].label, myTie: CLUBS[G.myClub].name + " — bye", ties: rd.ties });
          c.remaining = rd.survivors.concat([{ kind: "me" }]);
          c.r++;
        }
        if (c.r >= c.rounds.length) c.alive = "out";
      }
    }
    if (!G.board) G.board = { conf: 65, exp: expectedPos(G.myClub), grace: G.week + 6, chosen: true };
    if (!G.style || !STYLES[G.style]) G.style = "Balanced";
    if (!FORMATIONS[G.formation]) G.formation = "4-4-2";
    for (const sq of G.squads) for (const p of sq) {
      if (p.wage === undefined) p.wage = wageFor(p.rating, p.age);
      if (p.years === undefined) p.years = 1 + Math.floor(Math.random() * 4);
    }
    if (!G.wcap) setWageCap();
    if (G.sponsor === undefined) { // older saves get a modest existing deal
      G.sponsor = { name: "Meridian Bank", base: sponsorRep(), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 2 };
    }
    if (G.euro && !G.euro.format) { // rebuild a legacy group-format campaign in the Swiss format
      const lc = G.euro.legacyComp, ls = G.euro.legacyStage;
      initEuro(lc || null);
      if (G.euro) {
        const E = G.euro;
        if (ls === "won" || ls === "out") {
          E.stage = ls;
        } else {
          // fast-forward matchdays whose weeks have already passed
          const wks = euroMDWeeks(E.comp);
          while (E.played < wks.length && wks[E.played] < G.week) {
            const cands = E.teams.filter(t => t.id !== "me" && !E.myOpps.includes(t.id));
            const pick = cands[Math.floor(rnd() * cands.length)];
            const me = E.teams.find(t => t.id === "me");
            const [g1, g2] = euroScore(CLUBS[G.myClub].base, euroBase(E, pick.id));
            me.gf += g1; me.ga += g2; pick.gf += g2; pick.ga += g1;
            if (g1 > g2) me.pts += 3; else if (g2 > g1) pick.pts += 3; else { me.pts++; pick.pts++; }
            const others = E.teams.filter(t => t.id !== "me" && t.id !== pick.id);
            while (others.length >= 2) {
              const a = others.splice(Math.floor(rnd() * others.length), 1)[0];
              const b = others.splice(Math.floor(rnd() * others.length), 1)[0];
              const [ga, gb] = euroScore(euroBase(E, a.id), euroBase(E, b.id));
              a.gf += ga; a.ga += gb; b.gf += gb; b.ga += ga;
              if (ga > gb) a.pts += 3; else if (gb > ga) b.pts += 3; else { a.pts++; b.pts++; }
            }
            E.myOpps.push(pick.id);
            E.played++;
          }
        }
      }
      save();
    }
    return true;
  } catch (e) { return false; }
}
/* Export/import the career as a file — backup, or move between devices.
   (The game also autosaves to this browser continuously.) */
function exportSave() {
  if (!G) return;
  save();
  const raw = localStorage.getItem("touchline_save");
  const a = document.createElement("a");
  a.href = "data:application/json;charset=utf-8," + encodeURIComponent(raw);
  a.download = "football-manager-save-season" + G.season + "-week" + G.week + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function importSaveText(text) {
  const backup = localStorage.getItem("touchline_save");
  try {
    const data = JSON.parse(text);
    if (!data || typeof data.ver !== "number" || !data.squads || !data.league || typeof data.myClub !== "number") {
      throw new Error("not a save");
    }
    localStorage.setItem("touchline_save", JSON.stringify(data));
    if (!load()) throw new Error("incompatible version");
    stopTicker(); stopAnim();
    if (G.live) {
      G.screen = "live";
      liveCacheDirty();
    } else {
      G.screen = G.week >= G.fixtures.length ? "seasonEnd" : "main";
    }
    save(); render();
    return true;
  } catch (e) {
    if (backup !== null) localStorage.setItem("touchline_save", backup);
    else localStorage.removeItem("touchline_save");
    render();
    alert("That file isn't a valid save (or comes from a newer version of the game). Your current career is untouched.");
    return false;
  }
}
function importSave(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importSaveText(String(r.result));
  r.readAsText(f);
  input.value = "";
}

/* ---------------- GitHub cloud save ---------------- */
/* The token is stored ONLY in this browser (separate from the save itself,
   so it is never included in exported save files). */

function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }
function b64decode(b) { return decodeURIComponent(escape(atob(b.replace(/\s/g, "")))); }

function ghCfg() {
  try { return JSON.parse(localStorage.getItem("touchline_gh") || "null"); } catch (e) { return null; }
}
function ghStatus(msg, good) {
  const el = document.getElementById("gh-status");
  if (el) { el.textContent = msg; el.style.color = good ? "var(--pitch)" : "var(--amber)"; }
}
function ghSaveCfgFromUI() {
  const repo = (document.getElementById("gh-repo").value || "").trim();
  const token = (document.getElementById("gh-token").value || "").trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { ghStatus("Repository should look like: yourname/football-manager", false); return; }
  if (!token) { ghStatus("Paste your access token first.", false); return; }
  const prev = ghCfg();
  localStorage.setItem("touchline_gh", JSON.stringify({ repo, token, auto: prev ? !!prev.auto : true }));
  ghStatus("Settings saved ✓ — press “Back up to GitHub now” to test the connection.", true);
  render(); // reflect the auto-sync checkbox state
}
function ghSetAuto(on) {
  const cfg = ghCfg();
  if (!cfg) { ghStatus("Save your repository and token first — then turn on auto-sync.", false); render(); return; }
  cfg.auto = !!on;
  localStorage.setItem("touchline_gh", JSON.stringify(cfg));
  ghStatus(on ? "Auto-sync ON ✓ — every match result is backed up, and the game checks the cloud at startup." : "Auto-sync off — use the manual buttons.", true);
  if (on) ghQueueSync();
}
function ghHeaders(cfg) {
  return { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
}
function ghUrl(cfg) {
  return "https://api.github.com/repos/" + cfg.repo + "/contents/football-manager-save.json";
}
let ghSyncTimer = null;
let ghLastSync = null; // { ok, msg, t } — session-only, never saved

function ghSyncNote(msg, good) {
  ghLastSync = { ok: !!good, msg, t: Date.now() };
  ghStatus(msg, good);
  const note = document.getElementById("cloud-note"); // footer line on the main screen
  if (note) note.textContent = "☁ " + msg;
}
function ghQueueSync() { // debounced: a burst of results becomes one commit
  const cfg = ghCfg();
  if (!cfg || !cfg.auto || !G) return;
  if (ghSyncTimer) clearTimeout(ghSyncTimer);
  ghSyncTimer = setTimeout(() => { ghSyncTimer = null; ghBackup(true); }, 2500);
}
async function ghBackup(silent) {
  const cfg = ghCfg();
  if (!cfg) { ghStatus("Enter your repository and token first, then press Save settings.", false); return; }
  if (!G) return;
  save();
  if (!silent) ghStatus("Backing up…", true);
  try {
    let sha;
    const probe = await fetch(ghUrl(cfg), { headers: ghHeaders(cfg) });
    if (probe.ok) sha = (await probe.json()).sha;
    const res = await fetch(ghUrl(cfg), {
      method: "PUT",
      headers: ghHeaders(cfg),
      body: JSON.stringify({
        message: "Career backup — " + seasonYears(G.season) + ", week " + G.week + " (" + CLUBS[G.myClub].name + ")",
        content: b64encode(localStorage.getItem("touchline_save")),
        sha,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    ghSyncNote("✓ Backed up to GitHub — " + seasonYears(G.season) + ", matchweek " + Math.min(G.week + 1, G.fixtures.length) + ".", true);
  } catch (e) {
    ghSyncNote("Backup failed (" + e.message + ")." + (silent ? " Auto-sync will retry after your next match." : " Check the repository name and that the token has Contents read & write access."), false);
  }
}
/* At startup: if a NEWER save exists in the cloud (e.g. you played on another
   device), offer to pick it up. Local-only progress is never overwritten silently. */
async function ghStartupCheck() {
  const cfg = ghCfg();
  if (!cfg || !cfg.auto) return;
  try {
    const res = await fetch(ghUrl(cfg), { headers: ghHeaders(cfg) });
    if (!res.ok) return;
    const txt = b64decode((await res.json()).content);
    const remote = JSON.parse(txt);
    if (!remote || typeof remote.ver !== "number") return;
    const newer = (remote.savedAt || 0) > ((G && G.savedAt) || 0) + 1500;
    if (!newer) { if (G) ghSyncNote("✓ Cloud save is in sync.", true); return; }
    const who = CLUBS[remote.myClub] ? CLUBS[remote.myClub].name : "your club";
    if (!G || confirm("☁ A newer cloud save was found:\n" + who + " — " + seasonYears(remote.season) +
                      ", matchweek " + Math.min((remote.week || 0) + 1, 38) +
                      "\n\nLoad it here? (Cancel keeps this device's game.)")) {
      if (importSaveText(txt)) ghSyncNote("✓ Cloud save loaded.", true);
    }
  } catch (e) {}
}
async function ghRestore() {
  const cfg = ghCfg();
  if (!cfg) { ghStatus("Enter your repository and token first, then press Save settings.", false); return; }
  ghStatus("Fetching from GitHub…", true);
  try {
    const res = await fetch(ghUrl(cfg), { headers: ghHeaders(cfg) });
    if (!res.ok) throw new Error(res.status === 404 ? "no backup found in that repository" : "HTTP " + res.status);
    const data = await res.json();
    if (importSaveText(b64decode(data.content))) {
      ghStatus("✓ Career restored from GitHub.", true);
    }
  } catch (e) {
    ghStatus("Restore failed (" + e.message + ").", false);
  }
}

/* ---------------- Lineup helpers ---------------- */

function validateLineup() {
  const squad = G.squads[G.myClub];
  const f = FORMATIONS[G.formation];
  const need = { GK: 1, DF: f.DF, MF: f.MF, FW: f.FW };
  const chosen = [];
  const lineup = (G.lineup || []).map(id => squad.find(p => p.id === id)).filter(Boolean);
  for (const pos of ["GK", "DF", "MF", "FW"]) {
    const ok = lineup.filter(p => p.pos === pos && available(p)).slice(0, need[pos]);
    chosen.push(...ok.map(p => p.id));
    let missing = need[pos] - ok.length;
    if (missing > 0) {
      const subs = squad.filter(p => p.pos === pos && available(p) && !chosen.includes(p.id))
                        .sort((a, b) => effRating(b) - effRating(a)).slice(0, missing);
      chosen.push(...subs.map(p => p.id));
      missing -= subs.length;
    }
  }
  if (chosen.length < 11) {
    for (const p of squad.filter(p => available(p) && !chosen.includes(p.id))
                         .sort((a, b) => effRating(b) - effRating(a))) {
      chosen.push(p.id);
      if (chosen.length === 11) break;
    }
  }
  return chosen.slice(0, 11);
}

/* ---------------- Analytics: 📊 form & performance charts ----------------
   Everything is reconstructed from G.results week by week, so the charts work
   on any save — including careers started long before this tab existed. */

function myLeagueHistory() {
  const stats = {};
  for (const i of G.league) stats[i] = { pts: 0, gd: 0, gf: 0 };
  const hist = [];
  for (const week of G.results) {
    let my = null;
    for (const r of week) {
      const S = stats[r.h], T = stats[r.a];
      if (!S || !T) continue;
      S.gd += r.hg - r.ag; T.gd += r.ag - r.hg; S.gf += r.hg; T.gf += r.ag;
      if (r.hg > r.ag) S.pts += 3; else if (r.hg < r.ag) T.pts += 3; else { S.pts++; T.pts++; }
      if (r.h === G.myClub) my = { gf: r.hg, ga: r.ag, opp: r.a, ha: "H" };
      else if (r.a === G.myClub) my = { gf: r.ag, ga: r.hg, opp: r.h, ha: "A" };
    }
    if (!my) continue;
    const order = Object.keys(stats).map(Number).sort((a, b) =>
      stats[b].pts - stats[a].pts || stats[b].gd - stats[a].gd || stats[b].gf - stats[a].gf);
    my.pos = order.indexOf(G.myClub) + 1;
    my.pts = stats[G.myClub].pts;
    my.res = my.gf > my.ga ? "W" : my.gf < my.ga ? "L" : "D";
    hist.push(my);
  }
  return hist;
}

const ANA_RES_COL = { W: "#2EAE6A", D: "#E8B33C", L: "#D85C4A" };

function anaCanvas(id, h) {
  return `<canvas id="${id}" width="720" height="${h}" style="width:100%;max-width:720px;display:block;margin:2px auto 14px;background:#131C24;border:1px solid var(--line);border-radius:6px"></canvas>`;
}

function anaFrame(id) { // shared chart scaffolding: context + plot rectangle
  const c = document.getElementById(id);
  if (!c || !c.getContext) return null;
  const x = c.getContext("2d");
  if (!x) return null;
  const W = c.width, H = c.height, L = 34, R = 12, T = 14, B = 22;
  x.clearRect(0, 0, W, H);
  x.font = "11px " + "'SF Mono', Consolas, monospace";
  return { x, W, H, L, R, T, B, iw: W - L - R, ih: H - T - B };
}

function drawPosChart(hist) {
  const f = anaFrame("ana-pos");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const N = G.fixtures.length, P = PL_SIZE;
  const X = w => L + (N <= 1 ? 0 : (w / (N - 1)) * iw);
  const Y = pos => T + ((pos - 1) / (P - 1)) * ih;
  // qualification bands: Champions League, Europe, the drop
  x.fillStyle = "rgba(46,174,106,0.10)"; x.fillRect(L, Y(1), iw, Y(4.5) - Y(1));
  x.fillStyle = "rgba(232,179,60,0.07)"; x.fillRect(L, Y(4.5), iw, Y(6.5) - Y(4.5));
  x.fillStyle = "rgba(216,92,74,0.12)"; x.fillRect(L, Y(17.5), iw, Y(P) - Y(17.5));
  x.fillStyle = "#9FB3BE"; x.textAlign = "right"; x.textBaseline = "middle";
  for (const p of [1, 4, 10, 17, 20]) {
    x.fillText(p, L - 6, Y(p));
    x.strokeStyle = "rgba(159,179,190,0.12)"; x.lineWidth = 1;
    x.beginPath(); x.moveTo(L, Y(p)); x.lineTo(L + iw, Y(p)); x.stroke();
  }
  if (G.board && G.board.exp) { // the board's demand, as a dashed line
    x.strokeStyle = "rgba(232,179,60,0.7)"; x.setLineDash([5, 4]);
    x.beginPath(); x.moveTo(L, Y(G.board.exp)); x.lineTo(L + iw, Y(G.board.exp)); x.stroke();
    x.setLineDash([]);
    x.fillStyle = "#E8B33C"; x.textAlign = "left";
    x.fillText("board: " + ordinal(G.board.exp), L + 4, Y(G.board.exp) - 8);
  }
  x.strokeStyle = "#E8EFF2"; x.lineWidth = 2; x.beginPath();
  hist.forEach((m, w) => { const px = X(w), py = Y(m.pos); w ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
  hist.forEach((m, w) => {
    x.beginPath(); x.arc(X(w), Y(m.pos), 3.4, 0, 6.29);
    x.fillStyle = ANA_RES_COL[m.res]; x.fill();
  });
}

function drawGoalsChart(hist) {
  const f = anaFrame("ana-goals");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const N = G.fixtures.length;
  const mid = T + ih / 2;
  const peak = Math.max(3, ...hist.map(m => Math.max(m.gf, m.ga)));
  const bw = Math.max(3, iw / N - 2);
  x.strokeStyle = "rgba(159,179,190,0.35)";
  x.beginPath(); x.moveTo(L, mid); x.lineTo(L + iw, mid); x.stroke();
  hist.forEach((m, w) => {
    const px = L + (w / N) * iw + 1;
    const hF = (m.gf / peak) * (ih / 2 - 2), hA = (m.ga / peak) * (ih / 2 - 2);
    x.fillStyle = "rgba(46,174,106,0.85)"; x.fillRect(px, mid - hF, bw, hF);
    x.fillStyle = "rgba(216,92,74,0.85)"; x.fillRect(px, mid + 1, bw, hA);
  });
  x.fillStyle = "#9FB3BE"; x.textAlign = "left"; x.textBaseline = "middle";
  x.fillText("scored ↑", L + 4, T + 8);
  x.fillText("conceded ↓", L + 4, T + ih - 8);
}

function drawPaceChart(hist) {
  const f = anaFrame("ana-pace");
  if (!f) return;
  const { x, L, T, iw, ih } = f;
  const N = G.fixtures.length;
  const refs = [[2.0, "title pace", "#E8B33C"], [1.74, "top-4 pace", "#2EAE6A"], [1.0, "safety", "#D85C4A"]];
  const yMax = Math.max(2.0 * N, hist[hist.length - 1].pts * (N / hist.length)) + 4;
  const X = w => L + ((w + 1) / N) * iw;
  const Y = pts => T + ih - (pts / yMax) * ih;
  x.textBaseline = "middle";
  for (const [rate, label, col] of refs) {
    x.strokeStyle = col; x.globalAlpha = 0.45; x.setLineDash([4, 4]);
    x.beginPath(); x.moveTo(L, Y(0)); x.lineTo(L + iw, Y(rate * N)); x.stroke();
    x.setLineDash([]); x.globalAlpha = 1;
    x.fillStyle = col; x.textAlign = "right";
    x.fillText(label + " (" + Math.round(rate * N) + ")", L + iw - 4, Y(rate * N) + 9);
  }
  x.strokeStyle = "#E8EFF2"; x.lineWidth = 2; x.beginPath(); x.moveTo(L, Y(0));
  hist.forEach((m, w) => x.lineTo(X(w), Y(m.pts)));
  x.stroke();
  const last = hist[hist.length - 1];
  const proj = Math.round(last.pts / hist.length * N);
  x.fillStyle = "#E8EFF2"; x.textAlign = "left";
  x.fillText(last.pts + " pts → " + proj + " projected", Math.min(X(hist.length - 1) + 6, L + iw - 130), Y(last.pts));
  x.fillStyle = "#9FB3BE"; x.textAlign = "right"; x.textBaseline = "top";
  x.fillText("matches →", L + iw, T + ih + 6);
}

function ordinal(n) { return n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th"); }

function renderAnalytics() {
  const hist = myLeagueHistory();
  if (!hist.length) return `<div class="panel"><h2>📊 Form & analytics</h2>
    <p class="note">The charts appear after your first league match of the season.</p></div>`;
  const wins = hist.filter(m => m.res === "W").length;
  const draws = hist.filter(m => m.res === "D").length;
  const losses = hist.length - wins - draws;
  const rec = side => {
    const ms = hist.filter(m => m.ha === side);
    return ms.filter(m => m.res === "W").length + "-" + ms.filter(m => m.res === "D").length + "-" + ms.filter(m => m.res === "L").length;
  };
  let streak = 1;
  while (streak < hist.length && hist[hist.length - 1 - streak].res === hist[hist.length - 1].res) streak++;
  const streakWord = { W: "win", D: "draw", L: "defeat" }[hist[hist.length - 1].res];
  const big = [...hist].sort((a, b) => (b.gf - b.ga) - (a.gf - a.ga))[0];
  const bad = [...hist].sort((a, b) => (a.gf - a.ga) - (b.gf - b.ga))[0];
  const fmtM = m => m.gf + "–" + m.ga + " v " + CLUBS[m.opp].short + " (" + m.ha + ")";
  const cs = hist.filter(m => m.ga === 0).length;
  const sq = G.squads[G.myClub];
  const ts = [...sq].sort((a, b) => b.goals - a.goals)[0];
  const ta = [...sq].sort((a, b) => b.assists - a.assists)[0];
  const formStr = hist.slice(-6).map(m => `<span class="${m.res}" title="${fmtM(m)}">${m.res}</span>`).join("");
  return `<div class="panel">
    <h2>📊 Form & analytics — ${seasonYears(G.season)} league season</h2>
    <p class="note">League position week by week. Green band: Champions League places · amber: Europe · red: the drop.
      Dots are coloured by result.</p>
    ${anaCanvas("ana-pos", 220)}
    <p class="note">Goals in every league match — scored above the line, conceded below.</p>
    ${anaCanvas("ana-goals", 140)}
    <p class="note">Points pace against the marks that usually matter.</p>
    ${anaCanvas("ana-pace", 190)}
    <h3>Season insights</h3>
    <table><tbody>
      <tr><td>Record (W-D-L)</td><td class="num"><b>${wins}-${draws}-${losses}</b> · home ${rec("H")} · away ${rec("A")}</td></tr>
      <tr><td>Current run</td><td class="num">${streak} ${streakWord}${streak > 1 ? "s" : ""} on the spin · last six: <span class="formbar">${formStr}</span></td></tr>
      <tr><td>Biggest win</td><td class="num">${big.gf > big.ga ? fmtM(big) : "—"}</td></tr>
      <tr><td>Heaviest defeat</td><td class="num">${bad.gf < bad.ga ? fmtM(bad) : "—"}</td></tr>
      <tr><td>Clean sheets</td><td class="num">${cs} in ${hist.length}</td></tr>
      <tr><td>Goals per match</td><td class="num">${(hist.reduce((s, m) => s + m.gf, 0) / hist.length).toFixed(2)} scored · ${(hist.reduce((s, m) => s + m.ga, 0) / hist.length).toFixed(2)} conceded</td></tr>
      <tr><td>Talisman</td><td class="num">${ts && ts.goals ? esc(ts.name) + " — " + ts.goals + " goals" : "no goals yet"}${ta && ta.assists ? " · " + esc(ta.name) + " — " + ta.assists + " assists" : ""}</td></tr>
    </tbody></table>
  </div>`;
}

function drawAnalytics() {
  const hist = myLeagueHistory();
  if (!hist.length) return;
  drawPosChart(hist); drawGoalsChart(hist); drawPaceChart(hist);
}

  // sponsorship offers: a new shirt deal whenever the old one has run out
