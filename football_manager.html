<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Football Manager</title>
<style>
:root {
  --bg: #10181F;
  --panel: #18232C;
  --panel-2: #1F2D38;
  --line: #2C3E4C;
  --ink: #E8EFF2;
  --ink-soft: #9FB3BE;
  --pitch: #2EAE6A;
  --pitch-dark: #1E7A49;
  --amber: #E8B33C;
  --red: #D85C4A;
  --mono: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
header {
  background: linear-gradient(180deg, #15212B, #10181F);
  border-bottom: 2px solid var(--pitch);
  padding: 14px 24px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
header h1 { margin: 0; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
header h1 span { color: var(--pitch); }
#club-badge { font-size: 13px; color: var(--ink-soft); }
#week-badge { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--amber); }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

.tabs { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
.tabs button {
  background: var(--panel); color: var(--ink-soft); border: 1px solid var(--line);
  border-radius: 4px 4px 0 0; padding: 8px 16px; cursor: pointer; font-size: 14px;
}
.tabs button.active { background: var(--pitch-dark); color: #fff; border-color: var(--pitch); }
.tabs button:hover { color: #fff; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 16px; }
h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0.02em; }
h3 { margin: 16px 0 8px; font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--ink-soft); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tr.me td { background: rgba(46, 174, 106, 0.12); }
tr.champ td:first-child { border-left: 3px solid var(--amber); }
tr.ucl td:first-child { border-left: 3px solid #3D7DC8; }
tr.uel td:first-child { border-left: 3px solid #E8833C; }
tr.uecl td:first-child { border-left: 3px solid #35B07A; }
tr.releg td:first-child { border-left: 3px solid var(--red); }
.zone-legend { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
.zone-legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; vertical-align: -1px; }

button.action {
  background: var(--pitch-dark); color: #fff; border: 1px solid var(--pitch);
  border-radius: 4px; padding: 10px 22px; font-size: 15px; cursor: pointer; font-weight: 600;
}
button.action:hover { background: var(--pitch); }
button.ghost {
  background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
  border-radius: 4px; padding: 8px 14px; font-size: 13px; cursor: pointer;
}
button.ghost:hover { color: #fff; border-color: var(--ink-soft); }
select {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; font-size: 14px;
}
input[type="text"], input[type="password"], input:not([type]) {
  background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; font-size: 14px; font-family: inherit;
}

.club-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.club-card {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 14px; cursor: pointer; transition: border-color 0.15s;
}
.club-card:hover { border-color: var(--pitch); }
.club-card .cname { font-weight: 700; font-size: 16px; }
.club-card .cinfo { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
.club-card .cstars { font-size: 12px; color: var(--amber); margin-top: 6px; }
.stars-bar { color: var(--pitch); letter-spacing: 2px; }

.pos-GK { color: var(--amber); } .pos-DF { color: #6FB3E0; } .pos-MF { color: #8ED48E; } .pos-FW { color: #E08B8B; }
.tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); }
.tag.inj { color: var(--red); border-color: var(--red); }
.tag.sus { color: var(--amber); border-color: var(--amber); }
.formbar { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; }
.formbar .W { color: var(--pitch); } .formbar .D { color: var(--ink-soft); } .formbar .L { color: var(--red); }

.minute-badge { text-align: center; font-family: var(--mono); font-size: 18px; color: var(--amber); margin: 2px 0 10px; }
.pitch-wrap { margin: 6px auto 10px; max-width: 760px; position: relative; }
.snd-btn { position: absolute; top: 8px; right: 8px; z-index: 5; background: rgba(10,18,12,.55);
  border: 1px solid rgba(255,255,255,.25); border-radius: 8px; color: #fff;
  font-size: 15px; padding: 3px 9px; cursor: pointer; }
#pitch { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid var(--line); }
.kit-legend { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); padding: 4px 2px; }
.kit-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #fff; vertical-align: -1px; margin-right: 5px; }
.crest { vertical-align: middle; margin-right: 6px; flex-shrink: 0; }
td .crest { vertical-align: -4px; margin-right: 5px; }
.ev-else { color: var(--ink-soft); font-size: 13px; }
.speed-on { border-color: var(--pitch) !important; color: #fff !important; }
.ht-panel { background: var(--panel-2); border: 1px solid var(--amber); border-radius: 6px; padding: 14px; margin: 12px 0; }
.poss-bar { display: flex; height: 13px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.poss-bar .ph { background: var(--pitch-dark); }
.poss-bar .pa { background: #50647A; }
.stat-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; padding: 3px 0; }
.stat-row .lbl { color: var(--ink-soft); font-family: inherit; }
.motm { text-align: center; color: var(--amber); margin: 10px 0 4px; }

.lineup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.slot { display: flex; align-items: center; gap: 8px; }
.slot label { width: 34px; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }
.slot select { flex: 1; }

.score-line { font-size: 26px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
.score-line .vs { color: var(--ink-soft); font-size: 16px; font-weight: 400; margin: 0 10px; }
.events { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; }
.events li { padding: 5px 8px; border-bottom: 1px solid var(--line); }
.events .min { font-family: var(--mono); color: var(--amber); display: inline-block; width: 38px; }
.ev-goal { background: rgba(46, 174, 106, 0.08); }
.ev-red { background: rgba(216, 92, 74, 0.10); }
.other-results { color: var(--ink-soft); font-size: 13px; }
.other-results b { color: var(--ink); }

.banner {
  text-align: center; padding: 26px; border: 2px solid var(--amber); border-radius: 8px;
  background: linear-gradient(180deg, rgba(232,179,60,0.08), transparent); margin-bottom: 16px;
}
.banner h2 { font-size: 24px; color: var(--amber); }
.note { color: var(--ink-soft); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
footer { text-align: center; color: var(--ink-soft); font-size: 12px; padding: 24px; }

/* wide stats tables scroll sideways inside their panel instead of breaking the page */
.panel { overflow-x: auto; }

@media (max-width: 640px) {
  header { padding: 10px 12px; gap: 8px; }
  header h1 { font-size: 16px; }
  #club-badge { font-size: 11px; }
  #week-badge { font-size: 11px; }
  main { padding: 12px 8px 40px; }
  .panel { padding: 12px 10px; }
  th, td { padding: 4px 5px; font-size: 12px; }
  .tabs button { padding: 7px 10px; font-size: 13px; }
  button.action { padding: 12px 16px; font-size: 14px; width: 100%; }
  button.ghost { padding: 9px 12px; }
  .score-line { font-size: 19px; }
  .score-line .vs { margin: 0 6px; }
  .events { font-size: 13px; }
  .events .min { width: 32px; }
  .club-card { padding: 11px; }
  h2 { font-size: 15px; }
  .slot select { min-width: 0; }
  .kit-legend { font-size: 11px; }
  .zone-legend { font-size: 11px; }
}
</style>
</head>

function styleTip(style) {

function rollWeather(week) {
  const r = rnd();
  if (week <= 5) return r < 0.55 ? "clear" : r < 0.7 ? "heat" : r < 0.85 ? "rain" : r < 0.95 ? "wind" : "storm";

function getWeather() { // one forecast per game-week, fixed once rolled
  if (!G.wx || G.wx.week !== G.week || G.wx.season !== G.season) {

  return WEATHER[G.wx.kind] ? G.wx.kind : "clear";

function kitColors(hIdx, aIdx) {
  const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const home = colorOf(hIdx), away = colorOf(aIdx);
  const [r1, g1, b1] = hex2rgb(home), [r2, g2, b2] = hex2rgb(away);

/* Season numbers map to real campaign years: season 1 = 2025/26, season 2 = 2026/27… */

/* ---------------- The fixture calendar: a real date for every match ----------------
   League rounds are weekend fixtures — Saturdays, with every fourth round on a
   Sunday and the round nearest 26 December played on Boxing Day itself, whatever
   the weekday (the great English tradition). Midweeks follow the real broadcast
   map: Champions League and League Cup on Tuesday/Wednesday nights, Europa AND
   Conference League on Thursdays. FA Cup ties take the Sunday of their week.
   Season 1 kicks off on the first Saturday after 9 August 2025. */
const DAY_MS = 86400000;
function seasonStartMs(season) {
  const d = new Date(Date.UTC(2024 + season, 7, 11));
  return d.getTime() + ((6 - d.getUTCDay() + 7) % 7) * DAY_MS;
}
function matchDateMs(kind, wk, md) {
  // kind: "league" | "lc" | "fa" | "UCL" | "UEL" | "UECL"
  // wk: for league, the 0-based round; for the rest, G.week at the time
  //     (cups & Europe play in the midweek after league round wk−1)
  if (kind === "league") {
    const sat = seasonStartMs(G.season) + wk * 7 * DAY_MS;
    const d = new Date(sat);
    if (d.getUTCMonth() === 11 && d.getUTCDate() >= 23 && d.getUTCDate() <= 29)
      return Date.UTC(d.getUTCFullYear(), 11, 26); // Boxing Day football
    return sat + (wk % 4 === 3 ? DAY_MS : 0);
  }
  const anchor = seasonStartMs(G.season) + (Math.max(1, wk) - 1) * 7 * DAY_MS;
  const off = kind === "fa" ? 1                                     // Sunday
            : kind === "UEL" || kind === "UECL" ? 5                 // Thursday
            : ((md === undefined ? wk : md) % 2 ? 3 : 4);           // Tue / Wed
  return anchor + off * DAY_MS;
}
const DATE_DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DATE_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DATE_DAYS_ZH = ["日", "一", "二", "三", "四", "五", "六"];
function fmtDate(ms, short) {
  const d = new Date(ms);
  if (LANG === "zh") {
    const core = (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日（" + DATE_DAYS_ZH[d.getUTCDay()] + "）";
    return short ? core : d.getUTCFullYear() + "年" + core;
  }
  const core = DATE_DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + DATE_MONTHS[d.getUTCMonth()];
  return short ? core : core + " " + d.getUTCFullYear();
}
function matchDateStr(kind, wk, md, short) { return fmtDate(matchDateMs(kind, wk, md), short); }
function nextMatchDateStr(short) { // the date of whatever you actually play next
  const ef = dueEuro();
  if (ef) return matchDateStr(G.euro.comp, G.week, G.euro.played, short);
  const cf = dueCup();
  if (cf) return matchDateStr(cf.cupKey, G.week, undefined, short);
  if (G.week < G.fixtures.length) return matchDateStr("league", G.week, undefined, short);

}

let nextId = 1;
function potentialFor(rating, age) {
  const headroom = age <= 20 ? 6 + Math.floor(Math.random() * 9)
                 : age <= 23 ? 3 + Math.floor(Math.random() * 7)
                 : age <= 27 ? 1 + Math.floor(Math.random() * 3) : 0;
  return Math.min(94, rating + headroom);
}
function wageFor(rating, age) {
  const ageF = age <= 21 ? 0.6 : age <= 23 ? 0.8 : 1;
  return Math.max(0.3, Math.round(18 * Math.exp(0.1176 * (rating - 90)) * ageF * 10) / 10);
}
function makePlayer(name, pos, rating, age) {
  return { id: nextId++, name, pos, rating, age, pot: potentialFor(rating, age),
           wage: wageFor(rating, age), years: 2 + Math.floor(Math.random() * 4),
           fitness: 100, form: 0, injury: 0, ban: 0, yellows: 0, goals: 0, assists: 0, apps: 0 };
}
function wageBill() {
  return Math.round(G.squads[G.myClub].reduce((s, p) => s + (p.wage || 0), 0) * 10) / 10;
}
function wageCapFormula() {
  // a typical 18-man squad at this stature, plus ~18% headroom
  return Math.round(18 * wageFor(CLUBS[G.myClub].base - 1, 27) * 1.18);
}
function setWageCap() { // fixed each season: stature-based, but never below bill+15%
  G.wcap = Math.max(wageCapFormula(), Math.round(wageBill() * 1.15));
}
function wageCap() {
  if (!G.wcap) setWageCap();
  return G.wcap;
}
function renewDemand(p) {
  return Math.round(wageFor(p.rating, p.age) * (p.form >= 1 ? 1.15 : 1.05) * 10) / 10;
}
function renewContract(pid) {
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!p) return;
  const demand = renewDemand(p);
  if (wageBill() - (p.wage || 0) + demand > wageCap()) {
    if (typeof alert === "function") alert("The wage budget can't take it — his demand of £" + demand + "M/yr would push the bill past your £" + wageCap() + "M cap. Sell or release someone first.");
    return;
  }
  if (typeof confirm === "function" && !confirm("Offer " + p.name + " a new 3-year contract at £" + demand + "M/yr (currently £" + (p.wage || 0) + "M)?")) return;
  p.wage = demand;
  p.years = 3;
  G.deals = G.deals || [];
  G.deals.unshift("✍ " + p.name + " signed a new 3-year deal at £" + demand + "M/yr");
  save(); render();
}

/* ---------------- Fixtures (double round robin, circle method) ---------------- */

function makeFixtures(n) {
  const ids = [...Array(n).keys()];
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = ids[i], b = ids[n - 1 - i];
      pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    ids.splice(1, 0, ids.pop());
  }
  const back = rounds.map(rd => rd.map(([h, a]) => [a, h]));
  return rounds.concat(back);
}

function effRating(p) {
  let r = p.rating + p.form * 1.5;
  if (p.fitness < 60) r -= (60 - p.fitness) * 0.15;
  return r;
}
function available(p) { return p.injury === 0 && p.ban === 0 && !p.loan; }

function bestXI(squad, formationName) {
  const f = FORMATIONS[formationName];
  const by = pos => squad.filter(p => p.pos === pos && available(p))
                         .sort((a, b) => effRating(b) - effRating(a));
  const xi = [];
  const gk = by("GK")[0];
  if (gk) xi.push(gk.id);
  for (const pos of ["DF", "MF", "FW"]) {
    for (const p of by(pos).slice(0, f[pos])) xi.push(p.id);
  }
  // fill gaps with any available outfielder if short (injury crisis)
  if (xi.length < 11) {
    for (const p of squad.filter(p => available(p) && !xi.includes(p.id))
                         .sort((a, b) => effRating(b) - effRating(a))) {
      xi.push(p.id);
      if (xi.length === 11) break;
    }
  }
  return xi;
}

/* ---------------- Match engine ---------------- */

function rnd() { return Math.random(); }
function poisson(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= rnd(); } while (p > L);
  return k - 1;
}

function teamNumbers(squad, xiIds, mentality, formName, styleName, weatherKind) {
  const xi = xiIds.map(id => squad.find(p => p.id === id)).filter(Boolean);
  const g = pos => xi.filter(p => p.pos === pos);
  const avg = arr => arr.length ? arr.reduce((s, p) => s + effRating(p), 0) / arr.length : 40;
  let att = avg(g("FW")) * 0.6 + avg(g("MF")) * 0.4;
  let mid = avg(g("MF"));
  let def = avg(g("DF")) * 0.65 + avg(g("GK")) * 0.35;
  if (mentality === "Attacking") { att *= 1.07; def *= 0.94; }
  if (mentality === "Defensive") { att *= 0.93; def *= 1.06; }
  const fm = FORMATIONS[formName] || {};
  const st = STYLES[styleName] || STYLES.Balanced;
  const wx = WEATHER[weatherKind] || WEATHER.clear;
  const wm = weatherStyleMod(weatherKind, styleName);
  att *= (fm.att || 1) * st.att * wx.att * (wm.att || 1);
  mid *= (fm.mid || 1) * st.mid * (wm.mid || 1);
  def *= (fm.def || 1) * st.def * (wm.def || 1);
  if (xi.length < 11) { // down to 10 (or fewer) men
    const f = 1 - 0.07 * (11 - xi.length);
    att *= f; mid *= f; def *= f;
  }
  return { xi, att, mid, def, poss: st.poss || 0, drain: (st.drain || 1) * wx.drain };
}

function expGoals(my, opp, home) {
  const ratio = (my.att * 0.65 + my.mid * 0.35) / (opp.def * 0.7 + opp.mid * 0.3);
  let xg = 1.18 * Math.pow(ratio, 2.2);
  if (home) xg += 0.18;
  return Math.min(xg, 4.5);
}

function pickScorer(team) {
  const w = team.xi.map(p => p.pos === "FW" ? 6 : p.pos === "MF" ? 3 : p.pos === "DF" ? 1 : 0);
  const total = w.reduce((a, b) => a + b, 0);
  let r = rnd() * total;
  for (let i = 0; i < team.xi.length; i++) { r -= w[i]; if (r <= 0) return team.xi[i]; }
  return team.xi[team.xi.length - 1];
}

function simMatch(hIdx, aIdx, opts) {
  const hSquad = G.squads[hIdx], aSquad = G.squads[aIdx];
  const hXI = (opts && opts.hXI) || bestXI(hSquad, "4-4-2");
  const aXI = (opts && opts.aXI) || bestXI(aSquad, "4-4-2");
  const wx = getWeather();
  const hAI = aiTactics(hIdx), aAI = aiTactics(aIdx);
  const H = teamNumbers(hSquad, hXI, (opts && opts.hMent) || "Balanced", (opts && opts.hForm) || hAI.form, (opts && opts.hStyle) || hAI.style, wx);
  const A = teamNumbers(aSquad, aXI, (opts && opts.aMent) || "Balanced", (opts && opts.aForm) || aAI.form, (opts && opts.aStyle) || aAI.style, wx);

  const hg = poisson(expGoals(H, A, true));
  const ag = poisson(expGoals(A, H, false));

  const events = [];
  const addGoals = (n, team, clubIdx) => {
    for (let i = 0; i < n; i++) {
      const e = makeGoalEvent(team, clubIdx);
      e.min = 3 + Math.floor(rnd() * 88);
      events.push(e);
    }
  };
  addGoals(hg, H, hIdx);
  addGoals(ag, A, aIdx);

  // cards, injuries, and the odd missed penalty
  for (const [team, clubIdx] of [[H, hIdx], [A, aIdx]]) {
    if (rnd() < 0.08) {
      const p = pickScorer(team);
      const k = Math.floor(rnd() * PKMISS_LINES.length);
      events.push({ min: 5 + Math.floor(rnd() * 85), type: "pkmiss", clubIdx, pid: p.id, who: p.name,
                    text: p.name + " " + PKMISS_LINES[k], zh: p.name + " " + PKMISS_LINES_ZH[k] });
    }
    for (const p of team.xi) {
      if (rnd() < 0.13) {
        p.yellows++;
        events.push({ min: 10 + Math.floor(rnd() * 80), type: "yellow", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " goes into the book.", zh: p.name + " 食黃牌，俾球證記咗名。" });
        if (p.yellows % 4 === 0) p.ban = Math.max(p.ban, 1);
      }
      if (rnd() < 0.006) {
        p.ban = Math.max(p.ban, 2);
        events.push({ min: 20 + Math.floor(rnd() * 70), type: "red", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " is sent off! Straight red.", zh: p.name + " 直接紅牌！即刻收工！" });
      }
      if (rnd() < 0.035 * (WEATHER[wx] || WEATHER.clear).inj) {
        p.injury = 1 + Math.floor(rnd() * 4);
        events.push({ min: 5 + Math.floor(rnd() * 85), type: "injury", clubIdx, pid: p.id, who: p.name,
                      text: p.name + " limps off injured (" + p.injury + " wk).", zh: p.name + " 受傷一拐一拐離場（傷停 " + p.injury + " 週）。" });
      }
    }
  }
  events.sort((a, b) => a.min - b.min);

  // fitness and form
  const res = hg > ag ? 1 : hg < ag ? -1 : 0;
  for (const [team, sign] of [[H, res], [A, -res]]) {
    for (const p of team.xi) {
      p.apps++;
      p.fitness = Math.max(20, p.fitness - Math.round((10 + Math.floor(rnd() * 8)) * (team.drain || 1)));
      p.form = Math.max(-2, Math.min(2, p.form + (sign > 0 ? 1 : sign < 0 ? -1 : 0) * (rnd() < 0.6 ? 1 : 0)));
    }
  }
  const result = { h: hIdx, a: aIdx, hg, ag, events };
  if (hIdx === G.myClub || aIdx === G.myClub) {
    result.stats = synthStats(H, A, events, hIdx, aIdx);
    result.ratings = matchRatings(hIdx, aIdx, hXI, aXI, events, hg, ag);
    result.weather = wx;
  }
  return result;
}

/* Suspensions/injuries earned THIS week must not tick down until the week is over,
   so snapshot who was already out before kickoff and only decay those. */
function snapshotStatuses() {
  const inj = [], ban = [];
  for (const squad of G.squads) for (const p of squad) {
    if (p.injury > 0) inj.push(p.id);
    if (p.ban > 0) ban.push(p.id);
  }
  return { inj, ban };
}
function applyDecay(snapshot) {
  const inj = new Set(snapshot.inj), ban = new Set(snapshot.ban);
  for (const squad of G.squads) for (const p of squad) {
    if (inj.has(p.id) && p.injury > 0) p.injury--;
    if (ban.has(p.id) && p.ban > 0) p.ban--;
    // weekly recovery: the more tired, the faster you recover — but European
    // midweeks cost fitness with no extra recovery, so congestion bites
    p.fitness = Math.min(100, Math.round(p.fitness + (100 - p.fitness) * 0.45));
  }
}

function commitWeek(weekResults, myResult, snapshot) {
  ghQueueSync();
  if (myResult) myResult.dateMs = matchDateMs("league", G.week);
  applyDecay(snapshot);
  G.results.push(weekResults);
  G.week++;
  G.lastMatch = myResult;
  G.live = null;
  G.lastMatchEuro = false;
  G.lastMatchLabel = null;
  G.motmNews = null;
  if (!windowOpen()) G.offersIn = []; // bids expire when the window shuts
  // the board reacts to league results
  if (G.board && myResult) {
    const win = (myResult.h === G.myClub && myResult.hg > myResult.ag) || (myResult.a === G.myClub && myResult.ag > myResult.hg);
    const draw = myResult.hg === myResult.ag;
    const t = tableStats();
    const p = t.findIndex(r => r.i === G.myClub) + 1;
    const drift = Math.max(-1.5, Math.min(1.5, (G.board.exp - p) * 0.15));
    boardBump((win ? 2 : draw ? 0.5 : -2.5) + drift);
  }
  // Manager of the Month: best league record over each four-week block
  if (G.week % 4 === 0 && G.week <= 36 && G.results.length >= G.week) {
    const pts = {}, gd = {};
    for (let wk = G.week - 4; wk < G.week; wk++) {
      for (const r of G.results[wk]) {
        const dH = r.hg - r.ag;
        pts[r.h] = (pts[r.h] || 0) + (dH > 0 ? 3 : dH === 0 ? 1 : 0);
        pts[r.a] = (pts[r.a] || 0) + (dH < 0 ? 3 : dH === 0 ? 1 : 0);
        gd[r.h] = (gd[r.h] || 0) + dH;
        gd[r.a] = (gd[r.a] || 0) - dH;
      }
    }
    let best = null;
    for (const i of G.league) {
      const s = pts[i] || 0, d = gd[i] || 0;
      if (!best || s > best.s || (s === best.s && d > best.d)) best = { i, s, d };
    }
    if (best && best.i === G.myClub) {
      const MONTHS = ["August", "September", "October", "November", "December", "January", "February", "March", "April"];
      G.motm = G.motm || [];
      G.motm.push("Season " + G.season + " · " + MONTHS[G.week / 4 - 1] + " (" + best.s + " pts from 4 games)");
      G.motmNews = "🏅 Manager of the Month! Your " + best.s + " points from the last four league games topped the division.";
      boardBump(2);
    }
  }
  if (G.week >= G.fixtures.length) {
    G.screen = "seasonEnd";
    const t = tableStats();
    if (t[0].i === G.myClub) {
      G.honours.push("Season " + G.season + ": Premier League champions");
      boardBump(15);
    }
    // settle promotion & relegation the moment the season ends
    G.relegated = t.slice(-3).map(row => row.i);
    const inLeague = new Set(G.league);
    G.promoted = CLUBS.map((c, i) => i)
      .filter(i => !inLeague.has(i) && i !== EURO_SLOT)
      .map(i => ({ i, s: CLUBS[i].base + rnd() * 8 })) // strongest sides most likely to come up
      .sort((x, y) => y.s - x.s)
      .slice(0, 3)
      .map(x => x.i);
  } else {
    G.screen = "matchResult";
    if (!checkSack() && !G.event && G.week >= 2 && rnd() < 0.28) generateEvent();
  }
  save();
  render();
}

function quickSim() {
  if (G.week >= G.fixtures.length || G.live || dueEuro() || dueCup()) return;
  defaultExpectation();
  const my = G.myClub;
  G.lineup = validateLineup();
  const snapshot = snapshotStatuses();
  let myResult = null;
  const weekResults = G.fixtures[G.week].map(([h, a]) => {
    const opts = {};
    if (h === my) { opts.hXI = G.lineup; opts.hMent = G.mentality; opts.hForm = G.formation; opts.hStyle = G.style || "Balanced"; }
    if (a === my) { opts.aXI = G.lineup; opts.aMent = G.mentality; opts.aForm = G.formation; opts.aStyle = G.style || "Balanced"; }
    const r = simMatch(h, a, opts);
    if (h === my || a === my) myResult = r;
    return r;
  });
  commitWeek(weekResults, myResult, snapshot);
}

/* ---------------- Challenge modes ---------------- */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function startChallenge(kind) {
  if (kind === "daily") {
    const ds = new Date().toISOString().slice(0, 10);
    const seed = strHash("FM-" + ds);
    const realRandom = Math.random;
    Math.random = mulberry32(seed); // deterministic world: same squads, fixtures, draws for everyone today
    try { newGame(seed % PL_SIZE); } finally { Math.random = realRandom; }
    G.challenge = "daily";
    G.challengeDate = ds;
    G.board.chosen = true; G.board.choice = "daily";
    save(); render();
    return;
  }
  if (kind === "rescue") {
    newGame(0);
    G.challenge = "rescue";
    // the first half of the season happens without you...
    const me = G.myClub;
    G.myClub = -1;
    for (let wk = 0; wk < 19; wk++) {
      const snapshot = snapshotStatuses();
      G.results.push(G.fixtures[wk].map(([h, a]) => simMatch(h, a, {})));
      G.week++;
      applyDecay(snapshot);
    }
    // ...and you inherit whoever is bottom, in the January window
    const t = tableStats();
    G.myClub = t[t.length - 1].i;
    G.formation = "4-4-2"; G.mentality = "Balanced"; G.style = "Balanced";
    G.lineup = bestXI(G.squads[G.myClub], G.formation);
    G.budget = Math.max(5, Math.round((10 + (CLUBS[G.myClub].base - 70) * 3) * 0.6));
    setWageCap();
    G.board = { conf: 45, exp: 17, grace: 25, chosen: true, choice: "rescue" };
    G.cups.lc.alive = "out"; G.cups.fa.alive = "out"; // the old manager's messes
    G.euro = null;
    G.sponsor = { name: "Crown Logistics", base: Math.max(3, sponsorRep() - 4), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 1 };
    G.sponsorOffers = null;
    G.dealsKey = null; // a fresh January window awaits
    save(); render();
    return;
  }
  if (kind === "takeover") {
    const candidates = [...Array(PL_SIZE).keys()].filter(i => CLUBS[i].base <= 77);
    newGame(candidates[Math.floor(Math.random() * candidates.length)]);
    G.challenge = "takeover";
    G.budget = 400;
    G.wcap = Math.round(wageCapFormula() * 1.6);
    G.board = { conf: 70, exp: 1, grace: 6, chosen: true, choice: "takeover" };
    save(); render();
    return;
  }
  if (kind === "youth") {
    newGame(4); // Brighton — the model academy club
    G.challenge = "youth";
    G.board = { conf: 65, exp: 6, grace: 6, chosen: true, choice: "youth" };
    save(); render();
  }
}

function challengeVerdict(myPos) { // called at season end; returns banner line or ""
  if (!G.challenge) return "";
  const done = label => {
    G.honours.push("Season " + G.season + ": 🎖 " + label);
    G.challenge = null;
    return `<p style="color:var(--amber)"><b>🎖 CHALLENGE COMPLETE: ${label}</b></p>`;
  };
  const fail = msg => { G.challenge = null; return `<p style="color:var(--red)"><b>Challenge over:</b> ${msg}</p>`; };
  if (G.challenge === "rescue") {
    return myPos <= 17 ? done("Relegation Rescue — kept them up from the bottom of the table")
                       : fail("relegated. Some rescues are beyond anyone.");
  }
  if (G.challenge === "takeover") {
    if (myPos === 1) return done("The Takeover — title delivered in season " + G.season);
    if (G.season >= 2) return fail("two seasons, no title. The owner's jet is waiting.");
    return `<p class="note">🎖 The Takeover: the owner expects the title <b>next season</b>. No excuses.</p>`;
  }
  if (G.challenge === "youth") {
    if (myPos <= 6) return done("Youth Project — top six with a transfer ban");
    if (G.season >= 3) return fail("three seasons without cracking the top six. The project ends.");
    return `<p class="note">🎖 Youth Project: top six needed within ${3 - G.season} more season${3 - G.season > 1 ? "s" : ""}. Academy and loans only.</p>`;
  }
  if (G.challenge === "daily") {
    G.challenge = null;
    return `<p style="color:var(--amber)"><b>🎖 Daily Challenge ${esc(G.challengeDate || "")} complete — you finished #${myPos}.</b> Download your season card and compare with friends who played today's world.</p>`;
  }
  return "";
}

function evPick(filter, n) {
  const pool = G.squads[G.myClub].filter(p => !p.loan && (!filter || filter(p)));
  const out = [];
  while (out.length < (n || 1) && pool.length) out.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  return out;
}
function bumpForm(p, d) { if (p) p.form = Math.max(-2, Math.min(2, (p.form || 0) + d)); }

function generateEvent() {
  const keys = Object.keys(EVENT_DEFS).sort(() => rnd() - 0.5);
  for (const key of keys) {
    const built = EVENT_DEFS[key].build();
    if (built) {
      G.event = { key, ctx: built.ctx, text: built.text, choices: built.choices, auto: built.auto };
      return;
    }
  }
}
function decideEvent(i) {
  const e = G.event;
  if (!e || !EVENT_DEFS[e.key]) return;
  G.eventNews = "📰 " + EVENT_DEFS[e.key].resolve(e.ctx, i);
  G.event = null;
  save(); render();
}
function autoResolveEvent() { // played on without deciding — the passive option happens
  const e = G.event;
  if (!e || !EVENT_DEFS[e.key]) return;
  G.eventNews = "📰 (Unattended) " + EVENT_DEFS[e.key].resolve(e.ctx, e.auto);
  G.event = null;
}

/* ---------------- Other English clubs in Europe ---------------- */

function resolveEuroRivals() { // their campaigns settle at season's end
  G.euroRivalNews = [];
  for (const r of (G.euroRivals || [])) {
    const base = CLUBS[r.i].base;
    const winP = Math.max(0.3, Math.min(0.72, 0.35 + (base - 76) * 0.025));
    let label;
    const roll = rnd();
    if (roll > winP * 0.6 + 0.45) label = "went out in the league phase";
    else if (roll >= winP * 0.6 && rnd() > winP) label = "lost in the knockout play-offs";
    else {
      const rounds = ["the Round of 16", "the quarter-finals", "the semi-finals", "the final"];
      let k = 0;
      while (k < 4 && rnd() < winP) k++;
      if (k === 4 && G.euro && G.euro.comp === r.comp && G.euro.stage === "won") k = 3; // you took that trophy
      label = k === 4 ? "🏆 WON the " + COMP_NAME[r.comp] + "!" : "went out in " + rounds[k];
    }
    r.done = label;
    G.euroRivalNews.push("🌍 " + CLUBS[r.i].name + " (" + COMP_NAME[r.comp] + ") " + label);
  }
}
function assignEuroRivals(finalT) {
  const rivals = [];
  finalT.slice(0, 6).forEach((row, idx) => {
    if (row.i === G.myClub) return;
    rivals.push({ i: row.i, comp: idx < 4 ? "UCL" : idx === 4 ? "UEL" : "UECL", done: null });
  });
  G.euroRivals = rivals;
}

/* ---------------- Sponsorship ---------------- */

const SPONSOR_NAMES = ["Volt Energy", "Nimbus Cloud", "Harbour Finance", "AeroJet Airways", "DragonPay",
  "Stellar Telecom", "RedLion Brewery", "Velocity Motors", "TigerPay", "Apex Insurance",
  "Borealis Hotels", "Summit Sports", "Crown Logistics", "Meridian Bank"];

function sponsorRep() { // commercial appeal: stature + recent success
  let rep = (CLUBS[G.myClub].base - 64) * 1.3;
  const lastSeason = (G.career || [])[Math.max(0, (G.career || []).length - 1)];
  if (lastSeason && lastSeason.club === CLUBS[G.myClub].name) rep += Math.max(0, (21 - lastSeason.pos) * 0.4);
  rep += (G.honours || []).filter(h => h.startsWith("Season " + (G.season - 1) + ":")).length * 5;
  if (G.euro) rep += G.euro.comp === "UCL" ? 4 : 2;
  return Math.max(3, Math.round(rep));
}
function ensureSponsorOffers() {
  if (G.sponsor || G.week !== 0) return;
  if (G.sponsorOffers && G.sponsorOffers.length) return;
  const rep = sponsorRep();
  const names = [...SPONSOR_NAMES].sort(() => rnd() - 0.5);
  G.sponsorOffers = [
    { name: names[0], kind: "guaranteed", base: Math.round(rep * 1.0), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 3,
      blurb: "£" + Math.round(rep) + "M/yr guaranteed for 3 years. Safe money, no strings." },
    { name: names[1], kind: "performance", base: Math.round(rep * 0.6), winBonus: 0.3, top4Bonus: 8, trophyBonus: 10, years: 2,
      blurb: "£" + Math.round(rep * 0.6) + "M/yr base + £0.3M per league win + £8M for top four + £10M per trophy. Back yourself." },
    { name: names[2], kind: "short", base: Math.round(rep * 0.85), winBonus: 0, top4Bonus: 0, trophyBonus: 0, years: 1,
      blurb: "£" + Math.round(rep * 0.85) + "M/yr for one year only — renegotiate from strength after a big season." },
  ];
  save();
}
function signSponsor(i) {
  const o = (G.sponsorOffers || [])[i];
  if (!o || G.sponsor) return;
  G.sponsor = { name: o.name, base: o.base, winBonus: o.winBonus, top4Bonus: o.top4Bonus, trophyBonus: o.trophyBonus, years: o.years };
  G.sponsorOffers = null;
  G.budget += o.base; // year one, paid up front
  G.deals = G.deals || [];
  G.deals.unshift("🤝 Signed " + o.name + " as shirt sponsor — £" + o.base + "M banked for year one");
  save(); render();
}
function defaultSponsor() { // playing on without choosing = take the guaranteed money
  if (G.week === 0 && !G.sponsor) {
    ensureSponsorOffers();
    if (G.sponsorOffers && G.sponsorOffers.length) signSponsor(0);
  }
}

/* ---------------- The board: expectations, confidence, the sack ---------------- */

function expectedPos(clubIdx) {
  const ranked = [...G.league].sort((a, b) => CLUBS[b].base - CLUBS[a].base);
  return ranked.indexOf(clubIdx) + 1;
}
function boardOptions() {
  const natural = expectedPos(G.myClub);
  const opts = [];
  const ambTarget = Math.max(1, natural - 4);
  if (ambTarget < natural) {
    opts.push({ kind: "ambitious", target: ambTarget,
      title: "🔥 Promise them the moon",
      desc: "Target: " + expectationText(ambTarget) + ". The board releases a war chest of +£" + ambitionBonus() + "M — but you will be judged against this all season." });
  }
  opts.push({ kind: "realistic", target: natural,
    title: "🤝 A sensible season",
    desc: "Target: " + expectationText(natural) + ". No promises, no extras. The board nods." });
  const conTarget = Math.min(PL_SIZE, natural + 4);
  if (conTarget > natural) {
    opts.push({ kind: "conservative", target: conTarget,
      title: "🛡 Manage expectations down",
      desc: "Target: " + expectationText(conTarget) + ". An easier yardstick — but the board keeps 25% of your transfer budget back." });
  }
  return opts;
}
function ambitionBonus() { return 10 + Math.round((CLUBS[G.myClub].base - 70) * 1.5); }

function setExpectation(kind) {
  if (!G.board || G.board.chosen) return;
  const opt = boardOptions().find(o => o.kind === kind);
  if (!opt) return;
  G.board.exp = opt.target;
  G.board.choice = kind;
  G.board.chosen = true;
  if (kind === "ambitious") G.budget = (G.budget || 0) + ambitionBonus();
  if (kind === "conservative") G.budget = Math.round((G.budget || 0) * 0.75);
  save(); render();
}
function defaultExpectation() { // playing on without choosing = the sensible option
  if (G.board && !G.board.chosen) { G.board.choice = "realistic"; G.board.chosen = true; }
  defaultSponsor();
  if (G.event) autoResolveEvent();
}

function expectationText(e) {
  return e <= 2 ? "challenge for the title" :
         e <= 4 ? "qualify for the Champions League" :
         e <= 7 ? "push for European football" :
         e <= 12 ? "a solid top-half finish" :
         e <= 16 ? "comfortable mid-table safety" : "avoid relegation at all costs";
}
function boardBump(n) {
  if (!G.board) return;
  G.board.conf = Math.max(0, Math.min(100, G.board.conf + n));
}

function checkSack() {
  if (!G.board || G.week <= (G.board.grace || 6)) return false;
  if (G.board.conf > 5) return false;
  // dismissed — struggling clubs come calling
  const t = tableStats();
  const strugglers = t.slice(10).map(r => r.i).filter(i => i !== G.myClub);
  const offers = [];
  while (offers.length < 3 && strugglers.length) {
    const k = Math.floor(rnd() * strugglers.length);
    offers.push(strugglers.splice(k, 1)[0]);
  }
  G.offers = offers;
  G.screen = "sacked";
  return true;
}

function takeJob(clubIdx) {
  if (!G.offers || !G.offers.includes(clubIdx)) return;
  const oldClub = G.myClub;
  G.myClub = clubIdx;
  // in the cup brackets, you now ARE the new club: swap the entrant identities
  for (const key of ["lc", "fa"]) {
    const c = G.cups && G.cups[key];
    if (!c || !c.remaining) continue;
    for (const e of c.remaining) {
      if (e.kind === "league" && e.idx === clubIdx) { e.idx = oldClub; }
    }
    if (c.opp && c.opp.kind === "league" && c.opp.idx === clubIdx) { c.opp = null; }
  }
  G.euro = null;                 // the European campaign stayed with your old club
  G.budget = Math.max(5, 10 + (CLUBS[clubIdx].base - 70) * 3);
  G.sponsor = null; G.sponsorOffers = null; G.sponsorNews = null; // the deal stayed with your old club
  setWageCap();
  G.board = { conf: 60, exp: expectedPos(clubIdx), grace: G.week + 6, chosen: true };
  G.formation = "4-4-2"; G.mentality = "Balanced";
  G.lineup = bestXI(G.squads[clubIdx], G.formation);
  delete G.offers;
  G.screen = "main"; G.tab = "squad";
  save(); render();
}

function renderSacked() {

/* ---------------- Match stats & player ratings ---------------- */

function makeGoalEvent(T, clubIdx) {
  const p = pickScorer(T);
  p.goals++;
  const k = Math.floor(rnd() * GOAL_LINES.length);
  let text = p.name + " " + GOAL_LINES[k] + "!";
  let zh = p.name + " " + GOAL_LINES_ZH[k] + "！";
  if (rnd() < 0.65 && T.xi.length > 1) {
    let a = pickScorer(T);
    for (let i = 0; i < 6 && a.id === p.id; i++) a = pickScorer(T);
    if (a.id !== p.id) {
      a.assists = (a.assists || 0) + 1;
      text += " (assist: " + a.name + ")";
      zh += "（助攻：" + a.name + "）";
    }
  }
  return { type: "goal", clubIdx, pid: p.id, who: p.name, text, zh };
}

/* Ratings out of 10 for everyone who appeared; resolved to names so the
   report survives transfers and squad churn. */
function matchRatings(hIdx, aIdx, hApp, aApp, events, hg, ag) {
  const rate = (clubIdx, appIds, gf, ga) => {
    const sq = G.squads[clubIdx];
    return appIds.map(id => {
      const p = sq.find(x => x.id === id);
      if (!p) return null;
      let v = 6.4 + (rnd() - 0.5);
      const n = { g: 0, y: 0, r: 0, pk: 0 };
      for (const e of events) {
        if (e.pid !== p.id) continue;
        if (e.type === "goal") { v += 1.0; n.g++; }
        if (e.type === "yellow") { v -= 0.3; n.y++; }
        if (e.type === "red") { v -= 1.5; n.r++; }
        if (e.type === "pkmiss") { v -= 0.8; n.pk++; }
      }
      n.a = events.filter(e => e.type === "goal" && e.text.includes("assist: " + p.name)).length;
      v += n.a * 0.6;
      if (ga === 0 && (p.pos === "GK" || p.pos === "DF")) v += 0.6;
      v += gf > ga ? 0.3 : gf < ga ? -0.3 : 0;
      return { name: p.name, pos: p.pos, club: clubIdx, val: Math.max(4, Math.min(10, Math.round(v * 10) / 10)),
               g: n.g, a: n.a, y: n.y, r: n.r, pk: n.pk };
    }).filter(Boolean);
  };
  const home = rate(hIdx, hApp, hg, ag);
  const away = rate(aIdx, aApp, ag, hg);
  const all = home.concat(away);
  const motm = all.reduce((best, r) => r.val > best.val ? r : best, all[0]);
  return { home, away, motm };
}

function synthStats(H, A, events, hIdx, aIdx) {
  const pH = Math.pow(H.mid, 1.3) / (Math.pow(H.mid, 1.3) + Math.pow(A.mid, 1.3)) + 0.02 + (H.poss || 0) - (A.poss || 0);
  const poss = Math.max(25, Math.min(75, Math.round(pH * 100 + (rnd() - 0.5) * 6)));
  const count = (clubIdx, type) => events.filter(e => e.clubIdx === clubIdx && e.type === type).length;
  const mk = (clubIdx, T) => {
    const goals = count(clubIdx, "goal"), chances = count(clubIdx, "chance") + count(clubIdx, "pkmiss");
    const shots = goals + chances + poisson(4 * (T.att / 80));
    return { shots, sot: goals + Math.round((shots - goals) * 0.4) };
  };
  const h = mk(hIdx, H), a = mk(aIdx, A);
  return { poss, hShots: h.shots, hSot: h.sot, aShots: a.shots, aSot: a.sot };
}

/* ---------------- Transfer market ---------------- */

function playerValue(p) {
  const ageF = p.age <= 23 ? 1.3 : p.age <= 27 ? 1.15 : p.age <= 30 ? 0.9 : p.age <= 33 ? 0.5 : 0.25;
  // potential is priced in for young players — wonderkids don't come cheap
  const headroom = Math.max(0, (p.pot || p.rating) - p.rating);
  const eff = p.rating + headroom * (p.age <= 23 ? 0.55 : p.age <= 27 ? 0.25 : 0);
  return Math.max(1, Math.round(0.08 * Math.pow(Math.max(1, eff - 55), 2.1) * ageF));
}
function windowOpen() {
  return G.week === 0 || (G.week >= 19 && G.week <= 22);
}
function clubTopRating(clubIdx) {
  return Math.max(...G.squads[clubIdx].map(p => p.rating));
}
function askPrice(clubIdx, p) {
  const premium = p.rating >= clubTopRating(clubIdx) ? 1.45 : 1.15;
  return Math.round(playerValue(p) * premium);
}
function canLeave(clubIdx, p) {
  const sq = G.squads[clubIdx];
  const cnt = pos => sq.filter(x => x.pos === pos && x.id !== p.id).length;
  const need = { GK: 2, DF: 5, MF: 5, FW: 3 };
  return sq.length - 1 >= 14 && cnt(p.pos) >= need[p.pos];
}

function ensureWindowDeals() {
  const key = G.season + ":" + (G.week === 0 ? "summer" : "jan");
  if (G.dealsKey === key) return;
  G.dealsKey = key;
  G.deals = [];
  // AI clubs trade among themselves to keep the market alive
  const pool = CLUBS.map((c, i) => i).filter(i => i !== G.myClub && i !== EURO_SLOT);
  for (let n = 0; n < 9; n++) {
    const from = pool[Math.floor(rnd() * pool.length)];
    const to = pool[Math.floor(rnd() * pool.length)];
    if (from === to || G.squads[to].length >= 23) continue;
    const top = clubTopRating(from);
    // squad players move between AI clubs; superstars stay put
    const sellable = G.squads[from].filter(p => p.rating < top && p.rating <= 80 && canLeave(from, p));
    if (!sellable.length) continue;
    const p = sellable[Math.floor(rnd() * sellable.length)];
    G.squads[from] = G.squads[from].filter(x => x.id !== p.id);
    G.squads[to].push(p);
    G.deals.push(p.name + " — " + CLUBS[from].short + " → " + CLUBS[to].short + " (£" + playerValue(p) + "M)");
  }
  // ...and sometimes the phone rings about YOUR players
  G.offersIn = [];
  const candidates = [...G.squads[G.myClub]].filter(p => !p.loan).sort((a, b) => playerValue(b) - playerValue(a)).slice(0, 8);
  for (const p of candidates) {
    if (G.offersIn.length >= 3) break;
    const chance = p.rating >= 86 ? 0.5 : p.rating >= 80 ? 0.3 : 0.12;
    if (rnd() > chance) continue;
    let buyer;
    if (p.rating >= 84 && rnd() < 0.7) { // the continental giants circle your stars
      const ec = EURO_POOLS.UCL[Math.floor(rnd() * EURO_POOLS.UCL.length)];
      buyer = { name: ec[0], short: ec[1], col: ec[3] };
    } else {
      const others = G.league.filter(i => i !== G.myClub && CLUBS[i].base >= CLUBS[G.myClub].base - 6);
      const i = others.length ? others[Math.floor(rnd() * others.length)] : G.league.find(x => x !== G.myClub);
      buyer = { name: CLUBS[i].name, short: CLUBS[i].short, idx: i };
    }
    G.offersIn.push({ pid: p.id, buyer, fee: Math.round(playerValue(p) * (1.05 + rnd() * 0.45)) });
  }
  save();
}

function acceptOffer(pid) {
  if (!windowOpen()) return;
  const o = (G.offersIn || []).find(x => x.pid === pid);
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!o || !p || !canLeave(G.myClub, p)) return;
  if (typeof confirm === "function" && !confirm("Accept £" + o.fee + "M from " + o.buyer.name + " for " + p.name + "? This cannot be undone.")) return;
  G.squads[G.myClub] = G.squads[G.myClub].filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wageFor(p.rating, p.age); p.years = 2 + Math.floor(rnd() * 3);
  if (o.buyer.idx !== undefined && G.squads[o.buyer.idx].length < 25) G.squads[o.buyer.idx].push(p);
  G.budget += o.fee;
  G.lineup = validateLineup();
  G.offersIn = G.offersIn.filter(x => x.pid !== pid);
  G.deals.unshift("💸 You accepted £" + o.fee + "M from " + o.buyer.name + " for " + p.name);
  save(); render();
}
function rejectOffer(pid) {
  const o = (G.offersIn || []).find(x => x.pid === pid);
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!o) return;
  G.offersIn = G.offersIn.filter(x => x.pid !== pid);
  if (p && o.fee >= playerValue(p) * 1.3) {
    p.form = -2;
    G.deals.unshift("😤 " + p.name + " is unsettled after you rejected " + o.buyer.name + "'s £" + o.fee + "M bid");
  } else {
    G.deals.unshift("You rejected " + o.buyer.name + "'s £" + o.fee + "M bid for " + (p ? p.name : "your player"));
  }
  save(); render();
}

function buyPlayer(clubIdx, pid) {
  if (G.challenge === "youth") return; // transfer ban
  if (!windowOpen() || clubIdx === G.myClub || clubIdx === EURO_SLOT) return;
  const seller = G.squads[clubIdx];
  const p = seller.find(x => x.id === pid);
  if (!p || !canLeave(clubIdx, p)) return;
  const price = askPrice(clubIdx, p);
  if (price > G.budget || G.squads[G.myClub].length >= 25) return;
  if (wageBill() + wageFor(p.rating, p.age) > wageCap()) return;
  G.squads[clubIdx] = seller.filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wageFor(p.rating, p.age); p.years = 3;
  G.squads[G.myClub].push(p);
  G.budget -= price;
  G.deals.unshift("✍ You signed " + p.name + " from " + CLUBS[clubIdx].name + " for £" + price + "M");
  save(); render();
}

/* Loans: send a player out for the season — he plays regular football elsewhere
   and develops as if he'd made 25+ appearances. Returns next summer. */
function canLoanOut(p) {
  if (p.loan || !windowOpen()) return false;
  if (G.squads[G.myClub].filter(x => x.loan).length >= 4) return false;
  const floor = { GK: 2, DF: 5, MF: 5, FW: 3 };
  const availSamePos = G.squads[G.myClub].filter(x => x.pos === p.pos && available(x) && x.id !== p.id).length;
  return availSamePos >= floor[p.pos];
}
function loanOut(pid) {
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!p || !canLoanOut(p)) return;
  const hosts = CLUBS.map((c, i) => i).filter(i => i !== G.myClub && i !== EURO_SLOT && CLUBS[i].base <= CLUBS[G.myClub].base);
  const host = hosts[Math.floor(rnd() * hosts.length)];
  if (typeof confirm === "function" && !confirm("Loan " + p.name + " to " + CLUBS[host].name + " for the season? He'll be unavailable to you but will develop on regular football.")) return;
  p.loan = CLUBS[host].short;
  G.lineup = validateLineup();
  G.deals = G.deals || [];
  G.deals.unshift("🤝 " + p.name + " joins " + CLUBS[host].name + " on a season-long loan");
  save(); render();
}

function sellPlayer(pid) {
  if (!windowOpen()) return;
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!p || !canLeave(G.myClub, p)) return;
  const fee = Math.round(playerValue(p) * 0.9);
  if (typeof confirm === "function" && !confirm("Sell " + p.name + " (" + p.pos + ", rating " + p.rating + ") for £" + fee + "M? This cannot be undone.")) return;
  const buyers = CLUBS.map((c, i) => i)
    .filter(i => i !== G.myClub && i !== EURO_SLOT && G.squads[i].length < 24);
  const to = buyers[Math.floor(rnd() * buyers.length)];
  G.squads[G.myClub] = G.squads[G.myClub].filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wageFor(p.rating, p.age); p.years = 2 + Math.floor(rnd() * 3);
  G.squads[to].push(p);
  G.budget += fee;
  G.lineup = validateLineup();
  G.deals.unshift("💸 You sold " + p.name + " to " + CLUBS[to].name + " for £" + fee + "M");
  save(); render();
}

/* World stars: the named players at European clubs are signable too */
function strHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function foreignStars() {
  const out = [];
  for (const compKey of ["UCL", "UEL", "UECL"]) {
    for (const ec of EURO_POOLS[compKey]) {
      for (const [nm, pos] of ec[4]) {
        const key = nm + "@" + ec[1];
        if ((G.signedStars || []).includes(key)) continue;
        const h = strHash(key);
        out.push({ key, name: nm, pos, rating: Math.min(93, ec[2] + 3 + (h % 4)),
                   age: 22 + (h % 11), club: ec[0], short: ec[1], col: ec[3] });
      }
    }
  }
  return out;
}
function foreignAsk(s) {
  return Math.round(playerValue({ rating: s.rating, age: s.age, pot: s.rating }) * 1.35);
}
function buyForeign(key) {
  if (G.challenge === "youth") return; // transfer ban
  if (!windowOpen() || G.squads[G.myClub].length >= 25) return;
  const s = foreignStars().find(x => x.key === key);
  if (!s) return;
  const price = foreignAsk(s);
  if (price > G.budget) return;
  if (wageBill() + wageFor(s.rating, s.age) > wageCap()) return;
  const p = makePlayer(s.name, s.pos, s.rating, s.age);
  p.wage = wageFor(s.rating, s.age); p.years = 3;
  G.squads[G.myClub].push(p);
  G.budget -= price;
  G.signedStars = G.signedStars || [];
  G.signedStars.push(key);
  G.deals.unshift("🌍 You signed " + s.name + " from " + s.club + " for £" + price + "M — a statement to all of Europe");
  save(); render();
}

function renderTransfers() {
  const open = windowOpen();
  let html = `<div class="panel"><h2>💰 Transfer Market</h2>
    <p><b>Budget: £${G.budget}M</b> · Wages: <b style="color:${wageBill() > wageCap() ? "var(--red)" : "inherit"}">£${wageBill()}M/£${wageCap()}M</b> · Squad: ${G.squads[G.myClub].length}/25
    · Window: ${open ? `<span style="color:var(--pitch)">OPEN — ${G.week === 0 ? "summer window (closes at the first matchday)" : "January window (closes after week 23)"}</span>`
                     : `<span style="color:var(--red)">closed</span> — opens ${G.week < 19 ? "in January (after matchweek 19)" : "next summer"}`}</p>`;
  if (!open) {
    if ((G.deals || []).length) {
      html += `<h3>Last window's deals</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
    }
    return html + `</div>`;
  }
  ensureWindowDeals();
  // ---- incoming offers for your players ----
  const offers = (G.offersIn || []).filter(o => G.squads[G.myClub].some(p => p.id === o.pid));
  if (offers.length) {
    html += `<h3>📨 Offers received for your players</h3>
      <table><thead><tr><th>Player</th><th class="num">Rating</th><th>From</th><th class="num">Bid</th><th class="num">Value</th><th></th></tr></thead><tbody>` +
      offers.map(o => {
        const p = G.squads[G.myClub].find(x => x.id === o.pid);
        const ok = canLeave(G.myClub, p);
        const rich = o.fee >= playerValue(p) * 1.3;
        return `<tr><td>${esc(p.name)} <span class="pos-${p.pos}">${p.pos}</span></td>
          <td class="num">${p.rating}</td>
          <td>${o.buyer.idx !== undefined ? clubCrest(o.buyer.idx, 15) : crest(o.buyer.short, o.buyer.col || "#8A98A5", 15)}${esc(o.buyer.name)}</td>
          <td class="num"><b>£${o.fee}M</b>${rich ? " 🤑" : ""}</td><td class="num">£${playerValue(p)}M</td>
          <td>${ok ? `<button class="ghost" onclick="acceptOffer(${o.pid})">Accept</button>` : `<span class="note" title="Your squad would be too thin">—</span>`}
              <button class="ghost" onclick="rejectOffer(${o.pid})">Reject</button></td></tr>`;
      }).join("") + `</tbody></table>
      <p class="note">Rejecting a bid well above value may unsettle the player. Offers expire when the window closes.</p>`;
  }
  // ---- my squad (sell) ----
  const mine = [...G.squads[G.myClub]].sort((a, b) => effRating(b) - effRating(a));
  html += `<h3>Your squad — sell (you receive 90% of value)</h3>
    <table><thead><tr><th>Pos</th><th>Name</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Value</th><th></th></tr></thead><tbody>` +
    mine.map(p => {
      if (p.loan) return `<tr><td class="pos-${p.pos}">${p.pos}</td><td>${esc(p.name)}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td><td class="num">£${playerValue(p)}M</td>
        <td><span class="tag">on loan at ${esc(p.loan)}</span></td></tr>`;
      const ok = canLeave(G.myClub, p);
      const loanable = canLoanOut(p);
      return `<tr><td class="pos-${p.pos}">${p.pos}</td><td>${esc(p.name)}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td><td class="num">£${playerValue(p)}M</td>
        <td>${ok ? `<button class="ghost" onclick="sellPlayer(${p.id})">Sell £${Math.round(playerValue(p) * 0.9)}M</button>`
                 : `<span class="note" title="Selling would leave the squad too thin">—</span>`}
            ${loanable && p.rating < p.pot ? `<button class="ghost" onclick="loanOut(${p.id})" title="A season of regular football elsewhere — he develops as a regular starter">Loan out</button>` : ""}</td></tr>`;
    }).join("") + `</tbody></table>
    <p class="note">Loan out fringe youngsters (max 4) — a season of regular football develops them like first-team starters. They return next summer.</p>`;
  // ---- market (buy) ----
  if (G.challenge === "youth") {
    if ((G.deals || []).length) {
      html += `<h3>Done deals this window</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
    }
    return html + `<h3>Buy players</h3><p class="note">🎖 Youth Project: the board has imposed a <b>total transfer ban on incoming players</b>. Academy intakes and loans are your only tools. (Selling is permitted.)</p></div>`;
  }
  const filter = G.tfFilter || "All";
  const market = [];
  CLUBS.forEach((c, i) => {
    if (i === G.myClub || i === EURO_SLOT) return;
    for (const p of G.squads[i] || []) {
      if (filter !== "All" && p.pos !== filter) continue;
      market.push({ p, club: i });
    }
  });
  market.sort((x, y) => y.p.rating - x.p.rating);
  html += `<h3>Buy players</h3>
    <div class="row"><label>Position
      <select onchange="G.tfFilter=this.value;save();render()">` +
      ["All", "GK", "DF", "MF", "FW"].map(f => `<option${filter === f ? " selected" : ""}>${f}</option>`).join("") +
    `</select></label><span class="note">Top 50 by rating shown · clubs demand a premium for their star player</span></div>
    <table><thead><tr><th>Pos</th><th>Name</th><th>Club</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Pot</th><th class="num">Ask</th><th></th></tr></thead><tbody>` +
    market.slice(0, 50).map(({ p, club }) => {
      const price = askPrice(club, p);
      const wDemand = wageFor(p.rating, p.age);
      const sellerOk = canLeave(club, p);
      const wageOk = wageBill() + wDemand <= wageCap();
      const can = sellerOk && price <= G.budget && G.squads[G.myClub].length < 25 && wageOk;
      const why = !sellerOk ? "Their squad is too thin to sell" : price > G.budget ? "Beyond your budget" : !wageOk ? "His wages don't fit your wage budget" : G.squads[G.myClub].length >= 25 ? "Your squad is full" : "";
      return `<tr><td class="pos-${p.pos}">${p.pos}</td><td>${esc(p.name)}</td><td>${CLUBS[club].short}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td>
        <td class="num stars-bar">${potStars(p)}</td><td class="num">£${price}M<br><span class="note">£${wDemand}M/yr</span></td>
        <td>${can ? `<button class="ghost" onclick="buyPlayer(${club},${p.id})">Buy</button>` : `<span class="note" title="${why}">—</span>`}</td></tr>`;
    }).join("") + `</tbody></table>`;
  // ---- world stars (European clubs) ----
  const world = foreignStars().filter(s => filter === "All" || s.pos === filter)
    .sort((x, y) => y.rating - x.rating).slice(0, 40);
  html += `<h3>🌍 World stars — Europe's elite (35% world-record premium)</h3>
    <table><thead><tr><th>Pos</th><th>Name</th><th>Club</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Ask</th><th></th></tr></thead><tbody>` +
    world.map(s => {
      const price = foreignAsk(s);
      const wDemand = wageFor(s.rating, s.age);
      const wageOk = wageBill() + wDemand <= wageCap();
      const can = price <= G.budget && G.squads[G.myClub].length < 25 && wageOk;
      return `<tr><td class="pos-${s.pos}">${s.pos}</td><td>${esc(s.name)}</td>
        <td>${crest(s.short, s.col, 15)}${esc(s.club)}</td>
        <td class="num">${s.age}</td><td class="num">${s.rating}</td><td class="num">£${price}M<br><span class="note">£${wDemand}M/yr</span></td>
        <td>${can ? `<button class="ghost" onclick="buyForeign('${s.key.replace(/'/g, "\\'")}')">Buy</button>` : `<span class="note" title="${price > G.budget ? "Beyond your budget" : !wageOk ? "His wages don't fit your wage budget" : "Your squad is full"}">—</span>`}</td></tr>`;
    }).join("") + `</tbody></table>`;
  if ((G.deals || []).length) {
    html += `<h3>Done deals this window</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
  }
  return html + `</div>`;
}

/* ---------------- Domestic cups (FA Cup & League Cup) ---------------- */

const CUP_NAME = { fa: "FA Cup", lc: "League Cup" };
const CUP_PRIZE = { fa: 10, lc: 6 };

/* lower-league opposition for early rounds — the banana skins */
const MINNOWS = [
  ["Luton Town","LUT",68,"#F78F1E"], ["Norwich City","NOR",68,"#FFCD00"], ["West Brom","WBA",68,"#0A2A5C"],
  ["Coventry City","COV",68,"#5BC2E7"], ["Middlesbrough","MID",67,"#C8102E"], ["Derby County","DER",67,"#F5F5F5"],
  ["Hull City","HUL",66,"#F18A00"], ["Stoke City","STK",66,"#C8102E"], ["Blackburn Rovers","BLB",66,"#2B6BB5"],
  ["Millwall","MWL",66,"#0A2A5C"], ["Preston North End","PNE",65,"#F5F5F5"], ["Bolton Wanderers","BOL",65,"#1B4D9C"],
  ["Portsmouth","POM",66,"#064DA1"], ["Plymouth Argyle","PLY",64,"#0A4D3C"], ["Oxford United","OXF",64,"#FFCD00"],
  ["Charlton Athletic","CHA",63,"#C8102E"], ["Stockport County","STO",61,"#1B4D9C"], ["Wycombe Wanderers","WYC",60,"#0C3B5E"],
  ["Exeter City","EXE",60,"#C8102E"], ["Bradford City","BRA",59,"#7A263A"],
  ["Bristol City","BRC",64,"#E03A3E"], ["Cardiff City","CAR",64,"#0070B5"], ["Swansea City","SWA",64,"#F5F5F5"],
  ["Watford","WAT",64,"#FBEE23"], ["QPR","QPR",63,"#1D5BA4"], ["Sheffield Wednesday","SHW",62,"#4681CF"],
  ["Reading","REA",60,"#004494"], ["Wigan Athletic","WIG",59,"#1D59AF"], ["Barnsley","BNS",58,"#D71920"],
  ["Lincoln City","LIN",58,"#D31145"], ["Rotherham United","ROT",57,"#DD1E3E"], ["Doncaster Rovers","DON",56,"#D71920"],
  ["Notts County","NCO",56,"#F5F5F5"], ["Mansfield Town","MFD",56,"#F9A01B"], ["Crawley Town","CRW",55,"#D71920"],
  ["Walsall","WAL",55,"#D71920"], ["Carlisle United","CRL",55,"#1D59AF"], ["Grimsby Town","GRI",55,"#1D1D1D"],
];

/* Each cup is a real bracket: a full field enters round one, every tie is
   played, and the tournament resolves to a winner even after you exit. */

function entrantUid(e) { return e.kind === "me" ? "ME" : e.kind === "league" ? "L" + e.idx : "M" + e.m; }
function entrantName(e) { return e.kind === "me" ? CLUBS[G.myClub].name : e.kind === "league" ? CLUBS[e.idx].name : MINNOWS[e.m][0]; }
function entrantBase(e) { return e.kind === "me" ? CLUBS[G.myClub].base : e.kind === "league" ? CLUBS[e.idx].base : MINNOWS[e.m][2]; }

function buildCupField(size) {
  const field = [{ kind: "me" }];
  for (let i = 0; i < EURO_SLOT; i++) if (i !== G.myClub) field.push({ kind: "league", idx: i });
  const minnowIdxs = MINNOWS.map((m, i) => i);
  while (field.length < size && minnowIdxs.length) {
    const k = Math.floor(rnd() * minnowIdxs.length);
    field.push({ kind: "minnow", m: minnowIdxs.splice(k, 1)[0] });
  }
  return field.slice(0, size);
}

function initCups() {
  G.cups = {
    lc: { r: 0, alive: true, results: [], opp: null, history: [], winner: null,
      remaining: buildCupField(32), rounds: [
      { week: 4, label: "Round 3" }, { week: 8, label: "Round 4" }, { week: 13, label: "Quarter-final" },
      { week: 21, label: "Semi-final" }, { week: 26, label: "Final" }] },
    fa: { r: 0, alive: true, results: [], opp: null, history: [], winner: null,
      remaining: buildCupField(64), rounds: [
      { week: 16, label: "Round 3" }, { week: 20, label: "Round 4" }, { week: 25, label: "Round 5" },
      { week: 29, label: "Quarter-final" }, { week: 31, label: "Semi-final" }, { week: 35, label: "Final" }] },
  };
}

function drawMyCupOpp(c, r) {
  const isFinal = r === c.rounds.length - 1;
  const pool = c.remaining.filter(e => e.kind !== "me" && !(e.kind === "league" && e.idx === G.myClub));
  const e = pool[Math.floor(rnd() * pool.length)];
  const home = isFinal ? true : rnd() < 0.5; // finals at a neutral venue (Wembley)
  if (e.kind === "minnow") {
    const m = MINNOWS[e.m];
    return { kind: "minnow", uid: entrantUid(e), name: m[0], short: m[1], base: m[2], col: m[3], home };
  }
  return { kind: "league", uid: entrantUid(e), idx: e.idx, name: CLUBS[e.idx].name, short: CLUBS[e.idx].short, base: CLUBS[e.idx].base, home };
}

/* play one full round among `entrants` (no user involvement); returns {ties, survivors} */
function simCupRound(entrants) {
  const pool = [...entrants];
  const ties = [], survivors = [];
  while (pool.length >= 2) {
    const a = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    const b = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    let [ga, gb] = euroScore(entrantBase(a), entrantBase(b));
    let note = "";
    if (ga === gb) { if (rnd() < 0.5) ga++; else gb++; note = " (pens)"; }
    ties.push(entrantName(a) + " " + ga + "–" + gb + " " + entrantName(b) + note);
    survivors.push(ga > gb ? a : b);
  }
  survivors.push(...pool); // odd one out gets a bye (shouldn't happen with even fields)
  return { ties, survivors };
}

function dueCup() {
  if (!G.cups) return null;
  for (const key of ["lc", "fa"]) {
    const c = G.cups[key];
    if (!c || c.alive !== true) continue;
    const rd = c.rounds[c.r];
    if (rd && G.week === rd.week) {
      if (!c.opp) { c.opp = drawMyCupOpp(c, c.r); save(); }
      return { cupKey: key, label: CUP_NAME[key] + " · " + rd.label, opp: c.opp,
               home: c.opp.home, isFinal: c.r === c.rounds.length - 1 };
    }
  }
  return null;
}

function setCupOpponent(opp) {
  CLUBS[EURO_SLOT].name = opp.name;
  CLUBS[EURO_SLOT].short = opp.short;
  CLUBS[EURO_SLOT].base = opp.base;
  CLUBS[EURO_SLOT].col = opp.col;
  G.squads[EURO_SLOT] = genEuroSquad([opp.name, opp.short, opp.base, opp.col, []]);
  G.guestClub = { name: opp.name, short: opp.short, base: opp.base, col: opp.col };
}

function cupOppIdx(fix) {
  if (fix.opp.kind === "league") return fix.opp.idx;
  setCupOpponent(fix.opp);
  return EURO_SLOT;
}

function commitCup(fix, r, pens) {
  ghQueueSync();
  r.dateMs = matchDateMs(fix.cupKey, G.week);
  const c = G.cups[fix.cupKey];
  const myG = fix.home ? r.hg : r.ag, opG = fix.home ? r.ag : r.hg;
  let note = "";
  let win = myG > opG;
  if (myG === opG) {
    const oppIdx = fix.opp.kind === "league" ? fix.opp.idx : EURO_SLOT;
    const so = pens || simShootoutClubs(G.myClub, oppIdx);
    win = so.myWin;
    note = so.note;
    r.events = (r.events || []).concat(shootoutEvents(so, G.myClub, oppIdx));
  }
  const roundLabel = c.rounds[c.r].label;
  c.results.push({ label: roundLabel, opp: fix.opp.name, myG, opG, home: fix.home, note });
  // resolve the rest of the round's draw
  const others = (c.remaining || []).filter(e => entrantUid(e) !== "ME" && entrantUid(e) !== fix.opp.uid);
  const rest = simCupRound(others);
  const myTie = CLUBS[G.myClub].name + " " + myG + "–" + opG + " " + fix.opp.name + (note.includes("penalties") ? " (pens)" : "");
  c.history.push({ label: roundLabel, myTie, ties: rest.ties });
  const myTieWinner = win ? { kind: "me" } : (c.remaining || []).find(e => entrantUid(e) === fix.opp.uid);
  c.remaining = rest.survivors.concat(myTieWinner ? [myTieWinner] : []);
  if (win) {
    c.r++; c.opp = null;
    if (c.r >= c.rounds.length) {
      c.alive = "won";
      c.winner = CLUBS[G.myClub].name;
      G.honours.push("Season " + G.season + ": " + CUP_NAME[fix.cupKey] + " winners");
      G.budget = (G.budget || 0) + CUP_PRIZE[fix.cupKey];
      boardBump(12);
      note += " — 🏆 " + CUP_NAME[fix.cupKey].toUpperCase() + " WINNERS! (£" + CUP_PRIZE[fix.cupKey] + "M prize)";
    } else {
      boardBump(c.r >= c.rounds.length - 2 ? 3 : 1.5);
      if (fix.opp.kind === "minnow" && fix.opp.base < 65) note += " — no banana skin today.";
    }
  } else {
    c.alive = "out";
    boardBump(fix.opp.kind === "minnow" ? -8 : -3);
    if (fix.opp.kind === "minnow") note += " — a giant-killing! The press will not be kind.";
    // the tournament carries on without you
    c.r++;
    while (c.r < c.rounds.length && c.remaining.length > 1) {
      const rd = simCupRound(c.remaining);
      c.history.push({ label: c.rounds[c.r].label, myTie: null, ties: rd.ties });
      c.remaining = rd.survivors;
      c.r++;
    }
    if (c.remaining.length === 1) c.winner = entrantName(c.remaining[0]);
  }
  G.lastMatch = r;
  G.lastMatchEuro = "cup";
  G.lastMatchLabel = CUP_NAME[fix.cupKey] + " · " + c.results[c.results.length - 1].label + note;
  G.live = null;
  G.screen = "matchResult";
  save(); render();
}

function playCupQuick() {
  const fix = dueCup();
  if (!fix || G.live || dueEuro()) return;
  G.lineup = validateLineup();
  const oppIdx = cupOppIdx(fix);
  const h = fix.home ? G.myClub : oppIdx, a = fix.home ? oppIdx : G.myClub;
  const opts = {};
  if (fix.home) { opts.hXI = G.lineup; opts.hMent = G.mentality; opts.hForm = G.formation; opts.hStyle = G.style || "Balanced"; }
  else { opts.aXI = G.lineup; opts.aMent = G.mentality; opts.aForm = G.formation; opts.aStyle = G.style || "Balanced"; }
  commitCup(fix, simMatch(h, a, opts));
}

function startCupLive() {
  const fix = dueCup();
  if (!fix || G.live || dueEuro()) return;
  G.lineup = validateLineup();
  const oppIdx = cupOppIdx(fix);
  const h = fix.home ? G.myClub : oppIdx, a = fix.home ? oppIdx : G.myClub;
  const aiXI = bestXI(G.squads[oppIdx], "4-4-2");
  const L = {
    h, a,
    hXI: fix.home ? [...G.lineup] : aiXI,
    aXI: fix.home ? aiXI : [...G.lineup],
    hMent: fix.home ? G.mentality : "Balanced",
    aMent: fix.home ? "Balanced" : G.mentality,
    hForm: fix.home ? G.formation : aiTactics(oppIdx).form,
    aForm: fix.home ? aiTactics(oppIdx).form : G.formation,
    hStyle: fix.home ? (G.style || "Balanced") : aiTactics(oppIdx).style,
    aStyle: fix.home ? aiTactics(oppIdx).style : (G.style || "Balanced"),
    events: [{ min: 0, type: "info", text: fix.isFinal ? "Kick-off at Wembley — cup final day!" : "Kick-off — cup tie under way!", zh: fix.isFinal ? "溫布萊開波——盃賽決賽日！" : "開波——盃賽周中夜！" }],
    elsewhere: [], otherResults: [], snapshot: null,
    minute: 0, phase: "first", subsUsed: 0, aiSubs: 0, windows: 0, winPending: false,
    manage: false, notice: null, speed: "normal",
    reds: {}, endMin: 91 + Math.floor(rnd() * 4), cupFix: fix, cupLabel: fix.label,
    stats: { t: 0, hp: 0, hShots: 0, aShots: 0, hSot: 0, aSot: 0 },
  };
  L.hApp = [...L.hXI]; L.aApp = [...L.aXI];
  L.weather = getWeather();
  if (L.weather !== "clear") {
    L.events.push({ min: 0, type: "info", text: WEATHER[L.weather].icon + " Conditions: " + WEATHER[L.weather].name + " — " + WEATHER[L.weather].note, zh: wxLineZH(L.weather) });
  }
  G.live = L;
  liveCacheDirty();
  G.screen = "live";
  save(); render(); // begins paused at 0' — press ▶ Kick off when ready
}

function renderHall() {
  const hon = G.honours || [], motm = G.motm || [], car = G.career || [];
  const bestPos = car.length ? Math.min(...car.map(c => c.pos)) : null;
  return `<div class="panel"><h2>🏛 Hall of Fame</h2>
    <p class="note">Seasons managed: <b>${G.season}</b> · Trophies: <b>${hon.length}</b> ·
       Manager of the Month awards: <b>${motm.length}</b>${bestPos ? ` · Best league finish: <b>#${bestPos}</b>` : ""}</p>
    <h3>Trophy cabinet</h3>
    ${hon.length
      ? `<p>${hon.map(h => "🏆 " + esc(withYears(h))).join("<br>")}</p>`
      : `<p class="note">Empty. The shelf is dusted and waiting.</p>`}
    <h3>🏅 Manager of the Month</h3>
    ${motm.length
      ? `<p class="note">${motm.map(m => esc(withYears(m))).join("<br>")}</p>`
      : `<p class="note">None yet — string four big results together.</p>`}
    <h3>Career history</h3>
    ${car.length
      ? `<table><thead><tr><th>Season</th><th>Club</th><th class="num">Finish</th><th>Silverware</th></tr></thead><tbody>` +
        [...car].reverse().map(c => `<tr><td class="num">${seasonYears(c.s)}</td><td>${esc(c.club)}</td>
          <td class="num">#${c.pos}</td><td class="note">${esc(c.notes || "—") || "—"}</td></tr>`).join("") +
        `</tbody></table>`
      : `<p class="note">Your first season is still being written.</p>`}
  </div>`;
}

function renderCups() {
  let html = `<div class="panel"><h2>🏆 Domestic Cups</h2>`;
  for (const key of ["lc", "fa"]) {
    const c = G.cups[key];
    const status =
      c.alive === "won" ? `🏆 <b>${CUP_NAME[key]} WINNERS!</b>` :
      c.alive === "out" ? `Out of the ${CUP_NAME[key]}.${c.winner ? ` Eventual winners: <b>${esc(c.winner)}</b>.` : ""}` :
      `In the ${CUP_NAME[key]} — ${c.rounds[c.r].label} on ${matchDateStr(key, c.rounds[c.r].week, undefined, true)} (after league week ${c.rounds[c.r].week})` +
        (c.opp ? ` vs <b>${esc(c.opp.name)}</b> ${c.opp.home ? "(H)" : "(A)"}${c.opp.kind === "minnow" ? " — lower-league opposition" : ""}` : " (draw to be made)") +
        ` · ${(c.remaining || []).length} clubs left in the hat`;
    html += `<h3>${CUP_NAME[key]}</h3><p>${status}</p>`;
    // round-by-round bracket results, newest first
    for (const rd of [...(c.history || [])].reverse()) {
      const shown = rd.ties.slice(0, 8);
      html += `<h3 style="font-size:12px">${esc(rd.label)}</h3>
        <p class="note" style="margin:2px 0 8px">` +
        (rd.myTie ? `<b style="color:var(--ink)">▶ ${esc(rd.myTie)}</b><br>` : "") +
        shown.map(esc).join("<br>") +
        (rd.ties.length > shown.length ? `<br>…and ${rd.ties.length - shown.length} more ties` : "") +
        `</p>`;
    }
  }
  return html + `</div>`;
}

/* ---------------- European competition engine ---------------- */

/* UEFA's Swiss-model format (2024/25 onward): 36 clubs in ONE league table,
   8 matchdays vs 8 different opponents (6 in the Conference League).
   Top 8 → Round of 16 directly; 9th–24th → knockout play-off; 25th+ out. */

function euroMDWeeks(comp) { return comp === "UECL" ? [3, 6, 9, 12, 15, 18] : [3, 5, 7, 9, 11, 14, 17, 18]; }
const EURO_KO_WEEKS = { playoff: 22, R16: 24, QF: 27, SF: 30, F: 34 };
const EURO_KO_LABEL = { playoff: "Knockout Play-off", R16: "Round of 16", QF: "Quarter-final", SF: "Semi-final", F: "FINAL" };
const EURO_KO_NEXT = { playoff: "R16", R16: "QF", QF: "SF", SF: "F", F: "won" };

function euroTuple(E, id) { // [name, short, base, col, stars]
  if (id[0] === "P") return EURO_POOLS[E.comp][+id.slice(1)];
  return EURO_EXTRA[+id.slice(1)];
}
function euroName(E, id) { return id === "me" ? CLUBS[G.myClub].name : euroTuple(E, id)[0]; }
function euroBase(E, id) { return id === "me" ? CLUBS[G.myClub].base : euroTuple(E, id)[2]; }

function initEuro(comp) {
  if (!comp) { G.euro = null; return; }
  const ids = ["me"];
  EURO_POOLS[comp].forEach((c, i) => ids.push("P" + i));
  const extras = EURO_EXTRA.map((c, i) => "X" + i);
  while (ids.length < 36 && extras.length) {
    ids.push(extras.splice(Math.floor(rnd() * extras.length), 1)[0]);
  }
  G.euro = {
    comp, format: 2, stage: "league",
    teams: ids.map(id => ({ id, pts: 0, gf: 0, ga: 0 })),
    played: 0, myOpps: [], results: [], ko: null, koPool: null, opp: null,
  };
}

function rankEuro(E) {
  return [...E.teams].sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

function dueEuro() {
  const E = G.euro;
  if (!E || E.stage === "out" || E.stage === "won") return null;
  if (E.stage === "league") {
    const wks = euroMDWeeks(E.comp);
    if (E.played >= wks.length || G.week !== wks[E.played]) return null;
    if (!E.opp) {
      const cands = E.teams.filter(t => t.id !== "me" && !E.myOpps.includes(t.id));
      const pick = cands[Math.floor(rnd() * cands.length)];
      const tu = euroTuple(E, pick.id);
      E.opp = { id: pick.id, name: tu[0], short: tu[1], base: tu[2], col: tu[3], home: E.played % 2 === 0 };
      save();
    }
    return { kind: "league", label: "League Phase · Matchday " + (E.played + 1) + " of " + wks.length, opp: E.opp, home: E.opp.home };
  }
  if (EURO_KO_WEEKS[E.stage] === G.week) {
    if (!E.opp) {
      const pool = E.koPool || [];
      const id = pool[Math.floor(rnd() * pool.length)];
      if (id === undefined) { E.stage = "out"; save(); return null; }
      const tu = euroTuple(E, id);
      E.opp = { id, name: tu[0], short: tu[1], base: tu[2], col: tu[3], home: E.stage === "F" ? true : rnd() < 0.5 };
      save();
    }
    return { kind: E.stage, label: EURO_KO_LABEL[E.stage], opp: E.opp, home: E.opp.home };
  }
  return null;
}

let euroPid = 0;
function genEuroSquad(ec) {
  let [name, short, base, col, stars] = ec;
  const squad = [];
  euroPid = 0;
  const mk = (nm, pos, rating) => {
    const age = 21 + Math.floor(rnd() * 12);
    return { id: 900000 + (euroPid++), name: nm, pos, rating, pot: rating, age,
      wage: wageFor(rating, age), years: 3, fitness: 100, form: 0, injury: 0, ban: 0, yellows: 0, goals: 0, assists: 0, apps: 0 };
  };
  // stars you've signed away no longer turn out for their old club
  stars = (stars || []).filter(([nm]) => !(G && (G.signedStars || []).includes(nm + "@" + short)));
  const used = new Set(stars.map(s => s[0]));
  const filler = () => {
    for (let i = 0; i < 40; i++) {
      const n = "ABCDEFGHIJLMNPRSTV"[Math.floor(rnd() * 18)] + ". " + EURO_NAMES[Math.floor(rnd() * EURO_NAMES.length)];
      if (!used.has(n)) { used.add(n); return n; }
    }
    return "A. " + EURO_NAMES[0];
  };
  const counts = { GK: 2, DF: 6, MF: 6, FW: 4 };
  const starBy = { GK: [], DF: [], MF: [], FW: [] };
  for (const [nm, pos] of stars) starBy[pos].push(nm);
  for (const pos of ["GK", "DF", "MF", "FW"]) {
    starBy[pos].forEach(nm => squad.push(mk(nm, pos, base + 3 + Math.floor(rnd() * 3))));
    for (let i = starBy[pos].length; i < counts[pos]; i++) {
      squad.push(mk(filler(), pos, base - 3 + Math.floor(rnd() * 6)));
    }
  }
  return squad;
}

function setEuroGuest(opp) {
  const tu = euroTuple(G.euro, opp.id);
  CLUBS[EURO_SLOT].name = tu[0];
  CLUBS[EURO_SLOT].short = tu[1];
  CLUBS[EURO_SLOT].base = tu[2];
  CLUBS[EURO_SLOT].col = tu[3];
  G.squads[EURO_SLOT] = genEuroSquad(tu);
  G.guestClub = { name: tu[0], short: tu[1], base: tu[2], col: tu[3] };
}

function euroScore(a, b) {
  const ratio = a / b;
  return [poisson(1.35 * Math.pow(ratio, 2.2)), poisson(1.35 * Math.pow(1 / ratio, 2.2))];
}

/* one simulated round among the given ids: random pairs, losers eliminated */
function simEuroKORound(E, ids) {
  const pool = [...ids], winners = [];
  while (pool.length >= 2) {
    const a = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    const b = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    let [ga, gb] = euroScore(euroBase(E, a), euroBase(E, b));
    if (ga === gb) { if (rnd() < 0.5) ga++; else gb++; }
    winners.push(ga > gb ? a : b);
  }
  winners.push(...pool);
  return winners;
}

function commitEuro(fix, r, pens) {
  ghQueueSync();
  const E = G.euro;
  r.dateMs = matchDateMs(E.comp, G.week, E.played);
  const myG = fix.home ? r.hg : r.ag, opG = fix.home ? r.ag : r.hg;
  let note = "";
  if (fix.kind === "league") {
    // my result into the 36-team table
    const me = E.teams.find(t => t.id === "me"), op = E.teams.find(t => t.id === fix.opp.id);
    me.gf += myG; me.ga += opG; op.gf += opG; op.ga += myG;
    if (myG > opG) me.pts += 3; else if (myG < opG) op.pts += 3; else { me.pts++; op.pts++; }
    // ...and the other 17 ties of the matchday
    const others = E.teams.filter(t => t.id !== "me" && t.id !== fix.opp.id);
    while (others.length >= 2) {
      const a = others.splice(Math.floor(rnd() * others.length), 1)[0];
      const b = others.splice(Math.floor(rnd() * others.length), 1)[0];
      const [ga, gb] = euroScore(euroBase(E, a.id), euroBase(E, b.id));
      a.gf += ga; a.ga += gb; b.gf += gb; b.ga += ga;
      if (ga > gb) a.pts += 3; else if (gb > ga) b.pts += 3; else { a.pts++; b.pts++; }
    }
    E.played++;
    E.myOpps.push(fix.opp.id);
    E.opp = null;
    boardBump(myG > opG ? 1.5 : myG < opG ? -1 : 0.5);
    if (E.played === euroMDWeeks(E.comp).length) {
      const ranked = rankEuro(E).map(t => t.id);
      const myPos = ranked.indexOf("me") + 1;
      note = " — league phase over: finished #" + myPos + " of 36.";
      if (myPos <= 8) {
        // straight to the R16; 9th–24th contest the play-offs without you
        const playoffWinners = simEuroKORound(E, ranked.slice(8, 24));
        E.koPool = ranked.slice(0, 8).filter(id => id !== "me").concat(playoffWinners);
        E.stage = "R16"; note += " Straight into the Round of 16!"; boardBump(5);
      } else if (myPos <= 24) {
        E.koPool = ranked.slice(8, 24).filter(id => id !== "me");
        E.koTop8 = ranked.slice(0, 8);
        E.stage = "playoff"; note += " Into the knockout play-offs."; boardBump(1);
      } else {
        E.stage = "out"; note += " Eliminated."; boardBump(-5);
      }
    }
  } else {
    let win = myG > opG;
    if (myG === opG) {
      const so = pens || simShootoutClubs(G.myClub, EURO_SLOT);
      win = so.myWin;
      note = so.note;
      r.events = (r.events || []).concat(shootoutEvents(so, G.myClub, EURO_SLOT));
    }
    // the rest of the round resolves alongside your tie
    const others = (E.koPool || []).filter(id => id !== fix.opp.id);
    let survivors = simEuroKORound(E, others);
    if (!win) {
      E.stage = "out";
      boardBump(fix.kind === "F" ? -1 : -3);
      if (fix.kind === "F") note += " — runners-up.";
    } else if (fix.kind === "playoff") {
      E.koPool = (E.koTop8 || []).concat(survivors);
      E.stage = "R16"; boardBump(3); note += " — into the Round of 16!";
    } else if (fix.kind === "F") {
      E.stage = "won";
      G.honours.push("Season " + G.season + ": " + COMP_NAME[E.comp] + " winners");
      boardBump(15);
      note = " — CHAMPIONS OF EUROPE!";
    } else {
      E.koPool = survivors;
      E.stage = EURO_KO_NEXT[fix.kind];
      boardBump(fix.kind === "SF" ? 4 : 3);
    }
    E.opp = null;
  }
  E.results.push({ label: fix.label, opp: fix.opp.name, myG, opG, home: fix.home, note });
  G.lastMatch = r;
  G.lastMatchEuro = "euro";
  G.lastMatchLabel = COMP_NAME[E.comp] + " · " + fix.label + note;
  G.live = null;
  G.screen = "matchResult";
  save();
  render();
}

function playEuroQuick() {
  const fix = dueEuro();
  if (!fix || G.live) return;
  G.lineup = validateLineup();
  setEuroGuest(fix.opp);
  const h = fix.home ? G.myClub : EURO_SLOT, a = fix.home ? EURO_SLOT : G.myClub;
  const opts = {};
