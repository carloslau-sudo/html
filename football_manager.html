  }
  const my = WCS.myTeam, myName = WC_TEAMS[my][0];
  if (WCL) { // a live match is in progress
    const running = wclTimer != null;
    return `<div class="panel">
      <h2>🌎 ${WCS.stage === "group" ? "Group " + WC_GROUPS[WC_TEAMS[my][4]] : WC_ROUND_NAMES[WCS.ko.round]} — Live</h2>
      <div class="score-line" id="wcl-score">${wclScoreHtml()}</div>
      <div class="minute-badge" id="wcl-min">${WCL.phase === "ft" ? (LANG === "zh" ? "完場" : "FULL TIME") : fmtMin(WCL.minute) + "'"}</div>
      <div class="pitch-wrap">
        <canvas id="wc-pitch" width="760" height="498"></canvas>
        <button class="snd-btn" id="snd-btn" onclick="toggleSound()" title="Crowd sound on/off">${SND.on ? "🔊" : "🔇"}</button>
        ${langBtn("right:56px")}
      </div>
      ${WCL.phase === "ft"
        ? `<div class="row" style="justify-content:center"><button class="action" onclick="wclFinish()">Continue → result &amp; the other matches</button></div>`
        : `<div class="row" style="justify-content:center">
            <button class="${!running && WCL.minute === 0 ? "action" : "ghost"}" onclick="wclToggle()">${running ? "⏸ Pause" : "▶ Play"}</button>` +
            ["slow", "normal", "fast"].map(sp => `<button class="ghost${WCL.speed === sp ? " speed-on" : ""}" onclick="wclSpeed('${sp}')">${sp}</button>`).join("") +
            `<button class="ghost" onclick="wclSkip()">⏭ Full time</button>
            <button class="ghost" onclick="wclAbandon()" title="Abandon — nothing is recorded">✕</button>
          </div>`}
      <ul class="events" id="wcl-feed">${wclFeedHtml()}</ul>
    </div>`;
  }
  let html = `<div class="panel"><h2>🌎 World Cup ${(WCS.year || 2026)} — ${wcCrest(my, 24)}${esc(myName)}</h2>`;
  if (WCS.stage === "done") {
    const champs = WCS.champion === my;
    html += `<div class="banner"><h2>${champs ? "🏆 WORLD CHAMPIONS! 🏆" : "The tournament is over"}</h2>
      <p>${champs ? esc(myName) + " have won the World Cup! Immortality." :
        esc(WC_TEAMS[WCS.champion][0]) + " lift the trophy at MetLife." +
        (WCS.honoured ? "" : " Your run is over — but there is always the next one.")}</p>
      ${WCS.nat && WCS.natVerdict ? `<p class="note">${esc(WCS.natVerdict)}</p>` : ""}
      ${champs && WCS.honoured ? `<p class="note">🏛 Added to your career Hall of Fame.</p>` : ""}</div>`;
  } else {
    const opp = wcMyNextOpp();
    html += `<p class="note">📅 ${wcDateLabel()} · ${WCS.stage === "group"
      ? "Group " + WC_GROUPS[WC_TEAMS[my][4]] + " — matchday " + (WCS.md + 1) + " of 3"
      : WC_ROUND_NAMES[WCS.ko.round]}</p>`;
    if (opp !== null) {
      const stars = (WC_TEAMS[opp][6] || []).map(s => esc(s[0])).join(", ");
      html += `<div class="score-line">${wcCrest(my, 24)}${esc(myName)}<span class="vs">vs</span>${wcCrest(opp, 24)}${esc(WC_TEAMS[opp][0])}</div>
        <p class="note" style="text-align:center"><span class="stars-bar">${starBar(WC_TEAMS[opp][2] + 3)}</span> strength ${WC_TEAMS[opp][2]}${stars ? " · Danger: " + stars : ""}</p>
        <div class="row">
          <label>Formation <select onchange="wcSetTac('form', this.value)">${Object.keys(FORMATIONS).map(f => `<option${f === WCS.tac.form ? " selected" : ""}>${f}</option>`).join("")}</select></label>
          <label>Mentality <select onchange="wcSetTac('ment', this.value)">${MENTALITIES.map(m => `<option${m === WCS.tac.ment ? " selected" : ""}>${m}</option>`).join("")}</select></label>
          <label>Style <select onchange="wcSetTac('style', this.value)">${Object.keys(STYLES).map(st => `<option${st === WCS.tac.style ? " selected" : ""}>${st}</option>`).join("")}</select></label>
        </div>
        <div class="row">
          <button class="action" onclick="wcStartLive()">▶ Kick off — watch LIVE</button>
          <button class="ghost" onclick="wcPlayNext()" title="Instant result">Quick sim ${WCS.stage === "group" ? "matchday " + (WCS.md + 1) : WC_ROUND_NAMES[WCS.ko.round]}</button>
        </div>`;
    } else {
      html += `<p class="note">⛔ ${esc(myName)} are out of the tournament. You can still watch how it ends.</p>
        <div class="row"><button class="action" onclick="wcPlayNext()">▶ Continue — ${WCS.stage === "group" ? "matchday " + (WCS.md + 1) : WC_ROUND_NAMES[WCS.ko.round]}</button></div>`;
    }
  }
  if (WCS.lastMatch) {
    html += `<h3>Your last match</h3><div class="score-line">${wcScoreLine(WCS.lastMatch)}</div>
      <details class="fold"><summary>📋 Match timeline</summary>${wcFeedHtml(WCS.lastMatch)}</details>`;
  }
  if (WCS.stage === "group" || WCS.results.length) {
    html += `<details class="fold"${WCS.stage === "group" ? " open" : ""}><summary>Group ${WC_GROUPS[WC_TEAMS[my][4]]} table</summary>${wcGroupTableHtml(WC_TEAMS[my][4])}</details>`;
  }
  if (WCS.ko && WCS.ko.log.length) {
    html += `<details class="fold" open><summary>🏆 Knockout results</summary>` +
      WCS.ko.log.map(rd => `<h3>${rd.label || WC_ROUND_NAMES[rd.round]}</h3><p class="note">` +
        rd.matches.map(m => `${wcCrest(m.a, 14)}${esc(WC_TEAMS[m.a][0])} <b>${m.ag}–${m.bg}</b> ${esc(WC_TEAMS[m.b][0])}${wcCrest(m.b, 14).replace("margin-right: 6px", "")}${m.note || ""}`).join("<br>")
      + `</p>`).join("") + `</details>`;
  }
  if ((WCS.results || []).length) {
    html += `<details class="fold"><summary>📋 All group-stage results (${WCS.results.length * 24} matches)</summary>` +
      WCS.results.map((mdRes, md) => `<h3>Matchday ${md + 1} · ${WC_DATES[md]}</h3><p class="note">` +
        WC_GROUPS.split("").map((L, g) => {
          const ms = mdRes.filter(m => WC_TEAMS[m.a][4] === g);
          return `<b>Group ${L}:</b> ` + ms.map(m =>
            `${esc(WC_TEAMS[m.a][1])} ${m.ag}–${m.bg} ${esc(WC_TEAMS[m.b][1])}`).join(" · ");
        }).join("<br>") + `</p>`).join("") + `</details>`;
  }
  // tournament golden boot
  const boot = [];
  WCS.squads.forEach((sq, ti) => sq.forEach(p => { if (p.goals > 0) boot.push({ p, ti }); }));
  boot.sort((x, y) => y.p.goals - x.p.goals);
  if (boot.length) {
    html += `<details class="fold"><summary>👟 Golden Boot race</summary><p class="note">` +
      boot.slice(0, 10).map((s, i) => `${i + 1}. ${esc(s.p.name)} (${WC_TEAMS[s.ti][1]}) — ${s.p.goals}`).join("<br>") + `</p></details>`;
  }
  html += `<div class="row" style="margin-top:12px">
    <button class="ghost" onclick="wcExit()">← Back to your career</button>
    <button class="ghost" onclick="wcReset()">Start a new World Cup</button>
  </div></div>`;
  return html;
}

/* ---------------- Boot ---------------- */
applyDB();
if (load()) {
  if (G.live) {
    // resume the live match exactly where it was saved, paused
    G.screen = "live";
    liveCacheDirty();
  } else {
    G.screen = G.week >= G.fixtures.length ? "seasonEnd" : "main";
  }
}
render();
ghStartupCheck();
</script>
</body>
</html>
