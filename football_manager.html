/* ---------------- Match stats & player ratings ---------------- */

function makeGoalEvent(T, clubIdx) {
  const p = pickScorer(T);
  p.goals++;
  const k = Math.floor(rnd() * GOAL_LINES.length);
  let text = p.name + " " + GOAL_LINES[k] + "!";
  let zh = p.name + " " + GOAL_LINES_ZH[k] + "！";
  if (rnd() < 0.65 && T.xi.length > 1) {
    let a = pickScorer(T);
    for (let i = 0; i < 6 && a.id === p.id; i++) a = pickScorer(T);
    if (a.id !== p.id) {
      a.assists = (a.assists || 0) + 1;
      text += " (assist: " + a.name + ")";
      zh += "（助攻：" + a.name + "）";
    }
  }
  return { type: "goal", clubIdx, pid: p.id, who: p.name, text, zh };
}

/* Ratings out of 10 for everyone who appeared; resolved to names so the
   report survives transfers and squad churn. */
function matchRatings(hIdx, aIdx, hApp, aApp, events, hg, ag) {
  const rate = (clubIdx, appIds, gf, ga) => {
    const sq = G.squads[clubIdx];
    return appIds.map(id => {
      const p = sq.find(x => x.id === id);
      if (!p) return null;
      let v = 6.4 + (rnd() - 0.5);
      const n = { g: 0, y: 0, r: 0, pk: 0 };
      for (const e of events) {
        if (e.pid !== p.id) continue;
        if (e.type === "goal") { v += 1.0; n.g++; }
        if (e.type === "yellow") { v -= 0.3; n.y++; }
        if (e.type === "red") { v -= 1.5; n.r++; }
        if (e.type === "pkmiss") { v -= 0.8; n.pk++; }
      }
      n.a = events.filter(e => e.type === "goal" && e.text.includes("assist: " + p.name)).length;
      v += n.a * 0.6;
      if (ga === 0 && (p.pos === "GK" || p.pos === "DF")) v += 0.6;
      v += gf > ga ? 0.3 : gf < ga ? -0.3 : 0;
      return { name: p.name, pos: p.pos, club: clubIdx, val: Math.max(4, Math.min(10, Math.round(v * 10) / 10)),
               g: n.g, a: n.a, y: n.y, r: n.r, pk: n.pk };
    }).filter(Boolean);
  };
  const home = rate(hIdx, hApp, hg, ag);
  const away = rate(aIdx, aApp, ag, hg);
  const all = home.concat(away);
  const motm = all.reduce((best, r) => r.val > best.val ? r : best, all[0]);
  return { home, away, motm };
}

function synthStats(H, A, events, hIdx, aIdx) {
  const pH = Math.pow(H.mid, 1.3) / (Math.pow(H.mid, 1.3) + Math.pow(A.mid, 1.3)) + 0.02 + (H.poss || 0) - (A.poss || 0);
  const poss = Math.max(25, Math.min(75, Math.round(pH * 100 + (rnd() - 0.5) * 6)));
  const count = (clubIdx, type) => events.filter(e => e.clubIdx === clubIdx && e.type === type).length;
  const mk = (clubIdx, T) => {
    const goals = count(clubIdx, "goal"), chances = count(clubIdx, "chance") + count(clubIdx, "pkmiss");
    const shots = goals + chances + poisson(4 * (T.att / 80));
    return { shots, sot: goals + Math.round((shots - goals) * 0.4) };
  };
  const h = mk(hIdx, H), a = mk(aIdx, A);
  return { poss, hShots: h.shots, hSot: h.sot, aShots: a.shots, aSot: a.sot };
}

/* ---------------- Transfer market ---------------- */

function playerValue(p) {
  const ageF = p.age <= 23 ? 1.3 : p.age <= 27 ? 1.15 : p.age <= 30 ? 0.9 : p.age <= 33 ? 0.5 : 0.25;
  // potential is priced in for young players — wonderkids don't come cheap
  const headroom = Math.max(0, (p.pot || p.rating) - p.rating);
  const eff = p.rating + headroom * (p.age <= 23 ? 0.55 : p.age <= 27 ? 0.25 : 0);
  return Math.max(1, Math.round(0.08 * Math.pow(Math.max(1, eff - 55), 2.1) * ageF));
}
function windowOpen() {
  return G.week === 0 || (G.week >= 19 && G.week <= 22);
}
function clubTopRating(clubIdx) {
  return Math.max(...G.squads[clubIdx].map(p => p.rating));
}
function askPrice(clubIdx, p) {
  const premium = p.rating >= clubTopRating(clubIdx) ? 1.45 : 1.15;
  const ask0 = Math.round(playerValue(p) * premium);
  return p.clause && p.clause > 0 ? Math.min(p.clause, ask0) : ask0; // a release clause caps the fee
}
function canLeave(clubIdx, p) {
  if (p.loanFrom !== undefined) return false; // a loanee can't be sold or poached
  const sq = G.squads[clubIdx];
  const cnt = pos => sq.filter(x => x.pos === pos && x.id !== p.id).length;
  const need = { GK: 2, DF: 5, MF: 5, FW: 3 };
  return sq.length - 1 >= 14 && cnt(p.pos) >= need[p.pos];
}

function ensureWindowDeals() {
  const key = G.season + ":" + (G.week === 0 ? "summer" : "jan");
  if (G.dealsKey === key) return;
  G.dealsKey = key;
  G.deals = [];
  G.tfSearch = ""; G.tfShowAll = false; G.tfFilter = "All"; // a new window starts with clean, scoped filters
  // AI clubs trade among themselves to keep the market alive
  const pool = CLUBS.map((c, i) => i).filter(i => i !== G.myClub && i !== EURO_SLOT);
  for (let n = 0; n < 9; n++) {
    const from = pool[Math.floor(rnd() * pool.length)];
    const to = pool[Math.floor(rnd() * pool.length)];
    if (from === to || G.squads[to].length >= 23) continue;
    const top = clubTopRating(from);
    // squad players move between AI clubs; superstars stay put
    const sellable = G.squads[from].filter(p => p.rating < top && p.rating <= 80 && canLeave(from, p));
    if (!sellable.length) continue;
    const p = sellable[Math.floor(rnd() * sellable.length)];
    G.squads[from] = G.squads[from].filter(x => x.id !== p.id);
    G.squads[to].push(p);
    G.deals.push(p.name + " — " + CLUBS[from].short + " → " + CLUBS[to].short + " (£" + playerValue(p) + "M)");
  }
  // ...and sometimes the phone rings about YOUR players
  G.offersIn = [];
  const candidates = [...G.squads[G.myClub]].filter(p => !p.loan && p.loanFrom === undefined).sort((a, b) => playerValue(b) - playerValue(a)).slice(0, 8);
  for (const p of candidates) {
    if (G.offersIn.length >= 3) break;
    const chance = (p.clause && p.clause <= playerValue(p) * 1.2 ? 0.65 : 0) || (p.rating >= 86 ? 0.5 : p.rating >= 80 ? 0.3 : 0.12);
    if (rnd() > chance) continue;
    let buyer;
    if (p.rating >= 84 && rnd() < 0.7) { // the continental giants circle your stars
      const ec = EURO_POOLS.UCL[Math.floor(rnd() * EURO_POOLS.UCL.length)];
      buyer = { name: ec[0], short: ec[1], col: ec[3] };
    } else {
      const others = G.league.filter(i => i !== G.myClub && CLUBS[i].base >= CLUBS[G.myClub].base - 6);
      const i = others.length ? others[Math.floor(rnd() * others.length)] : G.league.find(x => x !== G.myClub);
      buyer = { name: CLUBS[i].name, short: CLUBS[i].short, idx: i };
    }
    G.offersIn.push({ pid: p.id, buyer, fee: Math.round(playerValue(p) * (1.05 + rnd() * 0.45)) });
  }
  save();
}

function acceptOffer(pid) {
  if (!windowOpen()) return;
  const o = (G.offersIn || []).find(x => x.pid === pid);
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!o || !p || !canLeave(G.myClub, p)) return;
  if (typeof confirm === "function" && !confirm("Accept £" + o.fee + "M from " + o.buyer.name + " for " + p.name + "? This cannot be undone.")) return;
  G.squads[G.myClub] = G.squads[G.myClub].filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wageFor(p.rating, p.age); p.years = 2 + Math.floor(rnd() * 3);
  if (o.buyer.idx !== undefined && G.squads[o.buyer.idx].length < 25) G.squads[o.buyer.idx].push(p);
  adjBudget(o.fee, "Sold " + p.name + " to " + o.buyer.name, "transfer_in");
  G.lineup = validateLineup();
  G.offersIn = G.offersIn.filter(x => x.pid !== pid);
  G.deals.unshift("💸 You accepted £" + o.fee + "M from " + o.buyer.name + " for " + p.name);
  save(); render();
}
function rejectOffer(pid) {
  const o = (G.offersIn || []).find(x => x.pid === pid);
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!o) return;
  G.offersIn = G.offersIn.filter(x => x.pid !== pid);
  if (p && o.fee >= playerValue(p) * 1.3) {
    p.form = -2;
    G.deals.unshift("😤 " + p.name + " is unsettled after you rejected " + o.buyer.name + "'s £" + o.fee + "M bid");
  } else {
    G.deals.unshift("You rejected " + o.buyer.name + "'s £" + o.fee + "M bid for " + (p ? p.name : "your player"));
  }
  const rp = G.squads[G.myClub].find(x => x.id === pid);
  const ro = (G.offersIn || []).find(o => o.pid === pid);
  if (rp) rp.morale = Math.max(30, (rp.morale === undefined ? 75 : rp.morale) - (rp.clause && ro && ro.fee >= rp.clause ? 25 : 12));
  save(); render();
}

function requestFunds() {
  if (G.fundKey === G.season || !G.board) return;
  G.fundKey = G.season;
  const conf = G.board.conf;
  if (rnd() * 100 < conf) { // the chairman opens the chequebook — and expects results
    const amount = 10 + Math.round(conf / 8) + Math.round(rnd() * 8);
    adjBudget(amount, "Board grant (transfer funds)", "funds");
    boardBump(-4);
    G.eventNews = "💷 The board grants you an extra £" + amount + "M. \"Spend it well — we'll be watching.\" (−4 confidence: expectations just rose.)";
  } else {
    boardBump(-2);
    G.eventNews = "🚪 \"The cupboard is bare.\" The board refuses your request — and didn't love being asked. (−2 confidence.)";
  }
  save(); render();
}

function buyPlayer(clubIdx, pid) {
  if (G.challenge === "youth") return; // transfer ban
  if (!windowOpen() || clubIdx === G.myClub || clubIdx === EURO_SLOT) return;
  const seller = G.squads[clubIdx];
  const p = seller.find(x => x.id === pid);
  if (!p || !canLeave(clubIdx, p)) return;
  const price = askPrice(clubIdx, p);
  if (price > G.budget || G.squads[G.myClub].length >= 25) return;
  if (wageBill() + wageFor(p.rating, p.age) > wageCap()) return;
  const wAgreed = negotiateWage(p.name, wageFor(p.rating, p.age));
  if (wAgreed === null) return;
  if (wageBill() + wAgreed > wageCap()) { if (typeof alert === "function") alert("That wage would burst your cap."); return; }
  G.squads[clubIdx] = seller.filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wAgreed; p.years = 3;
  G.squads[G.myClub].push(p);
  adjBudget(-price, "Bought " + p.name + " from " + CLUBS[clubIdx].name, "transfer_out");
  G.deals.unshift("✍ You signed " + p.name + " from " + CLUBS[clubIdx].name + " for £" + price + "M" +
    (p.injury ? " — ⚠ he arrives injured and needs " + p.injury + " week" + (p.injury > 1 ? "s" : "") + " to recover" :
     p.ban ? " — ⚠ he arrives suspended (" + p.ban + " match ban carries over)" : ""));
  save(); render();
}

/* Loans: send a player out for the season — he plays regular football elsewhere
   and develops as if he'd made 25+ appearances. Returns next summer. */
function canLoanOut(p) {
  if (p.loan || p.loanFrom !== undefined || !windowOpen()) return false;
  if (G.squads[G.myClub].filter(x => x.loan).length >= 4) return false;
  const floor = { GK: 2, DF: 5, MF: 5, FW: 3 };
  const availSamePos = G.squads[G.myClub].filter(x => x.pos === p.pos && available(x) && x.id !== p.id).length;
  return availSamePos >= floor[p.pos];
}
function loanOut(pid) {
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!p || !canLoanOut(p)) return;
  const hosts = CLUBS.map((c, i) => i).filter(i => i !== G.myClub && i !== EURO_SLOT && CLUBS[i].base <= CLUBS[G.myClub].base);
  const host = hosts[Math.floor(rnd() * hosts.length)];
  if (typeof confirm === "function" && !confirm("Loan " + p.name + " to " + CLUBS[host].name + " for the season? He'll be unavailable to you but will develop on regular football.")) return;
  p.loan = CLUBS[host].short;
  G.lineup = validateLineup();
  G.deals = G.deals || [];
  G.deals.unshift("🤝 " + p.name + " joins " + CLUBS[host].name + " on a season-long loan");
  save(); render();
}

/* Loan IN: borrow a young player for the season - no fee, you pay his wage, he
   counts toward your 25-man squad, and he returns to his parent club next summer.
   Up to 3 at a time. The lower the division, the bigger the lifeline. */
function canLoanIn() {
  return windowOpen()
    && G.squads[G.myClub].length < 25
    && G.squads[G.myClub].filter(x => x.loanFrom !== undefined).length < 3;
}
function loanTargets() {
  const myBase = CLUBS[G.myClub].base;
  const out = [];
  for (let i = 0; i < EURO_SLOT; i++) {
    if (i === G.myClub) continue;
    const sq = G.squads[i]; if (!sq || !sq.length) continue;
    const topId = [...sq].sort((a, b) => b.rating - a.rating)[0].id; // the club's best man is not loanable
    for (const p of sq) {
      if (p.id === topId || p.loan || p.loanFrom !== undefined || !available(p)) continue;
      if (p.age > 24) continue;                       // loans are for developing players
      if (p.rating < myBase - 8 || p.rating > myBase + 7) continue;
      out.push({ p, club: i });
    }
  }
  return out.sort((a, b) => b.p.rating - a.p.rating);
}
function loanIn(fromClub, pid) {
  if (!canLoanIn()) return;
  const sq = G.squads[fromClub]; if (!sq) return;
  const p = sq.find(x => x.id === pid);
  if (!p || p.loan || p.loanFrom !== undefined || !available(p)) return;
  const wage = p.wage || wageFor(p.rating, p.age);
  if (wageBill() + wage > wageCap()) { if (typeof alert === "function") alert("That loan wage would burst your cap (£" + wageCap() + "M). Trim wages first."); return; }
  if (typeof confirm === "function" && !confirm("Take " + p.name + " on a season-long loan from " + CLUBS[fromClub].name + "? You pay his £" + wage + "M/yr wage; he returns to them next summer.")) return;
  G.squads[fromClub] = sq.filter(x => x.id !== p.id);
  p.loanFrom = fromClub; p.wage = wage; p.loan = null;
  G.squads[G.myClub].push(p);
  G.lineup = validateLineup();
  G.deals = G.deals || [];
  G.deals.unshift("🤝 " + p.name + " joins on a season-long loan from " + CLUBS[fromClub].name);
  save(); render();
}

function sellPlayer(pid) {
  if (!windowOpen()) return;
  const p = G.squads[G.myClub].find(x => x.id === pid);
  if (!p || !canLeave(G.myClub, p)) return;
  const fee = Math.round(playerValue(p) * 0.9);
  if (typeof confirm === "function" && !confirm("Sell " + p.name + " (" + (p.role || p.pos) + ", rating " + p.rating + ") for £" + fee + "M? This cannot be undone.")) return;
  const buyers = CLUBS.map((c, i) => i)
    .filter(i => i !== G.myClub && i !== EURO_SLOT && G.squads[i].length < 24);
  const to = buyers[Math.floor(rnd() * buyers.length)];
  G.squads[G.myClub] = G.squads[G.myClub].filter(x => x.id !== pid);
  p.fitness = 100; p.form = 0;
  p.wage = wageFor(p.rating, p.age); p.years = 2 + Math.floor(rnd() * 3);
  G.squads[to].push(p);
  adjBudget(fee, "Sold " + p.name + " to " + CLUBS[to].name, "transfer_in");
  G.lineup = validateLineup();
  G.deals.unshift("💸 You sold " + p.name + " to " + CLUBS[to].name + " for £" + fee + "M");
  save(); render();
}

/* World stars: the named players at European clubs are signable too */
function strHash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function foreignStars() {
  const out = [];
  for (const compKey of ["UCL", "UEL", "UECL"]) {
    for (const ec of EURO_POOLS[compKey]) {
      for (const [nm, pos] of ec[4]) {
        const key = nm + "@" + ec[1];
        if ((G.signedStars || []).includes(key)) continue;
        const h = strHash(key);
        const pick = { GK: ["GK"], DF: ["CB", "LB", "RB", "CB"], MF: ["CM", "CDM", "CAM", "CM"], FW: ["ST", "LW", "RW", "ST", "CF"] }[pos];
        out.push({ key, name: nm, pos, role: pick[h % pick.length], rating: Math.min(93, ec[2] + 3 + (h % 4)),
                   age: 22 + (h % 11), club: ec[0], short: ec[1], col: ec[3] });
      }
    }
  }
  return out;
}
function foreignAsk(s) {
  return Math.round(playerValue({ rating: s.rating, age: s.age, pot: s.rating }) * 1.35);
}
function buyForeign(key) {
  if (G.challenge === "youth") return; // transfer ban
  if (!windowOpen() || G.squads[G.myClub].length >= 25) return;
  const s = foreignStars().find(x => x.key === key);
  if (!s) return;
  const price = foreignAsk(s);
  if (price > G.budget) return;
  if (wageBill() + wageFor(s.rating, s.age) > wageCap()) return;
  const wAgreed = negotiateWage(s.name, wageFor(s.rating, s.age));
  if (wAgreed === null) return;
  if (wageBill() + wAgreed > wageCap()) { if (typeof alert === "function") alert("That wage would burst your cap."); return; }
  const p = makePlayer(s.name, s.pos, s.rating, s.age);
  p.role = s.role || roleFor(s.pos, G.squads[G.myClub]);
  p.wage = wAgreed; p.years = 3;
  G.squads[G.myClub].push(p);
  adjBudget(-price, "Bought " + s.name + " (foreign signing)", "transfer_out");
  G.signedStars = G.signedStars || [];
  G.signedStars.push(key);
  G.deals.unshift("🌍 You signed " + s.name + " from " + s.club + " for £" + price + "M — a statement to all of Europe");
  save(); render();
}

function genFreeAgent() {
  const pos = ["GK", "DF", "DF", "MF", "MF", "FW", "FW"][Math.floor(rnd() * 7)];
  const veteran = rnd() < 0.7;
  const age = veteran ? 28 + Math.floor(rnd() * 8) : 18 + Math.floor(rnd() * 4); // mostly released veterans, some young unsigned
  const rating = 56 + Math.floor(rnd() * 20); // 56-75 — useful across every division
  const nm = LOWER_INIT[Math.floor(rnd() * LOWER_INIT.length)] + ". " + LOWER_SURN[Math.floor(rnd() * LOWER_SURN.length)];
  const p = makePlayer(nm, pos, rating, age, LINE_ROLES[pos][0]);
  p.pot = Math.min(94, rating + (age <= 21 ? 8 + Math.floor(rnd() * 8) : 1)); // veterans have no ceiling left
  p.years = 0; // unattached
  return p;
}
function topUpFreeAgents(min) {
  G.freeAgents = G.freeAgents || [];
  let g = 0;
  while (G.freeAgents.length < (min || 14) && g++ < 60) G.freeAgents.push(genFreeAgent());
  if (G.freeAgents.length > 30) G.freeAgents = G.freeAgents.slice(0, 30);
}
function signFreeAgent(id) {
  if (!windowOpen()) return;
  const idx = (G.freeAgents || []).findIndex(p => p.id === id);
  if (idx < 0) return;
  const p = G.freeAgents[idx];
  if (G.squads[G.myClub].length >= 25) { if (typeof alert === "function") alert("Your squad is full (25). Sell or release someone first."); return; }
  const wage = p.wage || wageFor(p.rating, p.age);
  if (wageBill() + wage > wageCap()) { if (typeof alert === "function") alert("That wage would burst your cap (£" + wageCap() + "M). Trim the wage bill first."); return; }
  let yrs = 2;
  if (typeof prompt === "function") {
    const t = prompt("Sign " + p.name + " on a free transfer at £" + wage + "M/yr. Contract length? (1 to 4)", "2");
    if (t === null) return;
    yrs = Math.max(1, Math.min(4, Math.round(parseFloat(t) || 0) || 2));
  }
  p.years = yrs; p.wage = wage; p.fitness = 100; p.form = 0; p.morale = 75;
  p.goals = 0; p.assists = 0; p.apps = 0; p.yellows = 0; p.injury = 0; p.ban = 0;
  G.freeAgents.splice(idx, 1);
  G.squads[G.myClub].push(p);
  G.deals = G.deals || [];
  G.deals.unshift("🆓 " + p.name + " signed on a FREE transfer (£" + wage + "M/yr, " + yrs + "y)");
  save(); render();
}
function renderTransfers() {
  const open = windowOpen();
  if (G.freeAgents === undefined) { G.freeAgents = []; if (open) topUpFreeAgents(14); }
  let html = `<div class="panel"><h2>💰 Transfer Market</h2>
    <p><b>Budget: £${G.budget}M</b> · Wages: <b style="color:${wageBill() > wageCap() ? "var(--red)" : "inherit"}">£${wageBill()}M/£${wageCap()}M</b> · Squad: ${G.squads[G.myClub].length}/25
    · Window: ${open ? `<span style="color:var(--pitch)">OPEN — ${G.week === 0 ? "summer window (closes at the first matchday)" : "January window (closes after week 23)"}</span>`
                     : `<span style="color:var(--red)">closed</span> — opens ${G.week < 19 ? "in January (after matchweek 19)" : "next summer"}`}</p>`;
  if (!open) {
    if ((G.deals || []).length) {
      html += `<h3>Last window's deals</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
    }
    return html + `</div>`;
  }
  ensureWindowDeals();
  // 🤲 once a season, you can go to the board cap-in-hand
  if (G.fundKey !== G.season) {
    html += `<p><button class="ghost" onclick="requestFunds()">🤲 Ask the board for more transfer funds</button>
      <span class="note">One request per season. Your odds ride on board confidence (${Math.round(G.board ? G.board.conf : 0)}%).</span></p>`;
  }
  // 🚨 deadline day: the January window's final week goes feral
  if (G.week === 22 && G.dlKey !== G.season) {
    G.dlKey = G.season;
    const pool = CLUBS.map((c, i) => i).filter(i => i !== G.myClub && i !== EURO_SLOT);
    for (let n = 0; n < 4; n++) {
      const from = pool[Math.floor(rnd() * pool.length)], to = pool[Math.floor(rnd() * pool.length)];
      if (from === to) continue;
      const p = G.squads[from].filter(q => canLeave(from, q))[0];
      if (!p) continue;
      G.squads[from] = G.squads[from].filter(q => q.id !== p.id); G.squads[to].push(p);
      G.deals.unshift("🚨 DEADLINE: " + p.name + " — " + CLUBS[from].short + " → " + CLUBS[to].short + " (£" + playerValue(p) + "M)");
    }
    const tgt = [...G.squads[G.myClub]].filter(q => !q.loan).sort((x, y) => playerValue(y) - playerValue(x))[0];
    if (tgt && rnd() < 0.7) {
      G.offersIn = (G.offersIn || []).concat([{ pid: tgt.id, fee: Math.round(playerValue(tgt) * 1.45),
        buyer: { name: "Paris Saint-Germain", short: "PSG", col: "#004170" } }]);
    }
    save();
  }
  if (G.week === 22) html += `<p style="color:var(--amber)"><b>🚨 DEADLINE DAY</b> — the window slams shut after this matchweek. Panic money is flying.</p>`;
  // ---- incoming offers for your players ----
  const offers = (G.offersIn || []).filter(o => G.squads[G.myClub].some(p => p.id === o.pid));
  if (offers.length) {
    html += `<h3>📨 Offers received for your players</h3>
      <table><thead><tr><th>Pos</th><th>Player</th><th class="num">Rating</th><th>From</th><th class="num">Bid</th><th class="num">Value</th><th></th></tr></thead><tbody>` +
      offers.map(o => {
        const p = G.squads[G.myClub].find(x => x.id === o.pid);
        const ok = canLeave(G.myClub, p);
        const rich = o.fee >= playerValue(p) * 1.3;
        return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${esc(p.name)}</td>
          <td class="num">${p.rating}</td>
          <td>${o.buyer.idx !== undefined ? clubCrest(o.buyer.idx, 15) : crest(o.buyer.short, o.buyer.col || "#8A98A5", 15)}${esc(o.buyer.name)}</td>
          <td class="num"><b>£${o.fee}M</b>${rich ? " 🤑" : ""}</td><td class="num">£${playerValue(p)}M</td>
          <td>${ok ? `<button class="ghost" onclick="acceptOffer(${o.pid})">Accept</button>` : `<span class="note" title="Your squad would be too thin">—</span>`}
              <button class="ghost" onclick="rejectOffer(${o.pid})">Reject</button></td></tr>`;
      }).join("") + `</tbody></table>
      <p class="note">Rejecting a bid well above value may unsettle the player. Offers expire when the window closes.</p>`;
  }
  // ---- my squad (sell) ----
  const mine = [...G.squads[G.myClub]].sort((a, b) => effRating(b) - effRating(a));
  html += `<h3>Your squad — sell (you receive 90% of value)</h3>
    <table><thead><tr><th>Pos</th><th>Name</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Value</th><th></th></tr></thead><tbody>` +
    mine.map(p => {
      if (p.loanFrom !== undefined) return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${esc(p.name)}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td><td class="num">£${playerValue(p)}M</td>
        <td><span class="tag" style="color:#3D7DC8">on loan from ${esc(CLUBS[p.loanFrom].short)}</span></td></tr>`;
      if (p.loan) return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${esc(p.name)}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td><td class="num">£${playerValue(p)}M</td>
        <td><span class="tag">on loan at ${esc(p.loan)}</span></td></tr>`;
      const ok = canLeave(G.myClub, p);
      const loanable = canLoanOut(p);
      return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${plink(G.myClub, p)}</td>
        <td class="num">${p.age}</td><td class="num">${p.rating}</td><td class="num">£${playerValue(p)}M</td>
        <td>${ok ? `<button class="ghost" onclick="sellPlayer(${p.id})">Sell £${Math.round(playerValue(p) * 0.9)}M</button>`
                 : `<span class="note" title="Selling would leave the squad too thin">—</span>`}
            ${loanable && p.rating < p.pot ? `<button class="ghost" onclick="loanOut(${p.id})" title="A season of regular football elsewhere — he develops as a regular starter">Loan out</button>` : ""}</td></tr>`;
    }).join("") + `</tbody></table>
    <p class="note">Loan out fringe youngsters (max 4) — a season of regular football develops them like first-team starters. They return next summer.</p>`;
  // ---- loan in players ----
  if (windowOpen()) {
    const loanedIn = G.squads[G.myClub].filter(x => x.loanFrom !== undefined).length;
    const showAllL = G.tfShowAll === true;
    let targets = loanTargets();
    if (!showAllL) targets = targets.filter(({ p }) => wageBill() + (p.wage || wageFor(p.rating, p.age)) <= wageCap());
    targets = targets.slice(0, 40);
    html += `<h3>🤝 Loan in players</h3>
      <p class="note">Borrow a young player for the season: no fee, you pay his wage, he counts toward your 25-man squad, and he returns to his club next summer. Max 3 at once (${loanedIn}/3 used). ${showAllL ? "" : "Only loans your wage budget can carry are listed."}</p>`;
    if (!targets.length) {
      html += `<p class="note">No loan targets your wage budget can carry right now${showAllL ? "" : " — trim wages, or enable \"Show every player\" in the buy section below"}.</p>`;
    } else {
      html += `<table><thead><tr><th>Pos</th><th>Name</th><th>From</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Wage</th><th></th></tr></thead><tbody>` +
        targets.map(({ p, club }) => {
          const wage = p.wage || wageFor(p.rating, p.age);
          const can = canLoanIn() && wageBill() + wage <= wageCap();
          const why = !windowOpen() ? "window closed" : G.squads[G.myClub].length >= 25 ? "squad full" : loanedIn >= 3 ? "3 loans max" : (wageBill() + wage > wageCap()) ? "wages too high" : "";
          return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${plink(club, p)}</td><td>${CLUBS[club].short}</td>
            <td class="num">${p.age}</td><td class="num">${staffTier("scout") >= 2 ? p.rating : (Math.floor(p.rating / 4) * 4) + "-" + (Math.floor(p.rating / 4) * 4 + 3)}</td><td class="num">£${wage}M/yr</td>
            <td>${can ? `<button class="ghost" onclick="loanIn(${club},${p.id})">Loan in</button>` : `<span class="note" style="font-size:11px">${why}</span>`}</td></tr>`;
        }).join("") + `</tbody></table>`;
    }
  }
  // ---- free agents (no fee) ----
  if (windowOpen() && G.challenge !== "youth") {
    const faFilter = G.tfFilter || "All";
    const fas = (G.freeAgents || []).filter(p => faFilter === "All" || p.pos === faFilter).sort((a, b) => b.rating - a.rating);
    html += `<h3>🆓 Free agents — no transfer fee</h3>
      <p class="note">Out-of-contract players you can sign for <b>nothing</b> — you pay only their wage. The way to strengthen on a tight budget.</p>`;
    if (!fas.length) {
      html += `<p class="note">No free agents matching this position right now.</p>`;
    } else {
      html += `<table><thead><tr><th>Pos</th><th>Name</th><th class="num">Age</th><th class="num">Rating</th><th class="num">Wage</th><th></th></tr></thead><tbody>` +
        fas.slice(0, 30).map(p => {
          const wage = p.wage || wageFor(p.rating, p.age);
          const slot = G.squads[G.myClub].length < 25;
          const wok = wageBill() + wage <= wageCap();
          const why = !slot ? "squad full" : !wok ? "wages too high" : "";
          return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${esc(p.name)}</td>
            <td class="num">${p.age}</td><td class="num">${staffTier("scout") >= 2 ? p.rating : (Math.floor(p.rating / 4) * 4) + "-" + (Math.floor(p.rating / 4) * 4 + 3)}</td><td class="num">£${wage}M/yr</td>
            <td>${(slot && wok) ? `<button class="ghost" onclick="signFreeAgent(${p.id})">Sign free</button>` : `<span class="note" style="font-size:11px">${why}</span>`}</td></tr>`;
        }).join("") + `</tbody></table>`;
    }
  }
  // ---- market (buy) ----
  if (G.challenge === "youth") {
    if ((G.deals || []).length) {
      html += `<h3>Done deals this window</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
    }
    return html + `<h3>Buy players</h3><p class="note">🎖 Youth Project: the board has imposed a <b>total transfer ban on incoming players</b>. Academy intakes and loans are your only tools. (Selling is permitted.)</p></div>`;
  }
  const filter = G.tfFilter || "All";
  const market = [];
  CLUBS.forEach((c, i) => {
    if (i === G.myClub || i === EURO_SLOT) return;
    for (const p of G.squads[i] || []) {
      if (filter !== "All" && p.pos !== filter) continue;
      market.push({ p, club: i });
    }
  });
  const MARKET_COLS = {
    name: r => r.p.name, club: r => CLUBS[r.club].short, age: r => r.p.age,
    rating: r => r.p.rating, pot: r => r.p.pot || 0, ask: r => askPrice(r.club, r.p),
  };
  const myFull = G.squads[G.myClub].length >= 25;
  const headroom = +(wageCap() - wageBill()).toFixed(1);
  const showAll = G.tfShowAll === true;
  const lvl = CLUBS[G.myClub] ? CLUBS[G.myClub].base : 72;
  const canAfford = r => canLeave(r.club, r.p) && askPrice(r.club, r.p) <= G.budget && wageBill() + wageFor(r.p.rating, r.p.age) <= wageCap();
  const onLevel = r => r.p.rating >= lvl - 9 && r.p.rating <= lvl + 7;
  // default view: players you can afford that suit your club's level; a name search or the toggle overrides
  let pool, scopeNote = "";
  if (G.tfSearch) {
    pool = market.filter(r => r.p.name.toLowerCase().includes(G.tfSearch.toLowerCase()));
    scopeNote = "Search results.";
  } else if (showAll) {
    pool = market;
    scopeNote = "Showing all <b>" + market.length + "</b> players on the market.";
  } else {
    pool = market.filter(r => canAfford(r) && onLevel(r));
    if (!pool.length) pool = market.filter(canAfford); // nothing on-level fits — fall back to anything affordable
    if (pool.length) scopeNote = "Showing the <b>" + pool.length + "</b> player" + (pool.length === 1 ? "" : "s") + " within your £" + G.budget + "M budget and wage room, around your club's level.";
  }
  html += myFull
    ? `<p style="color:var(--red)"><b>⛔ Your squad is full (25/25)</b> — sell or loan out before you can sign anyone. The list below still respects your budget.</p>`
    : (!pool.length && !showAll)
    ? `<p style="color:var(--red)"><b>⛔ Nothing on the transfer market is within reach</b> — budget £${G.budget}M, wage headroom £${headroom}M/yr. Sign a free agent above (no fee), sell a player, or trim wages.</p>
       <p class="note"><label><input type="checkbox" onchange="G.tfShowAll=this.checked;save();render()"> Show every player anyway, including ones you can't afford</label></p>`
    : `<p class="note">${scopeNote}</p>
       <p class="note"><label><input type="checkbox" ${showAll ? "checked" : ""} onchange="G.tfShowAll=this.checked;save();render()"> Show every player (loans and transfers), including those beyond your budget</label></p>`;
  const sortedMarket = sortRows(pool, "market", MARKET_COLS, r => r.p);
  if (!sortedMarket.length && market.length && (G.tfSearch || filter !== "All")) {
    html += `<p style="color:var(--amber)"><b>⚠ Your search or position filter is hiding all ${market.length} players</b>
      <button class="ghost" onclick="G.tfSearch='';G.tfFilter='All';save();render()">Clear search & position</button></p>`;
  }
  html += `<h3>Buy players</h3>
    <div class="row"><label>Position
      <select onchange="G.tfFilter=this.value;save();render()">` +
      ["All", "GK", "DF", "MF", "FW"].map(f => `<option${filter === f ? " selected" : ""}>${f}</option>`).join("") +
    `</select></label>
    <label>🔎 <input type="search" placeholder="player name…" value="${esc(G.tfSearch || "")}" size="14"
      onchange="G.tfSearch=this.value;save();render()"></label>
    <span class="note">Top 50 shown · click a column heading to sort · clubs demand a premium for their star player</span></div>
    <table><thead><tr>${thSort("market","pos","Pos")}${thSort("market","name","Name")}${thSort("market","club","Club")}${thSort("market","age","Age",1)}${thSort("market","rating","Rating",1,"","Rat")}${thSort("market","pot","Pot",1,"m-hide")}${thSort("market","ask","Ask",1)}<th></th></tr></thead><tbody>` +
    sortedMarket.slice(0, 50).map(({ p, club }) => {
      const price = askPrice(club, p);
      const wDemand = wageFor(p.rating, p.age);
      const sellerOk = canLeave(club, p);
      const wageOk = wageBill() + wDemand <= wageCap();
      const can = sellerOk && price <= G.budget && G.squads[G.myClub].length < 25 && wageOk;
      const why = !sellerOk ? "not for sale" : G.squads[G.myClub].length >= 25 ? "squad full" : price > G.budget ? "over budget" : !wageOk ? "wages too high" : "";
      return `<tr><td class="pos-${p.pos}" title="${p.pos}">${p.role || p.pos}</td><td>${plink(club, p)}${p.injury ? ` <span class="tag inj">INJ ${p.injury}wk</span>` : ""}${p.ban ? ` <span class="tag sus">BAN ${p.ban}</span>` : ""}</td><td>${CLUBS[club].short}</td>
        <td class="num">${p.age}</td><td class="num">${staffTier("scout") >= 2 ? p.rating : (Math.floor(p.rating / 4) * 4) + "–" + (Math.floor(p.rating / 4) * 4 + 3)}</td>
        <td class="num stars-bar m-hide">${staffTier("scout") ? `<b>${p.pot || "?"}</b>` : potStars(p)}</td><td class="num">£${price}M<br><span class="note">£${wDemand}M/yr</span></td>
        <td>${can ? `<button class="ghost" onclick="buyPlayer(${club},${p.id})">Buy</button>` : `<span class="note" style="font-size:11px">${why}</span>`}</td></tr>`;
    }).join("") + `</tbody></table>`;
  // ---- world stars (European clubs) ----
  const STAR_COLS = { name: x => x.name, club: x => x.club, age: x => x.age, rating: x => x.rating, ask: x => foreignAsk(x) };
  let starPool = foreignStars().filter(s => filter === "All" || s.pos === filter);
  if (G.tfSearch) starPool = starPool.filter(x => x.name.toLowerCase().includes(G.tfSearch.toLowerCase()));
  else if (!showAll) starPool = starPool.filter(s => foreignAsk(s) <= G.budget && wageBill() + wageFor(s.rating, s.age) <= wageCap());
  const world = sortRows(starPool, "stars", STAR_COLS, x => x).slice(0, 40);
  html += `<h3>🌍 World stars — Europe's elite (35% world-record premium)</h3>`;
  html += world.length
    ? `<table><thead><tr>${thSort("stars","pos","Pos")}${thSort("stars","name","Name")}${thSort("stars","club","Club")}${thSort("stars","age","Age",1)}${thSort("stars","rating","Rating",1,"","Rat")}${thSort("stars","ask","Ask",1)}<th></th></tr></thead><tbody>` +
      world.map(s => {
        const price = foreignAsk(s);
        const wDemand = wageFor(s.rating, s.age);
        const wageOk = wageBill() + wDemand <= wageCap();
        const can = price <= G.budget && G.squads[G.myClub].length < 25 && wageOk;
        return `<tr><td class="pos-${s.pos}" title="${s.pos}">${s.role || s.pos}</td><td>${esc(s.name)}</td>
        <td>${crest(s.short, s.col, 15)}${esc(s.club)}</td>
        <td class="num">${s.age}</td><td class="num">${s.rating}</td><td class="num">£${price}M<br><span class="note">£${wDemand}M/yr</span></td>
        <td>${can ? `<button class="ghost" onclick="buyForeign('${s.key.replace(/'/g, "\\'")}')">Buy</button>` : `<span class="note" style="font-size:11px">${G.squads[G.myClub].length >= 25 ? "squad full" : price > G.budget ? "over budget" : "wages too high"}</span>`}</td></tr>`;
      }).join("") + `</tbody></table>`
    : `<p class="note">None within your £${G.budget}M budget and wage room right now — these are the world's most expensive players.</p>`;
  if ((G.deals || []).length) {
    html += `<h3>Done deals this window</h3><p class="note">${G.deals.map(esc).join("<br>")}</p>`;
  }
  return html + `</div>`;

/* Each cup is a real bracket: a full field enters round one, every tie is
   played, and the tournament resolves to a winner even after you exit. */

function entrantUid(e) { return e.kind === "me" ? "ME" : e.kind === "league" ? "L" + e.idx : e.kind === "u21" ? "U" + e.idx : "M" + e.m; }
function entrantName(e) { return e.kind === "me" ? CLUBS[G.myClub].name : e.kind === "league" ? CLUBS[e.idx].name : e.kind === "u21" ? CLUBS[e.idx].name + " U21" : MINNOWS[e.m][0]; }
function entrantBase(e) { return e.kind === "me" ? CLUBS[G.myClub].base : e.kind === "league" ? CLUBS[e.idx].base : e.kind === "u21" ? Math.max(50, CLUBS[e.idx].base - 16) : MINNOWS[e.m][2]; }

function buildCupField(size) {
  const field = [{ kind: "me" }];
  for (let i = 0; i < EURO_SLOT; i++) if (i !== G.myClub) field.push({ kind: "league", idx: i });
  const minnowIdxs = MINNOWS.map((m, i) => i);
  while (field.length < size && minnowIdxs.length) {
    const k = Math.floor(rnd() * minnowIdxs.length);
    field.push({ kind: "minnow", m: minnowIdxs.splice(k, 1)[0] });
  }
  return field.slice(0, size);
}

/* Bristol Street Motors Trophy (EFL Trophy): League One & League Two clubs plus
   16 invited Premier League / Championship academy (U21) sides — 64 in all, a
   straight knockout to a Wembley final. Top-flight and Championship clubs do not
   contest it, and the National League has its own competition, so it exists only
   for tiers 2 and 3. Rounds avoid every League Cup and FA Cup week. */
function buildTrophyField() {
  const field = [{ kind: "me" }];
  const lower = (G.tiers[2] || []).concat(G.tiers[3] || []); // League One + League Two
  for (const idx of lower) if (idx !== G.myClub) field.push({ kind: "league", idx });
  const academy = (G.tiers[0] || []).concat(G.tiers[1] || []).slice(0, 16); // invited PL/Championship U21 sides
  for (const idx of academy) field.push({ kind: "u21", idx });
  return field;
}
function buildTrophyCup() {
  if (G.tier === 2 || G.tier === 3) {
    return { r: 0, alive: true, results: [], opp: null, history: [], winner: null,
      remaining: buildTrophyField(), rounds: [
      { week: 6, label: "Round 1" }, { week: 10, label: "Round 2" }, { week: 23, label: "Last 16" },
      { week: 28, label: "Quarter-final" }, { week: 33, label: "Semi-final" }, { week: 41, label: "Final" }] };
  }
  return { alive: "out", rounds: [], results: [], history: [], r: 0, winner: null };
}
/* A cup added (or revived) on a save already in progress: pick it up at the next upcoming
   round, byeing through any rounds already played, unless fewer than two rounds remain
   (entering with only the final left would be an unfair free run). Returns true if joined. */
function joinCupMidSeason(c) {
  if (!c || !c.rounds || !c.rounds.length) return false;
  let r = 0;
  while (r < c.rounds.length && c.rounds[r].week < G.week) r++;
  if (r > c.rounds.length - 2) return false; // fewer than two rounds remain — too late to enter fairly
  if (r > 0) { // bye through the rounds already played; sim them on the rest of the field to shrink it
    let field = (c.remaining || []).filter(e => entrantUid(e) !== "ME");
    for (let i = 0; i < r && field.length > 1; i++) field = simCupRound(field).survivors;
    c.remaining = [{ kind: "me" }].concat(field);
  }
  c.r = r; c.opp = null; c.alive = true;

}
function buildLC() {
  const lower = G.tier >= 2; // League One and League Two enter at Round 1
  return { r: 0, alive: true, results: [], opp: null, history: [], winner: null,
    entry: lower ? 2 : 0, remaining: buildCupField(32),
    rounds: lower
      ? [ { week: 1, label: "Round 1" }, { week: 2, label: "Round 2" }, { week: 4, label: "Round 3" }, { week: 8, label: "Round 4" }, { week: 13, label: "Quarter-final" }, { week: 19, week2: 21, label: "Semi-final" }, { week: 26, label: "Final" } ]
      : [ { week: 4, label: "Round 3" }, { week: 8, label: "Round 4" }, { week: 13, label: "Quarter-final" }, { week: 19, week2: 21, label: "Semi-final" }, { week: 26, label: "Final" } ] };
}
function buildFA() {
  const lower = G.tier >= 2;
  return { r: 0, alive: true, results: [], opp: null, history: [], winner: null,
    entry: lower ? 2 : 0, remaining: buildCupField(64),
    rounds: lower
      ? [ { week: 11, label: "Round 1" }, { week: 14, label: "Round 2" }, { week: 16, label: "Round 3" }, { week: 20, label: "Round 4" }, { week: 25, label: "Round 5" }, { week: 29, label: "Quarter-final" }, { week: 31, label: "Semi-final" }, { week: 35, label: "Final" } ]
      : [ { week: 16, label: "Round 3" }, { week: 20, label: "Round 4" }, { week: 25, label: "Round 5" }, { week: 29, label: "Quarter-final" }, { week: 31, label: "Semi-final" }, { week: 35, label: "Final" } ] };
}
function buildDomesticCup(key) { return key === "fa" ? buildFA() : key === "et" ? buildTrophyCup() : buildLC(); }
function initCups() {
  G.cups = { lc: buildLC(), fa: buildFA(), et: buildTrophyCup() };
}
/* Lower divisions, in-progress save: any cup not yet played this season is slotted into the weeks
   that remain so it auto-plays from Round 1 in the normal fixture flow (rather than being shelved or
   needing a separate button). Cups already under way this season are left untouched. */
function fitCupsIntoRemainingSeason() {
  if (!G.cups || G.tier < 2) return;
  const endW = G.fixtures.length - 1, startW = G.week + 1;
  if (endW - startW < 2) return; // too little of the season left to slot a tie
  const used = new Set();
  let offset = 0;
  for (const key of ["lc", "fa", "et"]) {
    let c = G.cups[key];
    if (!c || !(c.rounds || []).length) continue;
    if (c.alive !== true && !(c.results || []).length) c = G.cups[key] = buildDomesticCup(key); // shelved unplayed → fresh from Round 1
    if (c.alive !== true) continue;                 // won, or knocked out — nothing left to play
    if (key === "et" && !(c.remaining || []).some(e => entrantUid(e) !== "ME")) { // Trophy field lost its opponents on an older save — rebuild it, byed to the round reached
      let field = buildTrophyField().filter(e => entrantUid(e) !== "ME");
      for (let i = 0; i < (c.r || 0) && field.length > 1; i++) field = simCupRound(field).survivors;
      c.remaining = [{ kind: "me" }].concat(field);
    }
    const from = c.r || 0;                          // first round not yet played; earlier rounds keep their history
    if (from >= c.rounds.length) continue;
    if (c.rounds[from].week >= G.week) continue;    // its next tie is already ahead — it plays normally, leave it alone
    const remain = c.rounds.length - from;
    const room = endW - startW, stride = Math.max(1, Math.floor(room / remain));
    let ok = true; const weeks = [];
    for (let i = 0; i < remain; i++) {
      let wk = startW + offset + i * stride;
      while (used.has(wk) && wk <= endW) wk++;
      if (wk > endW) { ok = false; break; }
      weeks.push(wk);
    }
    if (!ok) continue; // not enough room left — it carries to next season
    weeks.forEach((wk, i) => { c.rounds[from + i].week = wk; delete c.rounds[from + i].week2; used.add(wk); });
    offset += 1; // stagger the next cup to avoid week clashes
  }
}

function drawMyCupOpp(c, r) {
  const isFinal = r === c.rounds.length - 1;
  const home = isFinal ? true : rnd() < 0.5; // finals at a neutral venue (Wembley)
  if (c.entry && r < c.entry) { // lower divisions enter at Round 1; preliminary ties are against lower-league opponents, outside the Round 3 bracket
    const lower = (G.tiers[2] || []).concat(G.tiers[3] || [], G.tiers[4] || []).filter(i => i !== G.myClub);
    const idx = lower[Math.floor(rnd() * lower.length)];
    return { kind: "league", uid: "L" + idx, idx, name: CLUBS[idx].name, short: CLUBS[idx].short, base: CLUBS[idx].base, home };
  }
  const pool = (c.remaining || []).filter(e => e.kind !== "me" && !(e.kind === "league" && e.idx === G.myClub));
  const e = pool[Math.floor(rnd() * pool.length)];
  if (!e) { // the bracket lost its other entrants (a field corrupted by an earlier build) — draw a stand-in so the tie is always playable
    const lower = (G.tiers[2] || []).concat(G.tiers[3] || [], G.tiers[1] || []).filter(i => i !== G.myClub);
    const idx = lower[Math.floor(rnd() * lower.length)];
    return { kind: "league", uid: "L" + idx, idx, name: CLUBS[idx].name, short: CLUBS[idx].short, base: CLUBS[idx].base, home };
  }
  if (e.kind === "minnow") {
    const m = MINNOWS[e.m];
    return { kind: "minnow", uid: entrantUid(e), name: m[0], short: m[1], base: m[2], col: m[3], home };
  }
  if (e.kind === "u21") {
    return { kind: "u21", uid: entrantUid(e), idx: e.idx, name: CLUBS[e.idx].name + " U21", short: CLUBS[e.idx].short, base: entrantBase(e), col: CLUBS[e.idx].col, home };
  }
  return { kind: "league", uid: entrantUid(e), idx: e.idx, name: CLUBS[e.idx].name, short: CLUBS[e.idx].short, base: CLUBS[e.idx].base, home };
}

/* play one full round among `entrants` (no user involvement); returns {ties, survivors} */
function simCupRound(entrants) {
  const pool = [...entrants];
  const ties = [], survivors = [];
  while (pool.length >= 2) {
    const a = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    const b = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    let [ga, gb] = euroScore(entrantBase(a), entrantBase(b));
    let note = "";
    if (ga === gb) { if (rnd() < 0.5) ga++; else gb++; note = " (pens)"; }
    ties.push(entrantName(a) + " " + ga + "–" + gb + " " + entrantName(b) + note);
    survivors.push(ga > gb ? a : b);
  }
  survivors.push(...pool); // odd one out gets a bye (shouldn't happen with even fields)
  return { ties, survivors };
}

function dueCup() {
  if (!G.cups) return null;
  if (G.forceCup && G.cups[G.forceCup] && G.cups[G.forceCup].alive === true) { // on-demand: play this cup's next tie now, off the calendar
    const c = G.cups[G.forceCup], rd = c.rounds[c.r];
    if (rd) {
      if (!c.opp) { c.opp = drawMyCupOpp(c, c.r); c.firstLegHome = c.opp.home; save(); }
      return { cupKey: G.forceCup, label: CUP_NAME[G.forceCup] + " · " + rd.label, opp: c.opp, home: c.opp.home, isFinal: c.r === c.rounds.length - 1, leg: 0 };
    }
  }
  for (const key of ["lc", "fa", "et"]) {
    const c = G.cups[key];
    if (!c || c.alive !== true) continue;
    const rd = c.rounds[c.r];
    if (!rd) continue;
    const leg2 = rd.week2 && G.week === rd.week2;
    const leg1 = G.week === rd.week && !(rd.week2 && c.agg);
    if (leg1 || leg2) {
      if (!c.opp) { c.opp = drawMyCupOpp(c, c.r); c.firstLegHome = c.opp.home; save(); }
      const leg = rd.week2 ? (leg2 ? 2 : 1) : 0;
      const home = leg === 0 ? c.opp.home : (leg2 ? !c.firstLegHome : c.firstLegHome);
      return { cupKey: key, label: CUP_NAME[key] + " · " + rd.label + (leg ? " (" + (leg === 1 ? "1st" : "2nd") + " leg)" : ""),
               opp: c.opp, home, isFinal: c.r === c.rounds.length - 1, leg };
    }
  }
  return null;
}

function playCupNow(key) {
  if (!G.cups || G.live) return;
  let c = G.cups[key];
  if (!c) c = G.cups[key] = buildDomesticCup(key);
  // start a fresh run from Round 1 when this season's competition is unplayed and either shelved or still on the
  // old pre-Round-1 schedule (no `entry` field); never discard a run already in progress
  if (!(c.results || []).length && (c.alive !== true || (key !== "et" && c.entry === undefined))) {
    c = G.cups[key] = buildDomesticCup(key);
  }
  if (c.alive !== true || !(c.rounds || []).length) return; // already won, or genuinely knocked out
  G.forceCup = key; G.screen = "prematch"; save(); render();
}
function setCupOpponent(opp) {
  CLUBS[EURO_SLOT].name = opp.name;
  CLUBS[EURO_SLOT].short = opp.short;
  CLUBS[EURO_SLOT].base = opp.base;
  CLUBS[EURO_SLOT].col = opp.col;
  G.squads[EURO_SLOT] = genEuroSquad([opp.name, opp.short, opp.base, opp.col, []]);
  G.guestClub = { name: opp.name, short: opp.short, base: opp.base, col: opp.col };
}

function cupOppIdx(fix) {
  if (fix.opp.kind === "league") return fix.opp.idx;
  setCupOpponent(fix.opp);
  return EURO_SLOT;
}

function commitCup(fix, r, pens) {
  ghQueueSync();
  addDramaEvents(r);
  r.dateMs = matchDateMs(fix.cupKey, G.week);
  const c = G.cups[fix.cupKey];
  if (G.forceCup) G.forceCup = null; // an on-demand tie is one-shot
  const myG = fix.home ? r.hg : r.ag, opG = fix.home ? r.ag : r.hg;
  const roundLabel = c.rounds[c.r].label;
  const twoLeg = fix.leg === 1 || fix.leg === 2;
  if (c.entry && c.r < c.entry) { // preliminary round: win to reach the Round 3 bracket, lose and you are out before it
    let note = "", win = myG > opG;
    if (myG === opG) {
      const oppIdx = fix.opp.kind === "league" ? fix.opp.idx : EURO_SLOT;
      const so = pens || simShootoutClubs(G.myClub, oppIdx);
      win = so.myWin; note = " " + so.note;
      r.events = (r.events || []).concat(shootoutEvents(so, G.myClub, oppIdx));
    }
    c.results.push({ label: roundLabel, opp: fix.opp.name, myG, opG, home: fix.home, note });
    c.history.push({ label: roundLabel, myTie: CLUBS[G.myClub].name + " " + myG + "–" + opG + " " + fix.opp.name + (note.includes("penalties") ? " (pens)" : ""), ties: [] });
    if (win) { c.r++; c.opp = null; boardBump(0.5); note += " — through to the " + c.rounds[c.r].label + "."; }
    else { c.alive = "out"; c.opp = null; boardBump(-2); }
    G.lastMatch = r; G.lastMatchEuro = "cup";
    G.lastMatchLabel = CUP_NAME[fix.cupKey] + " · " + roundLabel + note;
    G.live = null; G.screen = "matchResult"; save(); render();
    return;
  }
  if (fix.leg === 1) {
    // first leg of a two-legged tie: bank the score, keep the opponent, do not advance
    c.agg = { my: myG, opp: opG };
    const fnote = " - first leg, " + (myG > opG ? "leading " : myG < opG ? "trailing " : "level ") + myG + "-" + opG;
    c.results.push({ label: roundLabel + " (1st leg)", opp: fix.opp.name, myG, opG, home: fix.home, note: fnote });
    c.history.push({ label: roundLabel + " (1st leg)", myTie: CLUBS[G.myClub].name + " " + myG + "-" + opG + " " + fix.opp.name, ties: [] });
    G.lastMatch = r; G.lastMatchEuro = "cup";
    G.lastMatchLabel = CUP_NAME[fix.cupKey] + " · " + roundLabel + " (1st leg)" + fnote;
    G.live = null; G.screen = "matchResult"; save(); render();
    return;
  }
  let note = "";
  let aggMy = myG + (twoLeg && c.agg ? c.agg.my : 0), aggOp = opG + (twoLeg && c.agg ? c.agg.opp : 0);
  let win = aggMy > aggOp;
  if (aggMy === aggOp) {
    const oppIdx = fix.opp.kind === "league" ? fix.opp.idx : EURO_SLOT;
    const so = pens || simShootoutClubs(G.myClub, oppIdx);
    win = so.myWin;
    note = (twoLeg ? " - " + aggMy + "-" + aggOp + " agg;" : "") + " " + so.note;
    r.events = (r.events || []).concat(shootoutEvents(so, G.myClub, oppIdx));
  } else if (twoLeg) {
    note = " - " + (win ? "won " : "lost ") + aggMy + "-" + aggOp + " on aggregate";
  }
  const resultLabel = roundLabel + (fix.leg === 2 ? " (2nd leg)" : "");
  c.results.push({ label: resultLabel, opp: fix.opp.name, myG, opG, home: fix.home, note });
  // resolve the rest of the round's draw
  const others = (c.remaining || []).filter(e => entrantUid(e) !== "ME" && entrantUid(e) !== fix.opp.uid);
  const rest = simCupRound(others);
  const myTie = CLUBS[G.myClub].name + " " + myG + "–" + opG + " " + fix.opp.name + (note.includes("penalties") ? " (pens)" : "");
  c.history.push({ label: resultLabel, myTie, ties: rest.ties });
  const myTieWinner = win ? { kind: "me" } : (c.remaining || []).find(e => entrantUid(e) === fix.opp.uid);
  c.remaining = rest.survivors.concat(myTieWinner ? [myTieWinner] : []);
  if (win) {
    c.r++; c.opp = null; c.agg = null; c.firstLegHome = undefined;
    if (c.r >= c.rounds.length) {
      c.alive = "won";
      c.winner = CLUBS[G.myClub].name;
      G.honours.push("Season " + G.season + ": " + CUP_NAME[fix.cupKey] + " winners");
      adjBudget(CUP_PRIZE[fix.cupKey], CUP_NAME[fix.cupKey] + " winners' prize", "prize");
      boardBump(12);
      note += " — 🏆 " + CUP_NAME[fix.cupKey].toUpperCase() + " WINNERS! (£" + CUP_PRIZE[fix.cupKey] + "M prize)";
    } else {
      boardBump(c.r >= c.rounds.length - 2 ? 3 : 1.5);
      if (fix.opp.kind === "minnow" && fix.opp.base < 65) note += " — no banana skin today.";
    }
  } else {
    c.alive = "out"; c.opp = null; c.agg = null; c.firstLegHome = undefined;
    boardBump(fix.opp.kind === "minnow" ? -8 : -3);
    if (fix.opp.kind === "minnow") note += " — a giant-killing! The press will not be kind.";
    // the tournament carries on without you
    c.r++;
    while (c.r < c.rounds.length && c.remaining.length > 1) {
      const rd = simCupRound(c.remaining);
      c.history.push({ label: c.rounds[c.r].label, myTie: null, ties: rd.ties });
      c.remaining = rd.survivors;
      c.r++;
    }
    if (c.remaining.length === 1) c.winner = entrantName(c.remaining[0]);
  }
  G.lastMatch = r;
  G.lastMatchEuro = "cup";
  G.lastMatchLabel = CUP_NAME[fix.cupKey] + " · " + c.results[c.results.length - 1].label + note;
  G.live = null;
  G.screen = "matchResult";
  save(); render();
}

function playCupQuick() {
  const fix = dueCup();
  if (!fix || G.live || dueEuro()) return;
  prepMatchLineup(true);
  const oppIdx = cupOppIdx(fix);
  const h = fix.home ? G.myClub : oppIdx, a = fix.home ? oppIdx : G.myClub;
  const opts = {};
  if (fix.home) { opts.hXI = G.lineup; opts.hMent = G.mentality; opts.hForm = G.formation; opts.hStyle = G.style || "Balanced"; }
  else { opts.aXI = G.lineup; opts.aMent = G.mentality; opts.aForm = G.formation; opts.aStyle = G.style || "Balanced"; }
  commitCup(fix, simMatch(h, a, opts));
}

function startCupLive() {

  const L = {
    h, a,
    hXI: fix.home ? [...G.lineup] : aiXI,

    stats: { t: 0, hp: 0, hShots: 0, aShots: 0, hSot: 0, aSot: 0 },

/* ---------------- Pre-season: friendlies, Community Shield, UEFA Super Cup ----------------
   These play through the normal match flow (pick your XI, live or quick) and gate the league
   opener the way cup ties gate a midweek. They are exhibitions: fitness, injuries and sharpness
   carry into the season, but goals, appearances and bookings do not count toward it. */
function buildPreseason() {
  const q = [];
  const fl = friendliesLeft();
  for (let i = 0; i < fl; i++) q.push({ ptype: "friendly" });
  if (G.shield && !G.shield.played) q.push({ ptype: "shield" });
  if (G.superCup && !G.superCup.played) q.push({ ptype: "supercup" });
  G.preseason = q;
}
function preseasonLabel(ptype) {
  return ptype === "friendly" ? "\ud83e\udd1d Pre-season friendly" : ptype === "shield" ? "\ud83d\udee1 Community Shield" : "\ud83c\udfc6 UEFA Super Cup";
}
function duePreseason() {
  if (!G.preseason || !G.preseason.length || G.week !== 0 || G.tier == null) return null;
  const q = G.preseason[0];
  if (!q) return null;
  if (q.ptype === "shield" && (!G.shield || G.shield.played)) { G.preseason.shift(); return duePreseason(); }
  if (q.ptype === "supercup" && (!G.superCup || G.superCup.played)) { G.preseason.shift(); return duePreseason(); }
  if (!q.opp) {
    if (q.ptype === "friendly") {
      let idx = G.myClub, guard = 0;
      while (idx === G.myClub && guard++ < 50) idx = Math.floor(rnd() * EURO_SLOT);
      q.opp = { kind: "league", idx, name: CLUBS[idx].name, short: CLUBS[idx].short, base: CLUBS[idx].base, col: colorOf(idx) };

      q.home = true;
    } else {
      q.opp = { kind: "guest", name: G.superCup.name, short: G.superCup.short, base: G.superCup.base, col: G.superCup.col };
      q.home = true;
    }
    save();
  }
  return { kind: "preseason", ptype: q.ptype, label: preseasonLabel(q.ptype), opp: q.opp, home: q.home, isKO: q.ptype !== "friendly" };
}
function setPreseasonGuest(opp) {

function commitPreseason(fix, r, pens, snap) {

/* ---------------- European competition engine ---------------- */

/* UEFA's Swiss-model format (2024/25 onward): 36 clubs in ONE league table,
   8 matchdays vs 8 different opponents (6 in the Conference League).
   Top 8 → Round of 16 directly; 9th–24th → knockout play-off; 25th+ out. */

function euroMDWeeks(comp) { return comp === "UECL" ? [3, 6, 9, 12, 15, 18] : [3, 5, 7, 9, 11, 14, 17, 18]; }
const EURO_KO_WEEKS = { playoff: 22, R16: 24, QF: 28, SF: 32, F: 34 };  // first leg (or the one-off final)
const EURO_KO_WEEK2 = { playoff: 23, R16: 27, QF: 30, SF: 33 };          // second leg (finals are single)
const EURO_KO_LABEL = { playoff: "Knockout Play-off", R16: "Round of 16", QF: "Quarter-final", SF: "Semi-final", F: "FINAL" };
const EURO_KO_NEXT = { playoff: "R16", R16: "QF", QF: "SF", SF: "F", F: "won" };

function euroTuple(E, id) { // [name, short, base, col, stars]
  if (id[0] === "P") return EURO_POOLS[E.comp][+id.slice(1)];
  return EURO_EXTRA[+id.slice(1)];
}
function euroName(E, id) { return id === "me" ? CLUBS[G.myClub].name : euroTuple(E, id)[0]; }
function euroBase(E, id) { return id === "me" ? CLUBS[G.myClub].base : euroTuple(E, id)[2]; }

function euroOrd(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function euroCupWinnerIdx(c) {
  if (!c || !c.winner) return -1;
  return CLUBS.findIndex((x, i) => i < EURO_SLOT && x.name === c.winner);
}

/* Real English European qualification, computed across the final league table:
   top `uclSlots` go to the Champions League (4, occasionally 5 via the European
   Performance Spot); the FA Cup winners take a Europa League place and the
   League Cup winners a Conference League place; when a cup winner has already
   qualified higher, that place passes down to the next club, so some seasons
   send 7th or 8th into the Conference League. Returns {comp, route} per club. */
function europeanBerths(table, faIdx, lcIdx, uclSlots) {
  const comp = {}, route = {}, taken = new Set();
  for (let i = 0; i < uclSlots && i < table.length; i++) { comp[table[i]] = "UCL"; route[table[i]] = "finished " + euroOrd(i + 1); taken.add(table[i]); }
  let uel = 1;
  if (faIdx >= 0 && table.includes(faIdx)) {
    if (!taken.has(faIdx)) { comp[faIdx] = "UEL"; route[faIdx] = "FA Cup winners"; taken.add(faIdx); }
    else uel++;
  }
  for (let i = 0; i < table.length && uel > 0; i++) if (!taken.has(table[i])) { comp[table[i]] = "UEL"; route[table[i]] = "finished " + euroOrd(i + 1); taken.add(table[i]); uel--; }
  let uecl = 1;
  if (lcIdx >= 0 && table.includes(lcIdx)) {
    if (!taken.has(lcIdx)) { comp[lcIdx] = "UECL"; route[lcIdx] = "League Cup winners"; taken.add(lcIdx); }
    else uecl++;
  }
  for (let i = 0; i < table.length && uecl > 0; i++) if (!taken.has(table[i])) { comp[table[i]] = "UECL"; route[table[i]] = "finished " + euroOrd(i + 1); taken.add(table[i]); uecl--; }
  return { comp, route };
}

function initEuro(comp) {
  if (!comp) { G.euro = null; return; }
  const ids = ["me"];
  EURO_POOLS[comp].forEach((c, i) => ids.push("P" + i));
  const extras = EURO_EXTRA.map((c, i) => "X" + i);
  while (ids.length < 36 && extras.length) {
    ids.push(extras.splice(Math.floor(rnd() * extras.length), 1)[0]);
  }
  G.euro = {
    comp, format: 2, stage: "league",
    teams: ids.map(id => ({ id, pts: 0, gf: 0, ga: 0 })),
    played: 0, myOpps: [], results: [], ko: null, koPool: null, opp: null,
  };
}

function rankEuro(E) {
  return [...E.teams].sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

function dueEuro() {
  const E = G.euro;
  if (!E || E.stage === "out" || E.stage === "won") return null;
  if (E.stage === "league") {
    const wks = euroMDWeeks(E.comp);
    if (E.played >= wks.length || G.week !== wks[E.played]) return null;
    if (!E.opp) {
      const cands = E.teams.filter(t => t.id !== "me" && !E.myOpps.includes(t.id));
      const pick = cands[Math.floor(rnd() * cands.length)];
      const tu = euroTuple(E, pick.id);
      E.opp = { id: pick.id, name: tu[0], short: tu[1], base: tu[2], col: tu[3], home: E.played % 2 === 0 };
      save();
    }
    return { kind: "league", label: "League Phase · Matchday " + (E.played + 1) + " of " + wks.length, opp: E.opp, home: E.opp.home };
  }
  const isFinal = E.stage === "F";
  const leg2Due = !isFinal && EURO_KO_WEEK2[E.stage] === G.week;
  const leg1Due = EURO_KO_WEEKS[E.stage] === G.week && (isFinal || !E.agg);
  if (leg1Due || leg2Due) {
    const leg2 = leg2Due;
    if (!E.opp) {
      const pool = E.koPool || [];
      const id = pool[Math.floor(rnd() * pool.length)];
      if (id === undefined) { E.stage = "out"; save(); return null; }
      const tu = euroTuple(E, id);
      E.firstLegHome = isFinal ? true : rnd() < 0.5;
      E.opp = { id, name: tu[0], short: tu[1], base: tu[2], col: tu[3], home: E.firstLegHome };
      save();
    }
    const leg = isFinal ? 0 : (leg2 ? 2 : 1);
    const home = isFinal ? true : (leg2 ? !E.firstLegHome : E.firstLegHome);
    return { kind: E.stage, leg, label: EURO_KO_LABEL[E.stage] + (leg ? " (" + (leg === 1 ? "1st" : "2nd") + " leg)" : ""),
             opp: E.opp, home };
  }
  return null;
}

let euroPid = 0;
function genEuroSquad(ec) {
  let [name, short, base, col, stars] = ec;
  const squad = [];
  euroPid = 0;
  const mk = (nm, pos, rating) => {
    const age = 21 + Math.floor(rnd() * 12);
    return { id: 900000 + (euroPid++), name: nm, pos, rating, pot: rating, age,
      wage: wageFor(rating, age), years: 3, fitness: 100, form: 0, injury: 0, ban: 0, yellows: 0, goals: 0, assists: 0, apps: 0 };
  };
  // stars you've signed away no longer turn out for their old club
  stars = (stars || []).filter(([nm]) => !(G && (G.signedStars || []).includes(nm + "@" + short)));
  const used = new Set(stars.map(s => s[0]));
  const filler = () => {
    for (let i = 0; i < 40; i++) {
      const n = "ABCDEFGHIJLMNPRSTV"[Math.floor(rnd() * 18)] + ". " + EURO_NAMES[Math.floor(rnd() * EURO_NAMES.length)];
      if (!used.has(n)) { used.add(n); return n; }
    }
    return "A. " + EURO_NAMES[0];
  };
  const counts = { GK: 2, DF: 6, MF: 6, FW: 4 };
  const starBy = { GK: [], DF: [], MF: [], FW: [] };
  for (const [nm, pos] of stars) starBy[pos].push(nm);
  for (const pos of ["GK", "DF", "MF", "FW"]) {
    starBy[pos].forEach(nm => squad.push(mk(nm, pos, base + 3 + Math.floor(rnd() * 3))));
    for (let i = starBy[pos].length; i < counts[pos]; i++) {
      squad.push(mk(filler(), pos, base - 3 + Math.floor(rnd() * 6)));
    }
  }
  assignRoles(squad);
  return squad;
}

function setEuroGuest(opp) {
  const tu = euroTuple(G.euro, opp.id);
  CLUBS[EURO_SLOT].name = tu[0];
  CLUBS[EURO_SLOT].short = tu[1];
  CLUBS[EURO_SLOT].base = tu[2];
  CLUBS[EURO_SLOT].col = tu[3];
  G.squads[EURO_SLOT] = genEuroSquad(tu);
  G.guestClub = { name: tu[0], short: tu[1], base: tu[2], col: tu[3] };
}

function euroScore(a, b) {
  const ratio = a / b;
  return [poisson(1.35 * Math.pow(ratio, 2.2)), poisson(1.35 * Math.pow(1 / ratio, 2.2))];
}

/* one simulated round among the given ids: random pairs, losers eliminated */
function simEuroKORound(E, ids) {
  const pool = [...ids], winners = [];
  while (pool.length >= 2) {
    const a = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    const b = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    let [ga, gb] = euroScore(euroBase(E, a), euroBase(E, b));
    if (ga === gb) { if (rnd() < 0.5) ga++; else gb++; }
    winners.push(ga > gb ? a : b);
  }
  winners.push(...pool);
  return winners;
}

function commitEuro(fix, r, pens) {
  ghQueueSync();
  addDramaEvents(r);
  const E = G.euro;
  r.dateMs = matchDateMs(E.comp, G.week, E.played);
  const myG = fix.home ? r.hg : r.ag, opG = fix.home ? r.ag : r.hg;
  let note = "";
  if (fix.kind === "league") {
    // my result into the 36-team table
    const me = E.teams.find(t => t.id === "me"), op = E.teams.find(t => t.id === fix.opp.id);
    me.gf += myG; me.ga += opG; op.gf += opG; op.ga += myG;
    if (myG > opG) me.pts += 3; else if (myG < opG) op.pts += 3; else { me.pts++; op.pts++; }
    // ...and the other 17 ties of the matchday
    const others = E.teams.filter(t => t.id !== "me" && t.id !== fix.opp.id);
    while (others.length >= 2) {
      const a = others.splice(Math.floor(rnd() * others.length), 1)[0];
      const b = others.splice(Math.floor(rnd() * others.length), 1)[0];
      const [ga, gb] = euroScore(euroBase(E, a.id), euroBase(E, b.id));
      a.gf += ga; a.ga += gb; b.gf += gb; b.ga += ga;
      if (ga > gb) a.pts += 3; else if (gb > ga) b.pts += 3; else { a.pts++; b.pts++; }
    }
    E.played++;
    E.myOpps.push(fix.opp.id);
    E.opp = null;
    boardBump(myG > opG ? 1.5 : myG < opG ? -1 : 0.5);
    if (E.played === euroMDWeeks(E.comp).length) {
      const ranked = rankEuro(E).map(t => t.id);
      const myPos = ranked.indexOf("me") + 1;
      note = " — league phase over: finished #" + myPos + " of 36.";
      if (myPos <= 8) {
        // straight to the R16; 9th–24th contest the play-offs without you
        const playoffWinners = simEuroKORound(E, ranked.slice(8, 24));
        E.koPool = ranked.slice(0, 8).filter(id => id !== "me").concat(playoffWinners);
        E.stage = "R16"; note += " Straight into the Round of 16!"; boardBump(5);
      } else if (myPos <= 24) {
        E.koPool = ranked.slice(8, 24).filter(id => id !== "me");
        E.koTop8 = ranked.slice(0, 8);
        E.stage = "playoff"; note += " Into the knockout play-offs."; boardBump(1);
      } else {
        E.stage = "out"; note += " Eliminated."; boardBump(-5);
      }
    }
  } else {
    const isFinal = fix.kind === "F";
    if (!isFinal && fix.leg === 1) {
      // first leg: bank the score; the return leg is already on the calendar
      E.agg = { my: myG, opp: opG };
      note = " - first leg, " + (myG > opG ? "leading " : myG < opG ? "trailing " : "level ") + myG + "-" + opG;
    } else {
      let aggMy = myG + (isFinal ? 0 : (E.agg ? E.agg.my : 0)), aggOp = opG + (isFinal ? 0 : (E.agg ? E.agg.opp : 0));
      let win = aggMy > aggOp;
      if (aggMy === aggOp) {
        const so = pens || simShootoutClubs(G.myClub, EURO_SLOT);
        win = so.myWin;
        note = (isFinal ? "" : " - " + aggMy + "-" + aggOp + " agg;") + " " + so.note;
        r.events = (r.events || []).concat(shootoutEvents(so, G.myClub, EURO_SLOT));
      } else if (!isFinal) {
        note = " - " + (win ? "won " : "lost ") + aggMy + "-" + aggOp + " on aggregate";
      }
      // the rest of the round resolves alongside your tie
      const others = (E.koPool || []).filter(id => id !== fix.opp.id);
      let survivors = simEuroKORound(E, others);
      if (!win) {
        E.stage = "out";
        boardBump(isFinal ? -1 : -3);
        if (isFinal) note += " — runners-up.";
      } else if (fix.kind === "playoff") {
        E.koPool = (E.koTop8 || []).concat(survivors);
        E.stage = "R16"; boardBump(3); note += " — into the Round of 16!";
      } else if (isFinal) {
        E.stage = "won";
        G.honours.push("Season " + G.season + ": " + COMP_NAME[E.comp] + " winners");
        boardBump(15);
        note += " — CHAMPIONS OF EUROPE!";
      } else {
        E.koPool = survivors;
        E.stage = EURO_KO_NEXT[fix.kind];
        boardBump(fix.kind === "SF" ? 4 : 3);
      }
      E.opp = null; E.agg = null; E.firstLegHome = undefined;
    }
  }
  E.results.push({ label: fix.label, opp: fix.opp.name, myG, opG, home: fix.home, note });
  G.lastMatch = r;
  G.lastMatchEuro = "euro";
  G.lastMatchLabel = COMP_NAME[E.comp] + " · " + fix.label + note;
  G.live = null;
  G.screen = "matchResult";
  save();
  render();
}

/* ---------------- Penalty shootouts ---------------- */
/* Drawn knockout ties are settled kick by kick, not by a coin. */

function simShootoutClubs(myIdx, oppIdx, myXIids, oppXIids, plan) {
  const xiOf = (ci, ids) => (ids || bestXI(G.squads[ci], "4-4-2")).map(id => G.squads[ci].find(p => p.id === id)).filter(Boolean);
  const myXI = xiOf(myIdx, myXIids), opXI = xiOf(oppIdx, oppXIids);
  const takers = side => { const out = side.filter(p => p.pos !== "GK");
    plan === "fw"
      ? out.sort((a, b) => (b.pos === "FW" ? 1 : 0) - (a.pos === "FW" ? 1 : 0) || b.rating - a.rating)
      : out.sort((a, b) => b.rating - a.rating);
    if (G && G.pkTaker) { const k = out.findIndex(p => p.id === G.pkTaker); if (k > 0) out.unshift(out.splice(k, 1)[0]); }
    return out; };
  const keeper = xi => { const g = xi.find(p => p.pos === "GK"); return g ? g.rating : 70; };
  const myT = takers(myXI), opT = takers(opXI);
  const myGK = keeper(myXI), opGK = keeper(opXI);
  const pScore = (taker, gk) => Math.max(0.55, Math.min(0.92, 0.76 + (taker.rating - gk) * 0.004));
  const kicks = [];
  let myS = 0, opS = 0, myK = 0, opK = 0;
  const kick = (mineSide) => {
    const list = mineSide ? myT : opT;
    const t = list[(mineSide ? myK : opK) % list.length];
    if (mineSide) myK++; else opK++;
    const scored = rnd() < pScore(t, mineSide ? opGK : myGK);
    if (scored) { if (mineSide) myS++; else opS++; }
    kicks.push({ mine: mineSide, name: t.name, scored, myS, opS });
  };
  // five rounds each, stopping the moment it's mathematically settled
  let settled = false;
  for (let r = 0; r < 5 && !settled; r++) {
    kick(true);
    if (myS > opS + (5 - r) || opS > myS + (4 - r)) { settled = true; break; }
    kick(false);
    if (myS > opS + (4 - r) || opS > myS + (4 - r)) settled = true;
  }
  // sudden death
  let sd = 0;
  while (myS === opS && sd++ < 30) { kick(true); kick(false); }
  if (myS === opS) myS++; // the referee has a plane to catch
  return { myWin: myS > opS, myS, opS, kicks,
           note: " (" + (myS > opS ? "won" : "lost") + " " + myS + "–" + opS + " on penalties)" };
}

function shootoutEvents(so, myIdx, oppIdx) {
  return so.kicks.map((k, n) => ({
    min: 120, type: "info",
    text: "🥅 Pen " + (n + 1) + ": " + k.name + (k.scored ? " SCORES" : " MISSES") + "! " +
          CLUBS[myIdx].short + " " + k.myS + "–" + k.opS + " " + CLUBS[oppIdx].short,
    zh: "🥅 十二碼第 " + (n + 1) + " 輪：" + k.name + (k.scored ? "射入！" : "射失！") + " " +
        CLUBS[myIdx].short + " " + k.myS + "–" + k.opS + " " + CLUBS[oppIdx].short,
  }));
}

/* ---------------- Crowd sound (synthesized with WebAudio — no audio files) ----------------
   The crowd bed is looped brown noise through a bandpass filter; excitement moves the
   gain and filter frequency. Roars/groans are momentary gain swells; the referee's
   whistle is a square-wave oscillator with a 36Hz "pea" trill on its frequency. */
const SND = {
  ctx: null, dead: false, buf: null,
  crowd: null, crowdGain: null, crowdFilter: null,
  exc: 0.25, hold: 0,
  get on() { try { return localStorage.getItem("touchline_snd") !== "off"; } catch (e) { return false; } },
  bed() { return 0.05 + this.exc * 0.16; },
  init() {
    if (this.ctx || this.dead || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.dead = true; return; }
    try {
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 2;
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        last = (last + (Math.random() * 2 - 1) * 0.04) * 0.985;
        d[i] = last * 6;
      }
      this.buf = buf;
    } catch (e) { this.dead = true; this.ctx = null; }
  },
  startCrowd() {
    this.init();
    if (!this.ctx || this.crowd || !this.on) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const src = this.ctx.createBufferSource();
    src.buffer = this.buf; src.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "bandpass"; filt.frequency.value = 700; filt.Q.value = 0.6;
    const gain = this.ctx.createGain();
    gain.gain.value = 0;
    src.connect(filt); filt.connect(gain); gain.connect(this.ctx.destination);
    src.start();
    this.crowd = src; this.crowdGain = gain; this.crowdFilter = filt;
    this.setExcite(this.exc);
  },
  stopCrowd() {
    if (!this.ctx || !this.crowd) return;
    this.crowdGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.4);
    const old = this.crowd;
    this.crowd = null; this.crowdGain = null; this.crowdFilter = null;
    setTimeout(() => { try { old.stop(); } catch (e) {} }, 1800);
  },
  setExcite(x) {
    this.exc = Math.max(0.12, Math.min(1, x));
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    if (t < this.hold) return; // a roar/groan is mid-flight — don't cut it short
    this.crowdGain.gain.setTargetAtTime(this.bed(), t, 0.25);
    this.crowdFilter.frequency.setTargetAtTime(550 + this.exc * 900, t, 0.25);
  },
  swell(peak, up, down) {
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    const g = this.crowdGain.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(peak, t, up);
    g.setTargetAtTime(this.bed(), t + up * 4, down);
    this.hold = t + up * 4 + down * 2;
  },
  roar(big) { this.swell(big ? 0.55 : 0.34, 0.06, 0.9); },
  ooh() { this.swell(0.3, 0.05, 0.25); },
  groan() {
    if (!this.ctx || !this.crowdGain) return;
    const t = this.ctx.currentTime;
    const g = this.crowdGain.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime(0.3, t, 0.05);          // the rise as the chance opens up…
    g.setTargetAtTime(0.025, t + 0.4, 0.25);  // …then the air goes out of the ground
    g.setTargetAtTime(this.bed(), t + 1.5, 0.5);
    this.hold = t + 2.2;
  },
  whistle(blasts) {
    this.init();
    if (!this.ctx || !this.on) return;
    if (this.ctx.state === "suspended") this.ctx.resume();
    const t0 = this.ctx.currentTime + 0.02;
    for (let b = 0; b < blasts; b++) {
      const t = t0 + b * 0.42;
      const dur = blasts > 1 && b === blasts - 1 ? 0.65 : 0.28; // long final blast
      const osc = this.ctx.createOscillator();
      osc.type = "square"; osc.frequency.value = 2280;
      const trill = this.ctx.createOscillator();
      trill.frequency.value = 36;
      const trillGain = this.ctx.createGain(); trillGain.gain.value = 600;
      trill.connect(trillGain); trillGain.connect(osc.frequency);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.06, t + 0.02);
      g.gain.setValueAtTime(0.06, t + dur - 0.05);
      g.gain.linearRampToValueAtTime(0, t + dur);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); trill.start(t);
      osc.stop(t + dur + 0.05); trill.stop(t + dur + 0.05);
    }
  },
  cue(e) {
    if (!this.crowd) return;
    if (e.type === "goal") this.roar(e.clubIdx === G.myClub);
    else if (e.type === "chance") this.ooh();
    else if (e.type === "pkmiss") this.groan();
    else if (e.type === "yellow" || e.type === "red" || e.type === "injury") this.whistle(1);
  },
};

function toggleSound() {
  const wasOff = localStorage.getItem("touchline_snd") === "off";
  try { localStorage.setItem("touchline_snd", wasOff ? "on" : "off"); } catch (e) {}
  if (!wasOff) SND.stopCrowd();
  else if (G.live && tickTimer) SND.startCrowd();
  const b = document.getElementById("snd-btn");
