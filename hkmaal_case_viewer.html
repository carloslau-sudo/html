<style>
  :root {
    --paper: #FAF6EF;
    --card: #FFFBF5;
    --ink: #1B1F2A;
    --ink-muted: #4A5060;
    --ink-subtle: #8B8F9C;
    --rule: #D4CFC4;
    --brick: #A04B3F;
    --brick-soft: #F2DDD9;
    --brick-border: #D9B8B0;
    --sage: #4A6B58;
    --sage-soft: #E8EEE9;
    --sage-border: #C5D2C7;
    --dijon: #8B6F47;
    --dijon-soft: #F0E5D0;
    --dijon-border: #D8C09A;
    --highlight: #F5EFE2;
    --font-display: 'Fraunces', serif;
    --font-body: 'Source Serif 4', serif;
    --font-zh: 'Noto Serif TC', serif;
    --font-ui: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  .site-header { border-bottom: 1px solid var(--rule); }
  .site-header-inner { display: flex; align-items: flex-end; justify-content: space-between; padding: 24px 0; gap: 16px; flex-wrap: wrap; }
  .site-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-subtle); text-transform: uppercase; }
  .site-title { font-family: var(--font-display); font-size: 38px; font-weight: 500; line-height: 1.05; color: var(--ink); margin: 4px 0 0; letter-spacing: -0.02em; font-variation-settings: 'opsz' 96; }
  .site-title-en { font-family: var(--font-body); font-weight: 400; font-size: 22px; margin-left: 12px; color: var(--ink-muted); font-style: italic; }
  .count-badge { font-family: var(--font-mono); font-size: 12px; color: var(--ink-subtle); letter-spacing: 0.05em; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 14px; font-family: var(--font-ui); font-weight: 500; border: 1px solid transparent; letter-spacing: 0.01em; transition: all 0.15s; background: transparent; color: var(--ink); }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: #000; }
  .btn-secondary { color: var(--ink); border-color: var(--ink); }
  .btn-secondary:hover { background: var(--highlight); }
  .btn-ghost { color: var(--ink-muted); }
  .btn-ghost:hover { background: var(--highlight); color: var(--ink); }

  .pill { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 2px; border: 1px solid; font-family: var(--font-mono); letter-spacing: 0.02em; }
  .pill-ink { background: var(--highlight); color: var(--ink); border-color: var(--rule); }
  .pill-sage { background: var(--sage-soft); color: var(--sage); border-color: var(--sage-border); }
  .pill-brick { background: var(--brick-soft); color: var(--brick); border-color: var(--brick-border); }
  .pill-dijon { background: var(--dijon-soft); color: var(--dijon); border-color: var(--dijon-border); }
  .pill-warn { background: #FCE9C9; color: #876018; border-color: #E5C485; font-family: var(--font-ui); }

  .rule { height: 1px; background: var(--rule); }

  .library-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: wrap; gap: 12px; }
  .filter-select { padding: 6px 12px; font-size: 14px; font-family: var(--font-ui); border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 2px; }
  .checkbox-label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 13px; color: var(--ink-muted); cursor: pointer; }
  .checkbox-label input { margin: 0; }

  .case-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .case-card { padding: 24px; background: var(--card); cursor: pointer; transition: background 0.15s; }
  .case-card:hover { background: var(--highlight); }
  .case-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .case-title-zh { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--ink); line-height: 1.2; margin: 0 0 4px; font-variation-settings: 'opsz' 96; }
  .case-title-en { font-family: var(--font-body); font-size: 15px; font-style: italic; color: var(--ink-muted); line-height: 1.3; margin-bottom: 16px; }
  .case-meta-line { font-family: var(--font-mono); font-size: 11px; color: var(--ink-subtle); letter-spacing: 0.05em; }
  .empty-state { text-align: center; padding: 64px 24px; }

  .case-topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }

  .case-header { padding: 32px; background: var(--card); border: 1px solid var(--rule); margin-bottom: 32px; }
  .case-header-title { font-family: var(--font-display); font-size: 36px; font-weight: 500; color: var(--ink); line-height: 1.1; letter-spacing: -0.02em; font-variation-settings: 'opsz' 96; margin: 0; }
  .case-header-en { font-family: var(--font-body); font-style: italic; font-size: 20px; color: var(--ink-muted); margin-top: 6px; }
  .case-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; }
  .meta-col-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-subtle); text-transform: uppercase; margin-bottom: 6px; }
  .meta-col-body { font-family: var(--font-body); font-size: 14px; color: var(--ink); line-height: 1.5; }
  .meta-col-body strong { font-family: var(--font-zh); font-weight: 500; }

  .tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; margin-bottom: 24px; border-bottom: 1px solid var(--rule); }
  .tab { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: none; border: none; font-size: 14px; font-family: var(--font-ui); font-weight: 500; color: var(--ink-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tab.locked { opacity: 0.5; color: var(--ink-subtle); }
  .tab-en { font-style: italic; font-weight: 400; color: var(--ink-subtle); margin-left: 2px; }

  /* Stacked bilingual: zh on top, en beneath, separated by a soft rule */
  .bilingual-block { margin-bottom: 24px; }
  .bilingual-block .zh-block { margin-bottom: 16px; }
  .bilingual-block .en-block { padding-top: 16px; border-top: 1px dashed var(--rule); }
  .prose-zh p { font-family: var(--font-zh); font-size: 16px; line-height: 1.9; color: var(--ink); text-align: justify; margin: 0 0 14px; }
  .prose-en p { font-family: var(--font-body); font-size: 15px; line-height: 1.7; color: var(--ink-muted); margin: 0 0 14px; font-style: italic; }

  .brief-title-zh { font-family: var(--font-display); font-size: 26px; font-weight: 500; color: var(--ink); line-height: 1.1; letter-spacing: -0.01em; font-variation-settings: 'opsz' 96; margin: 0; }
  .brief-title-en { font-family: var(--font-body); font-style: italic; font-size: 18px; font-weight: 500; color: var(--ink-muted); line-height: 1.2; margin: 4px 0 0; }
  .brief-subtitle-zh { font-family: var(--font-zh); font-size: 14px; color: var(--ink-subtle); margin-top: 6px; }
  .brief-subtitle-en { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--ink-subtle); margin-top: 2px; }
  .brief-head { margin-bottom: 24px; }

  .confidential-alert { padding: 16px; background: var(--brick-soft); border: 1px solid var(--brick-border); margin-bottom: 16px; }
  .confidential-alert-label-zh { font-family: var(--font-zh); font-weight: 600; font-size: 14px; color: var(--brick); }
  .confidential-alert-label-en { font-family: var(--font-body); font-size: 12px; color: var(--brick); letter-spacing: 0.05em; text-transform: uppercase; font-style: italic; margin-top: 2px; }
  .confidential-alert-desc-zh { font-family: var(--font-zh); font-size: 13px; color: var(--brick); margin-top: 6px; }
  .confidential-alert-desc-en { font-family: var(--font-body); font-style: italic; font-size: 12px; color: var(--brick); margin-top: 2px; }

  .role-player-box { margin-top: 32px; padding: 20px; background: var(--highlight); border: 1px solid var(--rule); }
  .role-player-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-subtle); text-transform: uppercase; margin-bottom: 12px; }

  .overview-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--ink); }
  .overview-col { padding: 20px; }
  .overview-col + .overview-col { border-left: 1px solid var(--ink); }
  .overview-col-title-zh { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--ink); padding-bottom: 4px; }
  .overview-col-title-en { font-family: var(--font-body); font-style: italic; font-weight: 400; font-size: 13px; color: var(--ink-muted); padding-bottom: 8px; border-bottom: 1px solid var(--ink); margin-bottom: 12px; }
  .overview-subhead-zh { font-family: var(--font-zh); font-size: 12px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.03em; margin-bottom: 4px; margin-top: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .overview-subhead-zh:first-of-type { margin-top: 0; }
  .overview-subhead-en { font-family: var(--font-body); font-style: italic; font-size: 11px; color: var(--ink-subtle); margin-bottom: 6px; }
  .overview-list { list-style: decimal; padding-left: 18px; margin: 0; }
  .overview-list li { margin-bottom: 12px; }
  .overview-zh { font-family: var(--font-zh); font-size: 14px; color: var(--ink); line-height: 1.55; margin-bottom: 4px; }
  .overview-en { font-family: var(--font-body); font-style: italic; font-size: 12px; color: var(--ink-muted); line-height: 1.5; }

  .locked { text-align: center; padding: 96px 32px; border: 1px dashed var(--rule); background: var(--card); }
  .locked-icon { color: var(--ink-subtle); margin: 0 auto 16px; display: block; }
  .locked-title-zh { font-family: var(--font-display); font-size: 28px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; font-variation-settings: 'opsz' 96; }
  .locked-title-en { font-family: var(--font-body); font-style: italic; font-weight: 400; font-size: 18px; color: var(--ink-muted); display: block; margin-top: 4px; }
  .locked-desc-zh { font-family: var(--font-zh); font-size: 14px; color: var(--ink-muted); margin: 16px auto 4px; max-width: 480px; }
  .locked-desc-en { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--ink-subtle); margin: 0 auto 24px; max-width: 480px; }

  .site-footer { border-top: 1px solid var(--rule); margin-top: 32px; padding: 24px 0; }
  .site-footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .site-footer-tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; color: var(--ink-subtle); text-transform: uppercase; }
  .site-footer-note { font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--ink-subtle); }

  .icon { width: 14px; height: 14px; stroke-width: 1.75; }
  .icon-md { width: 16px; height: 16px; stroke-width: 1.75; }
  .icon-xl { width: 32px; height: 32px; stroke-width: 1.25; }

  @media (max-width: 700px) {
    .overview-grid { grid-template-columns: 1fr; }
    .overview-col + .overview-col { border-left: none; border-top: 1px solid var(--ink); }
    .case-meta-grid { grid-template-columns: 1fr 1fr; }
    .site-title { font-size: 28px; }
    .case-header-title { font-size: 26px; }
  }
</style>
