<html lang="zh-Hant">
<head>

<title>Bilingual Mediation Casebook · 雙語調解案集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --ink: #1F1B16;
  --ink-soft: #3E3A33;
  --ink-faint: #6B655B;
  --paper: #FAF6EE;
  --paper-2: #F2EDE2;
  --rule: #C9C0AE;
  --rule-soft: #DDD5C3;
  --accent: #6E2A1F;

  --sage: #E8EDE0;
  --sage-rule: #B8C2A8;
  --sage-ink: #3A4A2E;
  --dijon: #EDE3CC;
  --dijon-rule: #C5B485;
  --dijon-ink: #5A4818;

  --slate: #DDE5EB;
  --slate-rule: #9DAFC1;
  --slate-ink: #2A3E55;

  --terracotta: #EAD8CD;
  --terracotta-rule: #BE9080;
  --terracotta-ink: #5E2818;

  --plum: #E5DCE5;
  --plum-rule: #A98EA9;
  --plum-ink: #4A2B49;

  --stone: #E5E2DC;
  --stone-rule: #B0AB9F;
  --stone-ink: #3F3B33;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Spectral', 'Noto Serif TC', Georgia, serif;
  font-size: 16px;
  line-height: 1.7;
  font-feature-settings: "kern" 1, "liga" 1;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(110, 42, 31, 0.025), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(58, 74, 46, 0.02), transparent 50%);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 246, 238, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rule);
  padding: 14px 32px;
}
.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.brand {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.01em;
  color: var(--accent);
  margin-right: auto;
}
.brand .sub {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--paper);
  vertical-align: 4px;
}
select, .toggle-btn {
  font-family: 'Spectral', 'Noto Serif TC', serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 6px 12px;
  border-radius: 3px;
  cursor: pointer;
}
select:hover, .toggle-btn:hover { border-color: var(--ink); }
.toggle-group { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.toggle-group .toggle-btn { border: none; border-radius: 0; padding: 6px 14px; background: transparent; }
.toggle-group .toggle-btn.active { background: var(--ink); color: var(--paper); }

main { max-width: 1180px; margin: 0 auto; padding: 40px 32px 80px; }

.case-header { margin-bottom: 36px; padding-bottom: 24px; border-bottom: 2px solid var(--ink); }
.case-meta { display: flex; gap: 12px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 12px; }
.case-meta .pill { padding: 3px 8px; border: 1px solid var(--rule); border-radius: 2px; }
.case-meta .pill.level-1 { color: var(--sage-ink); border-color: var(--sage-rule); background: var(--sage); }
.case-meta .pill.level-2 { color: var(--slate-ink); border-color: var(--slate-rule); background: var(--slate); }
.case-meta .pill.level-3 { color: var(--accent); border-color: var(--accent); }

.case-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-size: 38px;
  line-height: 1.15;
  margin: 0 0 8px;
  letter-spacing: -0.01em;
}
section.block { margin-bottom: 48px; }
.section-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.section-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-size: 24px;
  margin: 0 0 18px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.section-title .en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 16px;
  color: var(--ink-faint);
}

.prose { font-size: 16px; line-height: 1.78; color: var(--ink); }
.prose p { margin: 0 0 14px; text-align: justify; hyphens: auto; }

.confidentials { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
@media (max-width: 920px) { .confidentials { grid-template-columns: 1fr; } }

.party-card {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-top: 4px solid var(--ink);
  padding: 28px;
  position: relative;
}
.party-card .party-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 4px;
}
.party-card h3 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-size: 22px;
  margin: 0 0 4px;
}
.party-card .role {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: var(--ink-soft);
  font-size: 15px;
  margin-bottom: 18px;
}

.schema-box {
  border-left: 3px solid;
  padding: 16px 18px;
  margin: 18px 0;
  border-radius: 0 4px 4px 0;
}
.schema-box .box-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.schema-box .box-label .zh { font-family: 'Noto Serif TC', serif; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
.schema-box .box-content { font-size: 14.5px; line-height: 1.65; }
.schema-box .box-content .field-name {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-style: italic;
  font-weight: 500;
  margin-right: 6px;
}
.schema-box .box-content p { margin: 6px 0; }
.schema-box .tag {
  display: inline-block;
  padding: 2px 8px;
  margin: 2px 4px 2px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.02em;
  border: 1px solid;
  border-radius: 2px;
  background: rgba(255,255,255,0.55);
}

.box-register { background: var(--slate); border-left-color: var(--slate-rule); color: var(--slate-ink); }
.box-register .tag { color: var(--slate-ink); border-color: var(--slate-rule); }

.box-legitimacy { background: var(--terracotta); border-left-color: var(--terracotta-rule); color: var(--terracotta-ink); }
.box-legitimacy .tag { color: var(--terracotta-ink); border-color: var(--terracotta-rule); }

.box-trust { background: var(--plum); border-left-color: var(--plum-rule); color: var(--plum-ink); }
.box-trust .field-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-bottom: 6px; }
.box-trust .field-key {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--plum-ink);
  opacity: 0.7;
  padding-top: 4px;
}

.box-coding { background: var(--stone); border-left-color: var(--stone-rule); color: var(--stone-ink); }
.box-coding .tag { color: var(--stone-ink); border-color: var(--stone-rule); }

.box-attributes { background: var(--sage); border-left-color: var(--sage-rule); color: var(--sage-ink); }
.box-attributes .attr-row { padding: 8px 0; border-bottom: 1px dashed rgba(58, 74, 46, 0.2); }
.box-attributes .attr-row:last-child { border-bottom: none; }
.box-attributes .attr-name {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.02em;
}
.box-attributes .attr-trigger { font-size: 13.5px; margin-top: 3px; color: var(--sage-ink); opacity: 0.85; }

.box-instruction { background: var(--dijon); border-left-color: var(--dijon-rule); color: var(--dijon-ink); }
.box-instruction .box-content { font-style: italic; }

.schema-legend {
  margin: 32px 0;
  padding: 24px 28px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--accent);
}
.schema-legend h4 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-size: 18px;
  margin: 0 0 12px;
  color: var(--accent);
  letter-spacing: 0.01em;
}
.schema-legend .legend-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  font-size: 13px;
}
.schema-legend .legend-item .swatch { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 8px; border: 1px solid; }
.schema-legend .legend-item strong { font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; font-weight: 600; }

.placeholder-note {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  padding: 8px 12px;
  background: rgba(110, 42, 31, 0.05);
  border-left: 2px solid var(--accent);
  margin: 12px 0;
}

body.lang-zh .lang-en, body.lang-zh .lang-sc { display: none; }
body.lang-sc .lang-en, body.lang-sc .lang-zh { display: none; }
body.lang-en .lang-zh, body.lang-en .lang-sc { display: none; }

/* Language-appropriate fonts */
body.lang-zh, body.lang-zh .lang-zh { font-family: 'Spectral', 'Noto Serif TC', Georgia, serif; }
body.lang-sc, body.lang-sc .lang-sc { font-family: 'Spectral', 'Noto Serif SC', Georgia, serif; }
.schema-box .box-label .zh .lang-zh { font-family: 'Noto Serif TC', serif; }
.schema-box .box-label .zh .lang-sc { font-family: 'Noto Serif SC', serif; }
.party-card h3 .lang-sc, .case-title .lang-sc { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; }

.banner {
  margin: 0 0 36px;
  padding: 18px 24px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--ink);
}
.banner-title {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', serif;
  font-weight: 600;
  font-size: 16px;
  margin: 0 0 6px;
}
.banner-text { font-size: 14px; color: var(--ink-soft); margin: 0; }

footer {
  margin-top: 80px;
  padding-top: 24px;
  border-top: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
}

@media print {
  .topbar { position: static; }
  body { background: white; }
}

/* Download buttons */
.download-btn {
  font-family: 'Spectral', 'Noto Serif TC', 'Noto Serif SC', Georgia, serif;
  font-size: 12px;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid var(--rule);
  padding: 4px 12px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-left: 12px;
}
.download-btn:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.download-btn::before {
  content: "\2193";
  margin-right: 4px;
}

.case-header { position: relative; }
.case-header .download-full {
  position: absolute;
  top: 4px;
  right: 0;
}

.section-title {
  display: flex !important;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.section-title .titles-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex: 1;
}

.party-card { position: relative; }
.party-card .download-cb {
  position: absolute;
  top: 18px;
  right: 18px;
  font-size: 11px;
  padding: 3px 10px;
  margin: 0;
}

/* Overview section */
.overview-block { margin-bottom: 28px; }
.overview-block h3 {
  font-family: 'Cormorant Garamond', 'Noto Serif TC', 'Noto Serif SC', serif;
  font-weight: 600;
  font-size: 19px;
  margin: 0 0 8px;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.overview-block h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin: 14px 0 6px;
  font-weight: 500;
}
.overview-block ol {
  margin: 0 0 12px 0;
  padding: 0;
  list-style: none;
  counter-reset: ov;
}
.overview-block li {
  margin-bottom: 8px;
  line-height: 1.7;
  padding-left: 30px;
  position: relative;
  counter-increment: ov;
}
.overview-block li::before {
  content: counter(ov);
  position: absolute;
  left: 0;
  top: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  width: 22px;
  text-align: right;
  padding-right: 4px;
}
</style>
</head>

      zh: "李太於 2018 年透過中介選用「彭氏寵物紀念」之雙位骨灰龕服務，分別為當時患重病的家中老犬「黑仔」及健康但年長的家貓「肥妹」預訂兩個相連龕位，合共付出 HK$48,600（包括長期安置費、長期供奉清潔費、石碑及刻字），並於同年完成《委託寄存供奉協議書》。2020 年香港政府推出新修訂之《寵物殯儀及紀念設施條例》，要求所有商業寵物骨灰龕場必須持牌經營，並訂明過渡期內不可接受新骨灰存放於新出售或新出租龕位。彭氏寵物紀念屬「截算前場所」，可申請暫免法律責任書，但在牌照仍未批出之過渡期內，只能繼續存放已存骨灰，不可接受新存放。2021 年 4 月「黑仔」因病過身，李太被告知無法即時安置骨灰於原預訂龕位，只可放於港島臨時短期暫存服務，每月需繳付 HK$320，共支付 21 個月（直至 2023 年初獲分配政府寵物紀念設施）。期間彭氏方面僅於 2022 年中通過張貼告示形式提出兩個方案：（一）預留龕位但不封碑、骨灰待牌照後再上位；（二）轉贈龕位予其他直系親友或寵物。李太認為兩個方案皆不可行 &mdash; 第一方案沒有主動通知，而且暫存期間「肥妹」亦已過身，二寵長期分離與當初預訂雙位的本意相違；第二方案則因家中無其他寵物可承繼。2024 年 6 月李太展開正式法律程序，要求退回「黑仔」龕位的安置費及清潔費共 HK$24,300。雙方在正式聆訊前曾自行會面一次，彭氏建議「待牌照批出後優先轉售並原銀奉還」，李太認為承諾過於模糊，於是申請正式調解。",
      sc: "李太于 2018 年透过中介选用「彭氏宠物纪念」之双位骨灰龛服务，分别为当时患重病的家中老犬「黑仔」及健康但年长的家猫「肥妹」预订两个相连龛位，合共付出 HK$48,600（包括长期安置费、长期供奉清洁费、石碑及刻字），并于同年完成《委托寄存供奉协议书》。2020 年香港政府推出新修订之《宠物殡仪及纪念设施条例》，要求所有商业宠物骨灰龛场必须持牌经营，并订明过渡期内不可接受新骨灰存放于新出售或新出租龛位。彭氏宠物纪念属「截算前场所」，可申请暂免法律责任书，但在牌照仍未批出之过渡期内，只能继续存放已存骨灰，不可接受新存放。2021 年 4 月「黑仔」因病过身，李太被告知无法即时安置骨灰于原预订龛位，只可放于港岛临时短期暂存服务，每月需缴付 HK$320，共支付 21 个月（直至 2023 年初获分配政府宠物纪念设施）。期间彭氏方面仅于 2022 年中通过张贴告示形式提出两个方案：（一）预留龛位但不封碑、骨灰待牌照后再上位；（二）转赠龛位予其他直系亲友或宠物。李太认为两个方案皆不可行 &mdash; 第一方案没有主动通知，而且暂存期间「肥妹」亦已过身，二宠长期分离与当初预订双位的本意相违；第二方案则因家中无其他宠物可承继。2024 年 6 月李太展开正式法律程序，要求退回「黑仔」龛位的安置费及清洁费共 HK$24,300。双方在正式聆讯前曾自行会面一次，彭氏建议「待牌照批出后优先转售并原银奉还」，李太认为承诺过于模糊，于是申请正式调解。",
      en: "In 2018 Mrs Lee bought paired pet-memorial niches from Pang&rsquo;s Pet Memorial via an intermediary, one each for her seriously-ill old dog Hak-Chai and her ageing but healthy cat Fei-Mui, paying HK$48,600 in total (long-term placement fee, long-term cleaning fee, stele and engraving). She signed the firm&rsquo;s standard custody-and-veneration agreement in the same year. In 2020 the Hong Kong government enacted a Pet Funerary and Memorial Facilities Ordinance requiring all commercial pet-memorial operators to obtain a licence; during the transition period no new ashes may be placed in newly-sold or newly-rented niches. Pang&rsquo;s qualified as a &lsquo;pre-cutoff&rsquo; operator and applied for a temporary exemption, meaning during the transition it can keep existing ashes but accept no new placements. Hak-Chai died in April 2021. Mrs Lee was told the ashes could not be placed in the pre-purchased niche; they went to a temporary government-run storage on Hong Kong Island at HK$320 per month, which she paid for 21 months until a government memorial slot was allocated in early 2023. During that period, in mid-2022, Pang&rsquo;s offered two options via a posted notice only: (i) reserve the niche but defer sealing and allow possible later relocation; (ii) transfer the niche to another family member or pet. Mrs Lee rejected both &mdash; the first because she received no proactive notice and Fei-Mui had since died, defeating the &lsquo;paired niche&rsquo; intent; the second because she has no other pets at home. In June 2024 she commenced formal legal proceedings seeking the return of Hak-Chai&rsquo;s placement and cleaning fees totalling HK$24,300. The parties self-negotiated once before the hearing; Pang&rsquo;s offered &ldquo;priority resale at full refund once licensed&rdquo; but Mrs Lee found the commitment too vague and applied for formal mediation."
    },

    joint_brief: {
      zh: "老陳（52歲，2012 年退休前是油尖區九年警員）和老李（54歲，二十多年廚房經驗，行內叫他「光哥」）是十二年前的街坊朋友。雙方在 2012 年各出資 HK$420,000，合共 HK$840,000 在旺角西洋菜街開設「鴻發茶餐廳」，各佔 50% 股權。合夥協議書約定：老陳負責資金、賬目及對外文件；老李負責廚房、入貨及人事。鴻發頭七年生意穩健，月利潤約 HK$40,000 至 HK$80,000，雙方平分。\n\n由 2020 年起，受疫情、租金上漲、外賣平台抽佣等因素影響，利潤下滑。2023 年起連續八個月錄得輕微虧損，2024 年上半年累計虧損約 HK$95,000。老陳開始翻查賬目，發現幾個問題：（一）入貨單和實際庫存之間存在差距，尤其是海鮮、雞翼和凍肉部分；（二）老李的姪子阿光（三年前由老李介紹入廚房做幫廚）有定期把當日剩餘食材帶回家的習慣，但賬目上沒有相關紀錄；（三）2024 年 3 月某次入米的單據顯示購入 200 公斤，但實際倉庫只見到 130 公斤入帳。\n\n老李的解釋是：阿光以及其他廚房員工帶走「散貨」屬於茶餐廳行業常見的非正式員工補貼，本來就在他作為廚房及人事主管的權限範圍之內，是長期默許的做法。老陳則認為：（一）規模已超出合理「散貨」範圍；（二）任何重大不入賬的物資流出都應該由合夥雙方同意；（三）老李未將這個安排通知資金合夥人，本身就是違反合夥責任。\n\n2024 年 6 月老陳要求清盤，提出按 50/50 分配剩餘資產（估值約 HK$280,000）後拆夥，並要求老李就累計約 HK$48,000 的未入帳物資承擔責任。老李認為老陳「見錢眼開、不顧街坊情義」，堅持繼續經營。雙方在 2024 年 8 月有過一次激烈爭執，當場老陳在阿光及幾位街坊面前公開質問阿光「為甚麼有些東西沒有入賬」，老李即場表示「你當著街坊面前質問我的家人和我的廚房，那我們不用做朋友」。之後雙方在 WhatsApp 群組互相發 voice message，街坊朋友勸解雙方都不奏效。老陳於 2024 年 10 月展開正式法律程序，要求清盤、分賬及追討約 HK$48,000 的未入帳物資價值。經朋友介紹，雙方同意嘗試調解。",
      sc: "老陈（52岁，2012 年退休前是油尖区九年警员）和老李（54岁，二十多年厨房经验，业内称他「光哥」）是十二年前的街坊朋友。双方在 2012 年各出资 HK$420,000，合共 HK$840,000 在旺角西洋菜街开设「鸿发茶餐厅」，各占 50% 股权。合伙协议书约定：老陈负责资金、账目及对外文件；老李负责厨房、入货及人事。鸿发头七年生意稳健，月利润约 HK$40,000 至 HK$80,000，双方平分。\n\n由 2020 年起，受疫情、租金上涨、外卖平台抽佣等因素影响，利润下滑。2023 年起连续八个月录得轻微亏损，2024 年上半年累计亏损约 HK$95,000。老陈开始翻查账目，发现几个问题：（一）入货单和实际库存之间存在差距，尤其是海鲜、鸡翼和冻肉部分；（二）老李的侄子阿光（三年前由老李介绍入厨房做帮厨）有定期把当日剩余食材带回家的习惯，但账目上没有相关纪录；（三）2024 年 3 月某次入米的单据显示购入 200 公斤，但实际仓库只见到 130 公斤入账。\n\n老李的解释是：阿光以及其他厨房员工带走「散货」属于茶餐厅行业常见的非正式员工补贴，本来就在他作为厨房及人事主管的权限范围之内，是长期默许的做法。老陈则认为：（一）规模已超出合理「散货」范围；（二）任何重大不入账的物资流出都应该由合伙双方同意；（三）老李未将这个安排通知资金合伙人，本身就是违反合伙责任。\n\n2024 年 6 月老陈要求清盘，提出按 50/50 分配剩余资产（估值约 HK$280,000）后分拆，并要求老李就累计约 HK$48,000 的未入账物资承担责任。老李认为老陈「见钱眼开、不顾街坊情义」，坚持继续经营。双方在 2024 年 8 月有过一次激烈争执，当场老陈在阿光及几位街坊面前公开质问阿光「为甚么有些东西没有入账」，老李立即表示「你当着街坊面前质问我的家人和我的厨房，那我们不用做朋友」。之后双方在 WhatsApp 群组互相发 voice message，街坊朋友劝解双方都不奏效。老陈于 2024 年 10 月展开正式法律程序，要求清盘、分账及追讨约 HK$48,000 的未入账物资价值。经朋友介绍，双方同意尝试调解。",
      en: "Old Chan (52, retired in 2012 after nine years as a police officer in the Yau Tsim district) and Old Lee (54, over 20 years of kitchen experience, known in the trade as Brother Gwong) have been neighbourhood friends for twelve years. In 2012 they each invested HK$420,000, totalling HK$840,000, to open Hung Fat Cafe — a Hong Kong cha chaan teng (an all-day diner-style cafe) — on Sai Yeung Choi Street in Mong Kok, each holding 50% equity. The partnership agreement assigned Chan to capital, bookkeeping, and external affairs; Lee to the kitchen, procurement, and personnel. Hung Fat ran steadily for the first seven years, with monthly profits between HK$40,000 and HK$80,000, split equally.\n\nFrom 2020 onwards, profits declined under the combined pressure of the pandemic, rising rent, and delivery-platform commissions. From 2023, eight consecutive months posted small losses; the first half of 2024 accumulated around HK$95,000 in losses. Chan began reviewing the books and found several issues: (i) discrepancies between procurement invoices and actual inventory, particularly in seafood, chicken wings, and frozen meat; (ii) Lee's nephew Ah Gwong (introduced into the kitchen by Lee three years ago as kitchen help) routinely took the day's leftover stock home, with no corresponding entry in the books; (iii) a March 2024 rice procurement invoice showed 200 kg purchased, but only 130 kg appeared in the warehouse intake records.\n\nLee's position: it is widely understood across the HK cha chaan teng trade that kitchen staff are permitted to take leftover stock home as informal supplementary compensation. As Lee is the partnership's kitchen and personnel manager under the partnership agreement, this practice falls within his contractual authority and has been tacitly sanctioned for years. Chan's position: (i) the scale has outgrown what counts as 'leftover'; (ii) any material undocumented outflow should require both partners' consent; (iii) Lee's failure to notify the capital partner of this arrangement is itself a breach of partnership duty.\n\nIn June 2024 Chan demanded a wind-up, proposing 50/50 distribution of the remaining assets (valued around HK$280,000) followed by dissolution, and asked Lee to assume responsibility for the approximately HK$48,000 of un-recorded stock outflow. Lee viewed Chan as driven by money, indifferent to the bonds of neighbourhood, and insisted on continuing to operate. They had a heated confrontation in August 2024 when Chan publicly questioned Ah Gwong in front of several neighbours about why certain items weren't in the books, and Lee immediately replied: \"You're questioning my family and my kitchen in front of the neighbourhood — then we don't need to be friends anymore.\" Subsequent WhatsApp voice messages between them were sharp; mediation attempts by mutual friends came to nothing. Chan commenced formal legal proceedings in October 2024, demanding wind-up, accounting, and recovery of approximately HK$48,000 in un-recorded stock value. A mutual friend referred them to mediation."

function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function sentenceSep(lang) { return lang === 'en' ? ', ' : '\uff0c'; }
function sentenceEnd(lang) { return lang === 'en' ? '. ' : '\u3002'; }

const PRINT_LABELS = {
  zh: { section: '\u8abf\u89e3\u6982\u89bd\u8868', cg: '\u5171\u540c\u57fa\u790e', generic: '\u4e00\u822c\u9069\u7528', case_spec: '\u6b64\u500b\u6848\u9069\u7528', issues: '\u5f85\u8b70\u4e8b\u9805', options: '\u53ef\u884c\u65b9\u6848', joint: '\u806f\u5408\u7c21\u4ecb', cb: '\u6a5f\u5bc6\u7c21\u4ecb', warning: '\u6b64\u6a5f\u5bc6\u7c21\u4ecb\u53ea\u80fd\u7531\u672c\u7576\u4e8b\u4eba\u53ca\u8abf\u89e3\u54e1\u67e5\u95b1\uff0c\u4e0d\u53ef\u5411\u5c0d\u65b9\u62ab\u9732\u3002', claimant: '\u7533\u7d22\u65b9', defendant: '\u88ab\u544a\u65b9', full: '\u5b8c\u6574\u500b\u6848' },
  sc: { section: '\u8c03\u89e3\u6982\u89c8\u8868', cg: '\u5171\u540c\u57fa\u7840', generic: '\u4e00\u822c\u9002\u7528', case_spec: '\u6b64\u4e2a\u6848\u9002\u7528', issues: '\u5f85\u8bae\u4e8b\u9879', options: '\u53ef\u884c\u65b9\u6848', joint: '\u8054\u5408\u7b80\u4ecb', cb: '\u673a\u5bc6\u7b80\u4ecb', warning: '\u6b64\u673a\u5bc6\u7b80\u4ecb\u53ea\u80fd\u7531\u672c\u5f53\u4e8b\u4eba\u53ca\u8c03\u89e3\u5458\u67e5\u9605\uff0c\u4e0d\u53ef\u5411\u5bf9\u65b9\u62ab\u9732\u3002', claimant: '\u7533\u7d22\u65b9', defendant: '\u88ab\u544a\u65b9', full: '\u5b8c\u6574\u4e2a\u6848' },
  en: { section: 'Mediation Overview', cg: 'Common Ground', generic: 'Generic', case_spec: 'Case-specific', issues: 'Issues', options: 'Options', joint: 'Joint Brief', cb: 'Confidential Brief', warning: 'This confidential brief is for this party and the mediator only. It must not be disclosed to the other party.', claimant: 'Claimant', defendant: 'Defendant', full: 'Full Case' }
};

    alert('Pop-up blocked. Please allow pop-ups for this site to download.');
    return;
  }
  const doc = '<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>' + escHtml(title) + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Spectral:wght@400;500&family=Noto+Serif+TC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">'
    + '<style>'
    + '@page { size: A4; margin: 22mm 18mm; }'
    + 'body { font-family: "Spectral", "Noto Serif TC", "Noto Serif SC", Georgia, serif; font-size: 13px; line-height: 1.75; color: #1F1B16; background: #FAF6EE; max-width: 820px; margin: 0 auto; padding: 24px; }'
    + 'h1 { font-family: "Cormorant Garamond", "Noto Serif TC", "Noto Serif SC", serif; font-weight: 600; font-size: 30px; margin: 0 0 4px; letter-spacing: -0.01em; }'
    + 'h2 { font-family: "Cormorant Garamond", "Noto Serif TC", "Noto Serif SC", serif; font-weight: 600; font-size: 22px; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #C9C0AE; }'
    + 'h3 { font-family: "Cormorant Garamond", "Noto Serif TC", "Noto Serif SC", serif; font-weight: 600; font-size: 18px; margin: 20px 0 8px; }'
    + 'h4 { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #6B655B; font-weight: 500; margin: 16px 0 6px; }'
    + 'p { margin: 0 0 12px; text-align: justify; }'
    + '.meta { font-family: "Cormorant Garamond", "Noto Serif TC", "Noto Serif SC", serif; font-style: italic; color: #6B655B; font-size: 14px; margin: 0 0 24px; }'
    + '.party-label { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #6B655B; margin-bottom: 4px; margin-top: 16px; }'
    + '.role { font-style: italic; color: #3E3A33; font-size: 13px; margin: 0 0 12px; }'
    + '.warning { padding: 10px 14px; background: rgba(110, 42, 31, 0.06); border-left: 3px solid #6E2A1F; font-size: 12px; color: #6E2A1F; margin: 8px 0 18px; }'
    + 'ol { margin: 4px 0 12px 24px; padding: 0; }'
    + 'li { margin-bottom: 6px; line-height: 1.65; }'
    + '.toolbar { background: #F2EDE2; border: 1px solid #C9C0AE; padding: 12px; text-align: center; margin-bottom: 24px; border-radius: 3px; }'
    + '.toolbar button { font-family: "Spectral", serif; font-size: 13px; padding: 6px 14px; cursor: pointer; background: #1F1B16; color: #FAF6EE; border: none; border-radius: 2px; margin: 0 4px; }'
    + '.toolbar button:hover { background: #6E2A1F; }'
    + 'hr { border: 0; border-top: 1px solid #DDD5C3; margin: 28px 0; }'
    + '@media print { .no-print { display: none; } body { background: white; padding: 0; max-width: none; } }'
    + '</style></head><body>'
    + '<div class="toolbar no-print"><button onclick="window.print()">Print / Save as PDF</button><button onclick="window.close()">Close</button></div>'
    + bodyHtml
    + '</body></html>';
  w.document.open();
  w.document.write(doc);
  w.document.close();
}

function renderListItems(items) {
  if (!items || !items.length) return '<p><em>(empty)</em></p>';
  return '<ol>' + items.map(it => '<li>' + escHtml(it) + '</li>').join('') + '</ol>';
}

function downloadJointBrief() {
  if (!currentCase) return;
  const lang = currentLang();
  const L = PRINT_LABELS[lang];
  const title = currentCase.meta['title_' + lang];
  const altLang = lang === 'en' ? 'zh' : 'en';
  const altTitle = currentCase.meta['title_' + altLang];
  const html = '<h1>' + escHtml(title) + '</h1>'
    + '<p class="meta">' + escHtml(altTitle) + '</p>'
    + '<h2>' + escHtml(L.joint) + '</h2>'
    + '<p>' + escHtml(currentCase.joint_brief[lang]) + '</p>';
  openPrintWindow(title + ' \u2014 ' + L.joint, html);
}

function downloadConfidentialBrief(partyIndex) {
  if (!currentCase) return;
  const lang = currentLang();
  const L = PRINT_LABELS[lang];
  const cb = currentCase.confidential_briefs[partyIndex];
  const party = currentCase.parties[partyIndex];
  const title = currentCase.meta['title_' + lang];
  const altLang = lang === 'en' ? 'zh' : 'en';
  const altTitle = currentCase.meta['title_' + altLang];
  const partyName = party['name_' + lang];
  const roleText = party['role_' + lang];
  const tbWhen = cb.trust_breakdown['when_' + lang];
  const tbWhat = cb.trust_breakdown['what_' + lang];
  const tbWhy = cb.trust_breakdown['why_it_mattered_' + lang];
  const rpi = cb['role_player_instruction_' + lang];
  const brief = cb['brief_' + lang];
  const sep = sentenceSep(lang);
  const period = sentenceEnd(lang);
  const claimDef = partyIndex === 0 ? L.claimant : L.defendant;

  const html = '<h1>' + escHtml(title) + '</h1>'
    + '<p class="meta">' + escHtml(altTitle) + '</p>'
    + '<div class="party-label">' + escHtml(claimDef) + '</div>'
    + '<h2>' + escHtml(L.cb) + ' \u2014 ' + escHtml(partyName) + '</h2>'
    + '<div class="role">' + escHtml(roleText) + '</div>'
    + '<div class="warning">' + escHtml(L.warning) + '</div>'
    + '<p>' + escHtml(tbWhen) + sep + escHtml(tbWhat) + period + escHtml(tbWhy) + period + '</p>'
    + '<p>' + escHtml(rpi) + '</p>'
    + '<p>' + escHtml(brief) + '</p>';
  openPrintWindow(title + ' \u2014 ' + partyName + ' ' + L.cb, html);
}

function downloadOverview() {
  if (!currentCase || !currentCase.mediation_overview) return;
  const lang = currentLang();
  const L = PRINT_LABELS[lang];
  const ov = currentCase.mediation_overview;
  const title = currentCase.meta['title_' + lang];
  const altLang = lang === 'en' ? 'zh' : 'en';
  const altTitle = currentCase.meta['title_' + altLang];

  const html = '<h1>' + escHtml(title) + '</h1>'
    + '<p class="meta">' + escHtml(altTitle) + '</p>'
    + '<h2>' + escHtml(L.section) + '</h2>'
    + '<h3>' + escHtml(L.cg) + '</h3>'
    + '<h4>' + escHtml(L.generic) + '</h4>'
    + renderListItems(ov.common_ground.generic[lang])
    + '<h4>' + escHtml(L.case_spec) + '</h4>'
    + renderListItems(ov.common_ground.case_specific[lang])
    + '<h3>' + escHtml(L.issues) + '</h3>'
    + renderListItems(ov.issues[lang])
    + '<h3>' + escHtml(L.options) + '</h3>'
    + renderListItems(ov.options[lang]);
  openPrintWindow(title + ' \u2014 ' + L.section, html);
}

function downloadFullCase() {
  if (!currentCase) return;
  const lang = currentLang();
  const L = PRINT_LABELS[lang];
  const title = currentCase.meta['title_' + lang];
  const altLang = lang === 'en' ? 'zh' : 'en';
  const altTitle = currentCase.meta['title_' + altLang];
  const sep = sentenceSep(lang);
  const period = sentenceEnd(lang);

  let html = '<h1>' + escHtml(title) + '</h1>'
    + '<p class="meta">' + escHtml(altTitle) + '</p>'
    + '<h2>' + escHtml(L.joint) + '</h2>'
    + '<p>' + escHtml(currentCase.joint_brief[lang]) + '</p>';

  currentCase.confidential_briefs.forEach(cb => {
    const party = currentCase.parties[cb.party_index];
    const partyName = party['name_' + lang];
    const roleText = party['role_' + lang];
    const claimDef = cb.party_index === 0 ? L.claimant : L.defendant;
    const tbWhen = cb.trust_breakdown['when_' + lang];
    const tbWhat = cb.trust_breakdown['what_' + lang];
    const tbWhy = cb.trust_breakdown['why_it_mattered_' + lang];

    html += '<hr>'
      + '<div class="party-label">' + escHtml(claimDef) + '</div>'
      + '<h2>' + escHtml(L.cb) + ' \u2014 ' + escHtml(partyName) + '</h2>'
      + '<div class="role">' + escHtml(roleText) + '</div>'
      + '<div class="warning">' + escHtml(L.warning) + '</div>'
      + '<p>' + escHtml(tbWhen) + sep + escHtml(tbWhat) + period + escHtml(tbWhy) + period + '</p>'
      + '<p>' + escHtml(cb['role_player_instruction_' + lang]) + '</p>'
      + '<p>' + escHtml(cb['brief_' + lang]) + '</p>';
  });

  if (currentCase.mediation_overview) {
    const ov = currentCase.mediation_overview;
    html += '<hr>'
      + '<h2>' + escHtml(L.section) + '</h2>'
      + '<h3>' + escHtml(L.cg) + '</h3>'
      + '<h4>' + escHtml(L.generic) + '</h4>'
      + renderListItems(ov.common_ground.generic[lang])
      + '<h4>' + escHtml(L.case_spec) + '</h4>'
      + renderListItems(ov.common_ground.case_specific[lang])
      + '<h3>' + escHtml(L.issues) + '</h3>'
      + renderListItems(ov.issues[lang])
      + '<h3>' + escHtml(L.options) + '</h3>'
      + renderListItems(ov.options[lang]);
  }

  openPrintWindow(title + ' \u2014 ' + L.full, html);
}

/* ---------------------- Render ---------------------- */

function render(caseObj) {
  currentCase = caseObj;
  const out = document.getElementById("case-view");
  out.innerHTML = "";

  const header = document.createElement("div");
  header.className = "case-header";
  header.innerHTML = `
    <button class="download-btn download-full" onclick="downloadFullCase()"><span class="lang-zh">下載完整個案</span><span class="lang-sc">下载完整个案</span><span class="lang-en">Download Full Case</span></button>
    <h1 class="case-title">
      <span class="lang-zh">${caseObj.meta.title_zh}</span>
      <span class="lang-sc">${caseObj.meta.title_sc}</span>
      <span class="lang-en">${caseObj.meta.title_en}</span>
    </h1>
  `;
  out.appendChild(header);

  const joint = document.createElement("section");
  joint.className = "block";
  joint.innerHTML = `
    <div class="section-eyebrow">JOINT BRIEF</div>
    <h2 class="section-title"><div class="titles-group"><span class="lang-zh">聯合簡介</span><span class="lang-sc">联合简介</span><span class="lang-en">Joint brief</span></div><button class="download-btn" onclick="downloadJointBrief()"><span class="lang-zh">下載</span><span class="lang-sc">下载</span><span class="lang-en">Download</span></button></h2>
    <div class="prose">
      <p class="lang-zh">${caseObj.joint_brief.zh}</p>
      <p class="lang-sc">${caseObj.joint_brief.sc}</p>
      <p class="lang-en">${caseObj.joint_brief.en}</p>
    </div>
  `;
  out.appendChild(joint);

  const confSection = document.createElement("section");
  confSection.className = "block";
  confSection.innerHTML = `
    <div class="section-eyebrow">CONFIDENTIAL BRIEFS</div>
    <h2 class="section-title"><span class="lang-zh">機密簡介</span><span class="lang-sc">机密简介</span><span class="lang-en">Confidential briefs</span></h2>
  `;
  const grid = document.createElement("div");
  grid.className = "confidentials";
  confSection.appendChild(grid);

  caseObj.confidential_briefs.forEach(cb => {
    const party = caseObj.parties[cb.party_index];
    const card = document.createElement("div");
    card.className = "party-card";
    const reg = REGISTER_LABEL[cb.register];
    const legitTagsZh = cb.legitimacy_framing.map(f => `<span class="tag">${LEGIT_LABEL[f].zh}</span>`).join("");
    const legitTagsSc = cb.legitimacy_framing.map(f => `<span class="tag">${LEGIT_LABEL[f].sc}</span>`).join("");
    const legitTagsEn = cb.legitimacy_framing.map(f => `<span class="tag">${LEGIT_LABEL[f].en}</span>`).join("");
    const attrs = cb.behavioural_attributes.map(a => `
      <div class="attr-row">
        <div class="attr-name"><span class="lang-zh">${a.attr_zh}</span><span class="lang-sc">${a.attr_sc}</span><span class="lang-en">${a.attr_en}</span></div>
        <div class="attr-trigger"><span class="lang-zh">${a.trigger_zh}</span><span class="lang-sc">${a.trigger_sc}</span><span class="lang-en">${a.trigger_en}</span></div>
      </div>
    `).join("");

    const codingBlock = cb.coding.present ? `
      <div class="box-coding schema-box">
        <div class="box-label"><span>CODING</span><span class="zh"><span class="lang-zh">編碼</span><span class="lang-sc">编码</span></span></div>
        <div class="box-content">
          <div><span class="field-name lang-zh">軸線：</span><span class="field-name lang-sc">轴线：</span><span class="field-name lang-en">Axes:</span> <span class="lang-zh">${cb.coding.axes_zh}</span><span class="lang-sc">${cb.coding.axes_sc}</span><span class="lang-en">${cb.coding.axes_en}</span></div>
          <div><span class="field-name lang-zh">方向：</span><span class="field-name lang-sc">方向：</span><span class="field-name lang-en">Direction:</span> <span class="lang-zh">${cb.coding.direction_zh}</span><span class="lang-sc">${cb.coding.direction_sc}</span><span class="lang-en">${cb.coding.direction_en}</span></div>
          <div><span class="field-name lang-zh">浮現方式：</span><span class="field-name lang-sc">浮现方式：</span><span class="field-name lang-en">How it leaks:</span> <span class="lang-zh">${cb.coding.how_it_leaks_zh}</span><span class="lang-sc">${cb.coding.how_it_leaks_sc}</span><span class="lang-en">${cb.coding.how_it_leaks_en}</span></div>
        </div>
      </div>
    ` : `
      <div class="box-coding schema-box">
        <div class="box-label"><span>CODING</span><span class="zh"><span class="lang-zh">編碼</span><span class="lang-sc">编码</span></span></div>
        <div class="box-content" style="opacity:0.7"><em><span class="lang-zh">無顯著編碼：${cb.coding.axes_zh}</span><span class="lang-sc">无显著编码：${cb.coding.axes_sc}</span><span class="lang-en">No significant coding: ${cb.coding.axes_en}</span></em></div>
      </div>
    `;

    card.innerHTML = `
      <button class="download-btn download-cb" onclick="downloadConfidentialBrief(${cb.party_index})"><span class="lang-zh">下載</span><span class="lang-sc">下载</span><span class="lang-en">Download</span></button>
      <div class="party-label">PARTY ${cb.party_index === 0 ? "A · CLAIMANT" : "B · DEFENDANT"}</div>
      <h3><span class="lang-zh">${party.name_zh}</span><span class="lang-sc">${party.name_sc}</span><span class="lang-en">${party.name_en}</span></h3>
      <p class="role"><span class="lang-zh">${party.role_zh}</span><span class="lang-sc">${party.role_sc}</span><span class="lang-en">${party.role_en}</span></p>

      <div class="prose">
        <p class="lang-zh">${cb.trust_breakdown.when_zh}，${cb.trust_breakdown.what_zh}。${cb.trust_breakdown.why_it_mattered_zh}。</p>
        <p class="lang-sc">${cb.trust_breakdown.when_sc}，${cb.trust_breakdown.what_sc}。${cb.trust_breakdown.why_it_mattered_sc}。</p>
        <p class="lang-en">${cb.trust_breakdown.when_en}, ${cb.trust_breakdown.what_en}. ${cb.trust_breakdown.why_it_mattered_en}.</p>

        <p class="lang-zh">${cb.role_player_instruction_zh}</p>
        <p class="lang-sc">${cb.role_player_instruction_sc}</p>
        <p class="lang-en">${cb.role_player_instruction_en}</p>

        <p class="lang-zh">${cb.brief_zh}</p>
        <p class="lang-sc">${cb.brief_sc}</p>
        <p class="lang-en">${cb.brief_en}</p>
      </div>
    `;
    grid.appendChild(card);
  });

  out.appendChild(confSection);

  // Mediation Overview section
  if (caseObj.mediation_overview) {
    const ov = caseObj.mediation_overview;
    function renderTriLangList(items) {
      const max = Math.max(items.zh.length, items.sc.length, items.en.length);
      let html = '<ol>';
      for (let i = 0; i < max; i++) {
        html += '<li>';
        if (items.zh[i]) html += `<span class="lang-zh">${items.zh[i]}</span>`;
        if (items.sc[i]) html += `<span class="lang-sc">${items.sc[i]}</span>`;
        if (items.en[i]) html += `<span class="lang-en">${items.en[i]}</span>`;
        html += '</li>';
      }
      return html + '</ol>';
    }

    const ovSection = document.createElement("section");
    ovSection.className = "block";
    ovSection.innerHTML = `
      <div class="section-eyebrow">MEDIATION OVERVIEW</div>
      <h2 class="section-title"><div class="titles-group"><span class="lang-zh">調解概覽表</span><span class="lang-sc">调解概览表</span><span class="lang-en">Mediation Overview</span></div><button class="download-btn" onclick="downloadOverview()"><span class="lang-zh">下載</span><span class="lang-sc">下载</span><span class="lang-en">Download</span></button></h2>

      <div class="overview-block">
        <h3><span class="lang-zh">共同基礎</span><span class="lang-sc">共同基础</span><span class="lang-en">Common Ground</span></h3>
        <h4><span class="lang-zh">一般適用</span><span class="lang-sc">一般适用</span><span class="lang-en">Generic</span></h4>
        ${renderTriLangList(ov.common_ground.generic)}
        <h4><span class="lang-zh">此個案適用</span><span class="lang-sc">此个案适用</span><span class="lang-en">Case-specific</span></h4>
        ${renderTriLangList(ov.common_ground.case_specific)}
      </div>

      <div class="overview-block">
        <h3><span class="lang-zh">待議事項</span><span class="lang-sc">待议事项</span><span class="lang-en">Issues</span></h3>
        ${renderTriLangList(ov.issues)}
      </div>

      <div class="overview-block">
        <h3><span class="lang-zh">可行方案</span><span class="lang-sc">可行方案</span><span class="lang-en">Options</span></h3>
        ${renderTriLangList(ov.options)}
      </div>
    `;
    out.appendChild(ovSection);
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function populateSelector(lang) {
  const sel = document.getElementById("case-select");
  const currentValue = sel.value || CASES[0].id;
  sel.innerHTML = "";
  CASES.forEach(c => {
    const o = document.createElement("option");
    o.value = c.id;
    const titleField = lang === "sc" ? c.meta.title_sc : (lang === "en" ? c.meta.title_en : c.meta.title_zh);
    o.textContent = titleField;
    sel.appendChild(o);
  });
  sel.value = currentValue;
}

populateSelector("zh");
document.getElementById("case-select").addEventListener("change", e => {
  const c = CASES.find(x => x.id === e.target.value);
  if (c) render(c);
});

document.querySelectorAll(".toggle-group .toggle-btn").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".toggle-group .toggle-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.body.className = "lang-" + b.dataset.lang;
    populateSelector(b.dataset.lang);
  });
});

render(CASES[0]);
</script>
</body>
</html>
